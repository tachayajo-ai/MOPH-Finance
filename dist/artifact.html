ทียบผล แยกรายได้และค่าใช้จ่าย<\/th>\n<th>Planfin_Waterfall<\/th>\n<\/tr>\n<tr>\n<th>AR Days และมูลค่าเคลมค้าง/ติด C<\/th>\n<th>RiskScore · เคลมค้าง_ยอดโอน<\/th>\n<\/tr>\n<tr>\n<th>CMI และต้นทุนต่อ AdjRW เทียบกลุ่มระดับเดียวกันในเขต<\/th>\n<th>Funnel_CMI · MDC_Gap<\/th>\n<\/tr>\n<tr>\n<th>I/E Ratio<\/th>\n<th>RiskScore<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h2 id=\"m-ch6\">บทที่ 6 · มาตรา 41 และมาตรา 18(4)<\/h2>\n<h3>6.1 หลักการ<\/h3>\n<p>ทั้งสองมาตราอยู่ภายใต้ พ.ร.บ.หลักประกันสุขภาพแห่งชาติ พ.ศ. 2545 มีหลักการร่วมคือ \"ช่วยเหลือเบื้องต้นโดยไม่ต้องพิสูจน์ถูกผิด\" (no-fault compensation)<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>มาตรา<\/strong><\/th>\n<th><strong>คุ้มครองใคร<\/strong><\/th>\n<th><strong>ตัวอย่างเหตุ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>มาตรา 41<\/th>\n<th>ผู้รับบริการ (ผู้ป่วย) ที่ได้รับความเสียหายจากการรักษาพยาบาล<\/th>\n<th>ภาวะแทรกซ้อนรุนแรงจากการผ่าตัด แพ้ยารุนแรง ความเสียหายจากการให้ยาผิด<\/th>\n<\/tr>\n<tr>\n<th>มาตรา 18(4)<\/th>\n<th>ผู้ให้บริการ (บุคลากร) ที่ได้รับความเสียหายจากการให้บริการ<\/th>\n<th>เข็มทิ่มตำและติดเชื้อ ติดเชื้อจากการปฏิบัติงาน ถูกทำร้ายขณะปฏิบัติหน้าที่ อุบัติเหตุระหว่างปฏิบัติงาน<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>ประเด็นที่ต้องสื่อสารให้บุคลากรเข้าใจถูก<\/strong><\/p>\n<p>การที่ผู้ป่วยได้รับเงินตามมาตรา 41 ไม่ใช่การที่โรงพยาบาลยอมรับผิด และไม่ใช่การตัดสินว่าบุคลากรทำผิดมาตรฐานวิชาชีพ เป็นคนละกระบวนการกับการสอบสวนทางวินัยและการฟ้องร้อง ความเข้าใจผิดเรื่องนี้ทำให้บุคลากรต่อต้านการรายงานอุบัติการณ์ ซึ่งบั่นทอนระบบบริหารความเสี่ยงทั้งระบบ<\/p><\/div>\n<h3>6.2 ประเภทความเสียหายและวงเงินช่วยเหลือ<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ประเภท<\/strong><\/th>\n<th><strong>ลักษณะความเสียหาย<\/strong><\/th>\n<th><strong>วงเงินช่วยเหลือ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>ประเภท 1<\/th>\n<th>เสียชีวิต หรือทุพพลภาพอย่างถาวร<\/th>\n<th>ไม่เกิน 400,000 บาท<\/th>\n<\/tr>\n<tr>\n<th>ประเภท 2<\/th>\n<th>สูญเสียอวัยวะ หรือพิการที่มีผลต่อการดำรงชีวิต<\/th>\n<th>ไม่เกิน 240,000 บาท<\/th>\n<\/tr>\n<tr>\n<th>ประเภท 3<\/th>\n<th>บาดเจ็บหรือเจ็บป่วยต่อเนื่อง<\/th>\n<th>ไม่เกิน 100,000 บาท<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>6.3 ข้อยกเว้นที่ไม่เข้าเกณฑ์<\/h3>\n<blockquote>\n<p>• ความเสียหายที่เกิดตามพยาธิสภาพของโรคหรือการดำเนินโรคตามธรรมชาติ<\/p>\n<p>• เหตุแทรกซ้อนที่เป็นผลข้างเคียงอันหลีกเลี่ยงไม่ได้ของการรักษาที่ทำตามมาตรฐาน<\/p>\n<p>• ความเสียหายจากเหตุสุดวิสัยที่ไม่เกี่ยวกับการให้บริการ<\/p>\n<\/blockquote>\n<div class=\"callout\"><p><strong>จุดชี้ขาดของคณะอนุกรรมการ<\/strong><\/p>\n<p>คำถามหลักไม่ใช่ \"ใครผิด\" แต่คือ \"ความเสียหายนี้เป็นผลจากการดำเนินของโรคเอง หรือเป็นผลจากการให้บริการ\" — สำนวนเสนอต้องแยกสองประเด็นนี้ให้ชัดด้วยข้อมูลทางคลินิก ไม่ใช่ด้วยความเห็น<\/p><\/div>\n<h3>6.4 กระบวนการและกรอบเวลา<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ขั้นตอน<\/strong><\/th>\n<th><strong>รายละเอียด<\/strong><\/th>\n<\/tr>\n<tr>\n<th>การยื่นคำร้อง<\/th>\n<th>ยื่นได้ที่หน่วยบริการ สสจ. หรือ สปสช.เขต โดยทั่วไปภายใน 2 ปีนับแต่วันที่ทราบความเสียหาย<\/th>\n<\/tr>\n<tr>\n<th>ผู้มีสิทธิยื่น<\/th>\n<th>ผู้เสียหาย ทายาท ผู้อุปการะ หรือหน่วยบริการที่ให้บริการ<\/th>\n<\/tr>\n<tr>\n<th>การพิจารณา<\/th>\n<th>คณะอนุกรรมการระดับจังหวัด/เขต พิจารณาภายในกรอบเวลาที่ข้อบังคับกำหนด (โดยทั่วไป 30 วัน)<\/th>\n<\/tr>\n<tr>\n<th>การอุทธรณ์<\/th>\n<th>ไม่พอใจผลพิจารณา อุทธรณ์ต่อคณะกรรมการหลักประกันสุขภาพแห่งชาติภายในกรอบเวลาที่กำหนด<\/th>\n<\/tr>\n<tr>\n<th>ผลทางกฎหมาย<\/th>\n<th>การรับเงินช่วยเหลือเบื้องต้นไม่ตัดสิทธิ์การฟ้องร้อง แต่ในทางปฏิบัติช่วยลดการฟ้องร้องได้มาก<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>6.5 บทบาทของงานประกันสุขภาพและงานบริหารความเสี่ยง<\/h3>\n<p>มาตรา 41 คือจุดที่งานประกันสุขภาพและงานบริหารความเสี่ยงบรรจบกัน ทุกคำร้องคือ incident ที่ต้องเข้าระบบ RM ไม่ใช่จบที่การจ่ายเงิน<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>ระยะ<\/strong><\/th>\n<th><strong>สิ่งที่ต้องทำ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>เมื่อเกิดเหตุ<\/th>\n<th>รายงานอุบัติการณ์ทันที · เก็บรักษาเวชระเบียนและหลักฐานให้ครบ · disclosure กับญาติอย่างเปิดเผยและเห็นอกเห็นใจ โดยไม่กล่าวโทษบุคคล<\/th>\n<\/tr>\n<tr>\n<th>เมื่อยื่นคำร้อง<\/th>\n<th>สรุปข้อเท็จจริงทางคลินิกตามลำดับเวลา (timeline) แยกข้อเท็จจริงออกจากความเห็น · แนบผลตรวจ ผลชันสูตร และบันทึกที่เกี่ยวข้อง<\/th>\n<\/tr>\n<tr>\n<th>คู่ขนานกับการพิจารณา<\/th>\n<th>ทำ RCA หาสาเหตุเชิงระบบ · ห้ามใช้ผล RCA เป็นเอกสารชี้ความผิดรายบุคคล<\/th>\n<\/tr>\n<tr>\n<th>หลังมีผลพิจารณา<\/th>\n<th>นำเข้าคณะกรรมการบริหารความเสี่ยง · แปลงเป็นมาตรการป้องกัน · ติดตามผลการนำไปปฏิบัติ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>ตัวชี้วัดที่ควรติดตามระดับจังหวัด (ชีต สรุป_ม41 คำนวณให้จากชีต ทะเบียน_ม41)<\/strong><\/p>\n<p>1. จำนวนคำร้องมาตรา 41 แยกตามหน่วยบริการและประเภทความเสียหาย<\/p>\n<p>2. ร้อยละของคำร้องที่ได้รับการพิจารณาภายในกรอบเวลา<\/p>\n<p>3. จำนวนคำร้องที่นำไปสู่ RCA และมีมาตรการป้องกันเป็นรูปธรรม<\/p>\n<p>4. จำนวนคำร้องมาตรา 18(4) แยกตามประเภทเหตุ โดยเฉพาะ needle stick injury และการถูกทำร้าย<\/p>\n<p>5. การเกิดซ้ำของเหตุประเภทเดียวกันในหน่วยบริการเดิม — ตัวนี้บอกว่ามาตรการที่วางไว้ได้ผลจริงหรือไม่<\/p><\/div>\n<h2 id=\"m-ch7\">บทที่ 7 · เปรียบเทียบ 3 กองทุนเชิงลึก และการไล่เบิกสิทธิซ้อน<\/h2>\n<h3>7.1 ลำดับการไล่เบิกที่ถูกต้อง<\/h3>\n<p>หลักการ: สิทธิหลัก (UC/SSS/CSMBS) เป็นสิทธิสุดท้ายเสมอ ต้องไล่เบิกจากแหล่งอื่นให้หมดก่อน<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>ลำดับ<\/strong><\/th>\n<th><strong>คำถามคัดกรอง<\/strong><\/th>\n<th><strong>ถ้าใช่ เบิกจาก<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>บาดเจ็บจากรถ?<\/th>\n<th>พ.ร.บ.ผู้ประสบภัยจากรถ<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>บาดเจ็บจากการทำงาน?<\/th>\n<th>กองทุนเงินทดแทน<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>มีประกันเอกชน?<\/th>\n<th>เบิกตามกรมธรรม์<\/th>\n<\/tr>\n<tr>\n<th>4<\/th>\n<th>เจ็บป่วยฉุกเฉินวิกฤต?<\/th>\n<th>UCEP (72 ชั่วโมงแรก ทุกสิทธิ)<\/th>\n<\/tr>\n<tr>\n<th>5<\/th>\n<th>ที่เหลือ<\/th>\n<th>สิทธิหลักของผู้ป่วย<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>จุดที่โรงพยาบาลเสียรายได้มากที่สุด<\/strong><\/p>\n<p>การไม่คัดกรองสิทธิซ้อนตั้งแต่จุดลงทะเบียน แล้วเบิกสิทธิหลักทันที ทำให้เสียเงินที่ควรได้จากแหล่งอื่น และหากตรวจพบภายหลังอาจถูกเรียกเงินคืนจากสิทธิหลักด้วย — เสียสองต่อ<\/p><\/div>\n<h3>7.2 พ.ร.บ.ผู้ประสบภัยจากรถ<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>รายการ<\/strong><\/th>\n<th><strong>สาระสำคัญ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>ค่าเสียหายเบื้องต้น<\/th>\n<th>จ่ายโดยไม่รอพิสูจน์ถูกผิด — ค่ารักษาพยาบาลตามจริงไม่เกิน 30,000 บาท และกรณีเสียชีวิต/ทุพพลภาพถาวร/สูญเสียอวัยวะ 35,000 บาท รวมไม่เกิน 65,000 บาทต่อคน<\/th>\n<\/tr>\n<tr>\n<th>ค่าสินไหมทดแทน (เมื่อพิสูจน์แล้วว่าเป็นฝ่ายถูก)<\/th>\n<th>ค่ารักษาตามจริงไม่เกิน 80,000 บาท · เสียชีวิตหรือทุพพลภาพถาวรสิ้นเชิง 500,000 บาท · ค่าชดเชยรายวันกรณีนอนโรงพยาบาล 200 บาทต่อวัน ไม่เกิน 20 วัน<\/th>\n<\/tr>\n<tr>\n<th>วงเงินต่อครั้ง<\/th>\n<th>ตั้งแต่ 1 มกราคม 2569 วงเงินรวมต่ออุบัติเหตุ 20 ล้านบาท เท่ากันทุกประเภทรถ<\/th>\n<\/tr>\n<tr>\n<th>กรอบเวลายื่น<\/th>\n<th>โดยทั่วไปภายใน 180 วันนับแต่วันเกิดเหตุ<\/th>\n<\/tr>\n<tr>\n<th>รถไม่มีประกัน / ชนแล้วหนี<\/th>\n<th>เบิกจากกองทุนทดแทนผู้ประสบภัย<\/th>\n<\/tr>\n<tr>\n<th>เมื่อวงเงินหมด<\/th>\n<th>ส่วนเกินจึงใช้สิทธิหลักของผู้ป่วย<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>7.3 UCEP และนโยบายบริการข้ามหน่วย<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>นโยบาย<\/strong><\/th>\n<th><strong>สาระสำคัญ<\/strong><\/th>\n<th><strong>ข้อควรระวัง<\/strong><\/th>\n<\/tr>\n<tr>\n<th>UCEP (เจ็บป่วยฉุกเฉินวิกฤต)<\/th>\n<th>ผู้ป่วยฉุกเฉินวิกฤต (คัดแยกระดับสีแดง) รักษาได้ทุกโรงพยาบาลโดยไม่ต้องสำรองจ่ายใน 72 ชั่วโมงแรก ทุกสิทธิ สปสช. เป็น clearing house<\/th>\n<th>ต้องผ่านการคัดแยกตามเกณฑ์และบันทึกถูกต้อง ถ้าไม่เข้าเกณฑ์วิกฤต รพ.จะเบิกไม่ได้<\/th>\n<\/tr>\n<tr>\n<th>UCEP Plus<\/th>\n<th>ขยายความคุ้มครองไปยังกลุ่มผู้ป่วยเฉพาะตามประกาศ<\/th>\n<th>เงื่อนไขและกลุ่มโรคเปลี่ยนตามประกาศ ต้องติดตาม<\/th>\n<\/tr>\n<tr>\n<th>บริการปฐมภูมิไปที่ไหนก็ได้<\/th>\n<th>ผู้มีสิทธิ UC รับบริการปฐมภูมิที่หน่วยบริการใดก็ได้ในระบบ<\/th>\n<th>กระทบการบริหาร OP capitation ของ CUP เพราะเกิดภาระตามจ่ายข้ามพื้นที่<\/th>\n<\/tr>\n<tr>\n<th>มะเร็งรักษาทุกที่<\/th>\n<th>ผู้ป่วยมะเร็งเลือกรับบริการที่หน่วยบริการที่มีศักยภาพได้<\/th>\n<th>ต้องมีระบบส่งต่อและระบบข้อมูลที่เชื่อมกัน<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>7.4 ตารางเปรียบเทียบเชิงปฏิบัติการ<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ประเด็นปฏิบัติงาน<\/strong><\/th>\n<th><strong>UC<\/strong><\/th>\n<th><strong>ประกันสังคม<\/strong><\/th>\n<th><strong>ข้าราชการ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>ระบบตรวจสอบสิทธิ<\/th>\n<th>ระบบตรวจสอบสิทธิ สปสช. / Authen Code<\/th>\n<th>ระบบ สปส.<\/th>\n<th>ฐานข้อมูลกรมบัญชีกลาง<\/th>\n<\/tr>\n<tr>\n<th>ระบบส่งเคลม<\/th>\n<th>FDH → e-Claim / 43 แฟ้ม / DMIS<\/th>\n<th>ระบบ สปส.<\/th>\n<th>ระบบเบิกจ่ายตรง<\/th>\n<\/tr>\n<tr>\n<th>การส่งต่อ<\/th>\n<th>ต้องมีใบส่งต่อ ยกเว้นกรณีฉุกเฉินและบริการที่กำหนด<\/th>\n<th>ต้องผ่าน รพ.คู่สัญญาหลัก<\/th>\n<th>เลือกได้อิสระกว่า<\/th>\n<\/tr>\n<tr>\n<th>ยานอกบัญชียาหลัก<\/th>\n<th>เบิกไม่ได้ ยกเว้นรายการที่กำหนด<\/th>\n<th>ขึ้นกับเงื่อนไขกองทุน<\/th>\n<th>เบิกได้ตามเงื่อนไขและหนังสือรับรอง<\/th>\n<\/tr>\n<tr>\n<th>ความเสี่ยงหลักของ รพ.<\/th>\n<th>งบปลายปิด ขาดทุนจากเคสหนัก<\/th>\n<th>ผู้ป่วยนอกเกินคาด<\/th>\n<th>ถูกตรวจสอบและเรียกเงินคืนย้อนหลัง<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>7.5 แผนปฏิบัติการคัดกรองสิทธิซ้อน<\/h3>\n<blockquote>\n<p><strong>1.<\/strong> Flow คัดกรองสิทธิที่จุดลงทะเบียนและห้องฉุกเฉิน มีคำถามบังคับ 3 ข้อ: อุบัติเหตุจากรถหรือไม่ · บาดเจ็บจากการทำงานหรือไม่ · มีประกันเอกชนหรือไม่<\/p>\n<p><strong>2.<\/strong> ผู้รับผิดชอบติดตามเอกสาร พ.ร.บ.รถ ภายใน 7 วันหลังรับผู้ป่วย เพื่อไม่ให้เกินกรอบ 180 วัน<\/p>\n<p><strong>3.<\/strong> ทะเบียนเคสอุบัติเหตุจราจรทุกรายและติดตามสถานะการเบิกรายสัปดาห์ (ชีต ทะเบียน_พรบรถ แจ้งเตือนเคสใกล้ครบกำหนดให้)<\/p>\n<p><strong>4.<\/strong> ตรวจย้อนหลังรายไตรมาสว่ามีเคสใดเบิกสิทธิหลักทั้งที่เข้าเกณฑ์สิทธิอื่น<\/p>\n<p><strong>5.<\/strong> อบรมเจ้าหน้าที่เวชระเบียนและห้องฉุกเฉินอย่างน้อยปีละครั้ง เพราะเป็นจุดที่อัตราเปลี่ยนคนสูง<\/p>\n<\/blockquote>\n<h2 id=\"m-ch8\">บทที่ 8 · บทบาท สสจ. และการเขียนหนังสือประสานงาน<\/h2>\n<h3>8.1 ฐานะของ สสจ. ในระบบหลักประกันสุขภาพ<\/h3>\n<p>สำนักงานสาธารณสุขจังหวัดมีสถานะซ้อนกันสามชั้น ซึ่งเป็นที่มาของความสับสนในการเลือกชนิดหนังสือและน้ำเสียง<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>ฐานะ<\/strong><\/th>\n<th><strong>ต่อใคร<\/strong><\/th>\n<th><strong>ลักษณะอำนาจ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>ผู้แทนของผู้ซื้อบริการ<\/th>\n<th>ปฏิบัติงานแทน สปสช. ในระดับจังหวัด<\/th>\n<th>ขึ้นทะเบียนหน่วยบริการ ตรวจสอบ กำกับเงื่อนไข<\/th>\n<\/tr>\n<tr>\n<th>ผู้บังคับบัญชาของผู้ให้บริการ<\/th>\n<th>รพศ./รพท./รพช./รพ.สต. ในสังกัด<\/th>\n<th>สั่งการ กำกับ ติดตาม ตามสายบังคับบัญชา<\/th>\n<\/tr>\n<tr>\n<th>ผู้ประสานงานแนวราบ<\/th>\n<th>อบจ. (รพ.สต.ถ่ายโอน), อปท., สปสช.เขต, หน่วยงานต่างสังกัด<\/th>\n<th>ไม่มีอำนาจสั่งการ ต้องใช้การขอความร่วมมือและกลไกคณะกรรมการ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>หลักการเลือกน้ำเสียง<\/strong><\/p>\n<p>ก่อนร่างหนังสือทุกฉบับ ต้องตอบก่อนว่ากำลังเขียนในฐานะใด เพราะฐานะกำหนดทั้งชนิดหนังสือ คำลงท้าย และคำว่า \"โปรด\" — ใช้ผิดฐานะทำให้หนังสือไม่มีผลในทางปฏิบัติ หรือสร้างความขัดแย้งโดยไม่จำเป็น<\/p><\/div>\n<h3>8.2 ภารกิจ 10 ด้านของงานประกันสุขภาพระดับจังหวัด<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>#<\/strong><\/th>\n<th><strong>ภารกิจ<\/strong><\/th>\n<th><strong>ระดับบทบาท<\/strong><\/th>\n<th><strong>ผลลัพธ์ที่ต้องส่งมอบ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>ขึ้นทะเบียนและต่ออายุหน่วยบริการ<\/th>\n<th>ดำเนินการเอง<\/th>\n<th>หน่วยบริการทุกแห่งมีสถานะพร้อมเบิกก่อนเริ่มปีงบ<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>บริหารการลงทะเบียนสิทธิประชากร<\/th>\n<th>ดำเนินการเอง<\/th>\n<th>สิทธิว่างและสิทธิซ้ำซ้อนต่ำที่สุดก่อนวันตัดยอด<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>กำกับคุณภาพการเบิกชดเชย<\/th>\n<th>กำกับ + สนับสนุน<\/th>\n<th>First Pass Rate ระดับจังหวัดและมูลค่าเคลมค้าง<\/th>\n<\/tr>\n<tr>\n<th>4<\/th>\n<th>ตรวจสอบเวชระเบียนและการให้รหัส<\/th>\n<th>ดำเนินการเอง<\/th>\n<th>รายงาน coding audit รายไตรมาส<\/th>\n<\/tr>\n<tr>\n<th>5<\/th>\n<th>เฝ้าระวังสถานะการเงินหน่วยบริการ<\/th>\n<th>กำกับ<\/th>\n<th>Risk Score รายเดือนและแผนฟื้นฟูของหน่วยที่เสี่ยง<\/th>\n<\/tr>\n<tr>\n<th>6<\/th>\n<th>เลขานุการกลไกมาตรา 41 และ 18(4)<\/th>\n<th>ดำเนินการเอง<\/th>\n<th>พิจารณาแล้วเสร็จในกรอบเวลา และมีมาตรการป้องกันตามมา<\/th>\n<\/tr>\n<tr>\n<th>7<\/th>\n<th>รับเรื่องร้องเรียนและคุ้มครองสิทธิ<\/th>\n<th>ดำเนินการเอง<\/th>\n<th>ระยะเวลาปิดเรื่องและอัตราการยุติข้อร้องเรียน<\/th>\n<\/tr>\n<tr>\n<th>8<\/th>\n<th>กำกับกองทุนหลักประกันสุขภาพท้องถิ่นและ LTC<\/th>\n<th>สนับสนุน + กำกับ<\/th>\n<th>อัตราการเบิกใช้งบและคุณภาพแผนงานของ อปท.<\/th>\n<\/tr>\n<tr>\n<th>9<\/th>\n<th>ประสานงาน รพ.สต.ถ่ายโอนกับ อบจ.<\/th>\n<th>ประสาน (ไม่มีอำนาจสั่ง)<\/th>\n<th>MOU และคณะกรรมการร่วมที่ใช้งานได้จริง<\/th>\n<\/tr>\n<tr>\n<th>10<\/th>\n<th>เสนอและต่อรองหลักเกณฑ์จัดสรรใน อปสข.<\/th>\n<th>ประสาน<\/th>\n<th>ข้อเสนอที่มีข้อมูลเชิงประจักษ์รองรับ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>8.3 เลือกชนิดหนังสือให้ถูก<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>สถานการณ์<\/strong><\/th>\n<th><strong>ชนิดหนังสือ<\/strong><\/th>\n<th><strong>หมายเหตุ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>แจ้งเวียนหลักเกณฑ์/แนวปฏิบัติไปยังหน่วยบริการในจังหวัด<\/th>\n<th>หนังสือภายนอก แบบเวียน<\/th>\n<th>ใส่ \"ว\" หน้าเลขทะเบียนส่ง เช่น ที่ อด ⟦รหัส⟧/ว ⟦เลข⟧<\/th>\n<\/tr>\n<tr>\n<th>เสนอ นพ.สสจ. เพื่อพิจารณาหรือลงนาม<\/th>\n<th>บันทึกข้อความ<\/th>\n<th>ไม่มีคำลงท้าย ใช้โครงสร้าง 5 หัวข้อ<\/th>\n<\/tr>\n<tr>\n<th>ติดต่อ สปสช.เขต หรือ อบจ.<\/th>\n<th>หนังสือภายนอก<\/th>\n<th>ต่างหน่วยงาน/ต่างสังกัด ใช้แบบพิธีเต็ม<\/th>\n<\/tr>\n<tr>\n<th>แต่งตั้งคณะทำงานตรวจสอบเวชระเบียนระดับจังหวัด<\/th>\n<th>คำสั่ง<\/th>\n<th>ระบุฐานอำนาจให้ชัด ห้ามเดา<\/th>\n<\/tr>\n<tr>\n<th>เตือนเรื่องค้างหรือขอรายละเอียดเพิ่มเติมที่ไม่สำคัญมาก<\/th>\n<th>หนังสือประทับตรา<\/th>\n<th>ไม่มีคำขึ้นต้น/ลงท้าย ใช้ตราส่วนราชการแทนลายมือชื่อ<\/th>\n<\/tr>\n<tr>\n<th>บันทึกผลการประชุมคณะอนุกรรมการ<\/th>\n<th>รายงานการประชุม<\/th>\n<th>แยก \"สาระสำคัญ\" กับ \"มติที่ประชุม\" ทุกวาระ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>8.4 โครงสร้างเนื้อความ<\/h3>\n<p>หนังสือภายนอก — 3 ย่อหน้า<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>ย่อหน้า<\/strong><\/th>\n<th><strong>หน้าที่<\/strong><\/th>\n<th><strong>สำนวนตั้งต้น<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1. เหตุ<\/th>\n<th>ที่มาของเรื่อง<\/th>\n<th>เรื่องต่อเนื่อง: \"ตามหนังสือที่อ้างถึง ... ความละเอียดแจ้งแล้ว นั้น\" · เรื่องใหม่: \"ด้วย ...\" หรือ \"เนื่องด้วย ...\"<\/th>\n<\/tr>\n<tr>\n<th>2. ความประสงค์<\/th>\n<th>สิ่งที่แจ้ง ขอ หรือให้ดำเนินการ<\/th>\n<th>\"ในการนี้ ...\" · \"บัดนี้ ...\" · \"จึงขอให้ ...\" · \"จึงขอความอนุเคราะห์ ...\"<\/th>\n<\/tr>\n<tr>\n<th>3. สรุป<\/th>\n<th>บอกชัดว่าผู้รับต้องทำอะไร ภายในเมื่อไร<\/th>\n<th>ดูตารางประโยคปิดด้านล่าง<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<p>ประโยคปิดตามฐานะผู้รับ<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>ผู้รับ<\/strong><\/th>\n<th><strong>ประโยคปิด<\/strong><\/th>\n<\/tr>\n<tr>\n<th>ผู้บังคับบัญชา / หน่วยงานภายนอก / ผู้มีฐานะสูงกว่า<\/th>\n<th>\"จึงเรียนมาเพื่อโปรดทราบ\" · \"...เพื่อโปรดพิจารณา\" · \"...เพื่อโปรดทราบและพิจารณาดำเนินการต่อไป\"<\/th>\n<\/tr>\n<tr>\n<th>หน่วยงานในสังกัดหรือระดับต่ำกว่า<\/th>\n<th>ไม่ใช้คำว่า \"โปรด\" — \"จึงเรียนมาเพื่อทราบและถือปฏิบัติ\" · \"...เพื่อทราบและดำเนินการต่อไป\"<\/th>\n<\/tr>\n<tr>\n<th>ขอความร่วมมือหน่วยงานนอกสังกัด (เช่น อบจ., อปท.)<\/th>\n<th>\"...จะขอบคุณยิ่ง\" · \"ขอขอบคุณมา ณ โอกาสนี้\"<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<p>บันทึกเสนอผู้บังคับบัญชา — 5 หัวข้อ<\/p>\n<blockquote>\n<p><strong>1. เรื่องเดิม<\/strong> — ที่มาของเรื่อง<\/p>\n<p><strong>2. ข้อเท็จจริง<\/strong> — สถานการณ์ปัจจุบันและข้อมูลที่เกี่ยวข้อง (ใส่ตัวเลขจริง)<\/p>\n<p><strong>3. ข้อระเบียบ/กฎหมาย<\/strong> — เฉพาะที่ตรวจสอบแล้ว ห้ามอ้างจากความจำ<\/p>\n<p><strong>4. ข้อพิจารณา<\/strong> — การวิเคราะห์และทางเลือก ขึ้นต้นด้วย \"เห็นควร...\"<\/p>\n<p><strong>5. ข้อเสนอ<\/strong> — \"จึงเรียนมาเพื่อโปรดพิจารณา หากเห็นชอบ โปรด⟦อนุมัติ/ลงนาม/สั่งการ⟧...\"<\/p>\n<\/blockquote>\n<h3>8.5 บันไดระดับความเข้มของถ้อยคำ<\/h3>\n<p>หนังสือติดตามงานที่ใช้ถ้อยคำระดับเดียวซ้ำ ๆ จะหมดพลังอย่างรวดเร็ว ให้ไต่ระดับเป็นขั้น และทุกขั้นต้องมีกำหนดเวลาชัดเจน<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>ระดับ<\/strong><\/th>\n<th><strong>สถานการณ์<\/strong><\/th>\n<th><strong>สำนวนที่ใช้<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1 แจ้ง<\/th>\n<th>ครั้งแรก ยังไม่เกินกำหนด<\/th>\n<th>\"จึงเรียนมาเพื่อทราบและดำเนินการต่อไป ทั้งนี้ ขอให้ดำเนินการให้แล้วเสร็จภายในวันที่ ⟦วันที่⟧\"<\/th>\n<\/tr>\n<tr>\n<th>2 ติดตาม<\/th>\n<th>ใกล้ครบกำหนดหรือยังไม่ได้รับรายงาน<\/th>\n<th>\"เนื่องจากยังมิได้รับรายงานจากหน่วยงานของท่าน จึงขอให้เร่งรัดดำเนินการและรายงานผลภายในวันที่ ⟦วันที่⟧\"<\/th>\n<\/tr>\n<tr>\n<th>3 เร่งรัดพร้อมผลกระทบ<\/th>\n<th>เกินกำหนดแล้ว และมีผลเสียหายเป็นตัวเงิน<\/th>\n<th>\"การดำเนินการล่าช้าดังกล่าวส่งผลให้หน่วยบริการสูญเสียสิทธิในการขอรับค่าใช้จ่ายเป็นเงินจำนวน ⟦จำนวน⟧ บาท จึงขอให้ดำเนินการให้แล้วเสร็จภายในวันที่ ⟦วันที่⟧ และรายงานผลโดยตรงต่อ ⟦ตำแหน่ง⟧\"<\/th>\n<\/tr>\n<tr>\n<th>4 ยกระดับ<\/th>\n<th>ไม่ตอบสนองหลายครั้ง<\/th>\n<th>ออกเป็นหนังสือจาก นพ.สสจ. ถึงผู้อำนวยการโดยตรง ระบุลำดับหนังสือที่เคยแจ้งทั้งหมด และกำหนดให้ชี้แจงเหตุผลเป็นลายลักษณ์อักษร<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>หลักการเขียนให้ \"สุภาพแต่เด็ดขาด\"<\/strong><\/p>\n<p>ความเด็ดขาดมาจาก <strong>ข้อเท็จจริงที่เป็นตัวเลข กำหนดเวลาที่ชัดเจน และผู้รับผิดชอบที่ระบุตัวได้<\/strong> ไม่ได้มาจากการใช้คำแรง หลีกเลี่ยงคำคลุมเครือ เช่น \"หากเป็นไปได้\" \"ตามความเหมาะสม\" \"โดยเร็ว\" เพราะทำให้หนังสือไม่มีเส้นตายและติดตามไม่ได้<\/p><\/div>\n<h3>8.6 แม่แบบหนังสือ 5 ฉบับ<\/h3>\n<p>ข้อความใน ⟦ ⟧ คือช่องที่ต้องเติมข้อมูลจริง ห้ามส่งหนังสือที่ยังมีเครื่องหมายนี้เหลืออยู่ · ทุกแม่แบบเป็นร่างเพื่อเสนอ ต้องผ่านการตรวจก่อนเสนอลงนาม<\/p>\n<p>แม่แบบที่ 1 · หนังสือเวียนแจ้งหลักเกณฑ์การบริหารกองทุนปีใหม่<\/p>\n<div class=\"callout\"><p><strong>หนังสือภายนอก (เวียน) — ถึงผู้อำนวยการโรงพยาบาลทุกแห่งในจังหวัด<\/strong><\/p>\n<p>ที่ ⟦รหัส⟧/ว ⟦เลขทะเบียนส่ง⟧<\/p>\n<p>เรื่อง แนวทางปฏิบัติในการขอรับค่าใช้จ่ายเพื่อบริการสาธารณสุข ปีงบประมาณ ⟦ปี⟧<\/p>\n<p>เรียน ผู้อำนวยการโรงพยาบาลทุกแห่ง<\/p>\n<p>สิ่งที่ส่งมาด้วย 1. สรุปสาระสำคัญที่เปลี่ยนแปลง จำนวน 1 ชุด 2. กำหนดการประชุมชี้แจง จำนวน 1 ฉบับ<\/p>\n<p>ด้วยสำนักงานหลักประกันสุขภาพแห่งชาติ (สปสช.) ได้ประกาศหลักเกณฑ์การดำเนินงานและการบริหารจัดการกองทุนหลักประกันสุขภาพแห่งชาติ ปีงบประมาณ ⟦ปี⟧ ซึ่งมีการปรับเปลี่ยนวิธีการจ่ายและเงื่อนไขการขอรับค่าใช้จ่ายในหลายรายการ นั้น<\/p>\n<p>ในการนี้ สำนักงานสาธารณสุขจังหวัด⟦จังหวัด⟧ ขอให้หน่วยบริการดำเนินการ ดังนี้<\/p>\n<p>1. ศึกษาสาระสำคัญที่เปลี่ยนแปลงตามสิ่งที่ส่งมาด้วย 1 และปรับแนวปฏิบัติภายในหน่วยบริการให้สอดคล้อง<\/p>\n<p>2. ตรวจสอบสถานะบัญชีผู้ใช้งานระบบของ สปสช. และการส่งข้อมูลผ่าน FDH ให้พร้อมใช้งาน และรายงานผลภายในวันที่ ⟦วันที่⟧<\/p>\n<p>3. มอบหมายผู้รับผิดชอบงานเบิกชดเชยเข้าร่วมประชุมชี้แจงตามสิ่งที่ส่งมาด้วย 2<\/p>\n<p>จึงเรียนมาเพื่อทราบและถือปฏิบัติ<\/p>\n<p>ขอแสดงความนับถือ<\/p>\n<p>(⟦ชื่อผู้ลงนาม⟧) · นายแพทย์สาธารณสุขจังหวัด⟦จังหวัด⟧<\/p><\/div>\n<p>แม่แบบที่ 2 · หนังสือเร่งรัดการแก้ไขข้อมูลที่ไม่ผ่านการตรวจสอบ (ระดับ 3)<\/p>\n<div class=\"callout\"><p><strong>หนังสือภายนอก — ถึงผู้อำนวยการโรงพยาบาลรายแห่ง<\/strong><\/p>\n<p>เรื่อง เร่งรัดการแก้ไขข้อมูลการขอรับค่าใช้จ่ายที่ไม่ผ่านการตรวจสอบ<\/p>\n<p>เรียน ผู้อำนวยการโรงพยาบาล⟦ชื่อ⟧<\/p>\n<p>อ้างถึง หนังสือสำนักงานสาธารณสุขจังหวัด⟦จังหวัด⟧ ที่ ⟦เลขที่⟧ ลงวันที่ ⟦วันที่⟧<\/p>\n<p>ตามหนังสือที่อ้างถึง สำนักงานสาธารณสุขจังหวัด⟦จังหวัด⟧ ได้ขอให้หน่วยบริการเร่งรัดการแก้ไขข้อมูลการขอรับค่าใช้จ่ายที่ไม่ผ่านการตรวจสอบ ความละเอียดแจ้งแล้ว นั้น<\/p>\n<p>บัดนี้ จากการตรวจสอบข้อมูล ณ วันที่ ⟦วันที่⟧ พบว่าหน่วยบริการของท่านยังมีข้อมูลที่ไม่ผ่านการตรวจสอบคงค้าง จำนวน ⟦จำนวน⟧ รายการ คิดเป็นมูลค่า ⟦จำนวน⟧ บาท ในจำนวนนี้ค้างเกิน 30 วัน ⟦จำนวน⟧ รายการ มูลค่า ⟦จำนวน⟧ บาท ซึ่งหากพ้นกำหนดการแก้ไข หน่วยบริการจะสูญเสียสิทธิในการขอรับค่าใช้จ่ายโดยไม่อาจเรียกคืนได้<\/p>\n<p>จึงขอให้ท่านดำเนินการ ดังนี้<\/p>\n<p>1. เร่งรัดการแก้ไขข้อมูลที่ใกล้พ้นกำหนดให้แล้วเสร็จภายในวันที่ ⟦วันที่⟧<\/p>\n<p>2. มอบหมายผู้รับผิดชอบโดยตรง และแจ้งชื่อพร้อมหมายเลขโทรศัพท์มายังกลุ่มงานประกันสุขภาพ ภายในวันที่ ⟦วันที่⟧<\/p>\n<p>3. รายงานผลการดำเนินการและมาตรการป้องกันมิให้เกิดขึ้นซ้ำ ภายในวันที่ ⟦วันที่⟧<\/p>\n<p>จึงเรียนมาเพื่อทราบและดำเนินการโดยด่วน<\/p>\n<p>ขอแสดงความนับถือ<\/p>\n<p>(⟦ชื่อผู้ลงนาม⟧) · ⟦ตำแหน่ง⟧<\/p><\/div>\n<p>แม่แบบที่ 3 · หนังสือแจ้งหน่วยบริการที่มีความเสี่ยงทางการเงิน<\/p>\n<div class=\"callout\"><p><strong>หนังสือภายนอก — ถึงผู้อำนวยการโรงพยาบาลรายแห่ง<\/strong><\/p>\n<p>เรื่อง แจ้งผลการประเมินสถานะทางการเงินและขอให้จัดทำแผนฟื้นฟูการเงิน<\/p>\n<p>เรียน ผู้อำนวยการโรงพยาบาล⟦ชื่อ⟧<\/p>\n<p>ด้วยสำนักงานสาธารณสุขจังหวัด⟦จังหวัด⟧ ได้ประเมินสถานะทางการเงินของหน่วยบริการในจังหวัด ประจำเดือน ⟦เดือน ปี⟧ ปรากฏว่าหน่วยบริการของท่านมีค่าคะแนนความเสี่ยงทางการเงิน (Risk Score) ระดับ ⟦ระดับ⟧ โดยมีทุนสำรองสุทธิคงเหลือเทียบเท่าค่าใช้จ่ายดำเนินการประมาณ ⟦จำนวน⟧ เดือน นั้น<\/p>\n<p>ในการนี้ เพื่อให้การบริหารการเงินการคลังของหน่วยบริการเป็นไปอย่างมีประสิทธิภาพ และไม่ส่งผลกระทบต่อคุณภาพและความปลอดภัยในการให้บริการแก่ประชาชน จึงขอให้ท่านดำเนินการ ดังนี้<\/p>\n<p>1. จัดทำแผนฟื้นฟูการเงิน โดยระบุมาตรการ ผู้รับผิดชอบ กรอบเวลา และเป้าหมายเชิงตัวเลขที่วัดผลได้ เสนอต่อคณะกรรมการบริหารการเงินการคลังระดับจังหวัด ภายในวันที่ ⟦วันที่⟧<\/p>\n<p>2. ประเมินผลกระทบด้านความปลอดภัยของผู้ป่วยจากมาตรการลดค่าใช้จ่ายที่เสนอ และแนบมาพร้อมแผนตามข้อ 1<\/p>\n<p>3. รายงานความคืบหน้าการดำเนินการตามแผนเป็นรายเดือน จนกว่าค่าคะแนนความเสี่ยงจะลดลงไม่เกินระดับ ⟦ระดับ⟧<\/p>\n<p>จึงเรียนมาเพื่อทราบและดำเนินการต่อไป<\/p>\n<p>ขอแสดงความนับถือ<\/p>\n<p>(⟦ชื่อผู้ลงนาม⟧) · นายแพทย์สาธารณสุขจังหวัด⟦จังหวัด⟧<\/p><\/div>\n<p>แม่แบบที่ 4 · หนังสือประสานงาน อบจ. เรื่อง รพ.สต.ถ่ายโอน<\/p>\n<div class=\"callout\"><p><strong>หนังสือภายนอก — ถึงหน่วยงานต่างสังกัด (ไม่มีอำนาจสั่งการ)<\/strong><\/p>\n<p>เรื่อง ขอความร่วมมือในการจัดทำข้อตกลงการดำเนินงานร่วมระหว่างหน่วยบริการ<\/p>\n<p>เรียน นายกองค์การบริหารส่วนจังหวัด⟦จังหวัด⟧<\/p>\n<p>ด้วยการถ่ายโอนภารกิจสถานีอนามัยเฉลิมพระเกียรติฯ และโรงพยาบาลส่งเสริมสุขภาพตำบลให้แก่องค์การบริหารส่วนจังหวัด ประกอบกับการจัดสรรงบบริการปฐมภูมิรูปแบบใหม่ในปีงบประมาณ 2570 ส่งผลให้การบริหารจัดการด้านเวชภัณฑ์ ระบบข้อมูลบริการ และระบบส่งต่อผู้ป่วยระหว่างหน่วยบริการ จำเป็นต้องมีการประสานการดำเนินงานร่วมกันอย่างเป็นระบบ เพื่อมิให้กระทบต่อความต่อเนื่องในการดูแลประชาชน นั้น<\/p>\n<p>ในการนี้ สำนักงานสาธารณสุขจังหวัด⟦จังหวัด⟧ จึงขอความร่วมมือจากท่านในการจัดทำข้อตกลงการดำเนินงานร่วม โดยมีประเด็นสำคัญ ดังนี้<\/p>\n<p>1. แนวทางการสนับสนุนยาและเวชภัณฑ์ระหว่างหน่วยบริการประจำกับหน่วยบริการที่ถ่ายโอน<\/p>\n<p>2. การใช้ระบบข้อมูลบริการร่วมกัน เพื่อให้การบันทึกและการขอรับค่าใช้จ่ายเป็นไปอย่างครบถ้วน<\/p>\n<p>3. แนวทางการส่งต่อผู้ป่วยและการแบ่งความรับผิดชอบงานสร้างเสริมสุขภาพและป้องกันโรคในพื้นที่<\/p>\n<p>4. การแต่งตั้งคณะทำงานร่วมเพื่อติดตามและแก้ไขปัญหาการดำเนินงานเป็นรายไตรมาส<\/p>\n<p>จึงเรียนมาเพื่อโปรดพิจารณาให้ความอนุเคราะห์ และหากเห็นชอบ ขอได้โปรดมอบหมายผู้แทนเข้าร่วมหารือในวันที่ ⟦วันที่⟧ จะขอบคุณยิ่ง<\/p>\n<p>ขอแสดงความนับถือ<\/p>\n<p>(⟦ชื่อผู้ลงนาม⟧) · นายแพทย์สาธารณสุขจังหวัด⟦จังหวัด⟧<\/p><\/div>\n<p>แม่แบบที่ 5 · บันทึกข้อความเสนอ นพ.สสจ.<\/p>\n<div class=\"callout\"><p><strong>บันทึกข้อความ (หนังสือภายใน) — ไม่มีคำลงท้าย<\/strong><\/p>\n<p>ส่วนราชการ กลุ่มงานประกันสุขภาพ สำนักงานสาธารณสุขจังหวัด⟦จังหวัด⟧ โทร. ⟦เบอร์⟧<\/p>\n<p>ที่ ⟦เลขที่⟧ วันที่ ⟦วัน เดือน ปี⟧<\/p>\n<p>เรื่อง ขออนุมัติแต่งตั้งคณะทำงานตรวจสอบเวชระเบียนและการให้รหัสโรคระดับจังหวัด<\/p>\n<p>เรียน นายแพทย์สาธารณสุขจังหวัด⟦จังหวัด⟧<\/p>\n<p>1. เรื่องเดิม ตามที่สำนักงานหลักประกันสุขภาพแห่งชาติกำหนดให้มีการตรวจสอบเอกสารหลักฐานการเรียกเก็บค่าใช้จ่ายเพื่อบริการสาธารณสุขทั้งก่อนและหลังการจ่าย และหน่วยบริการในจังหวัดมีความเสี่ยงต่อการถูกเรียกคืนค่าใช้จ่ายจากการให้รหัสที่ไม่มีหลักฐานรองรับ นั้น<\/p>\n<p>2. ข้อเท็จจริง จากการวิเคราะห์ข้อมูลปีงบประมาณ ⟦ปี⟧ พบว่าค่าดัชนีความซับซ้อนของผู้ป่วย (Case Mix Index: CMI) ของหน่วยบริการในจังหวัดจำนวน ⟦จำนวน⟧ แห่ง ต่ำกว่าค่ากลางของหน่วยบริการระดับเดียวกันในเขตอย่างมีนัยสำคัญ และมีมูลค่าการถูกปรับลดค่าน้ำหนักสัมพัทธ์จากการตรวจสอบ จำนวน ⟦จำนวน⟧ บาท<\/p>\n<p>3. ข้อระเบียบที่เกี่ยวข้อง ⟦ระบุเฉพาะที่ตรวจสอบแล้ว⟧<\/p>\n<p>4. ข้อพิจารณา เห็นควรแต่งตั้งคณะทำงานตรวจสอบเวชระเบียนและการให้รหัสโรคระดับจังหวัด เพื่อสุ่มตรวจเวชระเบียนจำนวน ⟦จำนวน⟧ ฉบับต่อหน่วยบริการต่อไตรมาส และจัดทำข้อเสนอแนะรายแห่ง อันจะช่วยลดความเสี่ยงจากการถูกเรียกคืนค่าใช้จ่าย และเพิ่มความถูกต้องของรายได้ที่หน่วยบริการพึงได้รับ<\/p>\n<p>5. ข้อเสนอ จึงเรียนมาเพื่อโปรดพิจารณา หากเห็นชอบ โปรดลงนามในคำสั่งแต่งตั้งคณะทำงานตามที่เสนอมาพร้อมนี้<\/p>\n<p>(⟦ชื่อผู้เสนอ⟧) · ⟦ตำแหน่ง⟧<\/p><\/div>\n<h3>8.7 Checklist ก่อนเสนอลงนาม<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>☐<\/strong><\/th>\n<th><strong>รายการตรวจสอบ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>ชนิดหนังสือตรงกับทิศทางการติดต่อและฐานะของผู้ส่ง<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>บันทึกข้อความไม่มีคำลงท้าย / หนังสือภายนอกมีคำขึ้นต้นและคำลงท้ายเป็นคู่กัน<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>ใช้หรือไม่ใช้คำว่า \"โปรด\" ถูกต้องตามฐานะผู้รับ<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>\"อ้างถึง\" ตรงกับหนังสือฉบับจริง และเนื้อความมีวลี \"ตามหนังสือที่อ้างถึง\"<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>จำนวนและชื่อ \"สิ่งที่ส่งมาด้วย\" ตรงกับที่กล่าวถึงในเนื้อความ<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>หนังสือเวียนมี \"ว\" หน้าเลขทะเบียนส่ง<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>ย่อหน้าสุดท้ายบอกชัดว่าต้องทำอะไร ภายในวันที่เท่าใด และรายงานต่อใคร<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>วันที่ที่กำหนดยังไม่ผ่านไปแล้ว และสอดคล้องกับกำหนดของหนังสือต้นเรื่อง<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>ตัวเลขและข้อเท็จจริงทุกจุดตรวจแล้ว ไม่มีการประมาณการที่ไม่ได้ระบุว่าเป็นการประมาณ<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>ไม่มีข้อมูลผู้ป่วยที่ระบุตัวตนได้โดยไม่จำเป็น (ชื่อ HN AN เลขบัตรประชาชน)<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>ไม่มีช่อง ⟦ ⟧ หลงเหลืออยู่<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>การลงนามแทนถูกประเภท (ปฏิบัติราชการแทน / รักษาราชการแทน / รักษาการในตำแหน่ง)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>สรุปบทที่ 8 — 3 ข้อที่ต้องจำ<\/strong><\/p>\n<p>1. ตอบให้ได้ก่อนร่างว่ากำลังเขียนในฐานะใด — ผู้แทนผู้ซื้อบริการ ผู้บังคับบัญชา หรือผู้ประสานแนวราบ<\/p>\n<p>2. ความเด็ดขาดมาจากตัวเลข กำหนดเวลา และผู้รับผิดชอบที่ระบุตัวได้ ไม่ได้มาจากคำแรง<\/p>\n<p>3. หนังสือที่ไม่มีเส้นตาย คือหนังสือที่ไม่มีใครทำตาม<\/p><\/div>\n<h2 id=\"m-appx\">ภาคผนวก<\/h2>\n<h3>ผนวก ก · ศัพท์ที่ใช้บ่อยในคู่มือ<\/h3>\n<p>ความหมายเต็มและการใช้งานของศัพท์ 203 คำ อยู่ในเล่ม ตำราคำศัพท์และตัวย่องานประกันสุขภาพ<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>คำย่อ<\/strong><\/th>\n<th><strong>ความหมาย<\/strong><\/th>\n<\/tr>\n<tr>\n<th>สปสช. / NHSO<\/th>\n<th>สำนักงานหลักประกันสุขภาพแห่งชาติ<\/th>\n<\/tr>\n<tr>\n<th>อปสข.<\/th>\n<th>คณะอนุกรรมการหลักประกันสุขภาพระดับเขตพื้นที่<\/th>\n<\/tr>\n<tr>\n<th>UCS / SSS / CSMBS<\/th>\n<th>สิทธิหลักประกันสุขภาพแห่งชาติ / ประกันสังคม / สวัสดิการรักษาพยาบาลข้าราชการ<\/th>\n<\/tr>\n<tr>\n<th>CUP<\/th>\n<th>หน่วยบริการประจำที่รับเงินเหมาจ่ายรายหัว<\/th>\n<\/tr>\n<tr>\n<th>CR<\/th>\n<th>Central Reimbursement — บริการกรณีเฉพาะที่เบิกจากส่วนกลาง (ในบริบทการเงินหมายถึง Current Ratio)<\/th>\n<\/tr>\n<tr>\n<th>DRG / RW / AdjRW / CMI<\/th>\n<th>กลุ่มวินิจฉัยโรคร่วม / ค่าน้ำหนักสัมพัทธ์ / ค่าน้ำหนักที่ปรับวันนอน / ดัชนีความซับซ้อนเฉลี่ย<\/th>\n<\/tr>\n<tr>\n<th>FDH<\/th>\n<th>Financial Data Hub — ศูนย์กลางข้อมูลด้านการเงิน สธ. ช่องทางส่งเบิกบัตรทองของ รพ. สังกัด สธ.<\/th>\n<\/tr>\n<tr>\n<th>National Health Package<\/th>\n<th>ชุดบริการปฐมภูมิปีงบ 2570 ที่รวมงบ OP และ P&amp;P ส่งตรงหน่วยบริการปฐมภูมิ<\/th>\n<\/tr>\n<tr>\n<th>Pre- / Post-payment audit<\/th>\n<th>การตรวจสอบก่อนจ่ายเงิน / หลังจ่ายเงิน ปี 2570 ใช้ระบบ AI ช่วยคัดกรอง<\/th>\n<\/tr>\n<tr>\n<th>AIPN<\/th>\n<th>แจ้งขออนุมัติรับผู้ป่วยในข้ามเขต/นอกเครือข่าย ภายใน 24 ชั่วโมง<\/th>\n<\/tr>\n<tr>\n<th>NWC / NI<\/th>\n<th>ทุนสำรองสุทธิ / รายได้สูง(ต่ำ)กว่าค่าใช้จ่ายสุทธิ<\/th>\n<\/tr>\n<tr>\n<th>UCEP<\/th>\n<th>เจ็บป่วยฉุกเฉินวิกฤตมีสิทธิทุกที่ 72 ชั่วโมงแรก<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>ผนวก ข · ปฏิทินงานประกันสุขภาพรายปี<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ช่วงเวลา<\/strong><\/th>\n<th><strong>งานหลัก<\/strong><\/th>\n<\/tr>\n<tr>\n<th>ก.ค. – ก.ย.<\/th>\n<th>จัดทำ Planfin ปีถัดไป (ใช้อัตรา IP จริงของเขต) · ตรวจสอบและปรับปรุงข้อมูลประชากรลงทะเบียน · ตรวจบัญชีผู้ใช้งานระบบ สปสช. (ThaiD) · เตรียมรับประกาศหลักเกณฑ์ปีใหม่<\/th>\n<\/tr>\n<tr>\n<th>ต.ค.<\/th>\n<th>เริ่มปีงบประมาณ · ประชุมชี้แจงแนวทางปฏิบัติปีใหม่ · ปรับระบบให้สอดคล้องประกาศใหม่ · ขึ้นปีงบใหม่ในไฟล์ Excel (เปลี่ยนปีในชีต ตั้งค่า)<\/th>\n<\/tr>\n<tr>\n<th>ต.ค. – ธ.ค. (Q1)<\/th>\n<th>ปิดการส่งเคลมปีงบที่ผ่านมา · เคลียร์รายการติด C ค้าง · ตรวจสอบยอดโอนงวดแรก<\/th>\n<\/tr>\n<tr>\n<th>ม.ค. – มี.ค. (Q2)<\/th>\n<th>ปรับแผน Planfin กลางปี · ประเมินสถานะการเงินรอบ 6 เดือน · ทบทวนอัตราจ่ายต่อ RW จริงของเขต<\/th>\n<\/tr>\n<tr>\n<th>เม.ย. – มิ.ย. (Q3)<\/th>\n<th>Coding audit ภายใน · เร่งรัดผลงาน P&amp;P และ QOF · ติดตามการใช้งบค่าเสื่อม<\/th>\n<\/tr>\n<tr>\n<th>ก.ค. – ก.ย. (Q4)<\/th>\n<th>เร่งรัดผลงานให้ทันปิดปี · ตรวจสอบ CR ที่ตกหล่น · สรุปผลการดำเนินงานและถอดบทเรียน<\/th>\n<\/tr>\n<tr>\n<th>ตลอดปี<\/th>\n<th>ขึ้นทะเบียน/ต่ออายุหน่วยบริการ · พิจารณาคำร้องมาตรา 41 และ 18(4) · เฝ้าระวังสถานะการเงินรายเดือน · ติดตามเคส พ.ร.บ.รถรายสัปดาห์<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>ผนวก ค · Checklist ประจำเดือนของงานประกันสุขภาพ สสจ.<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>☐<\/strong><\/th>\n<th><strong>รายการตรวจสอบ<\/strong><\/th>\n<th><strong>ชีตใน Excel<\/strong><\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>Risk Score ทางการเงินของทุก รพ. และแนวโน้มเทียบเดือนก่อน<\/th>\n<th>RiskScore · RiskTrend<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>ทุนสำรองคงเหลือและระยะเวลาทุนหมดของ รพ. ที่มีความเสี่ยง<\/th>\n<th>RiskScore<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>First Pass Rate และมูลค่าเคลมติด C ค้าง แยกตาม รพ. และอายุค้าง<\/th>\n<th>p-chart · เคลมค้าง_ยอดโอน<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>จำนวนเคสส่งเกินกำหนด (ต้องเป็นศูนย์)<\/th>\n<th>Pareto<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>ส่วนต่างยอดส่งเคลมกับยอดโอนจริง<\/th>\n<th>เคลมค้าง_ยอดโอน<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>CMI รายเดือนของทุก รพ. เทียบค่ากลางกลุ่มเดียวกัน<\/th>\n<th>ControlChart · Funnel_CMI<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>ความคืบหน้าผลงาน P&amp;P และ QOF เทียบเป้าหมายสะสม<\/th>\n<th>—<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>สถานะคำร้องมาตรา 41 และ 18(4) ที่อยู่ระหว่างพิจารณา<\/th>\n<th>สรุป_ม41<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>ทะเบียนเคสอุบัติเหตุจราจรและสถานะการเบิก พ.ร.บ.รถ<\/th>\n<th>ทะเบียน_พรบรถ<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>ประเด็นจาก รพ.สต.ถ่ายโอน — ระบบข้อมูล ยา เวชภัณฑ์ การส่งต่อ<\/th>\n<th>—<\/th>\n<\/tr>\n<tr>\n<th>☐<\/th>\n<th>ประกาศหรือหนังสือสั่งการใหม่จาก สปสช. ที่ต้องแจ้งเวียน<\/th>\n<th>—<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>ผนวก ง · คู่มือเชื่อมไฟล์ Excel ระบบวิเคราะห์ประกันสุขภาพ<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>บทในคู่มือ<\/strong><\/th>\n<th><strong>ชีตใน Excel<\/strong><\/th>\n<th><strong>ใช้ตอบคำถาม<\/strong><\/th>\n<\/tr>\n<tr>\n<th>บทที่ 2<\/th>\n<th>ภาพรวมจังหวัด<\/th>\n<th>จังหวัดเราอยู่ตรงไหนของเขต — ใช้ในเวที อปสข.<\/th>\n<\/tr>\n<tr>\n<th>บทที่ 3<\/th>\n<th>Funnel_CMI · ControlChart · MDC_Gap<\/th>\n<th>CMI ต่ำจริงหรือไม่ เปลี่ยนจริงหรือแค่แกว่ง ต่ำเพราะกลุ่มโรคใด<\/th>\n<\/tr>\n<tr>\n<th>บทที่ 4<\/th>\n<th>p-chart · Funnel_FPR · Pareto · แผนแก้ไข · เคลมค้าง_ยอดโอน<\/th>\n<th>เคลมผ่านครั้งแรกเท่าไร ติด C เพราะอะไร ค้างนานแค่ไหน ยอดโอนครบหรือไม่<\/th>\n<\/tr>\n<tr>\n<th>บทที่ 5<\/th>\n<th>RiskScore · RiskTrend · Planfin_Waterfall<\/th>\n<th>คะแนนวิกฤติการเงิน แนวโน้ม และกำไรต่างจากแผนเพราะรายการใด<\/th>\n<\/tr>\n<tr>\n<th>บทที่ 6<\/th>\n<th>ทะเบียน_ม41 · สรุป_ม41<\/th>\n<th>คำร้องแยกประเภท พิจารณาทันกรอบหรือไม่ มี RCA และมาตรการหรือไม่<\/th>\n<\/tr>\n<tr>\n<th>บทที่ 7<\/th>\n<th>ทะเบียน_พรบรถ<\/th>\n<th>เคสใดใกล้ครบ 180 วันแต่ยังไม่ยื่นเบิก<\/th>\n<\/tr>\n<tr>\n<th>ทุกบท<\/th>\n<th>Dashboard · รายหน่วย<\/th>\n<th>หน่วยนี้ควรทำอะไรก่อน และควรลงพื้นที่ที่ไหนก่อน<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>ผนวก จ · เอกสารอ้างอิงที่ต้องมีติดโต๊ะ<\/h3>\n<blockquote>\n<p><strong>1.<\/strong> พ.ร.บ.หลักประกันสุขภาพแห่งชาติ พ.ศ. 2545 — โดยเฉพาะมาตรา 18(4), 41, 46, 47<\/p>\n<p><strong>2.<\/strong> ประกาศคณะกรรมการหลักประกันสุขภาพแห่งชาติ เรื่อง หลักเกณฑ์การดำเนินงานและการบริหารจัดการกองทุนหลักประกันสุขภาพแห่งชาติ ปีงบประมาณ 2570<\/p>\n<p><strong>3.<\/strong> คู่มือบริหารกองทุนหลักประกันสุขภาพแห่งชาติ ปีงบประมาณ 2570 (แบ่งหลายเล่มตามประเภทบริการ)<\/p>\n<p><strong>4.<\/strong> คู่มือแนวทางปฏิบัติในการขอรับค่าใช้จ่ายเพื่อบริการสาธารณสุข ปีงบประมาณ 2570 — อ่านหัวข้อ \"สิ่งที่เปลี่ยนแปลง\" ทุกปี<\/p>\n<p><strong>5.<\/strong> คู่มือการใช้งานระบบ FDH สำหรับหน่วยบริการ<\/p>\n<p><strong>6.<\/strong> ข้อบังคับฯ ว่าด้วยหลักเกณฑ์ วิธีการ และเงื่อนไขการจ่ายเงินช่วยเหลือเบื้องต้น (มาตรา 41 และมาตรา 18(4))<\/p>\n<p><strong>7.<\/strong> คู่มือ Planfin และเกณฑ์ประเมินสถานะการเงินของหน่วยบริการ (กองเศรษฐกิจสุขภาพและหลักประกันสุขภาพ)<\/p>\n<p><strong>8.<\/strong> ตาราง Thai DRG เวอร์ชันที่ประกาศใช้ในปีงบประมาณนั้น<\/p>\n<p><strong>9.<\/strong> หลักเกณฑ์การจัดสรรของ อปสข. เขตสุขภาพที่ 8<\/p>\n<\/blockquote>\n<div class=\"callout\"><p><strong>คำเตือนสุดท้าย<\/strong><\/p>\n<p>เอกสารนี้จัดทำเพื่อสร้างความเข้าใจเชิงโครงสร้าง ไม่ใช่เอกสารอ้างอิงทางกฎหมายหรือทางการเงิน อัตราจ่าย เกณฑ์ รหัส และกรอบเวลาเปลี่ยนทุกปีงบประมาณ ก่อนใช้อ้างอิงในหนังสือราชการให้ยึดประกาศและคู่มือฉบับล่าสุดของหน่วยงานเจ้าของเรื่อง<\/p><\/div>\n", "criteria": {"_readme": "เกณฑ์ทุกตัวที่แอปใช้ แก้ไฟล์นี้ทุกปีงบ แล้วรัน python3 tools/build.py — ห้ามใส่ตัวเลขที่ไม่มีแหล่ง (src ต้องชี้ไปที่ sources)", "version": "ปีงบ 2567–2569 (ข้อมูลรวบรวม 12 พ.ย. 2569)", "status": "ร่างเพื่อการเรียน — ไม่ใช่ประกาศฉบับทางการ", "verify_label": "ตรวจกับหนังสือสั่งการปีงบปัจจุบันก่อนใช้งานจริง", "todo_next_fy": "อัปเดตเกณฑ์ปีงบ 2570 เมื่อได้หนังสือสั่งการจริงของ สป.สธ. / เขตสุขภาพที่ 8 (คู่มือ 7 Plus / TPS, แนวทาง Planfin จ.อุดรธานี)", "sources": {"S1": {"title": "รายละเอียดตัวชี้วัด 53 ร้อยละหน่วยบริการที่ประสบภาวะวิกฤตทางการเงิน (KPI template ปีงบ 2567)", "url": "ht     var src = Object.keys(C.sources).map(function (k) {
      var s = C.sources[k];
      return "<tr><td>" + srcTag(k) + "</td><td>" + (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + "</a>" : esc(s.title)) + '</td><td class="small muted">' + esc(s.kind) + "</td></tr>";
    }).join("");
    var eff = C.efficiency.map(function (e) {
      return "<tr><td><b>" + esc(e.id) + '</b><div class="small muted">' + esc(e.name) + '</div></td><td class="small">' + esc(e.formula) + "</td><td>" + esc(e.rule) + "</td><td>" + srcTag(e.src) + "</td></tr>";
    }).join("");
    var rat = C.ratios.map(function (c) { return "<tr><td><b>" + esc(c.id === "CASH" ? "Cash" : c.id) + '</b></td><td class="small">' + esc(c.formula) + '</td><td class="num">' + esc(c.op + " " + (c.unit === "บาท" ? c.threshold : c.threshold.toFixed(1))) + "</td><td>" + c.points + "</td><td>" + srcTag(c.src) + "</td></tr>"; }).join("");
    var lv = C.levels.map(function (l) { return '<tr><td class="num">' + esc(l.label) + "</td><td>" + esc(l.meaning) + "</td></tr>"; }).join("");
    return '<div class="page-head"><span class="eyebrow">' + esc(C.version) + " · " + esc(C.status) + '</span><h1>เกณฑ์และแหล่งอ้างอิง</h1><p>เกณฑ์ทุกตัวเก็บในไฟล์ <code>data/criteria.json</code> — แก้ไฟล์นั้นทุกปีงบแล้วรัน <code>python3 tools/build.py</code> ไม่ต้องแก้โค้ด</p></div>' +
      '<p class="notice">' + esc(C.verify_label) + " · " + esc(C.todo_next_fy) + "</p>" +
      '<section class="sheet stack"><h2>Ratio ใน Risk Score</h2><div class="scroll-x"><table><thead><tr><th>ตัวชี้วัด</th><th>สูตร</th><th>เกณฑ์เสี่ยง</th><th>คะแนน</th><th>ที่มา</th></tr></thead><tbody>' + rat + "</tbody></table></div>" +
      '<p class="small">มิติระยะเวลาทุนหมด 0–2 คะแนน ' + srcTag("M1") + " " + srcTag("S1") + " · " + esc(C.survival.summary) + "</p></section>" +
      '<div class="grid2"><section class="sheet stack"><h2>ความหมายระดับ Risk Score ' + srcTag(C.levels_src) + '</h2><div class="scroll-x"><table><tbody>' + lv + "</tbody></table></div><p class=\"small muted\">" + esc(C.national_target.text) + "</p></section>" +
      '<section class="sheet stack"><h2>ประเภทลูกหนี้ตามสิทธิ (แบบรายงาน จ.อุดรธานี) ' + srcTag(C.receivable_types.src) + "</h2><ol>" + C.receivable_types.items.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol></section></div>" +
      '<section class="sheet stack"><h2>เกณฑ์ประสิทธิภาพที่พบในเอกสาร (ยังต้องยืนยันฉบับทางการ)</h2><div class="scroll-x"><table><thead><tr><th>ตัวชี้วัด</th><th>สูตร</th><th>เกณฑ์</th><th>ที่มา</th></tr></thead><tbody>' + eff + "</tbody></table></div>" +
      '<p class="small">' + esc(C.risk_scoring_plus.text) + " " + srcTag(C.risk_scoring_plus.src) + "</p></section>" +
      '<section class="sheet stack"><h2>แหล่งอ้างอิง</h2><div class="scroll-x"><table><tbody>' + src + "</tbody></table></div>" +
      '<p class="small muted">ทุกแหล่งเป็นเอกสารนำเสนอ/รายงานของหน่วยงาน สธ. ที่เผยแพร่ ไม่ใช่ประกาศฉบับทางการ · เนื้อหาตำรา: ' + esc(D.meta.textbook) + " · คู่มือ: " + esc(D.meta.manual) + " · ศัพท์: " + esc(D.glossary.sources.G1) + "</p></section>";
  };

  // ------------------------------------------------------------ BACKUP
  RENDER.backup = function () {
    return '<div class="page-head"><span class="eyebrow">เก็บในเบราว์เซอร์เครื่องนี้เท่านั้น</span><h1>สำรองความคืบหน้า</h1>' +
      "<p>ความคืบหน้า (บทที่อ่าน แบบฝึกที่ติ๊ก คะแนน ศัพท์ที่จำได้ Action plan ตัวเลขที่กรอก) เก็บใน localStorage ของเบราว์เซอร์ — ย้ายเครื่องหรือล้างประวัติเบราว์เซอร์แล้วจะหาย ให้สำรองเป็นไฟล์ไว้</p></div>" +
      '<div class="grid2"><section class="sheet stack"><h2>ส่งออก</h2><div class="row"><button class="btn primary" id="bDl">ดาวน์โหลดไฟล์สำรอง (.json)</button><button class="btn" id="bCopy">คัดลอกเป็นข้อความ</button></div>' +
      '<textarea class="copybox" id="bBox" hidden></textarea></section>' +
      '<section class="sheet stack"><h2>นำเข้า</h2><div class="field"><label for="bFile">เลือกไฟล์สำรอง</label><input type="file" id="bFile" accept=".json,application/json"></div>' +
      '<div class="field"><label for="bPaste">หรือวางข้อความสำรอง</label><textarea class="copybox" id="bPaste"></textarea></div><button class="btn" id="bImport">นำเข้าจากข้อความ</button><div id="bMsg"></div></section></div>' +
      '<section class="sheet stack"><h2>เริ่มใหม่</h2><p class="small muted">ลบความคืบหน้าทั้งหมดในเครื่องนี้</p><div><button class="btn danger" id="bReset">ล้างข้อมูลทั้งหมด</button></div></section>';
  };
  AFTER.backup = function (root) {
    function dump() { return JSON.stringify({ app: "mophfin", v: 1, at: new Date().toISOString(), data: S }, null, 1); }
    $("#bDl", root).onclick = function () { download("mophfin-backup-" + new Date().toISOString().slice(0, 10) + ".json", dump(), "application/json"); };
    $("#bCopy", root).onclick = function () { copyText(dump(), $("#bBox", root)); };
    function imp(text) {
      try {
        var o = JSON.parse(text);
        if (o.app !== "mophfin" || !o.data) throw new Error("ไม่ใช่ไฟล์สำรองของแอปนี้");
        var b = blank(); for (var k in o.data) b[k] = o.data[k];
        S = b; save(); deck = null; route(); toast("นำเข้าแล้ว");
      } catch (e) { $("#bMsg", root).innerHTML = '<p class="notice pdpa small">นำเข้าไม่สำเร็จ: ' + esc(e.message) + "</p>"; }
    }
    $("#bFile", root).onchange = function (e) { var f = e.target.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { imp(String(r.result).replace(/^﻿/, "")); }; r.readAsText(f); };
    $("#bImport", root).onclick = function () { imp($("#bPaste", root).value); };
    var armed = false;
    $("#bReset", root).onclick = function (e) {
      if (!armed) { armed = true; e.target.textContent = "กดอีกครั้งเพื่อยืนยัน — ลบถาวร"; return; }
      S = blank(); save(); deck = null; route(); toast("ล้างข้อมูลแล้ว");
    };
  };

  window.addEventListener("hashchange", route);
  route();
})();

</script>
