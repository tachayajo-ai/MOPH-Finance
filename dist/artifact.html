<title>สมุดเรียนงบ รพ.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<style>
/* Layout: ledger-book workbench — fixed chapter rail on the left (top tabs on phone), one working sheet on the right.
   Color: ledger-green ink on cool paper; red only for negatives / fails, accounting-style. */
:root {
  --paper: #f3f6f3;
  --sheet: #ffffff;
  --ink: #15302a;
  --muted: #5a6d66;
  --line: #d5dfd9;
  --rule: #e8eeea;
  --accent: #0d6b52;
  --accent-ink: #ffffff;
  --accent-soft: #e0efe8;
  --ok: #1d7a3d;
  --ok-soft: #e3f3e7;
  --warn: #9a5c00;
  --warn-soft: #fbefd9;
  --crit: #b3261e;
  --crit-soft: #fbe5e3;
  --mark: #fff0b3;
  --mark-ink: #5c4600;
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Leelawadee UI", "Sukhumvit Set", Tahoma, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1513; --sheet: #151f1c; --ink: #e2ebe7; --muted: #94a79f; --line: #2b3a35; --rule: #1f2b27;
    --accent: #4fbf98; --accent-ink: #06231a; --accent-soft: #173a2f;
    --ok: #62c784; --ok-soft: #15301f; --warn: #e3a646; --warn-soft: #36290f; --crit: #f2756b; --crit-soft: #3a1a17;
    --mark: #4a3d10; --mark-ink: #ffe28a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1513; --sheet: #151f1c; --ink: #e2ebe7; --muted: #94a79f; --line: #2b3a35; --rule: #1f2b27;
  --accent: #4fbf98; --accent-ink: #06231a; --accent-soft: #173a2f;
  --ok: #62c784; --ok-soft: #15301f; --warn: #e3a646; --warn-soft: #36290f; --crit: #f2756b; --crit-soft: #3a1a17;
  --mark: #4a3d10; --mark-ink: #ffe28a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.65;
}
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.3; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--sheet);
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: .8rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .grp { font-size: .72rem; letter-spacing: .08em; color: var(--muted); margin: 10px 8px 2px; }
.nav a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: .95rem;
}
.nav a:hover { background: var(--rule); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a small { font-family: var(--f-num); font-size: .72rem; color: var(--muted); }
.rail-foot { margin-top: auto; font-size: .75rem; color: var(--muted); }

main {
  min-width: 0;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font-size: clamp(1.45rem, 3vw, 1.9rem); }
.page-head p { margin: 0; color: var(--muted); max-width: 68ch; }
.eyebrow { font-size: .75rem; letter-spacing: .1em; color: var(--accent); font-weight: 600; }

.topbar { display: none; }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
  .topbar {
    display: block; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--sheet); border-bottom: 1px solid var(--line);
  }
  .topbar .row { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding-block: 10px 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar b { font-family: var(--f-display); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    padding-block: 4px 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { flex: none; padding: 5px 11px; border-radius: 999px; font-size: .88rem; text-decoration: none; color: var(--ink); border: 1px solid var(--line); }
  .tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  main { padding-block: 18px 56px; }
}

/* ---------- building blocks ---------- */
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.sheet > h2 { font-size: 1.15rem; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 720px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet);
  font-size: .92rem; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--crit); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.mock { background: var(--mark); color: var(--mark-ink); border-color: transparent; font-weight: 600; }
.tag.verify { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.tag.crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.tag.watch { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.src { font-family: var(--f-num); font-size: .72rem; padding: 1px 6px; border-radius: 4px; background: var(--rule); color: var(--muted); text-decoration: none; white-space: nowrap; }
a.src:hover { color: var(--accent); }

.notice { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: .9rem; }
.notice.pdpa { border-color: var(--crit); background: var(--crit-soft); }
.notice.info { border-color: var(--accent); background: var(--accent-soft); }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: .85rem; color: var(--muted); }
.field input, .field select, .field textarea, .inp {
  width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper);
}
.field input.num { text-align: right; }
.field .hint { font-size: .75rem; color: var(--muted); }

.progress { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.scroll-x { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { border-bottom: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: .82rem; border-bottom-color: var(--line); background: var(--paper); }
td.r, th.r { text-align: right; }

/* ---------- reading ---------- */
.reader { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
.toc { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 2px; font-size: .9rem; }
.toc button { text-align: left; background: none; border: 0; padding: 6px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.toc button:hover { background: var(--rule); }
.toc button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; transform: translateY(-1px); }
.toc .dot.done { background: var(--ok); border-color: var(--ok); }
@media (max-width: 900px) {
  .reader { grid-template-columns: minmax(0, 1fr); }
  .toc { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .toc button { flex: none; border: 1px solid var(--line); }
}
.prose { max-width: 72ch; }
.prose h2 { font-size: 1.4rem; margin: 4px 0 14px; }
.prose h3 { font-size: 1.12rem; margin: 26px 0 8px; padding-top: 10px; border-top: 1px solid var(--rule); }
.prose h4 { font-size: 1rem; margin: 18px 0 6px; color: var(--accent); }
.prose p { margin: 0 0 12px; }
.prose ul, .prose ol { margin: 0 0 12px; padding-left: 1.4em; }
.prose li { margin: 3px 0; }
.prose table { margin: 6px 0 14px; }
.prose .scroll-x { margin-bottom: 14px; }
.prose blockquote { margin: 0 0 12px; padding-left: 12px; border-left: 2px solid var(--line); color: var(--muted); }
.prose .callout { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; }
.prose .callout p { margin: 0 0 6px; }
.prose .callout blockquote { border: 0; padding: 0; color: inherit; margin: 0; }
.formula { font-family: var(--f-num); background: var(--paper); border: 1px dashed var(--line); padding: 10px 14px; border-radius: 8px; margin: 0 0 14px; overflow-x: auto; }
.task { list-style: none; margin-left: -1.4em; }
.task label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 6px 10px; border-radius: 8px; background: var(--paper); }
.task input { margin-top: 6px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.task input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.chapter-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }

/* ---------- calculators ---------- */
.inputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
@media (max-width: 560px) { .inputs { grid-template-columns: minmax(0, 1fr); } }
.result-row td { vertical-align: middle; }
.pill { display: inline-block; font-size: .78rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.pill.pass { background: var(--ok-soft); color: var(--ok); }
.pill.fail { background: var(--crit-soft); color: var(--crit); }
.pill.na { background: var(--rule); color: var(--muted); }
.neg { color: var(--crit); }

.gauge { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.gauge div { height: 34px; border-radius: 6px; display: grid; place-items: center; font-family: var(--f-num); font-size: .9rem; background: var(--rule); color: var(--muted); }
.gauge div.t-ok.on { background: var(--ok); color: #fff; }
.gauge div.t-watch.on, .gauge div.t-warn.on { background: var(--warn); color: #fff; }
.gauge div.t-crit.on { background: var(--crit); color: #fff; }
.gauge div.cur { outline: 2px solid var(--ink); outline-offset: 2px; }
.score-big { font-family: var(--f-display); font-size: 3rem; line-height: 1; }
.big-money { font-family: var(--f-num); font-size: 2rem; font-weight: 600; color: var(--accent); }
.breakdown { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .breakdown { grid-template-columns: minmax(0, 1fr); } }
.breakdown > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.breakdown b { font-family: var(--f-num); font-size: 1.3rem; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 720px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.countdown b { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; color: var(--accent); }
.timeline { display: flex; flex-direction: column; gap: 0; }
.timeline .step { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: center; }
.timeline .step:last-child { border-bottom: 0; }
.timeline .when { font-size: .82rem; color: var(--muted); }
.timeline .now .when { color: var(--accent); font-weight: 600; }
@media (max-width: 560px) { .timeline .step { grid-template-columns: minmax(0, 1fr) auto; } .timeline .when { grid-column: 1 / -1; } }
.stat b { font-family: var(--f-num); font-size: 1.6rem; }
.tool-links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 720px) { .tool-links { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tool-links a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink); background: var(--sheet); }
.tool-links a:hover { border-color: var(--accent); }
.tool-links a span { font-size: .8rem; color: var(--muted); }

/* ---------- quiz / cards ---------- */
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.right { border-color: var(--ok); background: var(--ok-soft); }
.choice.wrong { border-color: var(--crit); background: var(--crit-soft); }
.choice:disabled { cursor: default; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.card-flip {
  min-height: 220px; border: 1px solid var(--line); border-radius: 14px; background: var(--sheet);
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  padding: 24px; cursor: pointer; gap: 10px;
}
.card-flip .term { font-family: var(--f-display); font-size: clamp(1.4rem, 4vw, 2rem); }
.card-flip .full { font-weight: 600; }
.card-flip .meaning { color: var(--muted); max-width: 60ch; }

/* ---------- glossary ---------- */
.gl-item { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.gl-item b { font-family: var(--f-display); }
@media (max-width: 560px) { .gl-item { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

/* ---------- action plan ---------- */
.plan-table textarea { width: 100%; min-width: 150px; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--paper); font-size: .88rem; }
.plan-table td { padding: 6px; }
.plan-table th { white-space: nowrap; }
.bad-input { border-color: var(--crit) !important; background: var(--crit-soft) !important; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: .9rem; z-index: 20; }
textarea.copybox { width: 100%; min-height: 120px; font-family: var(--f-num); font-size: .8rem; }

</style>

<div class="shell">
  <aside class="rail" aria-label="เมนูหลัก">
    <div class="brand"><b>สมุดเรียนงบ รพ.</b><span>งบการเงิน · กองทุน · งานประกันสุขภาพ</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <div class="topbar">
    <div class="row"><b>สมุดเรียนงบ รพ.</b><span class="tag verify" id="topVer"></span></div>
    <nav class="tabs" id="tabs" aria-label="เมนูหลัก"></nav>
  </div>
  <main id="main"><div class="page"><p>กำลังโหลด…</p></div></main>

<script>
window.APP_DATA = {"textbook": "# ตำรางบการเงินโรงพยาบาล สำหรับงานประกันสุขภาพ (เรียนด้วยตนเอง)\n\nจัดทำ 12 พ.ย. 2569 · เอกสารเรียนด้วยตนเอง\n## วิธีใช้ตำรา\n\nเป้าหมาย: ภายใน 90 วันหลังเริ่มงาน อ่านงบการเงิน รพ. 1 แห่งแล้วบอกได้ว่า \"ป่วยตรงไหน เพราะอะไร ต้องแก้อะไร\" ภายใน 30 นาที\n\nตำรานี้เรียงจาก Why → What → How → So what: บทที่ 1–2 คือภาษาบัญชี, บทที่ 3 คือบัญชี รพ.สธ., บทที่ 4–5 คือเครื่องมือวิเคราะห์ที่ สสจ. ใช้กำกับ รพ., บทที่ 6–7 คือจุดที่พยาบาลประกันสุขภาพได้เปรียบคนอื่น เพราะเข้าใจทั้งฝั่งคลินิกและฝั่งเคลม\n\n### แผนเรียน\n\n| ช่วง | บท | งานที่ต้องทำ (Output) |\n| --- | --- | --- |\n| สัปดาห์ 1 (ก่อนเริ่มงาน) | 1–2 | เขียนสมการบัญชีและบันทึกรายการ 10 รายการด้วยมือ |\n| สัปดาห์ 2 (ก่อนเริ่มงาน) | 3 | ทำ Mapping ผังบัญชีรายได้/ลูกหนี้ตามสิทธิ UC/SSS/CSMBS |\n| สัปดาห์ 3 (ก่อนเริ่มงาน) | 4 | คำนวณ Ratio จากงบ รพ. ตัวอย่าง 1 แห่ง |\n| วันที่ 1–30 | 5 | ขอข้อมูล Risk Score และ Planfin ของ รพ. 21 แห่ง จากหัวหน้ากลุ่มงาน |\n| วันที่ 31–60 | 6 | จับคู่ AR days กับผลเคลม e-Claim/FDH ของ รพ. 3 แห่งที่ Risk สูงสุด |\n| วันที่ 61–90 | 7 | ทำ Action plan 1 หน้า ให้ รพ. 1 แห่ง แล้วขอ Feedback จากหัวหน้า |\n\nหลักการเรียน: ทุกบทจบด้วยคำถาม \"แล้วมันกระทบเงินสดของ รพ. อย่างไร\" — ถ้าตอบไม่ได้ ให้กลับไปอ่านบทที่ 2 ใหม่\n\nข้อควรระวัง: เกณฑ์ตัวเลข (Risk Score, Planfin, ผังบัญชี) ปรับทุกปีงบประมาณ ก่อนใช้งานจริงให้ตรวจกับหนังสือสั่งการฉบับล่าสุดของ สป.สธ. / เขตสุขภาพที่ 8 เสมอ\n\n## บทที่ 1 ที่มาและแนวคิดพื้นฐานทางบัญชี\n\nบัญชีคือภาษาที่ใช้เล่าว่า \"องค์กรมีอะไร เป็นหนี้ใคร และทำงานแล้วรวยขึ้นหรือจนลง\" — งบการเงินคือรายงานสรุปของภาษานี้\n\n### 1.1 ที่มา: ทำไมต้องมีบัญชี\n\n- ระบบบัญชีคู่ (Double-entry) ถูกรวบรวมเป็นตำราครั้งแรกโดย Luca Pacioli ในอิตาลี ปี ค.ศ. 1494 เพื่อให้พ่อค้าตรวจได้ว่าบันทึกถูกต้องและไม่มีใครยักยอก\n- แนวคิดนี้ยังใช้ทุกวันนี้ เพราะตอบโจทย์ 3 อย่าง: ความรับผิดชอบ (Accountability), การตัดสินใจ (Decision-making), และการตรวจสอบ (Control)\n- สำหรับ รพ.รัฐ ความหมายคือ: เงินบำรุงเป็นเงินแผ่นดิน ผู้อำนวยการต้องแสดงได้ว่าใช้อย่างไร และ สสจ./เขต ต้องเห็นสัญญาณวิกฤตก่อน รพ. ขาดสภาพคล่อง\n\n### 1.2 สมการบัญชี — สิ่งเดียวที่ต้องจำให้ขึ้นใจ\n\n```latex\n\\text{สินทรัพย์} = \\text{หนี้สิน} + \\text{ทุน (ส่วนของเจ้าของ)}\n```\n\n- สินทรัพย์ (Assets) = สิ่งที่ รพ. ควบคุมและจะให้ประโยชน์ในอนาคต เช่น เงินสด ลูกหนี้ค่ารักษา ยาและเวชภัณฑ์คงคลัง อาคาร ครุภัณฑ์\n- หนี้สิน (Liabilities) = ภาระที่ต้องจ่ายออกไป เช่น เจ้าหนี้ค่ายา ค่าตอบแทนค้างจ่าย\n- ทุน (Equity) = ส่วนที่เหลือเมื่อหักหนี้แล้ว ใน รพ.รัฐ คือทุนและรายได้สูงกว่าค่าใช้จ่ายสะสม\n- ทุกรายการที่บันทึกต้องทำให้สมการยังสมดุล — นี่คือหัวใจของบัญชีคู่ (เดบิต = เครดิต)\n\n### 1.3 เกณฑ์เงินสด vs เกณฑ์คงค้าง (Cash vs Accrual basis)\n\n| ประเด็น | เกณฑ์เงินสด | เกณฑ์คงค้าง |\n| --- | --- | --- |\n| รับรู้รายได้เมื่อ | ได้รับเงินจริง | ให้บริการเสร็จ (เกิดสิทธิเรียกเก็บ) |\n| รับรู้ค่าใช้จ่ายเมื่อ | จ่ายเงินจริง | เกิดภาระ แม้ยังไม่จ่าย |\n| ตัวอย่าง รพ. | ผู้ป่วย UC นอน รพ. เดือน ต.ค. ได้เงินโอนจาก สปสช. เดือน ธ.ค. → รายได้ลงเดือน ธ.ค. | รายได้ลงเดือน ต.ค. พร้อมตั้ง \"ลูกหนี้ค่ารักษา UC\" ไว้ |\n| จุดอ่อน | ไม่เห็นภาระที่ค้างอยู่ | กำไรอาจสูง แต่เงินสดไม่มี ถ้าเก็บลูกหนี้ไม่ได้ |\n\nหน่วยบริการ สป.สธ. ใช้เกณฑ์คงค้าง ดังนั้นต้องอ่านงบกำไรขาดทุนคู่กับงบกระแสเงินสดเสมอ\n\n### 1.4 หลักการสำคัญที่ต้องรู้ (Concepts)\n\n- Going concern (การดำเนินงานต่อเนื่อง): สมมติว่า รพ. ยังเปิดต่อไป จึงตัดค่าเสื่อมราคาครุภัณฑ์ตามอายุใช้งานได้\n- Matching (การจับคู่รายได้กับค่าใช้จ่าย): ค่ายาที่ใช้กับผู้ป่วยเดือนนี้ ต้องลงค่าใช้จ่ายเดือนเดียวกับรายได้ของผู้ป่วยรายนั้น\n- Prudence (ความระมัดระวัง): ลูกหนี้ที่เก็บไม่ได้แน่ ต้องตั้งค่าเผื่อหนี้สงสัยจะสูญ ไม่ใช่นับเป็นรายได้เต็มจำนวน\n- Materiality (ความมีสาระสำคัญ): สนใจรายการที่มีผลต่อการตัดสินใจ ไม่ต้องไล่ทุกบาท\n\n### 1.5 แบบฝึก\n\n- [ ] บันทึก 5 รายการด้วยสมการบัญชี: ซื้อยาเชื่อ 100,000 บาท / ให้บริการ IP สิทธิ UC 50,000 บาท / ได้รับเงินโอน สปสช. 30,000 บาท / จ่ายค่ายา 60,000 บาท / ตัดค่าเสื่อมครุภัณฑ์ 5,000 บาท (ตัวเลขสมมติเพื่อฝึก)\n- [ ] อธิบายด้วยคำพูดตัวเองว่า \"ทำไม รพ. มีรายได้สูงกว่าค่าใช้จ่าย แต่ไม่มีเงินจ่ายค่ายา\"\n\n## บทที่ 2 งบการเงินหลักและความเชื่อมโยงระหว่างงบ\n\nงบการเงินมี 4 งบหลัก + หมายเหตุประกอบงบ แต่ละงบตอบคำถามคนละข้อ และต้องอ่านเชื่อมกันเสมอ\n\n### 2.1 งบแต่ละตัวตอบคำถามอะไร\n\n| งบ | ตอบคำถาม | ลักษณะเวลา | สิ่งที่ดูใน รพ. |\n| --- | --- | --- | --- |\n| งบแสดงฐานะการเงิน (Balance sheet) | ณ วันนี้ รพ. มีอะไร เป็นหนี้เท่าไร | ภาพนิ่ง ณ วันสิ้นงวด | เงินสด, ลูกหนี้ค่ารักษาตามสิทธิ, ยาคงคลัง, เจ้าหนี้ค่ายา |\n| งบแสดงผลการดำเนินงาน (Income statement) | ทำงานทั้งงวดแล้ว รายได้สูงหรือต่ำกว่าค่าใช้จ่าย | ช่วงเวลา (เดือน/ปี) | รายได้ค่ารักษาแยกสิทธิ, เงินเดือน/ค่าตอบแทน, ค่ายา, ค่าเสื่อม |\n| งบกระแสเงินสด (Cash flow) | เงินสดเข้า-ออกจริงเท่าไร มาจากไหน | ช่วงเวลา | เงินสดจากการดำเนินงาน vs ลงทุน vs จัดหาเงิน |\n| งบการเปลี่ยนแปลงส่วนทุน | ทุนเพิ่ม/ลดเพราะอะไร | ช่วงเวลา | รายได้สูง(ต่ำ)กว่าค่าใช้จ่ายสะสม |\n| หมายเหตุประกอบงบ | ตัวเลขข้างบนมีรายละเอียด/สมมติฐานอะไร | — | นโยบายตั้งค่าเผื่อหนี้สงสัยจะสูญ, รายละเอียดลูกหนี้รายสิทธิ |\n\n### 2.2 ความเชื่อมโยง (ต้องวาดเองให้ได้)\n\n1. รายได้สูง(ต่ำ)กว่าค่าใช้จ่ายสุทธิ (NI) จากงบผลการดำเนินงาน → ไหลไปเพิ่ม/ลดทุนในงบฐานะการเงิน\n2. งบกระแสเงินสดเริ่มจาก NI แล้วปรับรายการที่ไม่ใช่เงินสด เช่น บวกค่าเสื่อมกลับ, หักลูกหนี้ที่เพิ่มขึ้น, บวกเจ้าหนี้ที่เพิ่มขึ้น\n3. เงินสดปลายงวดในงบกระแสเงินสด = เงินสดในงบฐานะการเงิน\n\nข้อสรุปที่ต้องจำ: ลูกหนี้เพิ่ม = เงินสดลด, เจ้าหนี้เพิ่ม = เงินสดเพิ่ม (ชั่วคราว), ค่าเสื่อม = ค่าใช้จ่ายที่ไม่ใช่เงินสด\n\n### 2.3 ลำดับการอ่านงบที่แนะนำ\n\n1. งบกระแสเงินสด — รพ. มีเงินพอจ่ายไหม (คำถามเอาตัวรอด)\n2. งบฐานะการเงิน — ทุนหมุนเวียนสุทธิ (NWC) บวกหรือลบ, ลูกหนี้/เจ้าหนี้ค้างเท่าไร\n3. งบผลการดำเนินงาน — ขาดทุน/กำไรมาจากรายได้ต่ำ หรือค่าใช้จ่ายสูง\n4. หมายเหตุ — มีการประมาณการที่ทำให้ตัวเลขดูดีเกินจริงหรือไม่\n\n### 2.4 กับดักที่พบบ่อย\n\n- กำไรแต่เงินสดติดลบ: ลูกหนี้ค่ารักษาค้างสูง (เคลมไม่ผ่าน/ส่งช้า)\n- ตั้งลูกหนี้ตามราคาเรียกเก็บเต็ม แต่กองทุนจ่ายตามอัตราจ่ายจริง (เช่น DRG ตามค่า Base rate) ทำให้รายได้และลูกหนี้สูงเกินจริง\n- ไม่ตั้งค่าเผื่อหนี้สงสัยจะสูญ สำหรับลูกหนี้ที่เกินระยะเวลาเรียกเก็บได้\n- เจ้าหนี้ค่ายาค้างนาน ทำให้เงินสดดูดี แต่เป็นการยืมเงินผู้ขาย\n\n### 2.5 แบบฝึก\n\n- [ ] วาดแผนภาพเชื่อม 3 งบด้วยมือ โดยใช้ 5 รายการจากแบบฝึกบทที่ 1\n- [ ] หางบการเงิน รพ.ชุมชน 1 แห่ง (จาก สสจ. หรือรายงานประจำปี) แล้วระบุ NI, เงินสดปลายงวด, ลูกหนี้ค่ารักษารวม\n\n## บทที่ 3 ระบบบัญชีหน่วยบริการ สป.สธ. และลูกหนี้ค่ารักษาตามสิทธิ\n\nสำหรับงานประกันสุขภาพ บัญชีที่สำคัญที่สุดคือ \"ลูกหนี้ค่ารักษาพยาบาลแยกตามสิทธิ\" เพราะเป็นจุดที่งานเคลมกลายเป็นเงินสด หรือกลายเป็นหนี้สูญ\n\n### 3.1 ภาพรวมระบบ\n\n- หน่วยบริการสังกัด สป.สธ. บันทึกบัญชีเกณฑ์คงค้าง และส่งรายงานการเงินรายไตรมาสให้ กองเศรษฐกิจสุขภาพและหลักประกันสุขภาพ (สป.สธ.) เพื่อใช้ประเมินวิกฤตการเงิน ([KPI template ปีงบ 67](https://uthaihealth.moph.go.th/uthkpi67/document/140.pdf))\n- แหล่งข้อมูลกลางที่จังหวัด/เขตใช้ดึงตัวชี้วัด คือระบบ hfo.moph.go.th (ปรากฏเป็นแหล่งอ้างอิงในรายงานสถานการณ์การเงินของเขต 8)\n- เขตสุขภาพที่ 8 ติดตามข้อมูล Risk, 7 Plus Efficiency, TPS, Planfin, Cost/CMI/SumAdjRW ทุกเดือน และมีทีมระดับจังหวัดลงพื้นที่ทำ RCA เมื่อพบสัญญาณเตือน ([เขต 8](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20240219102839.pdf))\n\n### 3.2 ประเภทลูกหนี้ค่ารักษาตามสิทธิ (ตามแบบรายงานของ จ.อุดรธานี)\n\nแบบรายงานลูกหนี้ของ จ.อุดรธานี (ข้อมูล ณ 30 เม.ย. 2567) แยกลูกหนี้เป็นรายสิทธิ และแยกอายุตามปีงบประมาณที่เกิดหนี้ ([r8.moph.go.th](https://r8.moph.go.th/r8wayNewadmin/page/upload_file/20240521031539.pdf))\n\n| กลุ่มลูกหนี้ | แหล่งจ่าย | ระบบเรียกเก็บหลัก (ที่งานประกันต้องรู้) |\n| --- | --- | --- |\n| สิทธิ UC | สปสช. | e-Claim / FDH, DRG สำหรับ IP |\n| สิทธิประกันสังคม | สำนักงานประกันสังคม / รพ.คู่สัญญา | ตามข้อตกลงกับ รพ.คู่สัญญาหลัก / ระบบ สปส. |\n| สิทธิเบิกจ่ายตรง (CSMBS) | กรมบัญชีกลาง | ระบบเบิกจ่ายตรง (DRG สำหรับ IP) |\n| แรงงานต่างด้าว / ผู้มีปัญหาสถานะและสิทธิ | กองทุนเฉพาะ | ตามประกาศกองทุน |\n| สิทธิชำระเงิน | ผู้ป่วยจ่ายเอง | การติดตามหนี้ค้างชำระ |\n| สิทธิเบิกต้นสังกัด | หน่วยงานต้นสังกัด | หนังสือเรียกเก็บ |\n| สิทธิ พ.ร.บ. | บริษัทประกันภัย / กองทุนทดแทนผู้ประสบภัย | เอกสาร พ.ร.บ. |\n| สิทธิ อปท. | กรมส่งเสริมการปกครองท้องถิ่น | ระบบเบิกจ่ายตรง อปท. |\n| ระบบปฏิบัติการฉุกเฉิน (EMS) | สพฉ. | ตามหลักเกณฑ์ EMS |\n\nช่องทางเรียกเก็บในคอลัมน์ขวาเป็นภาพรวมเพื่อการเรียน — ก่อนใช้งานจริงให้ตรวจกับคู่มือของแต่ละกองทุนในปีงบประมาณนั้น\n\n### 3.3 วงจรลูกหนี้ (Revenue cycle) ที่พยาบาลประกันต้องเข้าใจ\n\n1. ให้บริการ → บันทึกรายได้ + ตั้งลูกหนี้ตามสิทธิ (เกณฑ์คงค้าง)\n2. สรุปเวชระเบียน / ให้รหัส ICD-10-TM, ICD-9-CM → ส่งเคลม\n3. กองทุนตรวจ → จ่าย / ปฏิเสธ (C, Deny) / ปรับลด\n4. รับเงิน → ตัดลูกหนี้; ส่วนต่างระหว่างที่ตั้งไว้กับที่ได้รับจริง → ปรับปรุงบัญชี\n5. ลูกหนี้ที่เกินกำหนด → ติดตาม / อุทธรณ์ / ตั้งค่าเผื่อหนี้สงสัยจะสูญ\n\nจุดรั่วที่งานประกันแก้ได้โดยตรง: ข้อ 2 (สรุปชาร์ตช้า, รหัสไม่ครบ ทำให้ AdjRW ต่ำ) และข้อ 3 (เคลมติด C / Deny ไม่ได้แก้ไขในเวลา)\n\n### 3.4 การอ่านรายงานลูกหนี้แยกอายุ (Aging)\n\n- ลูกหนี้ปีงบปัจจุบัน = ปกติ (อยู่ในวงจรเรียกเก็บ)\n- ลูกหนี้ปีงบก่อน 1 ปี = ต้องติดตาม หาสาเหตุรายสิทธิ\n- ลูกหนี้ 2 ปีขึ้นไป = มีโอกาสเก็บไม่ได้สูง ควรพิจารณาความเหมาะสมของการตั้งค่าเผื่อหนี้สงสัยจะสูญ/จำหน่ายหนี้ตามระเบียบ\n- ลูกหนี้สิทธิชำระเงินมักค้างนานที่สุด — ตัวอย่างในรายงานลูกหนี้ของเขต 8 (ส.ค. 2567) พบลูกหนี้สิทธิชำระเงินกระจายอยู่ในปีเก่าหลายปี ขณะที่ UC/SSS/CSMBS ส่วนใหญ่อยู่ในปีปัจจุบัน ([r8.moph.go.th](https://r8.moph.go.th/r8wayNewadmin/page/upload_file/20240822021519.pdf))\n\n### 3.5 แบบฝึก\n\n- [ ] ขอรายงานลูกหนี้แยกอายุ จ.อุดรธานี ฉบับล่าสุดจากกลุ่มงาน แล้วระบุ 3 รพ. ที่มีลูกหนี้ปีเก่าสูงสุด และสิทธิที่เป็นปัญหา\n- [ ] วาด Revenue cycle ของสิทธิ UC IP ตั้งแต่ Admit ถึงได้เงิน พร้อมระบุระยะเวลาแต่ละขั้น (ข้อมูลจาก รพ.จริง)\n\n## บทที่ 4 เครื่องมือวิเคราะห์งบการเงิน (Ratio)\n\nRatio คือการเอาตัวเลข 2 ตัวมาเทียบกัน เพื่อให้เปรียบเทียบ รพ. ต่างขนาดได้ — จำ 4 กลุ่ม: สภาพคล่อง, ความมั่นคง, ประสิทธิภาพ, ความสามารถทำกำไร\n\n### 4.1 สภาพคล่องและความมั่นคง (ใช้ใน Risk Score)\n\nสูตรและเกณฑ์ตามนิยามตัวชี้วัดวิกฤตการเงินของ สป.สธ. ([KPI template ปีงบ 67](https://uthaihealth.moph.go.th/uthkpi67/document/140.pdf))\n\n| ตัวชี้วัด | สูตร | สัญญาณเสี่ยง | แปลความ |\n| --- | --- | --- | --- |\n| Current Ratio (CR) | สินทรัพย์หมุนเวียน ÷ หนี้สินหมุนเวียน | < 1.5 | สินทรัพย์ระยะสั้นไม่พอคุ้มหนี้ระยะสั้น |\n| Quick Ratio (QR) | (สินทรัพย์หมุนเวียน − สินค้าคงเหลือ − สินทรัพย์หมุนเวียนอื่น) ÷ หนี้สินหมุนเวียน | < 1.0 | ไม่นับยาคงคลัง แล้วยังจ่ายหนี้ได้ไหม |\n| Cash Ratio | (เงินสด + รายการเทียบเท่าเงินสด + เงินฝากประจำ) ÷ หนี้สินหมุนเวียน | < 0.8 | เงินสดในมือพอจ่ายหนี้ระยะสั้นทันทีไหม |\n| Net Working Capital (NWC) | สินทรัพย์หมุนเวียน − หนี้สินหมุนเวียน | < 0 | ทุนสำรองติดลบ = ใช้เงินเจ้าหนี้หมุน |\n| Net Income (NI) | รวมรายได้ − รวมค่าใช้จ่าย (นิยาม Risk Score ใช้ NI รวมค่าเสื่อมราคาและค่าตัดจำหน่าย) | < 0 | ผลดำเนินงานขาดทุน |\n\nลำดับความสำคัญเวลาอ่าน: Cash Ratio → NWC → NI → CR/QR เพราะ รพ. ล้มจากเงินสดหมด ไม่ใช่จากขาดทุนทางบัญชี\n\n### 4.2 ประสิทธิภาพ (Efficiency) — จุดที่งานประกันมีผลโดยตรง\n\n| ตัวชี้วัด | สูตรทั่วไป | เกณฑ์ที่พบในเอกสารเขต 8 |\n| --- | --- | --- |\n| ACP-UC (ระยะเวลาเก็บหนี้ UC) | ลูกหนี้ UC ÷ รายได้ UC × จำนวนวันในงวด | เกิน 60 วัน = ไม่ผ่าน ([สกลนคร ธ.ค. 68](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20260123092014.pdf)) |\n| ACP-CSMBS / ACP-SSS | สูตรเดียวกัน แยกสิทธิ | ดูเกณฑ์ปีงบปัจจุบัน |\n| APP-Drug (ระยะเวลาชำระหนี้ยา) | เจ้าหนี้ค่ายา ÷ ต้นทุนยา × จำนวนวัน | มาตรฐาน 90 วัน ([รพ.โพธิ์ตาก](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20260608053511.pdf)); เกิน 180 วัน = สัญญาณผิดนัดชำระ |\n| IM (Inventory Management) | ยา/เวชภัณฑ์คงคลัง ÷ ต้นทุนที่ใช้ × จำนวนวัน | ดูเกณฑ์ปีงบปัจจุบัน |\n\nสูตรในคอลัมน์กลางเป็นสูตรมาตรฐานทางบัญชี — ตัวหารและจำนวนวันที่ สป.สธ. ใช้จริง ให้ตรวจกับคู่มือ 7 Plus ปีงบปัจจุบัน\n\n### 4.3 ความสามารถทำกำไร\n\n- EBITDA = กำไรก่อนดอกเบี้ย ภาษี ค่าเสื่อม และค่าตัดจำหน่าย — ใกล้เคียง \"เงินสดที่ธุรกิจหลักสร้างได้\" ใช้ดูว่า รพ. มีเงินไปลงทุนต่อไหม\n- Operating Margin (OPM/OPR) = กำไรจากการดำเนินงาน ÷ รายได้จากการดำเนินงาน — สกลนครใช้ค่ากลางรายกลุ่ม รพ. เป็นเกณฑ์เทียบ\n- ROA = กำไร ÷ สินทรัพย์รวม — สินทรัพย์ที่มีสร้างผลตอบแทนได้ไหม\n\n### 4.4 วิธีวิเคราะห์ 3 แบบ\n\n1. Trend (แนวราบ): เทียบตัวเองย้อนหลัง 3–5 ปี / รายไตรมาส — ดีขึ้นหรือแย่ลง\n2. Common-size (แนวตั้ง): แปลงทุกบรรทัดเป็น % ของรายได้รวม — ค่าใช้จ่ายหมวดไหนกินสัดส่วนเพิ่ม\n3. Benchmark: เทียบค่ากลางกลุ่ม รพ. ขนาดเดียวกัน (กลุ่ม F1/F2/F3/M1/M2/S/A) — ไม่เทียบ รพ.ชุมชนกับ รพ.ศูนย์\n\n### 4.5 แบบฝึก\n\n- [ ] คำนวณ CR, QR, Cash, NWC, NI จากงบ รพ. 1 แห่ง แล้วเทียบเกณฑ์ในตาราง 4.1\n- [ ] คำนวณ ACP-UC ของ รพ. เดียวกัน และเขียน 1 ประโยคว่าถ้าลดลง 10 วัน เงินสดจะเพิ่มประมาณเท่าไร (ลูกหนี้ UC ÷ จำนวนวัน × 10)\n\n## บทที่ 5 Risk Score วิกฤตการเงิน และ Planfin\n\nRisk Score คือ \"เครื่องวัดไข้\" ทางการเงินที่ สป.สธ. ใช้กับ รพ. ทุกแห่งทุกไตรมาส ส่วน Planfin คือ \"แผนการรักษา\" ที่ รพ. ทำล่วงหน้าแล้วจังหวัดกำกับ\n\n### 5.1 Risk Score 7 ระดับ — วิธีคิด\n\nคะแนนมาจาก 3 กลุ่ม (ตามนิยามตัวชี้วัด สป.สธ., [KPI template ปีงบ 67](https://uthaihealth.moph.go.th/uthkpi67/document/140.pdf)):\n\n| กลุ่ม | ตัวแปร | เงื่อนไขได้คะแนน |\n| --- | --- | --- |\n| ความคล่องตามสภาพสินทรัพย์ (Liquid Index) | CR, QR, Cash | CR < 1.5 / QR < 1.0 / Cash < 0.8 |\n| ความมั่นคงทางการเงิน (Status Index) | NWC, NI (รวมค่าเสื่อม) | NWC < 0 / NI < 0 |\n| ระยะเวลาเข้าสู่ปัญหารุนแรง (Survival Index) | NWC ÷ ขาดทุนเฉลี่ยต่อเดือน | ทุนหมุนเวียนหมดใน < 3 เดือน (น้ำหนัก 2 เท่า) หรือ < 6 เดือน |\n\n### 5.2 ความหมายของแต่ละระดับ\n\n| ระดับ | ความหมาย |\n| --- | --- |\n| 0–1 | ปกติ |\n| 2 | คาดว่าจะดีขึ้นภายใน 3 เดือน |\n| 3 | คาดว่าจะดีขึ้นภายหลัง 3 เดือน |\n| 4 | คาดว่าจะประสบปัญหาภายหลัง 6 เดือน |\n| 5 | คาดว่าจะประสบปัญหาภายใน 6 เดือน |\n| 6 | คาดว่าจะประสบปัญหาภายใน 3 เดือน |\n| 7 | วิกฤตการเงินขั้นรุนแรง |\n\nเป้าหมายระดับประเทศ ปีงบ 67–71: รพ. ระดับ 7 ไม่เกินร้อยละ 2 และระดับ 6 ไม่เกินร้อยละ 4 (ประเมินสิ้นไตรมาส) — ที่มาเดียวกับข้างบน\n\n### 5.3 เครื่องมือรุ่นใหม่ที่ต้องรู้ต่อ: 7 Plus Efficiency และ TPS\n\n- ปีงบ 2568 รายงานของ สป.สธ. ใช้ \"Risk Scoring Plus\" ที่เพิ่มตัวชี้วัดประสิทธิภาพ ได้แก่ OPM, ROA, APP-Drug, ACP-UC, ACP-CSMBS, ACP-SSS, IM และให้เกรด (เช่น 0A-, 1B-, 1D) พร้อมผลผ่าน/ไม่ผ่าน ([ข้อมูล Q4/2568](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20251113043601.pdf))\n- TPS (Total Performance Score) คิดคะแนนเต็ม 15 — ตัวอย่างการใช้ใน จ.สกลนคร กำหนดผ่านที่ 10.5 คะแนน และเป้าหมายจังหวัดร้อยละ 55 ของ รพ.; ส่วน 7 Plus Efficiency ตั้งเป้า รพ. ผ่านระดับ 5 ขึ้นไปร้อยละ 65 ([สกลนคร ธ.ค. 68](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20260123092014.pdf))\n- บทเรียนจากสกลนคร: รพ. ที่ Risk Score ต่ำอาจซ่อนปัญหาได้ เช่น Risk ระดับ 1 แต่เงินบำรุงหลังหักหนี้ติดลบหลายสิบล้าน — จึงต้องอ่าน Risk Score คู่กับ Efficiency และเงินบำรุงคงเหลือเสมอ\n- ข้อที่ต้องถามหัวหน้ากลุ่มงานวันแรก: เกณฑ์ 7 Plus / TPS ปีงบ 2570 ที่ จ.อุดรธานีใช้ เป็นฉบับไหน\n\n### 5.4 Planfin (แผนทางการเงิน)\n\n- Planfin = แผนประมาณการรายได้-ค่าใช้จ่าย + แผนลงทุน ของ รพ. ทำต้นปีงบ ผ่าน CFO จังหวัด แล้วส่งเขต\n- ปีงบ 2568 จ.อุดรธานี: รพ. ทุกแห่งทำแผนเกินดุล ผลวิเคราะห์แผนเป็นแบบ 1 จำนวน 3 แห่ง, แบบ 2 จำนวน 14 แห่ง, แบบ 3 จำนวน 4 แห่ง และทำครบทั้ง 7 แผน; EBITDA ตามแผนรวม 323,977,020 บาท ([สสจ.อุดรธานี, 11 พ.ย. 2567](https://r8.moph.go.th/r8wayNewadmin/page/upload_file/20241109054225.pdf))\n- การติดตามผล: เทียบผลจริงกับแผนรายไตรมาส — ตัวอย่าง จ.กาฬสินธุ์ใช้เกณฑ์รายได้/ค่าใช้จ่ายต่างจากแผนได้ไม่เกินร้อยละ 5 ([กาฬสินธุ์ Q4/2567](https://ksn.moph.go.th/wp-content/uploads/2024/09/5.13.1-CFO-ประกัน.pdf))\n- คำถามที่งานประกันต้องถามทุกครั้งที่ดู Planfin: \"รายได้ UC/SSS/CSMBS ในแผน ตั้งบนผลงาน AdjRW และอัตราจ่ายปีไหน — สมจริงไหม\"\n\n### 5.5 แบบฝึก\n\n- [ ] ขอ Risk Score + 7 Plus ไตรมาสล่าสุดของ รพ. 21 แห่ง จ.อุดรธานี แล้วจัดกลุ่ม: ปกติ / เฝ้าระวัง / วิกฤต\n- [ ] เลือก 1 รพ. ที่ Risk Score ต่ำแต่ Efficiency ไม่ผ่าน แล้วเขียนว่าความเสี่ยงที่ซ่อนอยู่คืออะไร\n- [ ] เทียบ Planfin ปีงบ 2569 กับผลจริงของ รพ. 1 แห่ง: บรรทัดไหนต่างจากแผนเกินร้อยละ 5\n\n## บทที่ 6 เชื่อมงานเคลมกับงบการเงิน\n\nทุกปัญหาเคลมมีปลายทางเป็นบรรทัดใดบรรทัดหนึ่งในงบการเงิน — ถ้าบอกได้ว่าลงบรรทัดไหน ก็ตั้งเป้าแก้และวัดผลเป็นเงินได้\n\n### 6.1 แผนที่: ปัญหาเคลม → งบการเงิน → ตัวชี้วัด\n\n| ปัญหาในงานประกัน | กระทบบรรทัดในงบ | ตัวชี้วัดที่ขยับ | ผลต่อ Risk/Efficiency |\n| --- | --- | --- | --- |\n| สรุปชาร์ต/ส่งเคลมล่าช้า | ลูกหนี้ UC/CSMBS ค้างสูง, เงินสดต่ำ | ACP เพิ่ม, Cash Ratio ลด | Cash < 0.8, ACP-UC ไม่ผ่าน |\n| ให้รหัสโรคไม่ครบ (Under-coding) | รายได้ IP ต่ำกว่าที่ควร | AdjRW / CMI ต่ำ | NI ลด, OPM ลด |\n| เคลมติด C / Deny ไม่แก้ในเวลา | ลูกหนี้ค้างแล้วกลายเป็นหนี้สูญ | ลูกหนี้ปีเก่าสูง | NI ลด (ตั้งค่าเผื่อ/ตัดหนี้) |\n| Post audit / MR Audit ถูกเรียกเงินคืน | รายได้ถูกปรับลดย้อนหลัง | รายได้จริงต่ำกว่า Planfin | NI ลด, Planfin คลาดเคลื่อน |\n| ตั้งลูกหนี้ตามราคาเรียกเก็บ ไม่ใช่อัตราจ่ายจริง | รายได้/ลูกหนี้สูงเกินจริง | NI ดูดี แต่ ACP สูง | Risk Score ต่ำหลอกตา |\n| Over-coding | รายได้เพิ่มชั่วคราว แล้วถูกเรียกคืน | — | ความเสี่ยงทางกฎหมาย/วินัย |\n\n### 6.2 สูตรแปลงงานเคลมเป็นเงิน (ใช้ตอนนำเสนอผู้บริหาร)\n\n- เงินสดที่ปลดล็อกได้จากการลด ACP:\n\n```latex\n\\text{เงินสดเพิ่ม} \\approx \\frac{\\text{รายได้สิทธินั้นต่อปี}}{365} \\times \\text{จำนวนวันที่ลดได้}\n```\n\n- รายได้ IP ที่หายจาก Under-coding ≈ ผลต่าง AdjRW ที่ควรได้ × อัตราจ่ายต่อ AdjRW ของกองทุนในปีนั้น (ต้องใช้อัตราจ่ายจริงจากประกาศ ห้ามประมาณเอง)\n- ทุกตัวเลขที่นำเสนอต้องอ้างแหล่ง: e-Claim/FDH (ผลเคลม), hfo (งบการเงิน), ประกาศกองทุน (อัตราจ่าย)\n\n### 6.3 ข้อได้เปรียบของพยาบาลในงานนี้\n\n- อ่านเวชระเบียนเป็น → รู้ว่ารหัสหาย/ผิดตรงไหน (Dx หลัก, Comorbidity, Complication, หัตถการ)\n- รู้ Workflow หน้างาน → หาจุดที่ชาร์ตค้างได้จริง (ward, OR, แพทย์สรุปช้า)\n- ประสบการณ์ Risk management → ใช้ RCA กับปัญหาเคลมแบบเดียวกับ Clinical incident\n\n### 6.4 แบบฝึก\n\n- [ ] เลือก 1 รพ. ที่ ACP-UC เกินเกณฑ์ → ดึงผลเคลม e-Claim/FDH 3 เดือนล่าสุด → แยกสาเหตุ: ส่งช้า / ติด C / Deny / รอจ่าย\n- [ ] ใช้สูตร 6.2 คำนวณเงินสดที่ปลดล็อกได้ ถ้าลด ACP-UC ลงถึงเกณฑ์\n\n## บทที่ 7 จากตัวเลขสู่ Action plan + กรณีศึกษา\n\nการวิเคราะห์ที่ดีจบด้วย \"ใครทำอะไร ภายในเมื่อไร วัดผลด้วยตัวเลขไหน\" ไม่ใช่จบด้วยคำว่า \"ควรปรับปรุง\"\n\n### 7.1 กรอบคิด 5 ขั้น\n\n1. Detect — ตัวชี้วัดไหนผิดเกณฑ์ (Cash, NWC, NI, ACP, APP)\n2. Diagnose — RCA: ปัญหาฝั่งรายได้ (เคลม, ผลงาน, อัตราจ่าย) หรือฝั่งค่าใช้จ่าย (บุคลากร, ยา, วัสดุ)\n3. Decide — เลือก Quick win (ภายใน 1 ไตรมาส) + มาตรการโครงสร้าง (1 ปี)\n4. Do — มอบผู้รับผิดชอบ กำหนดเป้าตัวเลขและวันที่\n5. Document & Follow — ติดตามรายเดือน รายงาน CFO จังหวัด / กวป.\n\n### 7.2 แบบฟอร์ม Action plan 1 หน้า\n\n| ปัญหา (ตัวชี้วัด + ค่าปัจจุบัน) | สาเหตุราก | มาตรการ | ผู้รับผิดชอบ | เป้าหมาย (ตัวเลข) | กำหนดเสร็จ | แหล่งข้อมูลติดตาม |\n| --- | --- | --- | --- | --- | --- | --- |\n|  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  |\n\n### 7.3 กรณีศึกษา: รพ.โพธิ์ตาก จ.หนองคาย (เขต 8)\n\nข้อมูลจากรายงานสถานการณ์การเงินการคลังที่เสนอผู้ตรวจราชการ ปีงบ 2566–2569 ([r8way](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20260608053511.pdf)):\n\n| ตัวชี้วัด | ค่าที่รายงาน |\n| --- | --- |\n| กลุ่ม รพ. | รพช.F3 ประชากร UC ไม่เกิน 15,000 คน (UC 11,739 คน ณ 1 เม.ย. 2568) |\n| Risk Score | ระดับ 6 |\n| TPS | 5.5 จาก 15 คะแนน เกรด F |\n| NWC | −8.20 ล้านบาท |\n| เงินบำรุงสุทธิ | −16.61 ล้านบาท (ณ Q2/2569) |\n| EBITDA | +3.74 ล้านบาท |\n| APP (ระยะเวลาชำระหนี้ยา) | 494 วัน (มาตรฐาน 90 วัน) |\n| รายได้ต่ำกว่าแผน | 11.7% (2566) → 19.4% (2568) → 15.0% (ครึ่งปี 2569) |\n\nคำถามฝึกวิเคราะห์ (ตอบเองก่อนดูแนวคิด):\n\n1. ปัญหาหลักอยู่ฝั่งรายได้หรือค่าใช้จ่าย — ใช้ตัวเลขไหนยืนยัน\n2. EBITDA เป็นบวก แต่ทำไม NWC และเงินบำรุงยังติดลบ\n3. APP 494 วันบอกอะไรเกี่ยวกับความสัมพันธ์กับเจ้าหนี้และความเสี่ยงการจัดหายา\n4. ถ้าคุณเป็นงานประกันสุขภาพระดับจังหวัด ต้องขอข้อมูลอะไรเพิ่ม 3 อย่าง\n5. เขียน Action plan ตามแบบฟอร์ม 7.2 อย่างน้อย 3 แถว\n\nแนวคิดเฉลย (ย่อ):\n\n- รายได้ต่ำกว่าแผนต่อเนื่องและรุนแรงขึ้น = สัญญาณว่า Planfin ตั้งรายได้เกินจริง และ/หรือ รายได้จากการเรียกเก็บรั่ว — เป็นงานของประกันสุขภาพโดยตรง\n- EBITDA บวกแต่ไม่พอ: กำไรเงินสดจากการดำเนินงานน้อยกว่าภาระหนี้สะสม จึงยังพลิก NWC ไม่ได้\n- APP สูงมาก = รพ. ใช้เจ้าหนี้ค่ายาเป็นแหล่งเงินทุน — ความเสี่ยงคือถูกระงับการส่งยา\n- ข้อมูลที่ควรขอ: ผลเคลมและ Deny รายสิทธิ, AdjRW/CMI เทียบ รพ. กลุ่มเดียวกัน, สมมติฐานรายได้ใน Planfin\n\n### 7.4 แบบฝึก\n\n- [ ] ทำ Action plan 1 หน้าให้ รพ. ใน จ.อุดรธานี 1 แห่ง แล้วขอ Feedback จากหัวหน้ากลุ่มงาน\n\n## แบบทดสอบตนเอง อภิธานศัพท์ และแหล่งอ้างอิง\n\n### แบบทดสอบตนเอง (ตอบได้ครบ = พร้อมใช้งานจริง)\n\n- [ ] อธิบายสมการบัญชี และยกตัวอย่างรายการ รพ. ที่ทำให้สินทรัพย์และหนี้สินเพิ่มพร้อมกัน\n- [ ] ทำไม รพ. ที่ NI เป็นบวก อาจมี Cash Ratio ต่ำกว่า 0.8\n- [ ] บอกเกณฑ์ CR, QR, Cash, NWC, NI ใน Risk Score ได้โดยไม่เปิดตำรา\n- [ ] อธิบายความต่างระหว่าง Risk Score ระดับ 5 กับระดับ 6\n- [ ] คำนวณ ACP-UC จากงบจริง และแปลงเป็นจำนวนเงินสดที่ค้างอยู่\n- [ ] ระบุ 3 ปัญหาเคลมที่ทำให้ลูกหนี้ปีเก่าสะสม\n- [ ] อ่าน Planfin แล้วบอกได้ว่ารายได้ส่วนไหนตั้งไว้สูงเกินจริง\n- [ ] เขียน Action plan 1 หน้าที่มีเป้าหมายเป็นตัวเลขและวันที่ครบทุกแถว\n\n### อภิธานศัพท์\n\n| คำ | ความหมายสั้น |\n| --- | --- |\n| Accrual basis | เกณฑ์คงค้าง: รับรู้รายได้/ค่าใช้จ่ายเมื่อเกิด ไม่ใช่เมื่อรับ/จ่ายเงิน |\n| ACP | Average Collection Period: จำนวนวันเฉลี่ยที่เก็บหนี้ได้ |\n| APP | Average Payment Period: จำนวนวันเฉลี่ยที่จ่ายหนี้เจ้าหนี้ |\n| CR / QR / Cash Ratio | อัตราส่วนสภาพคล่อง 3 ระดับ จากหลวมไปเข้ม |\n| EBITDA | กำไรก่อนดอกเบี้ย ภาษี ค่าเสื่อม และค่าตัดจำหน่าย |\n| IM | Inventory Management: การบริหารคลังยา/เวชภัณฑ์ |\n| NI | รายได้สูง(ต่ำ)กว่าค่าใช้จ่ายสุทธิ |\n| NWC | ทุนสำรองสุทธิ = สินทรัพย์หมุนเวียน − หนี้สินหมุนเวียน |\n| OPM / OPR | อัตรากำไรจากการดำเนินงาน |\n| Planfin | แผนทางการเงินประจำปีของหน่วยบริการ |\n| ROA | ผลตอบแทนต่อสินทรัพย์ |\n| Risk Score | ระดับวิกฤตการเงิน 0–7 ของ สป.สธ. |\n| TPS | Total Performance Score คะแนนประสิทธิภาพเต็ม 15 |\n| เงินบำรุงคงเหลือ (หักหนี้แล้ว) | เงินบำรุงที่เหลือจริงหลังหักหนี้สินและภาระผูกพัน |\n\n### แหล่งอ้างอิง (เปิดอ่านจริงหรือพบในผลค้นหา ณ วันที่จัดทำ)\n\nทุกรายการเป็นเอกสารนำเสนอ/รายงานของหน่วยงาน สธ. ที่เผยแพร่ ไม่ใช่ประกาศฉบับทางการ — ใช้เพื่อการเรียน ก่อนอ้างในหนังสือราชการให้ใช้หนังสือสั่งการฉบับจริงของ สป.สธ. / เขตสุขภาพที่ 8\n\n- [รายละเอียดตัวชี้วัด 53 ร้อยละหน่วยบริการที่ประสบภาวะวิกฤตทางการเงิน (KPI template ปีงบ 2567, สสจ.อุทัยธานี)](https://uthaihealth.moph.go.th/uthkpi67/document/140.pdf) — สูตร Ratio, เกณฑ์ Risk Score, ความหมาย 7 ระดับ, เป้าหมายปีงบ 67–71\n- [ข้อมูลวิเคราะห์วิกฤตทางการเงินระดับ 7 (Risk Scoring Plus) ไตรมาส 4/2568](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20251113043601.pdf) — ตัวชี้วัด Plus\n- [การวิเคราะห์ 7 Plus Efficiency Score และ TPS จ.สกลนคร (ข้อมูล ธ.ค. 2568)](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20260123092014.pdf) — เกณฑ์ ACP-UC 60 วัน, เป้า TPS/7 Plus, กรณี Risk ต่ำแต่ประสิทธิภาพต่ำ\n- [รายงานสถานการณ์การเงินการคลัง รพ.โพธิ์ตาก ปีงบ 2566–2569](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20260608053511.pdf) — กรณีศึกษาบทที่ 7, มาตรฐาน APP 90 วัน\n- [แผนทางการเงิน (Planfin) ปีงบ 2568 สสจ.อุดรธานี (11 พ.ย. 2567)](https://r8.moph.go.th/r8wayNewadmin/page/upload_file/20241109054225.pdf)\n- [การบริหารจัดการลูกหนี้ค่ารักษาพยาบาล จ.อุดรธานี ณ 30 เม.ย. 2567](https://r8.moph.go.th/r8wayNewadmin/page/upload_file/20240521031539.pdf)\n- [รายงานลูกหนี้ค่ารักษาแยกสิทธิ เขต 8 (ส.ค. 2567)](https://r8.moph.go.th/r8wayNewadmin/page/upload_file/20240822021519.pdf)\n- [การบริหารจัดการเพื่อป้องกันวิกฤตการเงินระดับ 7 เขต 8](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20240219102839.pdf)\n- [CFO ประกัน จ.กาฬสินธุ์ ไตรมาส 4/2567](https://ksn.moph.go.th/wp-content/uploads/2024/09/5.13.1-CFO-ประกัน.pdf) — เกณฑ์ Planfin ±5%\n\nสิ่งที่ยังต้องหาเพิ่มหลังเริ่มงาน: คู่มือเกณฑ์ 7 Plus / TPS ปีงบ 2570 ฉบับทางการ, คู่มือบัญชีหน่วยบริการ สป.สธ. ฉบับล่าสุด, แนวทาง Planfin ปีงบ 2570 ของ จ.อุดรธานี\n", "manual": "<p><strong>ระบบประกันสุขภาพ โรงพยาบาลรัฐ<\/strong><\/p>\n<p>คู่มือปฏิบัติงานสำหรับงานประกันสุขภาพระดับจังหวัด<\/p>\n<p>8 บทหลัก + ภาคผนวก<\/p>\n<p>ฉบับปรับปรุง ตุลาคม 2569 · อ้างอิงปีงบประมาณ 2569–2570<\/p>\n<p>ใช้คู่กับไฟล์ ระบบวิเคราะห์ประกันสุขภาพ_เขต8.xlsx และ ตำราคำศัพท์และตัวย่องานประกันสุขภาพ<\/p>\n<h2>สารบัญ<\/h2>\n<table>\n\n<thead>\n<tr>\n<th><strong>บท<\/strong><\/th>\n<th><strong>เรื่อง<\/strong><\/th>\n<th><strong>สาระสำคัญ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>แผนที่ระบบ — 3 กองทุนหลักและสิทธิย่อย<\/th>\n<th>โครงสร้างผู้ซื้อบริการ กลไกการจ่าย และจุดอ่อนของแต่ละกองทุน<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>โครงสร้างงบกองทุน UC และเส้นทางเดินเงิน<\/th>\n<th>งบปีงบ 2570 ที่อนุมัติจริง เส้นทาง 4 ชั้น และประเด็น รพ.สต.ถ่ายโอน<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>DRG / AdjRW / CMI<\/th>\n<th>กลไกจ่ายผู้ป่วยใน อัตราจ่ายปี 2569–2570 จุดรั่วของ coding และการตรวจสอบก่อน-หลังจ่าย<\/th>\n<\/tr>\n<tr>\n<th>4<\/th>\n<th>ระบบเคลมและการแก้ปัญหา \"ติด C\"<\/th>\n<th>FDH, e-Claim, AIPN, Authen Code วงจรเคลม 6 ขั้น และ KPI ที่ต้องติดตาม<\/th>\n<\/tr>\n<tr>\n<th>5<\/th>\n<th>Planfin, วิกฤติการเงินระดับ 7 และ Unit cost<\/th>\n<th>เกณฑ์ Risk Score 3 มิติ การอ่านสถานะการเงิน และแผนฟื้นฟู<\/th>\n<\/tr>\n<tr>\n<th>6<\/th>\n<th>มาตรา 41 และมาตรา 18(4)<\/th>\n<th>เงินช่วยเหลือเบื้องต้น — จุดเชื่อมกับงาน Risk Management<\/th>\n<\/tr>\n<tr>\n<th>7<\/th>\n<th>เปรียบเทียบ 3 กองทุนและการไล่เบิกสิทธิซ้อน<\/th>\n<th>พ.ร.บ.รถ, กองทุนเงินทดแทน, UCEP และลำดับการเบิกที่ถูกต้อง<\/th>\n<\/tr>\n<tr>\n<th>8<\/th>\n<th>บทบาท สสจ. และการเขียนหนังสือประสานงาน<\/th>\n<th>ภารกิจ 10 ด้าน · ชนิดหนังสือ · บันไดความเข้ม · แม่แบบ 5 ฉบับ<\/th>\n<\/tr>\n<tr>\n<th>ผนวก<\/th>\n<th>ภาคผนวก<\/th>\n<th>ศัพท์ที่ใช้บ่อย · ปฏิทินงานรายปี · Checklist ประจำเดือน · คู่มือเชื่อมไฟล์ Excel · เอกสารอ้างอิง<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>สิ่งที่เปลี่ยนจากฉบับกันยายน 2569<\/strong><\/p>\n<blockquote>\n<p>• งบกองทุนปี 2570 ใช้ตัวเลขที่อนุมัติจริง: เหมาจ่ายรายหัว <strong>4,669.44 บาท/คน<\/strong> (ฉบับเดิมใช้ข้อเสนอ 5,299 บาท)<\/p>\n<p>• อัตราจ่ายผู้ป่วยในปี 2570 <strong>ไม่เกิน 9,142 บาท/AdjRW<\/strong> (ฉบับเดิมใช้ 10,000 บาท ซึ่งเป็นข้อเสนอเดิม)<\/p>\n<p>• เพิ่มระบบ <strong>FDH<\/strong> ในบทที่ 4 ซึ่ง รพ. สังกัด สธ. ใช้ส่งเบิกบัตรทองตั้งแต่ 1 เมษายน 2567<\/p>\n<p>• แก้เกณฑ์ <strong>Risk Score วิกฤติการเงิน<\/strong> ในบทที่ 5 เป็น 3 มิติ: NWC และ NI ข้อละ 1 คะแนน และเพิ่มมิติระยะเวลาทุนหมด 0–2 คะแนน<\/p>\n<p>• เพิ่มประเด็นหลักเกณฑ์ปี 2570: National Health Package ปฐมภูมิ และการตรวจสอบก่อน-หลังจ่ายด้วย AI<\/p>\n<p>• เพิ่มผนวกเชื่อมแต่ละบทกับชีตในไฟล์ Excel<\/p>\n<\/blockquote><\/div>\n<h2>วิธีใช้คู่มือเล่มนี้<\/h2>\n<p>บทที่ 1–2 คือโครงสร้างที่ต้องเข้าใจก่อน บทที่ 3–4 คือกลไกที่ทำให้เงินเข้าจริง บทที่ 5 คือการอ่านผลลัพธ์ บทที่ 6–7 คือประเด็นเฉพาะที่พบบ่อยในงานประจำ บทที่ 8 คือการแปลงทั้งหมดเป็นหนังสือที่สั่งการได้จริง<\/p>\n<p>ตัวเลขอัตราจ่าย เกณฑ์ และรหัสเปลี่ยนทุกปีงบประมาณ ใช้คู่มือนี้เป็นกรอบความเข้าใจ และยึดประกาศ/คู่มือบริหารกองทุนฉบับปีปัจจุบันเมื่อใช้อ้างอิงในหนังสือราชการ<\/p>\n<h2 id=\"m-ch1\">บทที่ 1 · แผนที่ระบบ<\/h2>\n<h3>1.1 หลักคิดตั้งต้น<\/h3>\n<p>ระบบสุขภาพไทยแยก <strong>ผู้ซื้อบริการ (Purchaser)<\/strong> ออกจาก <strong>ผู้ให้บริการ (Provider)<\/strong> โรงพยาบาลรัฐจึงไม่ได้รับเงินจากงบประมาณแผ่นดินก้อนเดียว แต่รับจากหลายกองทุนที่มีกติกาต่างกัน การเข้าใจว่า \"ใครเป็นคนจ่าย และจ่ายด้วยกลไกอะไร\" คือพื้นฐานของงานประกันสุขภาพทั้งหมด<\/p>\n<h3>1.2 สามกองทุนหลัก<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ประเด็น<\/strong><\/th>\n<th><strong>UCS (บัตรทอง)<\/strong><\/th>\n<th><strong>SSS (ประกันสังคม)<\/strong><\/th>\n<th><strong>CSMBS (ข้าราชการ)<\/strong><\/th>\n<\/tr>\n<tr>\n<th>ผู้ซื้อบริการ<\/th>\n<th>สปสช.<\/th>\n<th>สปส. (กระทรวงแรงงาน)<\/th>\n<th>กรมบัญชีกลาง (กระทรวงการคลัง)<\/th>\n<\/tr>\n<tr>\n<th>กฎหมาย<\/th>\n<th>พ.ร.บ.หลักประกันสุขภาพแห่งชาติ พ.ศ. 2545<\/th>\n<th>พ.ร.บ.ประกันสังคม พ.ศ. 2533<\/th>\n<th>พ.ร.ฎ.เงินสวัสดิการเกี่ยวกับการรักษาพยาบาล พ.ศ. 2553<\/th>\n<\/tr>\n<tr>\n<th>ผู้มีสิทธิ<\/th>\n<th>ประมาณ 47 ล้านคน (ปีงบ 2570 คิดงบที่ 47.17 ล้านคน)<\/th>\n<th>ประมาณ 13 ล้านคน<\/th>\n<th>ประมาณ 4–5 ล้านคน<\/th>\n<\/tr>\n<tr>\n<th>แหล่งเงิน<\/th>\n<th>ภาษี<\/th>\n<th>สมทบ 3 ฝ่าย (ลูกจ้าง/นายจ้าง/รัฐ)<\/th>\n<th>ภาษี<\/th>\n<\/tr>\n<tr>\n<th>ผู้ป่วยนอก<\/th>\n<th>Capitation ตามประชากรที่ลงทะเบียนกับ CUP + fee schedule บางรายการ<\/th>\n<th>Capitation ให้ รพ.คู่สัญญาหลัก<\/th>\n<th>Fee for service (เบิกจ่ายตรง)<\/th>\n<\/tr>\n<tr>\n<th>ผู้ป่วยใน<\/th>\n<th>Global budget ระดับเขต + DRG (AdjRW)<\/th>\n<th>Capitation + จ่ายเพิ่มตาม AdjRW ส่วนที่เกินเกณฑ์<\/th>\n<th>DRG แต่อัตราต่อ RW สูงกว่า UC<\/th>\n<\/tr>\n<tr>\n<th>ใครแบกความเสี่ยง<\/th>\n<th>หน่วยบริการ (เงินปลายปิด)<\/th>\n<th>หน่วยบริการ<\/th>\n<th>รัฐ (ปลายเปิดมากกว่า)<\/th>\n<\/tr>\n<tr>\n<th>จุดอ่อนเชิงระบบ<\/th>\n<th>งบไม่พอ รพ.ขาดทุนสะสม<\/th>\n<th>สิทธิผูกกับนายจ้าง ย้าย รพ.ยุ่งยาก<\/th>\n<th>ค่าใช้จ่ายสูง ควบคุมยาก<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>ประเด็นเชิงนโยบายที่ต้องเข้าใจ<\/strong><\/p>\n<p>คนไทย 3 คนที่ป่วยด้วยโรคเดียวกันแต่ถือสิทธิต่างกัน ทำให้โรงพยาบาลได้รับเงินไม่เท่ากัน นี่คือที่มาของข้อถกเถียงเรื่อง \"ความเหลื่อมล้ำ 3 กองทุน\" และความพยายามบูรณาการสิทธิประโยชน์ให้ใกล้เคียงกัน<\/p><\/div>\n<h3>1.3 สิทธิย่อยที่ต้องรู้จัก<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>สิทธิ<\/strong><\/th>\n<th><strong>ผู้รับผิดชอบ<\/strong><\/th>\n<th><strong>ข้อสังเกตในทางปฏิบัติ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>สิทธิพนักงาน/ลูกจ้าง อปท.<\/th>\n<th>สปสช. บริหารแทน<\/th>\n<th>กติกาคล้าย CSMBS แต่เบิกผ่านระบบ สปสช.<\/th>\n<\/tr>\n<tr>\n<th>กองทุนคืนสิทธิ (บุคคลที่มีปัญหาสถานะและสิทธิ)<\/th>\n<th>กระทรวงสาธารณสุข<\/th>\n<th>งบ non-capitation แยกต่างหาก สำคัญมากในจังหวัดชายแดน<\/th>\n<\/tr>\n<tr>\n<th>ประกันสุขภาพแรงงานต่างด้าว<\/th>\n<th>กระทรวงสาธารณสุข (ไม่ใช่ สปสช.)<\/th>\n<th>รพ. ขายบัตร เงินเข้า รพ.โดยตรง เสี่ยงขาดทุนถ้าบริหารไม่ดี<\/th>\n<\/tr>\n<tr>\n<th>พ.ร.บ.ผู้ประสบภัยจากรถ<\/th>\n<th>บริษัทประกัน / กองทุนทดแทนผู้ประสบภัย<\/th>\n<th>ต้องเบิกก่อนเสมอ เป็นจุดที่ รพ.เสียรายได้มากที่สุดจุดหนึ่ง<\/th>\n<\/tr>\n<tr>\n<th>กองทุนเงินทดแทน<\/th>\n<th>สปส.<\/th>\n<th>ลูกจ้างบาดเจ็บจากการทำงาน คนละส่วนกับประกันสังคมทั่วไป<\/th>\n<\/tr>\n<tr>\n<th>ประกันสุขภาพเอกชน<\/th>\n<th>บริษัทประกัน<\/th>\n<th>เบิกส่วนเกินได้ ต้องคัดกรองตั้งแต่จุดลงทะเบียน<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>1.4 กลไกการจ่ายเงิน 5 รูปแบบ<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>กลไก<\/strong><\/th>\n<th><strong>หลักการ<\/strong><\/th>\n<th><strong>ใครแบกความเสี่ยง<\/strong><\/th>\n<th><strong>ตัวอย่าง<\/strong><\/th>\n<\/tr>\n<tr>\n<th>Capitation<\/th>\n<th>จ่ายตามหัวประชากรที่ลงทะเบียน ไม่ขึ้นกับปริมาณงาน<\/th>\n<th>หน่วยบริการเต็ม 100%<\/th>\n<th>OP ทั่วไป UC, OP ประกันสังคม<\/th>\n<\/tr>\n<tr>\n<th>Global budget + DRG<\/th>\n<th>วงเงินเขตปลายปิด หารด้วยผลงานรวมทั้งเขต<\/th>\n<th>หน่วยบริการร่วมกันทั้งเขต<\/th>\n<th>IP ทั่วไป UC<\/th>\n<\/tr>\n<tr>\n<th>Fee schedule<\/th>\n<th>จ่ายตามรายการและอัตราที่ประกาศล่วงหน้า<\/th>\n<th>ผู้ซื้อบริการ<\/th>\n<th>ทันตกรรม, PP บางรายการ, อุปกรณ์คนพิการ<\/th>\n<\/tr>\n<tr>\n<th>Point system with ceiling<\/th>\n<th>ให้แต้มถ่วงน้ำหนักแล้วหารวงเงินที่มี<\/th>\n<th>หน่วยบริการ<\/th>\n<th>แพทย์แผนไทย, PP บางส่วน<\/th>\n<\/tr>\n<tr>\n<th>Central reimbursement<\/th>\n<th>เบิกจากส่วนกลาง บางครั้งจ่ายเป็นของแทนเงิน<\/th>\n<th>ผู้ซื้อบริการ<\/th>\n<th>ยา จ(2), ยา CL, อวัยวะเทียม, สายสวนหัวใจ, น้ำยา CAPD<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>สรุปบทที่ 1 — 3 ข้อที่ต้องจำ<\/strong><\/p>\n<p>1. แยกให้ออกว่าผู้ป่วยรายนี้อยู่สิทธิใด เพราะกลไกจ่ายต่างกันโดยสิ้นเชิง<\/p>\n<p>2. UC เป็นระบบ \"เงินปลายปิด\" ความเสี่ยงทางการเงินตกอยู่ที่โรงพยาบาลเป็นหลัก<\/p>\n<p>3. ก่อนใช้สิทธิหลัก ต้องตรวจเสมอว่ามีสิทธิอื่นที่ต้องเบิกก่อน (พ.ร.บ.รถ / กองทุนเงินทดแทน / ประกันเอกชน)<\/p><\/div>\n<h2 id=\"m-ch2\">บทที่ 2 · โครงสร้างงบกองทุน UC และเส้นทางเดินเงิน<\/h2>\n<h3>2.1 งบกองทุนแบ่งเป็น 2 ก้อนใหญ่<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ก้อน<\/strong><\/th>\n<th><strong>ลักษณะ<\/strong><\/th>\n<th><strong>ประกอบด้วย<\/strong><\/th>\n<\/tr>\n<tr>\n<th><p>กลุ่ม A<\/p>\n<p>งบเหมาจ่ายรายหัว<\/p><\/th>\n<th>ตั้งวงเงินรวมแล้วหารด้วยจำนวนผู้มีสิทธิ ได้อัตรา \"บาทต่อหัว\"<\/th>\n<th>OP ทั่วไป, IP ทั่วไป, บริการกรณีเฉพาะ (CR), P&amp;P, ฟื้นฟูสมรรถภาพ, แพทย์แผนไทย, งบลงทุน (ค่าเสื่อม), เงินช่วยเหลือเบื้องต้น, QOF<\/th>\n<\/tr>\n<tr>\n<th><p>กลุ่ม B<\/p>\n<p>งบนอกเหมาจ่ายรายหัว<\/p><\/th>\n<th>ตั้งเป็นวงเงินเฉพาะโรค/เฉพาะกลุ่ม ไม่หารรายหัว<\/th>\n<th>เอดส์, ไตวายเรื้อรัง (RRT), NCD (DM/HT/COPD), LTC ผู้สูงอายุภาวะพึ่งพิง, ผู้มีปัญหาสถานะและสิทธิ, พื้นที่กันดาร/3 จชต., เงินเดือนหน่วยบริการภาครัฐ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>2.2 ตัวเลขงบกองทุนปีงบประมาณ 2570<\/h3>\n<p>บอร์ด สปสช. เคยเสนอ ครม. ให้เพิ่มเหมาจ่ายรายหัวปี 2570 เป็น 5,299 บาทต่อประชากร (ธันวาคม 2568) แต่วงเงินที่ได้รับจัดสรรจริงต่ำกว่าข้อเสนอ ตัวเลขที่ใช้ทำงานปี 2570 คือชุดด้านล่าง<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>รายการ<\/strong><\/th>\n<th><strong>ปีงบ 2570<\/strong><\/th>\n<th><strong>เทียบปี 2569<\/strong><\/th>\n<\/tr>\n<tr>\n<th>วงเงินกองทุนรวม<\/th>\n<th>289,113.05 ล้านบาท<\/th>\n<th>+23,817.46 ล้านบาท (+8.98%)<\/th>\n<\/tr>\n<tr>\n<th>ค่าบริการ (ไม่รวมเงินเดือน)<\/th>\n<th>214,144.41 ล้านบาท<\/th>\n<th>+10.47%<\/th>\n<\/tr>\n<tr>\n<th>เงินเดือนบุคลากรหน่วยบริการภาครัฐ<\/th>\n<th>74,968.64 ล้านบาท<\/th>\n<th>+4.93%<\/th>\n<\/tr>\n<tr>\n<th>งบเหมาจ่ายรายหัว (กลุ่ม A)<\/th>\n<th>220,257.68 ล้านบาท<\/th>\n<th>—<\/th>\n<\/tr>\n<tr>\n<th>งบนอกเหมาจ่ายรายหัว (กลุ่ม B)<\/th>\n<th>68,855.36 ล้านบาท<\/th>\n<th>—<\/th>\n<\/tr>\n<tr>\n<th>ประชากรผู้มีสิทธิที่ใช้คิดงบ<\/th>\n<th>47.170 ล้านคน<\/th>\n<th>—<\/th>\n<\/tr>\n<tr>\n<th><strong>อัตราเหมาจ่ายรายหัว<\/strong><\/th>\n<th><strong>4,669.44 บาท/คน<\/strong><\/th>\n<th>+493.45 บาท (+11.83%) จาก 4,175.99 บาท<\/th>\n<\/tr>\n<tr>\n<th>สิทธิประโยชน์ใหม่ 11 รายการ<\/th>\n<th>1,348.97 ล้านบาท<\/th>\n<th>เช่น เทคโนโลยีการแพทย์ขั้นสูง, วัคซีนนิวโมคอคคัสในเด็กเล็ก, TAVI, ปลูกถ่ายหัวใจ ปอด ตับ, ประสาทหูเทียม<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<p>ประเด็นหลักเกณฑ์ปี 2570 ที่กระทบงานจังหวัด<\/p>\n<p>บอร์ด สปสช. เห็นชอบหลักเกณฑ์บริหารกองทุนปี 2570 โดยปรับ 12 ประเด็น (ประชุม 2 กันยายน 2569) ประเด็นที่งานประกันสุขภาพจังหวัดต้องเตรียมรับ:<\/p>\n<blockquote>\n<p>• <strong>อัตราจ่ายผู้ป่วยในไม่เกิน 9,142 บาทต่อ AdjRW<\/strong> (รายละเอียดบทที่ 3)<\/p>\n<p>• <strong>National Health Package<\/strong> สำหรับบริการปฐมภูมิ รวมงบ OP และ P&amp;P ส่งตรงให้หน่วยบริการปฐมภูมิและเครือข่าย กระทบการจัดสรรเงินภายใน CUP และ รพ.สต.ถ่ายโอน<\/p>\n<p>• <strong>ระบบตรวจสอบด้วย AI<\/strong> ทั้งก่อนจ่าย (pre-payment audit) และหลังจ่าย (post-payment audit) เน้นตรวจความถูกต้องและความคุ้มค่า<\/p>\n<p>• หลัก \"Value for Money\" — ลดบริการที่ไม่มีข้อบ่งชี้ทางคลินิก เน้นปฐมภูมิและการป้องกันโรค<\/p>\n<p>• ปรับการเชื่อมโยงข้อมูล การจัดซื้อยา งานเอชไอวี และวัณโรคในชุมชน<\/p>\n<\/blockquote>\n<div class=\"callout\"><p><strong>กับดักที่พบบ่อยที่สุด<\/strong><\/p>\n<p>การนำอัตราเหมาจ่ายรายหัวคูณจำนวนประชากร แล้วสรุปว่านั่นคือเงินที่โรงพยาบาลจะได้รับ — ผิด เพราะ<\/p>\n<blockquote>\n<p>• ต้องหักเงินเดือนบุคลากรภาครัฐออกก่อน<\/p>\n<p>• เงินจำนวนมากไม่ได้จ่ายแบบเหมาจ่าย แต่จ่ายตามผลงานหรือจ่ายเป็นเวชภัณฑ์จากส่วนกลาง<\/p>\n<p>• IP จ่ายตามอัตราต่อ RW จริงของเขต ซึ่งมักต่ำกว่าเพดานที่ประกาศ<\/p>\n<\/blockquote>\n<p>บทเรียนปี 2570: ตัวเลข \"ข้อเสนอ\" กับตัวเลข \"ที่ได้รับจริง\" ต่างกันได้มาก อย่าทำ Planfin จากข่าวข้อเสนอ<\/p><\/div>\n<h3>2.3 เส้นทางเดินเงิน 4 ชั้น<\/h3>\n<h4>ชั้นที่ 1 — สปสช. ส่วนกลาง<\/h4>\n<blockquote>\n<p>• หักเงินเดือนหน่วยบริการภาครัฐออกก่อน ปัจจุบันหักในระดับประเทศ (เดิมหักระดับเขต ทำให้เขตที่มีบุคลากรหนาแน่นเสียเปรียบ)<\/p>\n<p>• กันงบบริหารจัดการและงบจ่ายจากส่วนกลาง เช่น ยาบัญชี จ(2), ยา CL, อวัยวะเทียม, สายสวนหัวใจ, น้ำยา CAPD, วัคซีน<\/p>\n<p>• รายการเหล่านี้มักจ่ายเป็น \"ของ\" ไม่ใช่ \"เงิน\" ผ่านเครือข่ายด้านยาและเวชภัณฑ์ โรงพยาบาลจึงไม่เห็นเป็นตัวเงินในบัญชี<\/p>\n<\/blockquote>\n<h4>ชั้นที่ 2 — สปสช. เขต<\/h4>\n<blockquote>\n<p>• IP: ได้ global budget ก้อนเดียวทั้งเขต หารด้วย Sum AdjRW ของทุกหน่วยบริการในเขต จึงได้อัตราจ่ายต่อ RW จริง<\/p>\n<p>• อปสข. มีอำนาจกำหนดหลักเกณฑ์จัดสรรบางรายการภายในเขต เช่น PPA, ค่าเสื่อมระดับเขต, การตามจ่าย OP refer<\/p>\n<\/blockquote>\n<div class=\"callout\"><p><strong>จุดยุทธศาสตร์ของ สสจ.<\/strong><\/p>\n<p>อปสข. คือเวทีที่ สสจ. ต้องมีส่วนร่วมอย่างจริงจัง เพราะหลักเกณฑ์การเกลี่ยเงินภายในเขตกระทบรายได้โรงพยาบาลในจังหวัดโดยตรง ข้อมูลเชิงประจักษ์มีน้ำหนักกว่าการโต้แย้งในที่ประชุมโดยไม่มีตัวเลข (ชีต ภาพรวมจังหวัด ในไฟล์ Excel ทำมาเพื่อเวทีนี้)<\/p><\/div>\n<h4>ชั้นที่ 3 — CUP (หน่วยบริการประจำ)<\/h4>\n<blockquote>\n<p>• ได้ OP capitation ตามประชากรที่ลงทะเบียน ปรับด้วยโครงสร้างอายุ (age-adjusted)<\/p>\n<p>• ต้องบริหารเงินก้อนนี้ให้ครอบคลุมทั้งเครือข่าย รวมถึงการตามจ่าย OP refer ไปหน่วยบริการอื่น<\/p>\n<p>• CUP ที่มีอัตรา refer สูงจะมีรายจ่ายตามจ่ายสูง กดกำไรส่วน OP ลงอย่างมีนัยสำคัญ<\/p>\n<\/blockquote>\n<h4>ชั้นที่ 4 — หน่วยบริการปฐมภูมิ / รพ.สต.<\/h4>\n<blockquote>\n<p>• รูปแบบเดิม: CUP จัดสรรลงตามข้อตกลง (ตามหัวประชากร / ผลงาน / เหมาจ่ายบางส่วน) และสนับสนุนยา เวชภัณฑ์ ระบบข้อมูล<\/p>\n<p>• รูปแบบปัจจุบัน: รพ.สต. ที่ถ่ายโอนไปสังกัด อบจ. รับเงินตรงจาก สปสช. ไม่ผ่าน CUP<\/p>\n<p>• ปี 2570: National Health Package ปฐมภูมิทำให้เงิน OP และ P&amp;P ไปถึงหน่วยปฐมภูมิโดยตรงมากขึ้น ข้อตกลงเดิมระหว่าง CUP กับหน่วยปฐมภูมิต้องทบทวนใหม่<\/p>\n<\/blockquote>\n<div class=\"callout\"><p><strong>ประเด็นร้อนที่ สสจ. ต้องบริหารจัดการ<\/strong><\/p>\n<p>การถ่ายโอน รพ.สต. ไป อบจ. สร้างความเสี่ยงหลายด้านพร้อมกัน<\/p>\n<blockquote>\n<p>• ระบบส่งต่อและระบบข้อมูลขาดตอน ทำให้เคลมตกหล่น<\/p>\n<p>• ข้อพิพาทเรื่องยาและเวชภัณฑ์ที่ CUP เคยสนับสนุน<\/p>\n<p>• ภาระงาน P&amp;P ที่ไม่ชัดว่าใครรับผิดชอบ ทำให้ผลงานตกทั้งสองฝ่าย<\/p>\n<\/blockquote>\n<p>มาตรการ: MOU ระหว่าง อบจ. กับ CUP ที่ระบุชัดเรื่องยา เวชภัณฑ์ ระบบส่งต่อ การแบ่งงาน P&amp;P และการใช้ระบบข้อมูลร่วมกัน<\/p><\/div>\n<h3>2.4 สูตรประมาณการรายได้ UC ของโรงพยาบาล<\/h3>\n<div class=\"callout\"><p><strong>รายได้ UC โดยประมาณ = (UC Pop × อัตรา OP ต่อหัว) − เงินเดือนที่ถูกหัก<\/strong><\/p>\n<p><strong>+ (Sum AdjRW × อัตราจ่ายต่อ RW จริงของเขต)<\/strong><\/p>\n<p><strong>+ บริการกรณีเฉพาะ (CR) ที่เบิกได้จริง + P&amp;P ตามผลงาน<\/strong><\/p>\n<p><strong>+ งบนอกเหมาจ่ายรายหัว (NCD, LTC, RRT, HIV)<\/strong><\/p><\/div>\n<p>หากผลลัพธ์ต่ำกว่าค่าใช้จ่ายดำเนินการ โรงพยาบาลจะเข้าสู่ภาวะ Planfin ติดลบตั้งแต่ต้นปี ซึ่งต้องวางแผนรับมือล่วงหน้า ไม่ใช่รอให้เกิดแล้วค่อยแก้<\/p>\n<div class=\"callout\"><p><strong>สรุปบทที่ 2 — 3 ข้อที่ต้องจำ<\/strong><\/p>\n<p>1. เงินที่ รพ.ได้จริง ≠ อัตราเหมาจ่ายรายหัว × ประชากร เพราะมีการหักเงินเดือนและกันงบส่วนกลาง<\/p>\n<p>2. IP เป็นระบบ zero-sum ภายในเขต ผลงานของ รพ.อื่นกระทบอัตราจ่ายของเราโดยตรง<\/p>\n<p>3. รพ.สต.ถ่ายโอนและ National Health Package คือจุดที่ต้องจัดการด้วยข้อตกลงเป็นลายลักษณ์อักษร<\/p><\/div>\n<h2 id=\"m-ch3\">บทที่ 3 · DRG / AdjRW / CMI<\/h2>\n<h3>3.1 ตรรกะพื้นฐาน<\/h3>\n<p>ระบบผู้ป่วยในไม่ได้จ่ายตาม \"ของที่ใช้จริง\" แต่จ่ายตาม \"ผู้ป่วยรายนี้ควรมีต้นทุนเท่าใด\" ซึ่งตัดสินจากสิ่งที่บันทึกในเวชระเบียนแล้วแปลงเป็นรหัส<\/p>\n<div class=\"callout\"><strong>เวชระเบียน → ICD-10 (การวินิจฉัย) + ICD-9-CM (หัตถการ) → Grouper → DRG → RW → AdjRW → จำนวนเงิน<\/strong><\/div>\n<div class=\"callout\"><p><strong>จุดที่เงินหายมากที่สุด<\/strong><\/p>\n<p>คือลูกศรแรก — การบันทึกเวชระเบียนและการให้รหัส ไม่ใช่ที่ สปสช. โรงพยาบาลจำนวนมากรักษาผู้ป่วยหนักเท่ากับ รพ.อื่น แต่ได้เงินน้อยกว่าเพราะบันทึกไม่ครบ<\/p><\/div>\n<h3>3.2 ศัพท์ที่ต้องแม่น<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ศัพท์<\/strong><\/th>\n<th><strong>ความหมาย<\/strong><\/th>\n<th><strong>ข้อควรรู้<\/strong><\/th>\n<\/tr>\n<tr>\n<th>DRG<\/th>\n<th>กลุ่มวินิจฉัยโรคร่วม รหัส 5 หลัก<\/th>\n<th>หลัก 1–2 = MDC (กลุ่มโรคหลักตามระบบอวัยวะ), หลัก 3–4 = ADRG, หลัก 5 = ระดับความรุนแรง<\/th>\n<\/tr>\n<tr>\n<th>RW<\/th>\n<th>ค่าน้ำหนักสัมพัทธ์ของ DRG<\/th>\n<th>ค่าคงที่ตามตาราง Thai DRG เวอร์ชันที่ประกาศใช้ในปีนั้น<\/th>\n<\/tr>\n<tr>\n<th>AdjRW<\/th>\n<th>RW ที่ปรับตามวันนอนจริง<\/th>\n<th>คือตัวที่นำไปคูณเงิน ไม่ใช่ RW ดิบ<\/th>\n<\/tr>\n<tr>\n<th>Sum AdjRW<\/th>\n<th>ผลรวม AdjRW ทั้งโรงพยาบาลในปีนั้น<\/th>\n<th>ตัวตั้งของรายได้ IP ทั้งก้อน<\/th>\n<\/tr>\n<tr>\n<th>CMI<\/th>\n<th>Sum AdjRW ÷ จำนวนผู้ป่วยในที่จำหน่าย<\/th>\n<th>ดัชนีความซับซ้อนเฉลี่ย ใช้เปรียบเทียบ รพ.ระดับเดียวกัน<\/th>\n<\/tr>\n<tr>\n<th>Outlier<\/th>\n<th>เคสที่วันนอนสั้นหรือยาวผิดปกติ<\/th>\n<th>Short stay ถูกลด AdjRW, Long stay ได้ปรับเพิ่มแบบขั้นบันได<\/th>\n<\/tr>\n<tr>\n<th>Base rate<\/th>\n<th>อัตราจ่ายต่อ 1 AdjRW<\/th>\n<th>อัตราที่ประกาศ ≠ อัตราที่ได้รับจริง<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>3.3 สูตรที่ต้องท่องได้ และอัตราจ่ายปี 2569–2570<\/h3>\n<div class=\"callout\"><p><strong>รายได้ IP = Sum AdjRW × อัตราจ่ายต่อ RW จริงของเขต<\/strong><\/p>\n<p><strong>อัตราจ่ายต่อ RW จริง = Global budget IP ของเขต ÷ Sum AdjRW ทั้งเขต<\/strong><\/p><\/div>\n<table>\n\n<thead>\n<tr>\n<th><strong>ปีงบ<\/strong><\/th>\n<th><strong>อัตราจ่าย IP (UC)<\/strong><\/th>\n<th><strong>หมายเหตุ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>2569<\/th>\n<th>8,350 บาท/AdjRW<\/th>\n<th>ยังเป็นงบปลายปิด อัตราจริงของแต่ละเขตขึ้นกับผลงานรวม<\/th>\n<\/tr>\n<tr>\n<th>2570<\/th>\n<th>ไม่เกิน 9,142 บาท/AdjRW<\/th>\n<th>มติบอร์ด สปสช. 2 ก.ย. 2569 พร้อมตรวจสอบก่อนและหลังจ่าย (ข้อเสนอเดิม 10,000 บาท ไม่ผ่าน)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<p>นัยสำคัญ 3 ประการ<\/p>\n<blockquote>\n<p><strong>1. เป็น zero-sum ภายในเขต<\/strong> — เมื่อ รพ.อื่นในเขตเพิ่ม AdjRW อัตราจ่ายต่อ RW ของทุกแห่งลดลง<\/p>\n<p><strong>2. อัตราจริงต่ำกว่าเพดานได้<\/strong> — 9,142 บาทคือเพดาน ใช้ทำ Planfin ไม่ได้โดยตรง ต้องใช้อัตราจริงของเขตปีก่อนเป็นฐาน (ชีต Planfin_Waterfall คำนวณส่วนต่างนี้ให้)<\/p>\n<p><strong>3. รพ.ที่ให้รหัสไม่ครบเสียเปรียบสองต่อ<\/strong> — ได้ AdjRW น้อยกว่าที่ควร และถูกดึงอัตราต่อ RW ลงโดย รพ.ที่ให้รหัสครบกว่า<\/p>\n<\/blockquote>\n<h3>3.4 ปัจจัยที่ดัน RW ขึ้น<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ลำดับ<\/strong><\/th>\n<th><strong>ปัจจัย<\/strong><\/th>\n<th><strong>คำอธิบาย<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>หัตถการ (ICD-9-CM)<\/th>\n<th>มีพลังมากที่สุด เคสเดียวกันหากมีรหัสผ่าตัดจะย้ายไป ADRG ที่ RW สูงกว่ามาก<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>Comorbidity / Complication<\/th>\n<th>CC และ MCC ยกระดับความรุนแรง<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>Principal Diagnosis ที่ถูกต้อง<\/th>\n<th>ต้องเป็นโรคที่ทำให้ต้องรับไว้ในโรงพยาบาล ไม่ใช่โรคที่ใช้เวลารักษานานที่สุด<\/th>\n<\/tr>\n<tr>\n<th>4<\/th>\n<th>สถานะการจำหน่าย<\/th>\n<th>เสียชีวิต / ส่งต่อ / ไม่สมัครใจรักษา มีผลต่อการปรับค่า<\/th>\n<\/tr>\n<tr>\n<th>5<\/th>\n<th>อายุ และน้ำหนักแรกเกิด<\/th>\n<th>ตัวแปรใน grouper สำหรับบางกลุ่มโรค โดยเฉพาะทารกแรกเกิด<\/th>\n<\/tr>\n<tr>\n<th>6<\/th>\n<th>วันนอน (LOS)<\/th>\n<th>ไม่เพิ่ม RW โดยตรง แต่ป้องกันการถูกหักจาก short stay<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>3.5 จุดรั่วที่พบบ่อย (เน้นห้องผ่าตัดและ ICU)<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>จุดรั่ว<\/strong><\/th>\n<th><strong>ผลกระทบ<\/strong><\/th>\n<th><strong>วิธีปิด<\/strong><\/th>\n<\/tr>\n<tr>\n<th>ไม่ลงรหัสหัตถการเสริม เช่น central line, arterial line, intubation, ชั่วโมงเครื่องช่วยหายใจ<\/th>\n<th>เสีย CC/MCC ทั้งกลุ่ม RW ตกหนึ่งระดับ<\/th>\n<th>checklist ให้ห้องผ่าตัดและ ICU ส่งรายการหัตถการเข้าเวชระเบียนทุกเคส<\/th>\n<\/tr>\n<tr>\n<th>ใช้เครื่องช่วยหายใจแต่ไม่ระบุจำนวนชั่วโมง<\/th>\n<th>ตกเกณฑ์ ADRG กลุ่ม ventilator ซึ่ง RW สูงมาก<\/th>\n<th>บันทึกเป็นตัวเลขชั่วโมงทุกราย ไม่ใช้คำว่า \"on ET tube\" เฉย ๆ<\/th>\n<\/tr>\n<tr>\n<th>สรุปเวชระเบียนจำหน่ายล่าช้าหรือไม่ครบ<\/th>\n<th>ผู้ให้รหัสไม่มีข้อมูล จึงให้รหัสต่ำไว้ก่อน<\/th>\n<th>KPI สรุปเวชระเบียนภายใน 7–15 วัน รายงานรายบุคคล<\/th>\n<\/tr>\n<tr>\n<th>โรคร่วมที่ควบคุมอยู่แล้วไม่ถูกบันทึก เช่น DM, CKD, AF, COPD<\/th>\n<th>เสียระดับความรุนแรง<\/th>\n<th>ระบุใน discharge summary แม้ไม่ได้รักษาโดยตรงในครั้งนั้น<\/th>\n<\/tr>\n<tr>\n<th>เลือก Principal Diagnosis ผิด โดยเลือกภาวะแทรกซ้อนเป็นโรคหลัก<\/th>\n<th>RW ต่ำกว่าที่ควร หรือถูกเรียกเงินคืน<\/th>\n<th>ทบทวนร่วมกับผู้ให้รหัสก่อนส่งเคลม<\/th>\n<\/tr>\n<tr>\n<th>ไม่แยกเคสที่เบิกบริการกรณีเฉพาะ (CR) ออกจาก DRG<\/th>\n<th>เสียโอกาสเบิกส่วนกลางซึ่งเป็นเงินคนละก้อน<\/th>\n<th>รายการ CR ติดไว้ที่ห้องเคลม ทบทวนทุกเดือน (ชีต เคลมค้าง_ยอดโอน แสดง CR ตกหล่น)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>3.6 การอ่านค่า CMI<\/h3>\n<blockquote>\n<p>• ค่าอ้างอิงคร่าว ๆ: รพ.ชุมชน ประมาณ 0.6–0.8 · รพ.ทั่วไป ประมาณ 0.8–1.2 · รพ.ศูนย์ ตั้งแต่ 1.2 ขึ้นไป<\/p>\n<p>• CMI ต่ำผิดปกติ อาจไม่ได้แปลว่าเคสง่าย แต่แปลว่าการให้รหัสอ่อน ต้อง coding audit ก่อนสรุปว่าศักยภาพต่ำ<\/p>\n<p>• CMI สูงขึ้นเร็วผิดปกติ เป็นธงแดงของ upcoding ซึ่งระบบตรวจสอบด้วย AI ปี 2570 จะจับได้เร็วขึ้น<\/p>\n<\/blockquote>\n<div class=\"callout\"><p><strong>เทคนิควินิจฉัยแยกโรค<\/strong><\/p>\n<p>ดู CMI แยกตาม MDC เทียบกับ รพ.ระดับเดียวกันในเขต (ชีต MDC_Gap)<\/p>\n<blockquote>\n<p>• ต่ำเฉพาะบาง MDC → ปัญหาการให้รหัสในกลุ่มโรคนั้น<\/p>\n<p>• ต่ำทั้งกระดาน → ปัญหาศักยภาพการให้บริการจริง หรือปัญหาระบบเวชระเบียนทั้งระบบ<\/p>\n<\/blockquote><\/div>\n<h3>3.7 การตรวจสอบเวชระเบียนและการตรวจสอบก่อน-หลังจ่าย<\/h3>\n<blockquote>\n<p>• <strong>Post-payment audit<\/strong> — สปสช. สุ่มตรวจเวชระเบียนย้อนหลัง หากการให้รหัสไม่มีหลักฐานรองรับจะเรียกเงินคืน ผลตรวจแบ่งเป็น ถูกต้อง / ปรับ RW เพิ่ม / ปรับ RW ลด<\/p>\n<p>• <strong>Pre-payment audit<\/strong> (เริ่มเข้มขึ้นปี 2570) — ระบบ AI คัดกรองข้อมูลก่อนจ่าย รายการผิดปกติจะถูกระงับหรือขอเอกสารเพิ่ม เงินเข้าช้าลงถ้าเอกสารไม่พร้อม<\/p>\n<p>• สาเหตุที่หน่วยบริการแพ้การตรวจสอบมากที่สุด ไม่ใช่ \"ให้รหัสผิด\" แต่คือ \"ไม่มีหลักฐานบันทึกในเวชระเบียน\"<\/p>\n<\/blockquote>\n<div class=\"callout\"><p><strong>กฎเหล็ก<\/strong><\/p>\n<p>ไม่บันทึก = ไม่ได้ทำ — ต่อให้ทำจริงก็ตาม หลักการนี้ใช้ได้ทั้งกับการเบิกจ่ายและการต่อสู้คดีทางการแพทย์<\/p><\/div>\n<h3>3.8 แผนปฏิบัติการระดับจังหวัด<\/h3>\n<blockquote>\n<p><strong>1.<\/strong> ดึง Sum AdjRW, CMI และจำนวนผู้ป่วยจำหน่ายของทุก รพ. ย้อนหลัง 3 ปี ทำเป็นแนวโน้ม (ชีต ControlChart)<\/p>\n<p><strong>2.<\/strong> หา 5 อันดับ MDC ที่แต่ละ รพ. มี CMI ต่ำกว่าค่ากลางเขต เพื่อชี้เป้าการตรวจสอบ (ชีต MDC_Gap)<\/p>\n<p><strong>3.<\/strong> เปรียบเทียบอัตราจ่ายต่อ RW ที่ได้รับจริงกับที่ประมาณการใน Planfin เพื่อหาช่องว่าง<\/p>\n<p><strong>4.<\/strong> ตั้งทีม coding audit ระดับจังหวัด สุ่มตรวจ 30–50 ฉบับต่อ รพ. ต่อไตรมาส ก่อนที่ สปสช. หรือระบบ AI จะตรวจพบ<\/p>\n<p><strong>5.<\/strong> ออกหนังสือให้ทุก รพ. กำหนด KPI การสรุปเวชระเบียนภายใน 15 วัน และรายงานผลรายเดือน<\/p>\n<\/blockquote>\n<h2 id=\"m-ch4\">บทที่ 4 · ระบบเคลมและการแก้ปัญหา &quot;ติด C&quot;<\/h2>\n<h3>4.1 แผนผังระบบที่ต้องรู้จัก<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ระบบ<\/strong><\/th>\n<th><strong>ใช้กับอะไร<\/strong><\/th>\n<\/tr>\n<tr>\n<th><p><strong>FDH (Financial Data Hub)<\/strong><\/p>\n<p>ศูนย์กลางข้อมูลด้านการเงิน สธ.<\/p><\/th>\n<th>รพ. สังกัด สธ. ส่งข้อมูลเบิกบัตรทองผ่าน FDH เป็นช่องทางเดียวตั้งแต่ 1 เมษายน 2567 ข้อมูลไหลจาก HIS ของ รพ. → FDH → สปสช. ติดตามสถานะการตรวจสอบและยอดชดเชยได้จาก FDH<\/th>\n<\/tr>\n<tr>\n<th>e-Claim<\/th>\n<th>ผู้ป่วยในทุกสิทธิ, OP กรณีเฉพาะ, อุบัติเหตุ/เจ็บป่วยฉุกเฉิน, UCEP, OP refer ข้ามจังหวัด — ข้อมูลจาก FDH เชื่อมเข้าระบบนี้<\/th>\n<\/tr>\n<tr>\n<th>43 แฟ้ม → HDC / OP-PP Individual<\/th>\n<th>ผู้ป่วยนอกทั่วไป และ P&amp;P รายบุคคล (จ่ายตามผลงานและ fee schedule)<\/th>\n<\/tr>\n<tr>\n<th>AIPN<\/th>\n<th>แจ้งขออนุมัติรับผู้ป่วยในข้ามเขต/นอกเครือข่าย ไม่แจ้งภายใน 24 ชั่วโมง = ไม่ได้รับเงิน<\/th>\n<\/tr>\n<tr>\n<th>Seamless for DMIS<\/th>\n<th>โรคเฉพาะ เช่น ไตวายเรื้อรัง (HD/CAPD/KT), วัณโรค, มะเร็ง, Stroke/STEMI fast track, ธาลัสซีเมีย<\/th>\n<\/tr>\n<tr>\n<th>NAPPLUS<\/th>\n<th>ผู้ติดเชื้อเอชไอวีและผู้ป่วยเอดส์<\/th>\n<\/tr>\n<tr>\n<th>New Authen Code<\/th>\n<th>ยืนยันการเข้ารับบริการ เป็นเงื่อนไขบังคับของหลายรายการ<\/th>\n<\/tr>\n<tr>\n<th>Drug Catalogue<\/th>\n<th>ฐานรหัสยาสำหรับจ่ายชดเชย (ยา จ(2), ยา CL, ยากำพร้า)<\/th>\n<\/tr>\n<tr>\n<th>Statement / Smart Money Transfer<\/th>\n<th>ตรวจยอดโอน งวดโอน และรายการหัก<\/th>\n<\/tr>\n<tr>\n<th>e-Portal<\/th>\n<th>ขึ้นทะเบียนหน่วยบริการ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>เรื่องเร่งด่วนที่ต้องตรวจสอบ<\/strong><\/p>\n<p>ระบบ e-Claim ของ สปสช. เข้าใช้งานผ่าน Single Sign-On ด้วย ThaiD บัญชีที่ไม่ผูก ThaiD จะเข้าระบบไม่ได้ ถ้าเข้าระบบไม่ได้จะแก้ข้อมูลติด C ไม่ได้และเงินจะค้างเป็นเดือน — ตรวจว่าเจ้าหน้าที่เคลมทุก รพ. ในจังหวัดผูกบัญชีครบ และมีผู้ปฏิบัติแทนอย่างน้อย 2 คนต่อ รพ.<\/p><\/div>\n<h3>4.2 วงจรเคลม 6 ขั้น<\/h3>\n<div class=\"callout\"><p><strong>1 ตรวจสอบสิทธิ + Authen → 2 ให้บริการ / บันทึกเวชระเบียน → 3 ให้รหัส (Coding)<\/strong><\/p>\n<p><strong>→ 4 ส่งข้อมูลผ่าน FDH ภายในกำหนด → 5 ตรวจสอบ (ผ่าน / ติด C / ถูกระงับก่อนจ่าย) → 6 ประมวลผล → โอนเงิน<\/strong><\/p><\/div>\n<table>\n\n<thead>\n<tr>\n<th><strong>ขั้น<\/strong><\/th>\n<th><strong>จุดรั่ว<\/strong><\/th>\n<th><strong>ผลลัพธ์<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>ไม่ Authen / สิทธิว่าง / สิทธิไม่ตรงวันรับบริการ<\/th>\n<th>ติด C ทันที<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>เวชระเบียนบันทึกไม่ครบ<\/th>\n<th>ได้รหัสต่ำกว่าความเป็นจริง และแพ้การตรวจสอบ<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>ให้รหัสผิดหรือรหัสไม่สัมพันธ์กัน<\/th>\n<th>ติด C หรือถูกเรียกเงินคืนภายหลัง<\/th>\n<\/tr>\n<tr>\n<th>4<\/th>\n<th>ส่งข้อมูลเกินกำหนด / ข้อมูลค้างใน HIS ไม่ขึ้น FDH<\/th>\n<th>ถูกตัดสิทธิการเบิก<\/th>\n<\/tr>\n<tr>\n<th>5<\/th>\n<th>ปล่อยข้อมูลติด C ค้างไว้<\/th>\n<th>หมดเวลาแก้ไข = สูญเงินโดยไม่จำเป็น<\/th>\n<\/tr>\n<tr>\n<th>6<\/th>\n<th>ยอดโอนไม่ตรงกับที่ส่งเคลม<\/th>\n<th>ต้องอุทธรณ์ภายในกรอบเวลาที่กำหนด<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<p>กำหนดเวลาหลัก: โดยทั่วไปต้องส่งข้อมูลภายใน 30 วันนับจากวันจำหน่ายหรือวันให้บริการ และแก้ไขข้อมูลติด C ภายในกรอบที่ประกาศ เงื่อนไขแต่ละรายการไม่เท่ากัน ดูคู่มือแนวทางปฏิบัติในการขอรับค่าใช้จ่ายปีปัจจุบัน หัวข้อ \"สิ่งที่เปลี่ยนแปลง\"<\/p>\n<h3>4.3 &quot;ติด C&quot; คืออะไร<\/h3>\n<p>ติด C คือสถานะของข้อมูลที่ไม่ผ่านการตรวจสอบในกระบวนการพิจารณา มี 2 กรณีหลัก<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>สถานะ<\/strong><\/th>\n<th><strong>ความหมาย<\/strong><\/th>\n<th><strong>การจัดการ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>สถานะ 2<\/th>\n<th>ไม่ผ่านการตรวจสอบขั้นต้น (ระบบตรวจพบเอง เช่น ผิดรูปแบบ ผิดตรรกะ)<\/th>\n<th>หน่วยบริการแก้ไขเองได้ทันที<\/th>\n<\/tr>\n<tr>\n<th>สถานะ 3<\/th>\n<th>ไม่ผ่านการตรวจสอบจาก สปสช.<\/th>\n<th>แก้ตามเหตุผลที่ระบุ หรือยื่นอุทธรณ์<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<p>สาเหตุติด C ที่พบบ่อยที่สุด<\/p>\n<blockquote>\n<p><strong>1.<\/strong> สิทธิ ณ วันรับบริการไม่ตรง / สิทธิว่าง / เปลี่ยนสิทธิระหว่างนอนโรงพยาบาล<\/p>\n<p><strong>2.<\/strong> ไม่มี Authen Code หรือ Authen ผิดวัน<\/p>\n<p><strong>3.<\/strong> เลขประจำตัวประชาชน 13 หลักผิด หรือชื่อ-สกุลไม่ตรงฐานทะเบียนราษฎร<\/p>\n<p><strong>4.<\/strong> การวินิจฉัย–หัตถการ–เพศ–อายุ ไม่สัมพันธ์กัน<\/p>\n<p><strong>5.<\/strong> วันที่ผิดตรรกะ เช่น วันจำหน่ายก่อนวันรับไว้ หรือวันผ่าตัดอยู่นอกช่วงนอนโรงพยาบาล<\/p>\n<p><strong>6.<\/strong> ส่งข้อมูลซ้ำกับรายการที่ผ่านแล้ว<\/p>\n<p><strong>7.<\/strong> หน่วยบริการไม่ได้ขึ้นทะเบียนสำหรับบริการนั้น<\/p>\n<p><strong>8.<\/strong> ไม่แจ้ง AIPN หรือแจ้งเกิน 24 ชั่วโมง<\/p>\n<p><strong>9.<\/strong> ไม่แนบเอกสารหลักฐานตามเงื่อนไขของรายการกรณีเฉพาะ<\/p>\n<p><strong>10.<\/strong> รหัสยาหรืออุปกรณ์ไม่ตรงกับ Drug Catalogue<\/p>\n<\/blockquote>\n<h3>4.4 การจัดลำดับความเสี่ยงเพื่อแก้ไข<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ระดับ<\/strong><\/th>\n<th><strong>ลักษณะ<\/strong><\/th>\n<th><strong>การจัดการ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>แดง<\/th>\n<th>ส่งเกินกำหนด / ไม่แจ้ง AIPN<\/th>\n<th>กู้คืนไม่ได้ ต้องแก้ที่ระบบงานหน้างาน ไม่ใช่แก้ที่ข้อมูล<\/th>\n<\/tr>\n<tr>\n<th>ส้ม<\/th>\n<th>ติด C สถานะ 3 ที่ใกล้หมดเวลาแก้ไข / ค้างเกิน 30 วัน<\/th>\n<th>เคลียร์รายวัน มอบหมายผู้รับผิดชอบชัดเจน<\/th>\n<\/tr>\n<tr>\n<th>เหลือง<\/th>\n<th>ติด C สถานะ 2<\/th>\n<th>มอบหมายเจ้าหน้าที่แก้ไขแบบรวมชุด<\/th>\n<\/tr>\n<tr>\n<th>เขียว<\/th>\n<th>ผ่านแล้วแต่ได้เงินต่ำกว่าที่คาด<\/th>\n<th>ทบทวนการให้รหัสและเงื่อนไขรายการ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>4.5 ตัวชี้วัดที่ควรเรียกจากทุก รพ. รายเดือน<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>#<\/strong><\/th>\n<th><strong>ตัวชี้วัด<\/strong><\/th>\n<th><strong>เป้าหมาย / ข้อสังเกต<\/strong><\/th>\n<th><strong>ชีตใน Excel<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>ร้อยละเคลมผ่านครั้งแรก (First Pass Rate)<\/th>\n<th>ไม่ต่ำกว่าร้อยละ 95<\/th>\n<th>p-chart · Funnel_FPR<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>จำนวนและมูลค่าเคสติด C ค้าง แยกอายุค้าง<\/th>\n<th>แยก &lt;15 วัน / 15–30 วัน / &gt;30 วัน<\/th>\n<th>เคลมค้าง_ยอดโอน<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>จำนวนเคสที่ส่งเกินกำหนด<\/th>\n<th>ต้องเป็นศูนย์ ถ้าไม่ใช่คือปัญหาเชิงระบบ<\/th>\n<th>Pareto (C11)<\/th>\n<\/tr>\n<tr>\n<th>4<\/th>\n<th>ส่วนต่างระหว่างยอดส่งเคลมกับยอดโอนจริง<\/th>\n<th>ตรวจจาก statement / FDH<\/th>\n<th>เคลมค้าง_ยอดโอน<\/th>\n<\/tr>\n<tr>\n<th>5<\/th>\n<th>มูลค่า CR ที่เบิกได้ เทียบเคสที่เข้าเกณฑ์<\/th>\n<th>มักพบเบิกไม่ครบหลายล้านบาทต่อปี<\/th>\n<th>เคลมค้าง_ยอดโอน<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>4.6 แผนปฏิบัติการระดับจังหวัด<\/h3>\n<blockquote>\n<p><strong>1.<\/strong> ทุก รพ. มี Claim Center ที่มีผู้รับผิดชอบชัดเจน ไม่ฝากไว้กับงานเวชระเบียนเพียงอย่างเดียว<\/p>\n<p><strong>2.<\/strong> ตรวจและเคลียร์รายการติด C ทุกวันทำการ ไม่ใช่รอสิ้นเดือน<\/p>\n<p><strong>3.<\/strong> ทำ pre-audit หน้างาน ตรวจสิทธิและ Authen ตั้งแต่จุดลงทะเบียน ปิดสาเหตุติด C อันดับ 1–3 ได้ทันที<\/p>\n<p><strong>4.<\/strong> SOP สำหรับ AIPN ติดไว้ที่ห้องฉุกเฉินและหอผู้ป่วย ระบุใครแจ้ง แจ้งอย่างไร ภายในกี่ชั่วโมง และใครปฏิบัติแทนในวันหยุด<\/p>\n<p><strong>5.<\/strong> ตรวจว่าข้อมูลจาก HIS ขึ้น FDH ครบทุกวัน — ข้อมูลที่ค้างใน HIS ไม่ถือว่าส่งแล้ว<\/p>\n<p><strong>6.<\/strong> ประชุมงานเคลมระดับจังหวัดทุกไตรมาส เปรียบเทียบ First Pass Rate ด้วย Funnel plot และให้แห่งที่ทำได้ดีมาแลกเปลี่ยน<\/p>\n<p><strong>7.<\/strong> ตรวจบัญชีผู้ใช้งานระบบ สปสช. (ThaiD) ของทุกหน่วยบริการให้พร้อมก่อนเริ่มปีงบประมาณใหม่<\/p>\n<\/blockquote>\n<h2 id=\"m-ch5\">บทที่ 5 · Planfin, วิกฤติการเงินระดับ 7 และ Unit cost<\/h2>\n<h3>5.1 Planfin คืออะไร<\/h3>\n<p>แผนประมาณการรายได้และค่าใช้จ่ายของหน่วยบริการในสังกัดสำนักงานปลัดกระทรวงสาธารณสุข จัดทำผ่านโปรแกรม Planfin ของกองเศรษฐกิจสุขภาพและหลักประกันสุขภาพ ส่งก่อนเริ่มปีงบประมาณ และปรับแผนกลางปีในไตรมาสที่ 2<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>ด้านรายได้<\/strong><\/th>\n<th><strong>ด้านค่าใช้จ่าย<\/strong><\/th>\n<\/tr>\n<tr>\n<th>UC (OP capitation, IP DRG, CR, P&amp;P, non-capitation)<\/th>\n<th>ต้นทุนยา<\/th>\n<\/tr>\n<tr>\n<th>ประกันสังคม<\/th>\n<th>เวชภัณฑ์มิใช่ยาและวัสดุการแพทย์<\/th>\n<\/tr>\n<tr>\n<th>ข้าราชการ / อปท.<\/th>\n<th>วัสดุทั่วไป<\/th>\n<\/tr>\n<tr>\n<th>ชำระเงินเอง / แรงงานต่างด้าว<\/th>\n<th>ค่าแรง (เงินเดือน ค่าตอบแทน จ้างเหมา)<\/th>\n<\/tr>\n<tr>\n<th>งบประมาณและรายได้อื่น<\/th>\n<th>ค่าใช้สอยและสาธารณูปโภค / ค่าเสื่อมราคา<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>ข้อผิดพลาดที่พบบ่อยในการทำ Planfin<\/strong><\/p>\n<p>ประมาณการรายได้ IP ด้วยอัตราที่ประกาศ (ปี 2570 คือเพดาน 9,142 บาท/AdjRW) ทั้งที่ควรใช้ <strong>อัตราจ่ายต่อ RW จริงของเขตในปีก่อนหน้า<\/strong> เป็นฐาน ผลคือแผนดูดีเกินจริง แล้วสิ้นปีกลายเป็นติดลบ ชีต Planfin_Waterfall คำนวณส่วนที่อาจประมาณการเกินให้รายโรงพยาบาล<\/p><\/div>\n<h3>5.2 วิกฤติการเงินระดับ 7 (Risk Scoring)<\/h3>\n<p>ประเมินจากคะแนนรวม 0–7 ใน 3 มิติ ตามเกณฑ์ของกองเศรษฐกิจสุขภาพและหลักประกันสุขภาพ<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>มิติ<\/strong><\/th>\n<th><strong>ตัวชี้วัด<\/strong><\/th>\n<th><strong>เกณฑ์ที่ถือว่ามีปัญหา<\/strong><\/th>\n<th><strong>คะแนน<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1. สภาพคล่อง<\/th>\n<th>Current Ratio<\/th>\n<th>น้อยกว่า 1.5<\/th>\n<th>1<\/th>\n<\/tr>\n<tr>\n<th><\/th>\n<th>Quick Ratio<\/th>\n<th>น้อยกว่า 1.0<\/th>\n<th>1<\/th>\n<\/tr>\n<tr>\n<th><\/th>\n<th>Cash Ratio<\/th>\n<th>น้อยกว่า 0.8<\/th>\n<th>1<\/th>\n<\/tr>\n<tr>\n<th>2. ความมั่นคงและผลประกอบการ<\/th>\n<th>ทุนสำรองสุทธิ (NWC)<\/th>\n<th>ติดลบ<\/th>\n<th>1<\/th>\n<\/tr>\n<tr>\n<th><\/th>\n<th>รายได้สูง(ต่ำ)กว่าค่าใช้จ่ายสุทธิ (NI)<\/th>\n<th>ติดลบ<\/th>\n<th>1<\/th>\n<\/tr>\n<tr>\n<th>3. ระยะเวลาทุนหมด<\/th>\n<th>ดูตารางถัดไป<\/th>\n<th>ตามสถานะ NWC และ NI<\/th>\n<th>0–2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h4>มิติที่ 3 · ระยะเวลาทุนหมด<\/h4>\n<table>\n\n<thead>\n<tr>\n<th><strong>สถานะ<\/strong><\/th>\n<th><strong>การให้คะแนน<\/strong><\/th>\n<\/tr>\n<tr>\n<th>NWC บวก และ NI บวก<\/th>\n<th>0 คะแนน<\/th>\n<\/tr>\n<tr>\n<th>NWC บวก แต่ NI ติดลบ (ทุนกำลังถูกใช้หมด)<\/th>\n<th>ทุนหมดใน มากกว่า 6 เดือน = 0 · 3–6 เดือน = 1 · ไม่เกิน 3 เดือน = 2<\/th>\n<\/tr>\n<tr>\n<th>NWC ติดลบ แต่ NI บวก (กำลังฟื้น)<\/th>\n<th>ฟื้นภายใน ไม่เกิน 3 เดือน = 0 · 3–6 เดือน = 1 · มากกว่า 6 เดือน = 2<\/th>\n<\/tr>\n<tr>\n<th>NWC และ NI ติดลบทั้งคู่<\/th>\n<th>2 คะแนน<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<table>\n\n<thead>\n<tr>\n<th><strong>คะแนน<\/strong><\/th>\n<th><strong>ระดับ<\/strong><\/th>\n<th><strong>ความหมายและการจัดการ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>0<\/th>\n<th>ปกติ<\/th>\n<th>ติดตามตามปกติ<\/th>\n<\/tr>\n<tr>\n<th>1–2<\/th>\n<th>เฝ้าระวัง<\/th>\n<th>โรงพยาบาลบริหารจัดการได้เอง<\/th>\n<\/tr>\n<tr>\n<th>3–4<\/th>\n<th>เริ่มมีปัญหา<\/th>\n<th>จัดทำแผนปรับปรุงและรายงานความคืบหน้า<\/th>\n<\/tr>\n<tr>\n<th>5–6<\/th>\n<th>มีปัญหา<\/th>\n<th>CFO ระดับจังหวัดและเขตเข้าแทรกแซง<\/th>\n<\/tr>\n<tr>\n<th>7<\/th>\n<th>วิกฤติ<\/th>\n<th>ติดลบทุกมิติ ต้องทำแผนฟื้นฟูการเงินและขอเงินเกลี่ยระดับเขต<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h4>สูตรที่ต้องคำนวณเองได้<\/h4>\n<div class=\"callout\"><p><strong>Current Ratio = สินทรัพย์หมุนเวียน ÷ หนี้สินหมุนเวียน<\/strong><\/p>\n<p><strong>Quick Ratio = (สินทรัพย์หมุนเวียน − สินค้าคงคลัง) ÷ หนี้สินหมุนเวียน<\/strong><\/p>\n<p><strong>Cash Ratio = (เงินสด + รายการเทียบเท่าเงินสด) ÷ หนี้สินหมุนเวียน<\/strong><\/p>\n<p><strong>NWC = สินทรัพย์หมุนเวียน − หนี้สินหมุนเวียน<\/strong><\/p>\n<p><strong>ระยะเวลาทุนหมด (เดือน) = NWC ÷ ขาดทุนเฉลี่ยต่อเดือน · ระยะเวลาฟื้น (เดือน) = |NWC| ÷ กำไรเฉลี่ยต่อเดือน<\/strong><\/p>\n<p><strong>ทุนสำรองคงเหลือ (เดือน) = NWC ÷ ค่าใช้จ่ายดำเนินการเฉลี่ยต่อเดือน<\/strong><\/p><\/div>\n<div class=\"callout\"><h4>สัญญาณเตือนภัยที่ใช้จริง<\/h4>\n<p>ทุนสำรองคงเหลือน้อยกว่า 3 เดือน ถือเป็นธงแดงแม้คะแนน Risk Score จะยังไม่ถึง 7 · คะแนนเพิ่ม 2 ระดับภายใน 2 ไตรมาสให้ลงตรวจสอบทันที (ชีต RiskScore และ RiskTrend แจ้งให้อัตโนมัติ)<\/p><\/div>\n<h3>5.3 ดัชนีประสิทธิภาพ (Efficiency Index)<\/h3>\n<p>Risk Score บอก \"อาการ\" แต่ Efficiency index บอก \"สาเหตุ\"<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>ตัวชี้วัด<\/strong><\/th>\n<th><strong>อ่านว่าอะไร<\/strong><\/th>\n<th><strong>ถ้าผิดปกติแปลว่าอะไร<\/strong><\/th>\n<\/tr>\n<tr>\n<th>I/E Ratio (รายได้ ÷ ค่าใช้จ่าย)<\/th>\n<th>น้อยกว่า 1 คือขาดทุน<\/th>\n<th>ปัญหาเชิงโครงสร้าง แก้ทั้งรายได้และรายจ่าย<\/th>\n<\/tr>\n<tr>\n<th>AR Days (ระยะเวลาเก็บหนี้)<\/th>\n<th>ยาว = เงินจมอยู่ในลูกหนี้<\/th>\n<th>ปัญหาที่ระบบเคลม ย้อนไปดูบทที่ 4<\/th>\n<\/tr>\n<tr>\n<th>AP Days (ระยะเวลาชำระหนี้)<\/th>\n<th>ยาวผิดปกติ = ค้างจ่ายเจ้าหนี้<\/th>\n<th>ขาดสภาพคล่องแล้ว แม้กำไรยังไม่ติดลบ<\/th>\n<\/tr>\n<tr>\n<th>Inventory Turnover<\/th>\n<th>ต่ำ = ยาและเวชภัณฑ์ค้างสต๊อก<\/th>\n<th>บริหารคลังอ่อน เงินจมในของ<\/th>\n<\/tr>\n<tr>\n<th>ต้นทุนต่อ OP visit<\/th>\n<th>สูงกว่ากลุ่มเปรียบเทียบ<\/th>\n<th>ประสิทธิภาพบริการผู้ป่วยนอกต่ำ<\/th>\n<\/tr>\n<tr>\n<th>ต้นทุนต่อ AdjRW<\/th>\n<th>สูงกว่ากลุ่มเปรียบเทียบ<\/th>\n<th>ประสิทธิภาพ IP ต่ำ หรือ CMI ต่ำผิดปกติ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><h4>การวินิจฉัยแยกโรคที่ใช้บ่อยมาก<\/h4>\n<p>ต้นทุนต่อ AdjRW สูงอาจไม่ได้แปลว่าใช้ทรัพยากรเปลือง แต่แปลว่า AdjRW ต่ำเกินจริงเพราะการให้รหัสอ่อน — ตรวจ CMI ก่อนสั่งลดค่าใช้จ่าย มิฉะนั้นจะแก้ผิดจุดและกระทบคุณภาพบริการโดยไม่จำเป็น<\/p><\/div>\n<h3>5.4 Unit cost<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ประเด็น<\/strong><\/th>\n<th><strong>Quick Method<\/strong><\/th>\n<th><strong>Standard / Full Cost<\/strong><\/th>\n<\/tr>\n<tr>\n<th>ฐานข้อมูล<\/th>\n<th>บัญชีเกณฑ์คงค้าง ประกอบกับผลงาน (OP visit, Sum AdjRW)<\/th>\n<th>ปันส่วนต้นทุนผ่าน cost center<\/th>\n<\/tr>\n<tr>\n<th>ความเร็ว<\/th>\n<th>เร็ว ทำได้ทุก รพ. ทุกปี<\/th>\n<th>ช้า ต้องเก็บข้อมูลละเอียด<\/th>\n<\/tr>\n<tr>\n<th>ใช้ทำอะไร<\/th>\n<th>เปรียบเทียบระหว่าง รพ. และใช้เป็นฐานตั้งอัตราจ่ายของ สปสช.<\/th>\n<th>ตั้งราคาบริการ วิเคราะห์ประสิทธิภาพหน่วยงานย่อย<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>ต้นทุนต่อ OP visit = ต้นทุนส่วนผู้ป่วยนอก ÷ จำนวน OP visit<\/strong><\/p>\n<p><strong>ต้นทุนต่อ AdjRW = ต้นทุนส่วนผู้ป่วยใน ÷ Sum AdjRW<\/strong><\/p><\/div>\n<div class=\"callout\"><p><strong>ทำไมเรื่องนี้สำคัญ<\/strong><\/p>\n<p>สปสช. ใช้ข้อมูลต้นทุน Quick Method ของกระทรวงสาธารณสุขย้อนหลังหลายปีเป็นฐานคำนวณอัตราจ่าย ข้อมูลต้นทุนที่โรงพยาบาลส่งเข้าระบบปีนี้คืออัตราจ่ายของอีก 2–3 ปีข้างหน้า หากกรอกไม่ครบหรือไม่ถูกต้องเท่ากับทำร้ายตัวเองในระยะยาว<\/p><\/div>\n<h3>5.5 Playbook เมื่อโรงพยาบาลเข้าสู่ระดับ 5–7<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ระยะ<\/strong><\/th>\n<th><strong>การดำเนินการ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>0–7 วัน<\/th>\n<th>ยืนยันความถูกต้องของตัวเลขก่อน บางครั้งเป็นความคลาดเคลื่อนทางบัญชี — ตรวจการปิดบัญชี ลูกหนี้ค้างรับ เจ้าหนี้ค้างจ่าย<\/th>\n<\/tr>\n<tr>\n<th>ภายใน 30 วัน<\/th>\n<th>จัดทำแผนฟื้นฟูการเงิน (Financial Recovery Plan) เสนอ CFO จังหวัด และส่งต่อระดับเขต<\/th>\n<\/tr>\n<tr>\n<th>มาตรการเร่งด่วน<\/th>\n<th>เคลียร์รายการติด C ทุกระบบ · เร่งเบิก CR ที่ตกหล่น · ไล่เบิก พ.ร.บ.รถที่ค้าง · เจรจาขยายเวลาชำระกับคู่ค้า · ระงับการจัดซื้อที่ไม่จำเป็น · ทบทวนการจ่ายค่าตอบแทน<\/th>\n<\/tr>\n<tr>\n<th>มาตรการเชิงโครงสร้าง<\/th>\n<th>Coding audit เพื่อยก CMI · ปรับ skill mix · ทบทวน service plan ที่ขาดทุนเรื้อรัง · รวมการจัดซื้อระดับจังหวัดหรือเขต<\/th>\n<\/tr>\n<tr>\n<th>การขอสนับสนุน<\/th>\n<th>เสนอขอเงินเกลี่ยระดับเขตผ่าน อปสข. หรือเงินกันเพื่อแก้ปัญหาการเงินของหน่วยบริการ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>ข้อควรระวังด้านความปลอดภัยผู้ป่วย<\/strong><\/p>\n<p>การตัดค่าใช้จ่ายด้านบุคลากรและเวชภัณฑ์แบบเหมารวมเร็วที่สุด แต่แลกด้วยความเสี่ยงทางคลินิกที่เพิ่มทันที ทุกแผนฟื้นฟูการเงินควรแนบ <strong>Patient Safety Impact Assessment<\/strong> — นี่คือจุดที่งานประกันสุขภาพและงานบริหารความเสี่ยงต้องทำงานร่วมกัน<\/p><\/div>\n<h3>5.6 Dashboard ที่ควรมีรายเดือน<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>รายการ<\/strong><\/th>\n<th><strong>ชีตใน Excel<\/strong><\/th>\n<\/tr>\n<tr>\n<th>Risk Score 0–7 พร้อมแนวโน้มย้อนหลัง 24 เดือน<\/th>\n<th>RiskScore · RiskTrend<\/th>\n<\/tr>\n<tr>\n<th>ทุนสำรองคงเหลือ (เดือน) และระยะเวลาทุนหมด<\/th>\n<th>RiskScore<\/th>\n<\/tr>\n<tr>\n<th>Planfin แผนเ
