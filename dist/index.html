-- | --- | --- |\n| CR ผ่าน แต่ Cash ไม่ผ่าน | เงินจมในลูกหนี้หรือยาคงคลัง | ACP รายสิทธิ, IM |\n| NI บวก แต่ NWC ติดลบ | ขาดทุนสะสมเก่า หรือใช้เงินบำรุงลงทุนเกินตัว | Trend NWC, กระแสเงินสดกิจกรรมลงทุน |\n| NI บวก แต่ APP สูงมาก | ใช้เจ้าหนี้ยาเป็นแหล่งทุน | เงินบำรุงหลังหักหนี้, เจ้าหนี้แยกอายุ |\n| NI ติดลบ แต่ EBITDA บวก | ขาดทุนจากค่าเสื่อม ยังไม่วิกฤตทันที | แผนทดแทนครุภัณฑ์, Survival |\n| OPM สูงกว่ากลุ่ม แต่ Cash ต่ำ | กำไรยังไม่กลายเป็นเงิน | ACP, การตั้งลูกหนี้ (บทที่ 3.2) |\n| CR สูงมาก (เช่น > 5) | เงินสะสมมากเกินจำเป็น หรือหนี้สินหมุนเวียนต่ำผิดปกติ | แผนลงทุน, ความครบของการตั้งเจ้าหนี้ |\n\nภาพรวม จ.อุดรธานี ณ มิ.ย. 69 เข้ารูปแบบที่ 1 และ 3 พร้อมกัน: กำไรดี (NI/OPM ผ่านเกือบทั้งจังหวัด) แต่สภาพคล่องต่ำและ APP สูง — แปลว่าโจทย์ของจังหวัดคือ **เปลี่ยนกำไรเป็นเงินสดแล้วคืนหนี้ยา** ซึ่งงานประกัน (ACP) เป็นจุดเริ่ม\n\n### 4.6 กับดักที่พบบ่อย\n\n- **สูตรต่างแหล่งให้ค่าต่างกัน** — คู่มือ M1 คิด QR โดยหักแค่สินค้าคงคลัง และ Cash Ratio ไม่รวมเงินฝากประจำ ส่วน S1 (KPI template) หักสินทรัพย์หมุนเวียนอื่นด้วยและรวมเงินฝากประจำ — ก่อนเทียบตัวเลข 2 ชุดให้ถามว่าใช้สูตรไหน (แอปนี้ใช้สูตร S1)\n- **เทียบงวดที่มีจำนวนวันต่างกัน** — ACP/APP/IM ต้องใช้จำนวนวันให้ตรงกับงวดของรายได้/ต้นทุน (ไตรมาส 3 สะสม = 273 วัน ไม่ใช่ 365)\n- **ตัวเลขปลายงวดเป็นภาพนิ่ง** — จ่ายเจ้าหนี้ก้อนใหญ่หลังวันปิดงวด 1 วัน CR/Cash ก็ดูดีขึ้น ต้องดู Trend หลายงวดประกอบ\n- **CR สูงไม่ได้แปลว่าดีเสมอ** — จ.อุดรธานีมี รพ. ที่ CR 10.06 (สไลด์ กวป. ก.ค. 69 หน้า 8) ต้องถามต่อว่ามีแผนใช้เงินหรือหนี้บันทึกครบไหม\n- **ตัวหารเล็กหรือติดลบ** — Ratio จะกระโดดผิดธรรมชาติ (เช่น ROA ของ รพ. ที่สินทรัพย์รวมต่ำมาก) ให้ดูตัวเลขบาทคู่กันเสมอ\n- **Benchmark ข้ามระดับ** — รพ.ศูนย์ (A) กับ รพ.ชุมชน (F) มีโครงสร้างต้นทุนต่างกัน ห้ามเทียบตรง\n\n### 4.7 แบบฝึก\n\n- [ ] คำนวณ CR, QR, Cash, NWC, NI จากงบ รพ. 1 แห่ง แล้วเทียบเกณฑ์ในตาราง 4.1\n- [ ] คำนวณ ACP-UC ของ รพ. เดียวกัน และเขียน 1 ประโยคว่าถ้าลดลง 10 วัน เงินสดจะเพิ่มประมาณเท่าไร (ลูกหนี้ UC ÷ จำนวนวัน × 10)\n- [ ] คำนวณ Risk Score จากงบสมมติ: เงินสดและรายการเทียบเท่า 2,000,000 · เงินฝากประจำ 1,000,000 · ลูกหนี้ 7,000,000 · ยาคงคลัง 2,500,000 · สินทรัพย์หมุนเวียนอื่น 500,000 · หนี้สินหมุนเวียน 10,000,000 · NI 9 เดือน (600,000) — แล้วตรวจคำตอบกับเมนู \"Ratio + Risk Score\" (ตัวเลขสมมติ)\n- [ ] วินิจฉัย 3 รพ. สมมติ: ก) CR 1.6 · Cash 0.4 · ACP-UC 95 วัน — ข) NI +8 ล้าน · APP 380 วัน · Cash 0.5 — ค) NI (3 ล้าน) · EBITDA +4 ล้าน · NWC +20 ล้าน (ตัวเลขสมมติ)\n- [ ] เปิดเมนู \"กรณีศึกษา 21 รพ.\" หา รพ. ที่ NI บวกแต่ NWC ติดลบ มีกี่แห่ง และแต่ละแห่ง APP เท่าไร\n\n::: ดูเฉลย: Risk Score จากงบสมมติ\n\nสินทรัพย์หมุนเวียนรวม = 2,000,000 + 1,000,000 + 7,000,000 + 2,500,000 + 500,000 = 13,000,000\n\n| ตัวชี้วัด | คำนวณ | ค่า | คะแนน |\n| --- | --- | --- | --- |\n| CR | 13,000,000 ÷ 10,000,000 | 1.30 | 1 |\n| QR | (13,000,000 − 2,500,000 − 500,000) ÷ 10,000,000 | 1.00 | 0 (ไม่ต่ำกว่า 1.0) |\n| Cash | (2,000,000 + 1,000,000) ÷ 10,000,000 | 0.30 | 1 |\n| NWC | 13,000,000 − 10,000,000 | 3,000,000 | 0 |\n| NI | | (600,000) | 1 |\n| Survival | NWC บวก NI ลบ: 3,000,000 ÷ (600,000 ÷ 9) = 45 เดือน | > 6 เดือน | 0 |\n| **รวม** | | | **3** |\n\nข้อสังเกต: ถ้าใช้สูตร Cash Ratio แบบ M1 (ไม่รวมเงินฝากประจำ) จะได้ 0.20 — คะแนนเท่าเดิม แต่ตัวเลขที่รายงานต่างกัน\n\n:::\n\n::: ดูเฉลย: วินิจฉัย 3 รพ.\n\n- **ก)** CR ผ่านแต่ Cash ไม่ผ่าน + ACP-UC 95 วัน → เงินจมในลูกหนี้ UC · มาตรการแรก: ไล่ติด C/Deny และชาร์ตค้างสรุป (บทที่ 3)\n- **ข)** กำไรดีแต่ APP 380 วันและ Cash ต่ำ → ใช้เจ้าหนี้ยาเป็นแหล่งทุน · ตรวจว่ารายได้ที่ทำให้กำไรเป็นเงินจริงหรือยังเป็นลูกหนี้ และทำแผนชำระหนี้ยา\n- **ค)** ขาดทุนจากค่าเสื่อม แต่ EBITDA และ NWC บวก → ยังไม่วิกฤต (Survival ยาว) · ประเด็นคือแผนทดแทนครุภัณฑ์ระยะยาว ไม่ต้องรีบมาตรการระยะสั้น\n\n:::\n\n::: ดูเฉลย: กรณีศึกษา NI บวกแต่ NWC ติดลบ\n\n- มี **3 แห่ง**: รพ.04, รพ.05, รพ.19 — ทั้งหมด NI บวก (สไลด์ กวป. ก.ค. 69 หน้า 8)\n- ดู APP ในหน้ารายละเอียดของแต่ละแห่ง แล้วตอบว่ากำไรปีนี้พอปิดหนี้เก่าหรือไม่ — ถ้า NWC ติดลบน้อยกว่ากำไร 9 เดือน แปลว่าถ้ากำไรเป็นเงินสดได้จริง NWC จะกลับเป็นบวก\n\n:::\n\n### 4.8 สรุปบท — 3 ข้อที่ต้องจำ\n\n1. อ่าน Ratio จากเงินจริงก่อน: **Cash → NWC → NI → CR/QR** — CR → QR → Cash คือการลอกเปลือกทีละชั้น ถ้าชั้นนอกผ่านแต่ชั้นในไม่ผ่าน เงินจมอยู่ในลูกหนี้หรือยา\n2. ACP, IM, APP คือวงจรเดียวกัน: **ลด ACP ได้เงินคืน ลด APP ต้องใช้เงิน** — งานประกันจึงเป็นจุดเริ่มของการแก้สภาพคล่อง\n3. Ratio ตัวเดียวคืออาการ **อ่านเป็นคู่จึงเห็นสาเหตุ** และต้องรู้เสมอว่าใช้สูตรแหล่งไหน งวดกี่วัน เทียบกับกลุ่มไหน\n\n### แผนผังความคิด (Mind map)\n\nจำภาพนี้ให้ได้ก่อนไปบทถัดไป — ลองปิดจอแล้ววาดเองบนกระดาษ\n\n```mindmap\nRatio 4 กลุ่ม\n- สภาพคล่อง (ลอกเปลือก)\n  - CR < 1.5 เสี่ยง\n  - QR < 1.0 เสี่ยง\n  - Cash < 0.8 เสี่ยง\n  - CR ผ่าน Cash ไม่ผ่าน = เงินจม\n- ความมั่นคง\n  - NWC < 0 เสี่ยง\n  - NI < 0 เสี่ยง (รวมค่าเสื่อม)\n- ประสิทธิภาพ = วงจรเดียว\n  - IM + ACP − APP\n  - ลด ACP ได้เงินคืน\n  - ลด APP ต้องใช้เงิน\n  - อุดร: APP ผ่าน 3/21\n- ทำกำไร\n  - EBITDA บวก ≠ เงินพอ\n  - OPM / ROA เทียบค่ากลางกลุ่ม\n- วิธีวิเคราะห์\n  - Trend: หลายงวด\n  - Common-size: % ของรายได้\n  - Benchmark: ระดับเดียวกัน\n- อ่านเป็นคู่\n  - NI บวก NWC ลบ = หนี้เก่า\n  - NI บวก APP สูง = ยืมผู้ขาย\n  - NI ลบ EBITDA บวก = ค่าเสื่อม\n- กับดัก\n  - สูตร S1 ≠ M1\n  - จำนวนวันในงวด\n  - ภาพนิ่งปลายงวด\n```\n\n## บทที่ 5 Risk Score วิกฤตการเงิน และ Planfin\n\nRisk Score คือ \"เครื่องวัดไข้\" ทางการเงินที่ สป.สธ. ใช้กับ รพ. ทุกแห่งทุกไตรมาส ส่วน Planfin คือ \"แผนการรักษา\" ที่ รพ. ทำล่วงหน้าแล้วจังหวัดกำกับ\n\nเป้าหมายของบทนี้: จบบทแล้วคิด Risk Score ด้วยมือได้ครบ 3 มิติ (รวม Survival ทั้ง 4 กรณี) รู้ว่าแต่ละระดับต้องทำอะไร อ่าน Risk Score คู่กับ 7 Plus / TPS / เงินบำรุงหลังหักหนี้ / Planfin ได้ และหา รพ. ที่ \"ไข้ไม่ขึ้นแต่ป่วย\" ได้ ใช้เวลาประมาณ 3–4 ชั่วโมง\n\nตัวอย่างคำนวณเป็น **ตัวเลขสมมติ** ตัวเลขจริง จ.อุดรธานีมาจากสไลด์ กวป. ก.ค. 69 (ข้อมูล ณ มิ.ย. 69 = 9 เดือน, รหัส รพ. สุ่ม) — เกณฑ์ทุกตัว **ตรวจกับหนังสือสั่งการปีงบปัจจุบันก่อนใช้งานจริง**\n\n### 5.1 Risk Score 7 ระดับ — วิธีคิด\n\nคะแนนมาจาก 3 กลุ่ม (ตามนิยามตัวชี้วัด สป.สธ., [KPI template ปีงบ 67](https://uthaihealth.moph.go.th/uthkpi67/document/140.pdf)):\n\n| กลุ่ม | ตัวแปร | เงื่อนไขได้คะแนน |\n| --- | --- | --- |\n| ความคล่องตามสภาพสินทรัพย์ (Liquid Index) | CR, QR, Cash | CR < 1.5 / QR < 1.0 / Cash < 0.8 |\n| ความมั่นคงทางการเงิน (Status Index) | NWC, NI (รวมค่าเสื่อม) | NWC < 0 / NI < 0 |\n| ระยะเวลาเข้าสู่ปัญหารุนแรง (Survival Index) | NWC ÷ ขาดทุนเฉลี่ยต่อเดือน | ทุนหมุนเวียนหมดใน < 3 เดือน (น้ำหนัก 2 เท่า) หรือ < 6 เดือน |\n\nคะแนนรวม 0–7 = ระดับ Risk Score โดยตรง (Liquid 0–3 + Status 0–2 + Survival 0–2)\n\n**Survival Index — 4 กรณีที่ต้องแยกให้ออก** (ตามคู่มือ M1 บทที่ 5.2 และ S1; เครื่องคำนวณในแอปใช้กติกานี้ ทดสอบกับข้อมูลจริง 21 รพ. ได้ตรงทุกแห่ง)\n\n| กรณี | คำถามที่ Survival ถาม | วิธีนับ | คะแนน |\n| --- | --- | --- | --- |\n| NWC บวก · NI บวก | — | — | 0 |\n| NWC บวก · NI ติดลบ | ทุนที่มีจะหมดในกี่เดือน | NWC ÷ ขาดทุนต่อเดือน | > 6 = 0 · 3–6 = 1 · ≤ 3 = 2 |\n| NWC ติดลบ · NI บวก | ต้องใช้กี่เดือนจึงฟื้น | NWC ติดลบ ÷ กำไรต่อเดือน | ≤ 3 = 0 · 3–6 = 1 · > 6 = 2 |\n| NWC ติดลบ · NI ติดลบ | — | — | 2 |\n\n\"ต่อเดือน\" = NI ÷ จำนวนเดือนในงวด (ไตรมาส 3 สะสม = 9 เดือน) — ใส่จำนวนเดือนผิด คะแนน Survival เปลี่ยนได้ทันที\n\nตัวอย่าง (ตัวเลขสมมติ, งวด 9 เดือน):\n\n| รพ. | NWC | NI 9 เดือน | ต่อเดือน | เดือน | คะแนน |\n| --- | --- | --- | --- | --- | --- |\n| ก | 6,000,000 | (1,800,000) | ขาดทุน 200,000 | ทุนหมดใน 30 | 0 |\n| ข | 900,000 | (2,700,000) | ขาดทุน 300,000 | ทุนหมดใน 3 | 2 |\n| ค | (1,500,000) | 4,500,000 | กำไร 500,000 | ฟื้นใน 3 | 0 |\n| ง | (6,000,000) | 2,700,000 | กำไร 300,000 | ฟื้นใน 20 | 2 |\n\nตัวอย่างเต็ม (ตัวเลขสมมติ, งวด 9 เดือน): CR 1.20 · QR 0.90 · Cash 0.30 · NWC (2,000,000) · NI +1,800,000\n\n::: ลองคิด Risk Score เองก่อน แล้วกดดูเฉลย\n\n| มิติ | ตัวแปร | คะแนน |\n| --- | --- | --- |\n| Liquid | CR 1.20 < 1.5 · QR 0.90 < 1.0 · Cash 0.30 < 0.8 | 3 |\n| Status | NWC ติดลบ = 1 · NI บวก = 0 | 1 |\n| Survival | NWC ติดลบ NI บวก: 2,000,000 ÷ (1,800,000 ÷ 9 = 200,000) = 10 เดือน > 6 | 2 |\n| **รวม** | | **6** |\n\nระดับ 6 = \"คาดว่าจะประสบปัญหาภายใน 3 เดือน\" ทั้งที่ **มีกำไร** — เพราะกำไรเดือนละ 200,000 ต้องใช้ 10 เดือนจึงปิด NWC ที่ติดลบได้ ถ้าเพิ่มกำไรเป็นเดือนละ 700,000 (เช่น เร่งเคลมให้รายได้เข้าเร็วขึ้น) จะฟื้นใน 2.9 เดือน → Survival 0 → ระดับ 4\n\nตรวจคำตอบด้วยเมนู \"Ratio + Risk Score\" (เลือกงวด Q3 = 9 เดือน)\n\n:::\n\n### 5.2 ความหมายของแต่ละระดับ\n\n| ระดับ | ความหมาย |\n| --- | --- |\n| 0–1 | ปกติ |\n| 2 | คาดว่าจะดีขึ้นภายใน 3 เดือน |\n| 3 | คาดว่าจะดีขึ้นภายหลัง 3 เดือน |\n| 4 | คาดว่าจะประสบปัญหาภายหลัง 6 เดือน |\n| 5 | คาดว่าจะประสบปัญหาภายใน 6 เดือน |\n| 6 | คาดว่าจะประสบปัญหาภายใน 3 เดือน |\n| 7 | วิกฤตการเงินขั้นรุนแรง |\n\nเป้าหมายระดับประเทศ ปีงบ 67–71: รพ. ระดับ 7 ไม่เกินร้อยละ 2 และระดับ 6 ไม่เกินร้อยละ 4 (ประเมินสิ้นไตรมาส) — ที่มาเดียวกับข้างบน\n\nการบริหารตามระดับ (คู่มือ M1 บทที่ 5.2 — เอกสารเรียบเรียงภายใน):\n\n| คะแนน | สถานะ | ใครทำอะไร |\n| --- | --- | --- |\n| 0 | ปกติ | ติดตามตามปกติ |\n| 1–2 | เฝ้าระวัง | รพ. บริหารจัดการได้เอง |\n| 3–4 | เริ่มมีปัญหา | จัดทำแผนปรับปรุงและรายงานความคืบหน้า |\n| 5–6 | มีปัญหา | CFO ระดับจังหวัดและเขตเข้าแทรกแซง |\n| 7 | วิกฤติ | ทำแผนฟื้นฟูการเงินและขอเงินเกลี่ยระดับเขต |\n\nธงแดงที่ไม่ต้องรอ Risk Score ถึง 7 (M1):\n\n- ทุนสำรองคงเหลือ (NWC ÷ ค่าใช้จ่ายดำเนินการเฉลี่ยต่อเดือน) น้อยกว่า 3 เดือน\n- คะแนนเพิ่ม 2 ระดับภายใน 2 ไตรมาส → ลงตรวจสอบทันที\n\nระดับบอก \"ความรุนแรง\" แต่ **ทิศทาง** สำคัญกว่า — รพ. ระดับ 3 ที่ขึ้นจาก 1 ใน 2 ไตรมาส น่าห่วงกว่า รพ. ระดับ 4 ที่ลดจาก 6\n\n### 5.3 เครื่องมือรุ่นใหม่ที่ต้องรู้ต่อ: 7 Plus Efficiency และ TPS\n\n- ปีงบ 2568 รายงานของ สป.สธ. ใช้ \"Risk Scoring Plus\" ที่เพิ่มตัวชี้วัดประสิทธิภาพ ได้แก่ OPM, ROA, APP-Drug, ACP-UC, ACP-CSMBS, ACP-SSS, IM และให้เกรด (เช่น 0A-, 1B-, 1D) พร้อมผลผ่าน/ไม่ผ่าน ([ข้อมูล Q4/2568](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20251113043601.pdf))\n- TPS (Total Performance Score) คิดคะแนนเต็ม 15 — ตัวอย่างการใช้ใน จ.สกลนคร กำหนดผ่านที่ 10.5 คะแนน และเป้าหมายจังหวัดร้อยละ 55 ของ รพ.; ส่วน 7 Plus Efficiency ตั้งเป้า รพ. ผ่านระดับ 5 ขึ้นไปร้อยละ 65 ([สกลนคร ธ.ค. 68](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20260123092014.pdf))\n- บทเรียนจากสกลนคร: รพ. ที่ Risk Score ต่ำอาจซ่อนปัญหาได้ เช่น Risk ระดับ 1 แต่เงินบำรุงหลังหักหนี้ติดลบหลายสิบล้าน — จึงต้องอ่าน Risk Score คู่กับ Efficiency และเงินบำรุงคงเหลือเสมอ\n- ข้อที่ต้องถามหัวหน้ากลุ่มงานวันแรก: เกณฑ์ 7 Plus / TPS ปีงบ 2570 ที่ จ.อุดรธานีใช้ เป็นฉบับไหน\n\nRisk Score กับ 7 Plus ตอบคำถามต่างกัน:\n\n| เครื่องมือ | ตอบคำถาม | เปรียบทางคลินิก |\n| --- | --- | --- |\n| Risk Score | ตอนนี้เงินพอไหม จะหมดเมื่อไร | Vital signs |\n| 7 Plus Efficiency | บริหารวงจรเงินดีไหม (เก็บหนี้ จ่ายหนี้ คลังยา กำไร) | Lab ที่บอกสาเหตุ |\n| TPS | ผลงานรวมด้านการเงินการคลังตามเกณฑ์ที่กำหนด | Score ประเมินรวม |\n\nภาพจริง จ.อุดรธานี (สไลด์ กวป. ก.ค. 69): 7 Plus ผ่าน 14 แห่ง = 66.67% (เป้า 65%, หน้า 28) · TPS Q2Y69 ได้ 10.5 ขึ้นไป 15 จาก 21 แห่ง (เกณฑ์ผ่านเกรด B ≥ 10.5, เป้า 55%, หน้า 29–33) — เกณฑ์ TPS ของจังหวัดในสไลด์ระบุเป็นเกรด ตัวเลข 10.5 มาจากเอกสารสกลนคร\n\n### 5.4 Planfin (แผนทางการเงิน)\n\n- Planfin = แผนประมาณการรายได้-ค่าใช้จ่าย + แผนลงทุน ของ รพ. ทำต้นปีงบ ผ่าน CFO จังหวัด แล้วส่งเขต\n- ปีงบ 2568 จ.อุดรธานี: รพ. ทุกแห่งทำแผนเกินดุล ผลวิเคราะห์แผนเป็นแบบ 1 จำนวน 3 แห่ง, แบบ 2 จำนวน 14 แห่ง, แบบ 3 จำนวน 4 แห่ง และทำครบทั้ง 7 แผน; EBITDA ตามแผนรวม 323,977,020 บาท ([สสจ.อุดรธานี, 11 พ.ย. 2567](https://r8.moph.go.th/r8wayNewadmin/page/upload_file/20241109054225.pdf))\n- การติดตามผล: เทียบผลจริงกับแผนรายไตรมาส — ตัวอย่าง จ.กาฬสินธุ์ใช้เกณฑ์รายได้/ค่าใช้จ่ายต่างจากแผนได้ไม่เกินร้อยละ 5 ([กาฬสินธุ์ Q4/2567](https://ksn.moph.go.th/wp-content/uploads/2024/09/5.13.1-CFO-ประกัน.pdf))\n- คำถามที่งานประกันต้องถามทุกครั้งที่ดู Planfin: \"รายได้ UC/SSS/CSMBS ในแผน ตั้งบนผลงาน AdjRW และอัตราจ่ายปีไหน — สมจริงไหม\"\n\nวิธีเทียบที่ จ.อุดรธานีใช้ปีงบ 69 (สไลด์ กวป. ก.ค. 69 หน้า 11–12):\n\n```latex\nค่าตามแผน ณ งวด = แผนทั้งปี ÷ 12 × จำนวนเดือน\n% ต่างจากแผน = (ผลจริง − ค่าตามแผน ณ งวด) ÷ ค่าตามแผน ณ งวด × 100\nผ่าน = ต่างไม่เกิน ±5% · ภาพรวมผ่านถ้ารายได้หรือค่าใช้จ่ายผ่านอย่างน้อย 1 ช่อง · เป้า รพ. ผ่านร้อยละ 70\n```\n\nสังเกต **±5%** — รายได้ **สูงกว่า** แผนเกิน 5% ก็ไม่ผ่าน เพราะเกณฑ์วัด \"ความแม่นของแผน\" ไม่ใช่ \"ผลงานดี\"\n\nตัวอย่าง (ตัวเลขสมมติ, ไตรมาส 3 = 9 เดือน): แผนรายได้ทั้งปี 120,000,000 · แผนค่าใช้จ่ายทั้งปี 114,000,000 · ผลจริงรายได้ 84,000,000 · ค่าใช้จ่าย 86,000,000\n\n::: ลองคำนวณเอง แล้วกดดูเฉลย\n\n- รายได้ตามแผน ณ งวด = 120,000,000 ÷ 12 × 9 = 90,000,000 → ต่าง (84 − 90) ÷ 90 = **−6.7%** ไม่ผ่าน\n- ค่าใช้จ่ายตามแผน ณ งวด = 114,000,000 ÷ 12 × 9 = 85,500,000 → ต่าง (86 − 85.5) ÷ 85.5 = **+0.6%** ผ่าน\n- ภาพรวม **ผ่าน** (ผ่าน 1 ช่อง) — แต่ผลจริงขาดทุน 2,000,000 ขณะที่แผนตั้งไว้เกินดุล\n\nคำถามของงานประกัน: รายได้ขาด 6 ล้านมาจากไหน — สมมติแผนตั้ง UC IP ไว้ 3,000 AdjRW ต่อปี × อัตราสมมติ 10,000 บาท ณ 9 เดือนควรได้ 2,250 AdjRW แต่ได้จริง 2,000 → ขาด 250 × 10,000 = **2,500,000** อธิบายได้ราวครึ่งหนึ่ง ส่วนที่เหลือต้องไล่ต่อที่ OP และสิทธิอื่น — ผลงาน AdjRW ต่ำกว่าแผนอาจมาจากจำนวนผู้ป่วยหรือ Under-coding ต้องแยกให้ออกด้วย CMI\n\n:::\n\nภาพจริง จ.อุดรธานี ณ มิ.ย. 69 (หน้า 11–12): Planfin ผ่านภาพรวม 19 จาก 21 แห่ง (เป้า 70%) — ด้านค่าใช้จ่ายผ่าน 18 แห่ง แต่ด้านรายได้ผ่านเพียง 10 แห่ง และทั้ง 11 แห่งที่ไม่ผ่านเป็นเพราะรายได้จริง **สูงกว่า** แผนเกิน 5% (สูงสุด +17.6%) ไม่มีแห่งไหนต่ำกว่าแผนเกิน 5% → แผนรายได้ของหลายแห่งตั้งไว้ต่ำกว่าความจริง ควรถามว่าตั้งบนสมมติฐานอะไร\n\n### 5.5 Risk Score 3 เกณฑ์ที่ จ.อุดรธานีรายงานคู่กัน\n\nสไลด์ กวป. ก.ค. 69 (หน้า 6–8) รายงาน Risk Score 3 แบบคู่กัน:\n\n| เกณฑ์ | ฐานคิด | รพ. ระดับ 6–7 ณ มิ.ย. 69 |\n| --- | --- | --- |\n| กระทรวง (NI) | นิยาม สป.สธ. ตาม 5.1 | 0 แห่ง |\n| เขต 8 (NI) | ปรับงบก่อนคิด (สไลด์ระบุ \"ตัดลูกหนี้\") ทำให้ CR/QR/Cash/NWC ต่ำกว่า | 6 แห่ง |\n| เขต 8 (EBITDA) | เหมือนเขต 8 แต่ใช้ EBITDA แทน NI | 7 แห่ง |\n\nรวมไม่ซ้ำ รพ. ที่ระดับ 6–7 ในเกณฑ์เขต 8 แบบใดแบบหนึ่ง = 8 แห่ง\n\nตัวอย่างจริง: รพ.01 เกณฑ์กระทรวงได้ระดับ 3 (CR 1.07 · NWC +5.3 ล้าน · NI +12.5 ล้าน) แต่เกณฑ์เขต 8 (NI) ได้ระดับ 7 (CR 0.91 · NWC −7.4 ล้าน · NI −4.0 ล้าน) — งบเดียวกัน ต่างกัน 4 ระดับ เพราะเกณฑ์เขตปรับลูกหนี้ออกก่อน แปลว่า **สภาพคล่องของ รพ. นี้พึ่งลูกหนี้ที่ยังไม่เป็นเงิน**\n\n- แอปนี้ใช้เกณฑ์กระทรวง (NI) ในเครื่องคำนวณ\n- นิยามการปรับงบของเกณฑ์เขต 8 ไม่ได้ระบุในสไลด์ — **ถามหัวหน้ากลุ่มงาน** ก่อนอธิบายให้ รพ. ฟัง\n- ในหนังสือราชการหรือที่ประชุม ต้องระบุทุกครั้งว่าใช้ Risk Score เกณฑ์ไหน\n\n### 5.6 คัดกรอง 21 รพ. — \"ไข้ไม่ขึ้นแต่ป่วย\"\n\nใช้ตาราง 2 × 2: Risk Score (เกณฑ์กระทรวง) × เงินบำรุงคงเหลือหลังหักหนี้ — ข้อมูลจริง จ.อุดรธานี ณ มิ.ย. 69 (หน้า 6–8):\n\n| | เงินบำรุงหลังหักหนี้ ≥ 0 | เงินบำรุงหลังหักหนี้ ติดลบ |\n| --- | --- | --- |\n| **Risk 0–2** | 5 แห่ง — ปกติจริง | **8 แห่ง — ไข้ไม่ขึ้นแต่ป่วย** |\n| **Risk 3 ขึ้นไป** | 0 แห่ง | 8 แห่ง — ป่วยชัด |\n\n- ช่อง \"ไข้ไม่ขึ้นแต่ป่วย\" คือกลุ่มที่ระบบเตือนภัยปกติจะมองข้าม — เช่น รพ.10 Risk 2 แต่เงินบำรุงหลังหักหนี้ติดลบ 40.9 ล้าน\n- ลำดับความสนใจ: ป่วยชัด (แทรกแซงตามระดับ) → ไข้ไม่ขึ้นแต่ป่วย (ดู APP และ ACP ว่าหนี้มาจากไหน) → ปกติจริง (ติดตามตามรอบ)\n- เพิ่มมิติที่ 3–4 ได้: 7 Plus ไม่ผ่าน และ Planfin รายได้ต่ำกว่าแผน — รพ. ที่ติดหลายมิติพร้อมกันคือเป้าหมายลงพื้นที่ทำ RCA\n\n### 5.7 กับดักที่พบบ่อย\n\n- **ใส่จำนวนเดือนผิด** — ไตรมาส 3 สะสมต้องหาร 9 ไม่ใช่ 3 หรือ 12 Survival เปลี่ยนได้ 2 คะแนน\n- **อ่าน Risk 0–2 ว่าปลอดภัย** — ดู 5.6: รพ. Risk 0–2 ใน จ.อุดรธานี 8 จาก 13 แห่งมีเงินบำรุงหลังหักหนี้ติดลบ\n- **ปนเกณฑ์** — Risk Score เกณฑ์กระทรวงกับเกณฑ์เขต 8 ห่างกันได้หลายระดับ ต้องระบุเกณฑ์เสมอ\n- **Planfin ผ่าน = ดี** — ผ่านภาพรวมได้ด้วยค่าใช้จ่ายช่องเดียว ทั้งที่รายได้ขาดและผลจริงขาดทุน\n- **ไล่แก้คะแนน ไม่ใช่แก้เหตุ** — เลื่อนจ่ายเจ้าหนี้ก่อนปิดงวดทำให้ Cash ดีขึ้นชั่วคราว แต่ APP แย่ลงและหนี้ไม่ได้หาย\n- **ดูไตรมาสเดียว** — ต้องดูทิศทาง (ธงแดง: ขึ้น 2 ระดับใน 2 ไตรมาส)\n\n### 5.8 แบบฝึก\n\n- [ ] ขอ Risk Score + 7 Plus ไตรมาสล่าสุดของ รพ. 21 แห่ง จ.อุดรธานี แล้วจัดกลุ่ม: ปกติ / เฝ้าระวัง / วิกฤต\n- [ ] เลือก 1 รพ. ที่ Risk Score ต่ำแต่ Efficiency ไม่ผ่าน แล้วเขียนว่าความเสี่ยงที่ซ่อนอยู่คืออะไร\n- [ ] เทียบ Planfin ปีงบ 2569 กับผลจริงของ รพ. 1 แห่ง: บรรทัดไหนต่างจากแผนเกินร้อยละ 5\n- [ ] คิด Survival 3 ข้อ (ตัวเลขสมมติ, งวด 9 เดือน): ก) NWC 2,000,000 · NI (4,500,000) — ข) NWC (3,600,000) · NI 9,000,000 — ค) NWC (500,000) · NI (900,000)\n- [ ] เปิดเมนู \"กรณีศึกษา 21 รพ.\" เลือก 1 รพ. ในช่อง \"ไข้ไม่ขึ้นแต่ป่วย\" ของ 5.6 แล้วเขียน 3 บรรทัด: ป่วยตรงไหน เพราะอะไร ต้องแก้อะไร\n\n::: ดูเฉลย: Survival 3 ข้อ\n\n- **ก)** NWC บวก NI ลบ: ขาดทุนต่อเดือน 500,000 → ทุนหมดใน 2,000,000 ÷ 500,000 = 4 เดือน → **1 คะแนน**\n- **ข)** NWC ลบ NI บวก: กำไรต่อเดือน 1,000,000 → ฟื้นใน 3,600,000 ÷ 1,000,000 = 3.6 เดือน → **1 คะแนน**\n- **ค)** NWC และ NI ติดลบทั้งคู่ → **2 คะแนน** (ไม่ต้องคำนวณเดือน)\n\n:::\n\n::: ดูแนวคำตอบ: ไข้ไม่ขึ้นแต่ป่วย\n\nตัวอย่างกรอบคำตอบสำหรับ รพ. ที่ Risk ต่ำแต่เงินบำรุงหลังหักหนี้ติดลบ (ใช้ตัวเลขของ รพ. ที่เลือกเติมเอง):\n\n1. **ป่วยตรงไหน:** เงินบำรุงหลังหักหนี้ติดลบ ___ ล้าน แม้ Risk ระดับ ___ และ NI บวก\n2. **เพราะอะไร:** APP ___ วัน (หนี้ยาค้าง) และ/หรือ ACP-UC ___ วัน (เงินจมในลูกหนี้) — ดูว่าตัวไหนไม่ผ่าน\n3. **ต้องแก้อะไร:** เร่งเก็บลูกหนี้ก่อน (ACP) แล้วทำแผนชำระหนี้ยา ตั้งเป้าเป็นตัวเลข + วันที่ (บทที่ 7)\n\n:::\n\n### 5.9 สรุปบท — 3 ข้อที่ต้องจำ\n\n1. Risk Score = Liquid 3 + Status 2 + Survival 2 — Survival มี 4 กรณี และ **ต้องหารด้วยจำนวนเดือนให้ถูกงวด**\n2. Risk Score ต่ำ **ไม่ได้แปลว่าปลอดภัย** — อ่านคู่กับเงินบำรุงหลังหักหนี้ 7 Plus และ Planfin เสมอ และระบุทุกครั้งว่าใช้เกณฑ์กระทรวงหรือเขต 8\n3. Planfin วัดความแม่นของแผน (±5% ทั้งสองทาง) — งานประกันต้องถามว่ารายได้ในแผนตั้งบน AdjRW และอัตราจ่ายปีไหน\n\n### แผนผังความคิด (Mind map)\n\nจำภาพนี้ให้ได้ก่อนไปบทถัดไป — ลองปิดจอแล้ววาดเองบนกระดาษ\n\n```mindmap\nRisk Score + Planfin\n- 3 มิติ 7 คะแนน\n  - Liquid 0–3: CR QR Cash\n  - Status 0–2: NWC NI\n  - Survival 0–2: 4 กรณี\n  - หารจำนวนเดือนให้ถูกงวด\n- ระดับ → ใครทำอะไร\n  - 1–2 รพ. จัดการเอง\n  - 3–4 ทำแผนปรับปรุง\n  - 5–6 CFO จังหวัด/เขตแทรกแซง\n  - 7 แผนฟื้นฟู + เงินเกลี่ย\n- ธงแดง\n  - ทุนสำรอง < 3 เดือน\n  - ขึ้น 2 ระดับใน 2 ไตรมาส\n- 3 เกณฑ์ จ.อุดร\n  - กระทรวง (NI)\n  - เขต 8 (NI) ตัดลูกหนี้\n  - เขต 8 (EBITDA)\n  - ระบุเกณฑ์ทุกครั้ง\n- ไข้ไม่ขึ้นแต่ป่วย\n  - Risk 0–2 แต่เงินบำรุงติดลบ\n  - อุดร มิ.ย. 69: 8 แห่ง\n  - ดู APP + ACP ต่อ\n- 7 Plus + TPS\n  - Risk = Vital signs\n  - 7 Plus = Lab หาสาเหตุ\n  - TPS ผ่าน B (10.5/15)\n- Planfin\n  - แผนปี ÷ 12 × เดือน\n  - ±5% ทั้งสองทาง\n  - รายได้ตั้งบน AdjRW ปีไหน\n```\n\n## บทที่ 6 เชื่อมงานเคลมกับงบการเงิน\n\nทุกปัญหาเคลมมีปลายทางเป็นบรรทัดใดบรรทัดหนึ่งในงบการเงิน — ถ้าบอกได้ว่าลงบรรทัดไหน ก็ตั้งเป้าแก้และวัดผลเป็นเงินได้\n\nเป้าหมายของบทนี้: จบบทแล้วแปลปัญหาเคลมทุกแบบเป็น \"บรรทัดในงบ + จำนวนเงิน\" ได้ ประมาณรายได้ที่หายจาก Under-coding จากผล MR Audit ได้ เทียบปัญหาเคลมข้าม รพ. อย่างเป็นธรรม และจัดลำดับว่าจะไล่แก้อะไรก่อน ใช้เวลาประมาณ 3–4 ชั่วโมง\n\nตัวอย่างคำนวณเป็น **ตัวเลขสมมติ** รวมถึงอัตราจ่ายต่อ AdjRW 10,000 บาท (ไม่ใช่อัตราจริง — อัตราจริงดู \"คู่มือประกันสุขภาพ\" บทที่ 3.3 และประกาศกองทุนปีงบนั้น) ตัวเลขจริง จ.อุดรธานีมาจากสไลด์ กวป. ก.ค. 69 (รหัส รพ. สุ่ม) ไม่มีข้อมูลผู้ป่วยรายบุคคลในบทนี้\n\n### 6.1 แผนที่: ปัญหาเคลม → งบการเงิน → ตัวชี้วัด\n\n| ปัญหาในงานประกัน | กระทบบรรทัดในงบ | ตัวชี้วัดที่ขยับ | ผลต่อ Risk/Efficiency |\n| --- | --- | --- | --- |\n| สรุปชาร์ต/ส่งเคลมล่าช้า | ลูกหนี้ UC/CSMBS ค้างสูง, เงินสดต่ำ | ACP เพิ่ม, Cash Ratio ลด | Cash < 0.8, ACP-UC ไม่ผ่าน |\n| ให้รหัสโรคไม่ครบ (Under-coding) | รายได้ IP ต่ำกว่าที่ควร | AdjRW / CMI ต่ำ | NI ลด, OPM ลด |\n| เคลมติด C / Deny ไม่แก้ในเวลา | ลูกหนี้ค้างแล้วกลายเป็นหนี้สูญ | ลูกหนี้ปีเก่าสูง | NI ลด (ตั้งค่าเผื่อ/ตัดหนี้) |\n| Post audit / MR Audit ถูกเรียกเงินคืน | รายได้ถูกปรับลดย้อนหลัง | รายได้จริงต่ำกว่า Planfin | NI ลด, Planfin คลาดเคลื่อน |\n| ตั้งลูกหนี้ตามราคาเรียกเก็บ ไม่ใช่อัตราจ่ายจริง | รายได้/ลูกหนี้สูงเกินจริง | NI ดูดี แต่ ACP สูง | Risk Score ต่ำหลอกตา |\n| Over-coding | รายได้เพิ่มชั่วคราว แล้วถูกเรียกคืน | — | ความเสี่ยงทางกฎหมาย/วินัย |\n\nแยกปัญหาเป็น 2 ชนิดตามสิ่งที่เสีย (ต่อยอดจากบทที่ 3.2):\n\n| ชนิด | ปัญหา | เสียอะไร | เห็นในงบไหม |\n| --- | --- | --- | --- |\n| **เงินมาช้า** | ส่งช้า, ติด C ที่ยังแก้ได้, รอจ่าย | เงินสด (เวลา) | เห็น — ลูกหนี้ค้าง, ACP สูง |\n| **เงินหายถาวร** | Under-coding, Deny เป็นที่สิ้นสุด, หมดเวลาแก้/อุทธรณ์, ถูกเรียกคืน | รายได้และ NI | Deny/เรียกคืนเห็นเป็นปรับลด · Under-coding **ไม่เห็น** |\n\nเงินมาช้าแก้ด้วย \"ความเร็ว\" — เงินหายถาวรแก้ด้วย \"คุณภาพเวชระเบียน\" ใช้ทีมและตัวชี้วัดคนละชุด\n\n### 6.2 สูตรแปลงงานเคลมเป็นเงิน (ใช้ตอนนำเสนอผู้บริหาร)\n\n- เงินสดที่ปลดล็อกได้จากการลด ACP:\n\n```latex\n\\text{เงินสดเพิ่ม} \\approx \\frac{\\text{รายได้สิทธินั้นต่อปี}}{365} \\times \\text{จำนวนวันที่ลดได้}\n```\n\n- รายได้ IP ที่หายจาก Under-coding ≈ ผลต่าง AdjRW ที่ควรได้ × อัตราจ่ายต่อ AdjRW ของกองทุนในปีนั้น (ต้องใช้อัตราจ่ายจริงจากประกาศ ห้ามประมาณเอง)\n- ทุกตัวเลขที่นำเสนอต้องอ้างแหล่ง: e-Claim/FDH (ผลเคลม), hfo (งบการเงิน), ประกาศกองทุน (อัตราจ่าย)\n\nใช้สูตร ACP กับงวดสะสมให้หารด้วยจำนวนวันของงวด (เช่น 273 วัน — บทที่ 3.7) ใช้กับรายได้ทั้งปีหารด้วย 365 ห้ามปนกัน\n\n**ประมาณรายได้ที่หายจาก Under-coding ด้วยผล MR Audit** (ตัวเลขสมมติ):\n\nรพ. มี IP UC ปีละ 4,000 ราย สุ่มตรวจเวชระเบียน 50 ฉบับแบบสุ่มจริง (ไม่เลือกเฉพาะชาร์ตที่สงสัย) พบ Under-coding 8 ฉบับ รวม AdjRW ที่ควรได้เพิ่ม 2.00\n\n::: ลองประมาณเอง แล้วกดดูเฉลย\n\n- AdjRW ที่หายเฉลี่ยต่อชาร์ตในตัวอย่าง = 2.00 ÷ 50 = 0.04\n- ขยายผลทั้งปี = 0.04 × 4,000 = **160 AdjRW**\n- เป็นเงิน ≈ 160 × 10,000 (อัตราสมมติ) = **1,600,000 บาทต่อปี**\n\nข้อควรระวังเวลานำเสนอ:\n\n1. ขยายผลได้เฉพาะเมื่อ **สุ่มจริง** — ถ้าเลือกชาร์ตที่สงสัย ตัวเลขจะสูงเกินจริง\n2. ตัวอย่าง 50 ฉบับยังเล็ก ให้นำเสนอเป็น \"ประมาณการเบื้องต้น\" และเสนอขยายการสุ่ม\n3. ใช้อัตราจ่ายจริงของกองทุนปีนั้น และระบุแหล่ง\n4. ตัวเลขที่ \"ได้คืนจริง\" มีแค่ชาร์ตที่ยังแก้/ส่งเพิ่มได้ภายในเวลา ที่เหลือคือ \"รายได้ที่จะได้ถ้าแก้ระบบ\" สำหรับปีถัดไป\n\n:::\n\n### 6.3 เทียบปัญหาเคลมข้าม รพ. อย่างเป็นธรรม\n\nจำนวนติด C ของ รพ. ใหญ่ย่อมสูงกว่า รพ. เล็ก — ต้องหารด้วยขนาดงานก่อนเทียบ\n\nข้อมูลจริง จ.อุดรธานี (สไลด์ กวป. ก.ค. 69: ติด C สะสม 1 ต.ค. 68 – 30 ก.ค. 69 หน้า 34 · Sum AdjRW หน้า 20):\n\n| เทียบแบบ | อันดับ 1 | อันดับ 2 | อันดับ 3 | รพ.21 (ระดับ A) อยู่อันดับ |\n| --- | --- | --- | --- | --- |\n| จำนวนติด C (รายการ) | รพ.21 (3,568) | รพ.10 (1,373) | รพ.19 (346) | 1 |\n| ติด C ต่อ 1,000 Sum AdjRW | รพ.19 (128) | รพ.12 (99) | รพ.03 (82) | 13 |\n\n- เมื่อหารด้วยขนาดงาน รพ.21 จากอันดับ 1 ตกไปอันดับ 13 และ รพ. ขนาด F1–F2 ขึ้นมาแทน\n- รพ.19 ติดอันดับทั้งสองแบบ และ ACP-UC 81 วัน (เกินเกณฑ์) — เป็นเป้าหมายแรกที่ควรลงไปดู\n- ข้อจำกัด: ติด C นับทุกรายการเคลม แต่ Sum AdjRW นับเฉพาะ IP และช่วงเวลาไม่ตรงกันพอดี จึงเป็นตัวหารโดยประมาณ — ถ้ามีจำนวนเคลมทั้งหมดของแต่ละ รพ. ให้ใช้ \"% ติด C ต่อจำนวนเคลม\" แทน\n\nหลักเดียวกันใช้กับทุกตัวชี้วัด: เงินที่ค้าง ÷ รายได้ (ACP), รายการปัญหา ÷ จำนวนเคลม, AdjRW ÷ จำนวนผู้ป่วยใน (CMI)\n\n### 6.4 อ่าน CMI ให้เป็น\n\n```latex\nCMI = Sum AdjRW ÷ จำนวนผู้ป่วยในที่จำหน่าย\n```\n\nCMI คือ \"ความหนักเฉลี่ยของผู้ป่วยใน 1 ราย\" ตามรหัสที่ส่ง — สะท้อน 2 อย่างปนกัน: ความหนักของผู้ป่วยจริง และความครบของการให้รหัส\n\n| ที่เห็น | เป็นได้ 2 ทาง | แยกด้วย |\n| --- | --- | --- |\n| CMI ต่ำกว่าเกณฑ์ระดับ | ผู้ป่วยเบาจริง (ส่งต่อรายหนักออก) **หรือ** Under-coding | MR Audit แบบสุ่ม + ดูอัตราส่งต่อ |\n| CMI ลดลงจากปีก่อน | Case mix เปลี่ยน **หรือ** Coder/แพทย์ผู้สรุปเปลี่ยน | เทียบรายแผนก / รายเดือน |\n| CMI สูงผิดปกติเทียบกลุ่ม | รับรายหนักจริง **หรือ** Over-coding | ตรวจก่อนจะถูก Post audit |\n\nเกณฑ์ CMI ที่ จ.อุดรธานีใช้ (สไลด์ กวป. ก.ค. 69 หน้า 20): A ≥ 1.6 · S ≥ 1.2 · M2 ≥ 0.8 · F1–F3 ≥ 0.6 — ณ มิ.ย. 69 ต่ำกว่าเกณฑ์ 1 แห่ง (รพ.16: 0.599 เกณฑ์ 0.6) — **ตรวจกับหนังสือสั่งการปีงบปัจจุบันก่อนใช้งานจริง**\n\nผ่านเกณฑ์ ≠ ไม่มี Under-coding — เกณฑ์เป็นเพียงพื้นขั้นต่ำ รพ. ที่ CMI ผ่านพอดีอาจยังมีรายได้รั่วอยู่ ดู \"คู่มือประกันสุขภาพ\" บทที่ 3.4–3.7 สำหรับปัจจัยที่ดัน RW และจุดรั่วที่พบบ่อย\n\n### 6.5 จัดลำดับการไล่ปัญหาเคลม — 4 ถัง\n\nแยกลูกหนี้ที่ค้างในระบบเคลมเป็น 4 ถังก่อนสั่งงาน (เหมือน Triage):\n\n| ถัง | ความหมาย | เจ้าของหลัก | มาตรการ | ตัวชี้วัด |\n| --- | --- | --- | --- | --- |\n| ① ยังไม่ส่ง | บริการแล้วแต่ยังไม่ส่งเคลม | เวชระเบียน / Coder / แพทย์ผู้สรุป | เร่งสรุปชาร์ต ตั้งรอบส่ง | ชาร์ตค้างสรุป, ระยะเวลาส่ง |\n| ② ติด C | ส่งแล้ว ข้อมูลไม่ผ่านตรวจ | งานประกัน | แก้ตามรหัส C ภายในเวลา | ติด C สะสม, % แก้ทันเวลา |\n| ③ Deny | ถูกปฏิเสธ | งานประกัน + แพทย์ | อุทธรณ์ถ้ามีหลักฐาน / ปรับลดถ้าสิ้นสุด | % อุทธรณ์สำเร็จ |\n| ④ รอจ่าย | ผ่านแล้ว รอโอน | การเงิน | กระทบยอด Statement | ยอดรอจ่ายตาม Statement |\n\nลำดับลงมือ = **เงินมาก × แก้ได้ × ใกล้หมดเวลา** ก่อน:\n\n1. ติด C ที่ใกล้หมดกรอบเวลาแก้ไข (ถ้าหลุดจะกลายเป็นเงินหายถาวร)\n2. ชาร์ต IP ค้างสรุปที่ AdjRW สูง (มูลค่าต่อรายมาก)\n3. Deny ที่มีหลักฐานอุทธรณ์ได้\n4. รอจ่ายที่ยอดไม่ตรง Statement\n\nกรอบเวลาแก้ไข/อุทธรณ์ของแต่ละกองทุนดู \"คู่มือประกันสุขภาพ\" บทที่ 4 และประกาศปีงบปัจจุบัน — ตำรานี้ไม่ระบุจำนวนวัน\n\n### 6.6 ข้อได้เปรียบของพยาบาลในงานนี้\n\n- อ่านเวชระเบียนเป็น → รู้ว่ารหัสหาย/ผิดตรงไหน (Dx หลัก, Comorbidity, Complication, หัตถการ)\n- รู้ Workflow หน้างาน → หาจุดที่ชาร์ตค้างได้จริง (ward, OR, แพทย์สรุปช้า)\n- ประสบการณ์ Risk management → ใช้ RCA กับปัญหาเคลมแบบเดียวกับ Clinical incident\n\nตัวอย่าง RCA ปัญหาเคลม (กรณีสมมติ): \"ติด C สะสมเพิ่มขึ้นทุกเดือน 3 เดือนติด\"\n\n| ทำไม | คำตอบ (สมมติ) |\n| --- | --- |\n| 1. ทำไมติด C เพิ่ม | รายการใหม่ติดเร็วกว่าที่แก้ทัน |\n| 2. ทำไมแก้ไม่ทัน | เจ้าหน้าที่แก้ C มี 1 คน และทำงานอื่นด้วย |\n| 3. ทำไมรายการใหม่ติดมาก | ข้อมูลสิทธิ/การยืนยันตัวตนไม่ครบตั้งแต่จุดลงทะเบียน |\n| 4. ทำไมจุดลงทะเบียนไม่ครบ | ไม่มีการตรวจก่อนส่ง และไม่มี feedback ย้อนกลับ |\n| 5. ทำไมไม่มี feedback | ไม่มีรายงานติด C แยกตามจุดที่ทำผิด |\n\nRoot cause = ไม่มีระบบ feedback จากผลเคลมถึงจุดบันทึกข้อมูล → มาตรการ: รายงานติด C รายสัปดาห์แยกจุดบริการ + checklist ก่อนส่ง (แก้ต้นทาง) — ไม่ใช่แค่เพิ่มคนแก้ C (แก้ปลายทาง)\n\n### 6.7 กับดักที่พบบ่อย\n\n- **เทียบจำนวนติด C ดิบข้าม รพ.** — ต้องหารด้วยขนาดงานก่อน (6.3)\n- **นับรายการ ไม่นับเงิน** — ติด C 100 รายการ OP อาจมีมูลค่าน้อยกว่า IP 5 ราย ให้เรียงตามมูลค่าเสมอ\n- **ขยายผล MR Audit จากชาร์ตที่เลือกเอง** — ประมาณการจะสูงเกินจริง และเสียความน่าเชื่อถือในที่ประชุม\n- **ใช้อัตราจ่ายเดาหรือของปีอื่น** — ตัวเลขเงินต้องใช้อัตราจริงของกองทุนปีนั้นพร้อมแหล่ง\n- **แก้ CMI ด้วยการ \"ใส่รหัสให้เยอะ\"** — คือ Over-coding เสี่ยงถูกเรียกคืนและผิดวินัย เป้าหมายคือ \"ครบและถูก\" ไม่ใช่ \"สูง\"\n- **แก้ปลายทางอย่างเดียว** — เพิ่มคนแก้ C โดยไม่แก้ต้นทาง ปัญหาจะกลับมา\n\n### 6.8 แบบฝึก\n\n- [ ] เลือก 1 รพ. ที่ ACP-UC เกินเกณฑ์ → ดึงผลเคลม e-Claim/FDH 3 เดือนล่าสุด → แยกสาเหตุ: ส่งช้า / ติด C / Deny / รอจ่าย\n- [ ] ใช้สูตร 6.2 คำนวณเงินสดที่ปลดล็อกได้ ถ้าลด ACP-UC ลงถึงเกณฑ์\n- [ ] คำนวณเงินสดที่ปลดล็อกได้: รายได้ประกันสังคมต่อปี 36,500,000 · ACP-SSS 130 วัน ลดเหลือ 120 วัน (ตัวเลขสมมติ)\n- [ ] ประมาณรายได้ที่หายจาก Under-coding: IP ปีละ 2,000 ราย · สุ่มตรวจ 40 ฉบับ พบ 6 ฉบับ AdjRW ที่ควรได้เพิ่มรวม 1.80 · อัตราสมมติ 10,000 บาท/AdjRW (ตัวเลขสมมติ)\n- [ ] จากตาราง 6.3 เลือก รพ. 1 แห่งที่อันดับต่างกันมากระหว่าง 2 แบบ แล้วเขียน 2 บรรทัดอธิบายว่าทำไม และควรใช้แบบไหนในที่ประชุม\n\n::: ดูเฉลย: ACP-SSS\n\n- รายได้ต่อวัน = 36,500,000 ÷ 365 = 100,000 บาท\n- ลด 10 วัน → เงินสดปลดล็อก ≈ 100,000 × 10 = **1,000,000 บาท**\n\nเกณฑ์ ACP-SSS ≤ 120 วันเป็นค่าที่อนุมานจากสไลด์ K1 ไม่ใช่เกณฑ์ที่ประกาศ — ตรวจกับหนังสือสั่งการปีงบปัจจุบันก่อนใช้งานจริง\n\n:::\n\n::: ดูเฉลย: Under-coding จาก MR Audit\n\n- AdjRW ที่หายเฉลี่ยต่อชาร์ต = 1.80 ÷ 40 = 0.045\n- ขยายผลทั้งปี = 0.045 × 2,000 = **90 AdjRW**\n- เป็นเงิน ≈ 90 × 10,000 = **900,000 บาทต่อปี** (อัตราสมมติ)\n\nนำเสนอเป็นประมาณการเบื้องต้น (ตัวอย่าง 40 ฉบับ) ระบุว่าสุ่มอย่างไร และเสนอขยายการสุ่มก่อนตั้งเป้ารายได้\n\n:::\n\n::: ดูแนวคำตอบ: อันดับต่างกัน\n\nตัวอย่าง รพ.21: จำนวนติด C สูงสุดของจังหวัด แต่ต่อ 1,000 AdjRW อยู่อันดับ 13 — เพราะเป็น รพ. ระดับ A ที่มีผลงานมากที่สุด จำนวนติด C จึงสูงตามขนาด\n\nในที่ประชุมใช้ **ทั้งสองแบบคู่กัน**: แบบต่อขนาดงานใช้จัดลำดับว่า \"ใครต้องปรับระบบ\" ส่วนจำนวนดิบใช้บอก \"ภาระงานแก้ C อยู่ที่ไหน\" (จัดคน/ทีมช่วย)\n\n:::\n\n### 6.9 สรุปบท — 3 ข้อที่ต้องจำ\n\n1. ปัญหาเคลมมี 2 ชนิด: **เงินมาช้า** (เห็นเป็นลูกหนี้/ACP แก้ด้วยความเร็ว) และ **เงินหายถาวร** (Under-coding มองไม่เห็นในงบ แก้ด้วยคุณภาพเวชระเบียน)\n2. ทุกตัวเลขที่นำเสนอต้อง **แปลงเป็นบาทด้วยอัตราจริงพร้อมแหล่ง** และขยายผล MR Audit ได้เฉพาะจากการสุ่มจริง\n3. เทียบข้าม รพ. ต้อง **หารด้วยขนาดงานก่อน** และไล่แก้ตามลำดับ เงินมาก × แก้ได้ × ใกล้หมดเวลา\n\n### แผนผังความคิด (Mind map)\n\nจำภาพนี้ให้ได้ก่อนไปบทถัดไป — ลองปิดจอแล้ววาดเองบนกระดาษ\n\n```mindmap\nเคลม → งบการเงิน\n- เงินมาช้า\n  - ส่งช้า · ติด C · รอจ่าย\n  - ลูกหนี้ค้าง ACP สูง\n  - แก้ด้วยความเร็ว\n- เงินหายถาวร\n  - Under-coding: มองไม่เห็น\n  - Deny สิ้นสุด · ถูกเรียกคืน\n  - แก้ด้วยคุณภาพเวชระเบียน\n- แปลงเป็นเงิน\n  - รายได้ต่อวัน × วันที่ลด ACP\n  - AdjRW ที่หาย × อัตราจริง\n  - MR Audit ต้องสุ่มจริง\n- เทียบอย่างเป็นธรรม\n  - หารด้วยขนาดงาน\n  - ติด C ต่อ 1,000 AdjRW\n  - เรียงตามมูลค่า\n- CMI\n  - Sum AdjRW ÷ จำนวน IP\n  - ต่ำ: ผู้ป่วยเบา หรือ Under-coding\n  - สูงผิดปกติ: เสี่ยง Post audit\n- 4 ถัง (Triage)\n  - ยังไม่ส่ง · ติด C · Deny · รอจ่าย\n  - เงินมาก × แก้ได้ × ใกล้หมดเวลา\n- จุดแข็งพยาบาล\n  - อ่านเวชระเบียนเป็น\n  - RCA: แก้ต้นทาง ไม่ใช่ปลายทาง\n```\n\n## บทที่ 7 จากตัวเลขสู่ Action plan + กรณีศึกษา\n\nการวิเคราะห์ที่ดีจบด้วย \"ใครทำอะไร ภายในเมื่อไร วัดผลด้วยตัวเลขไหน\" ไม่ใช่จบด้วยคำว่า \"ควรปรับปรุง\"\n\nเป้าหมายของบทนี้: จบบทแล้วพา รพ. 1 แห่งผ่าน 5 ขั้นตั้งแต่เห็นตัวเลขจนเขียน Action plan 1 หน้าที่ทุกแถววัดผลได้ เขียนเป้าหมายและตัวชี้วัดติดตามที่ถูกชนิด และสรุปขึ้นสไลด์ กวป. ได้ใน 1 หน้า ใช้เวลาประมาณ 3–4 ชั่วโมง\n\nบทนี้ใช้ข้อมูลจริง 2 ชุด: รายงาน รพ.โพธิ์ตาก (เอกสารเผยแพร่ของเขต 8) และ รพ.19 จากสไลด์ กวป. ก.ค. 69 (รหัส รพ. สุ่ม) — **เป้าหมายตัวเลขในตัวอย่าง Action plan เป็นเป้าตัวอย่างเพื่อฝึก ไม่ใช่เป้าที่ทางการกำหนด** และห้ามมีข้อมูลผู้ป่วยในเอกสารทุกฉบับ (PDPA)\n\n### 7.1 กรอบคิด 5 ขั้น\n\n1. Detect — ตัวชี้วัดไหนผิดเกณฑ์ (Cash, NWC, NI, ACP, APP)\n2. Diagnose — RCA: ปัญหาฝั่งรายได้ (เคลม, ผลงาน, อัตราจ่าย) หรือฝั่งค่าใช้จ่าย (บุคลากร, ยา, วัสดุ)\n3. Decide — เลือก Quick win (ภายใน 1 ไตรมาส) + มาตรการโครงสร้าง (1 ปี)\n4. Do — มอบผู้รับผิดชอบ กำหนดเป้าตัวเลขและวันที่\n5. Document & Follow — ติดตามรายเดือน รายงาน CFO จังหวัด / กวป.\n\nแต่ละขั้นต้องได้ผลลัพธ์อะไร และใช้เครื่องมือจากบทไหน:\n\n| ขั้น | ผลลัพธ์ที่ต้องได้ | เครื่องมือ | บท |\n| --- | --- | --- | --- |\n| Detect | รายการตัวชี้วัดที่หลุด + ค่าปัจจุบัน + ทิศทาง | Risk Score, 7 Plus, เงินบำรุงหลังหักหนี้, Trend | 4, 5 |\n| Diagnose | สมมติฐานสาเหตุ 1–3 ข้อ + ข้อมูลที่ต้องขอเพื่อยืนยัน | อ่าน Ratio เป็นคู่, 4 ถังเคลม, Aging, RCA | 3, 4.5, 6.5 |\n| Decide | มาตรการที่แก้ \"สาเหตุ\" ไม่ใช่แก้ \"คะแนน\" | Quick win + โครงสร้าง | 7.2 |\n| Do | ผู้รับผิดชอบ + เป้าตัวเลข + วันที่ ครบทุกแถว | แบบฟอร์ม 1 หน้า | 7.2 |\n| Document | ตัวชี้วัดนำ (รายเดือน) + ตัวชี้วัดผล (รายไตรมาส) | ตารางติดตาม | 7.6 |\n\nขั้นที่คนข้ามบ่อยที่สุดคือ **Diagnose** — กระโดดจาก \"Cash ต่ำ\" ไป \"ลดค่าใช้จ่าย\" ทันที ทั้งที่สาเหตุอาจอยู่ที่ลูกหนี้ค้าง\n\n### 7.2 แบบฟอร์ม Action plan 1 หน้า\n\n| ปัญหา (ตัวชี้วัด + ค่าปัจจุบัน) | สาเหตุราก | มาตรการ | ผู้รับผิดชอบ | เป้าหมาย (ตัวเลข) | กำหนดเสร็จ | แหล่งข้อมูลติดตาม |\n| --- | --- | --- | --- | --- | --- | --- |\n|  |  |  |  |  |  |  |\n|  |  |  |  |  |  |  |\n\nกติกาเขียนแถวที่ดี 5 ข้อ:\n\n1. **ปัญหา** มีชื่อตัวชี้วัด + ค่าปัจจุบัน + เกณฑ์ + ข้อมูล ณ วันที่\n2. **สาเหตุราก** มาจากข้อมูล ไม่ใช่ความรู้สึก — ถ้ายังไม่มีข้อมูล ให้เขียนว่า \"สมมติฐาน\" และใส่แถวขอข้อมูลก่อน\n3. **มาตรการ** เป็นการกระทำที่ทำได้จริง (กริยา + สิ่งที่ทำ + ความถี่)\n4. **เป้าหมาย** ใช้ตัวชี้วัดเดียวกับช่องปัญหา และเป็นตัวเลข\n5. **ผู้รับผิดชอบ** เป็นตำแหน่ง/หน่วยงานเดียว (ไม่ใช่ \"ทุกฝ่าย\") และ **ไม่มีชื่อผู้ป่วย / HN / AN / เลขบัตร** ในช่องใดเลย\n\nแถวที่ไม่ดี vs แถวที่ดี (ตัวเลขสมมติ):\n\n| | แถวที่ไม่ดี | แถวที่ดี |\n| --- | --- | --- |\n| ปัญหา | ลูกหนี้สูง | ACP-UC 85 วัน (เกณฑ์ 60) ข้อมูล ณ 31 มี.ค. |\n| สาเหตุ | เจ้าหน้าที่ไม่เพียงพอ | ติด C สะสม 210 รายการ 60% มาจากข้อมูลสิทธิไม่ครบที่จุดลงทะเบียน (ผล e-Claim 3 เดือน) |\n| มาตรการ | เร่งรัดการเรียกเก็บ | แก้ C ที่ใกล้หมดเวลาทุกสัปดาห์ + checklist ตรวจสิทธิก่อนส่ง ณ จุดลงทะเบียน |\n| ผู้รับผิดชอบ | ทุกฝ่าย | หัวหน้างานประกันสุขภาพ |\n| เป้าหมาย | ลดลง | ACP-UC ≤ 60 วัน · ติด C สะสม ≤ 100 รายการ |\n| กำหนดเสร็จ | โดยเร็ว | 30 มิ.ย. (ไตรมาสถัดไป) |\n| ติดตาม | — | e-Claim / FDH รายสัปดาห์ · hfo รายไตรมาส |\n\nในแอป ใช้เมนู \"Action plan\" กรอกได้ทันที (มีตัวกรองข้อมูลผู้ป่วยก่อนคัดลอก/ส่งออก) หรือกด \"ร่าง Action plan จาก รพ. นี้\" ในหน้ากรณีศึกษาเพื่อได้แถวตั้งต้น\n\n### 7.3 กรณีศึกษา: รพ.โพธิ์ตาก จ.หนองคาย (เขต 8)\n\nข้อมูลจากรายงานสถานการณ์การเงินการคลังที่เสนอผู้ตรวจราชการ ปีงบ 2566–2569 ([r8way](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20260608053511.pdf)):\n\n| ตัวชี้วัด | ค่าที่รายงาน |\n| --- | --- |\n| กลุ่ม รพ. | รพช.F3 ประชากร UC ไม่เกิน 15,000 คน (UC 11,739 คน ณ 1 เม.ย. 2568) |\n| Risk Score | ระดับ 6 |\n| TPS | 5.5 จาก 15 คะแนน เกรด F |\n| NWC | −8.20 ล้านบาท |\n| เงินบำรุงสุทธิ | −16.61 ล้านบาท (ณ Q2/2569) |\n| EBITDA | +3.74 ล้านบาท |\n| APP (ระยะเวลาชำระหนี้ยา) | 494 วัน (มาตรฐาน 90 วัน) |\n| รายได้ต่ำกว่าแผน | 11.7% (2566) → 19.4% (2568) → 15.0% (ครึ่งปี 2569) |\n\nคำถามฝึกวิเคราะห์ (ตอบเองก่อนดูแนวคิด):\n\n1. ปัญหาหลักอยู่ฝั่งรายได้หรือค่าใช้จ่าย — ใช้ตัวเลขไหนยืนยัน\n2. EBITDA เป็นบวก แต่ทำไม NWC และเงินบำรุงยังติดลบ\n3. APP 494 วันบอกอะไรเกี่ยวกับความสัมพันธ์กับเจ้าหนี้และความเสี่ยงการจัดหายา\n4. ถ้าคุณเป็นงานประกันสุขภาพระดับจังหวัด ต้องขอข้อมูลอะไรเพิ่ม 3 อย่าง\n5. เขียน Action plan ตามแบบฟอร์ม 7.2 อย่างน้อย 3 แถว\n\n::: ดูแนวคิดเฉลย ข้อ 1–4\n\n- รายได้ต่ำกว่าแผนต่อเนื่องและรุนแรงขึ้น = สัญญาณว่า Planfin ตั้งรายได้เกินจริง และ/หรือ รายได้จากการเรียกเก็บรั่ว — เป็นงานของประกันสุขภาพโดยตรง\n- EBITDA บวกแต่ไม่พอ: กำไรเงินสดจากการดำเนินงานน้อยกว่าภาระหนี้สะสม จึงยังพลิก NWC ไม่ได้\n- APP สูงมาก = รพ. ใช้เจ้าหนี้ค่ายาเป็นแหล่งเงินทุน — ความเสี่ยงคือถูกระงับการส่งยา\n- ข้อมูลที่ควรขอ: ผลเคลมและ Deny รายสิทธิ, AdjRW/CMI เทียบ รพ. กลุ่มเดียวกัน, สมมติฐานรายได้ใน Planfin\n\n:::\n\n::: ดูตัวอย่าง Action plan ข้อ 5 (เป้าตัวอย่างเพื่อฝึก)\n\n| ปัญหา | สาเหตุราก (สมมติฐาน — ต้องยืนยันด้วยข้อมูล) | มาตรการ | ผู้รับผิดชอบ | เป้าหมาย | กำหนดเสร็จ | ติดตาม |\n| --- | --- | --- | --- | --- | --- | --- |\n| รายได้ต่ำกว่าแผน 15.0% (ครึ่งปี 69) | แผนตั้งรายได้บน AdjRW/อัตราที่ไม่สมจริง และ/หรือเคลมรั่ว | ขอผลเคลมรายสิทธิ 6 เดือน + สมมติฐาน Planfin แล้วแยกส่วนต่างเป็น \"แผนเกินจริง\" กับ \"เคลมรั่ว\" | งานประกัน สสจ. ร่วมกับ CFO รพ. | รายงานแยกสาเหตุครบ 100% ของส่วนต่าง | ภายใน 1 เดือน | Planfin, e-Claim/FDH |\n| APP 494 วัน (มาตรฐาน 90) | ใช้เจ้าหนี้ยาเป็นแหล่งทุน เพราะเงินสดไม่พอ | ทำแผนชำระหนี้ยารายเดือน เรียงตามผู้ขายที่เสี่ยงระงับส่งยา และผูกกับเงินที่ได้จากการลด ACP | ผู้อำนวยการ รพ. / CFO รพ. | APP ลดลงทุกไตรมาส (ตั้งตัวเลขหลังเห็นแผนเงินสด) | ทบทวนทุกไตรมาส | งบไตรมาส, hfo |\n| NWC −8.20 ล้าน · Risk 6 | ผลรวมของ 2 แถวบน | ติดตามตามระดับ Risk (CFO จังหวัด/เขตแทรกแซง) | CFO จังหวัด | Risk ไม่เพิ่ม และ NWC ดีขึ้นทุกไตรมาส | สิ้นปีงบ | hfo |\n\nสังเกต: แถวแรกคือ **ขอข้อมูลเพื่อยืนยันสาเหตุ** — ถ้ายังไม่รู้สาเหตุ ห้ามข้ามไปกำหนดมาตรการลดค่าใช้จ่าย\n\n:::\n\n### 7.4 กรณีศึกษาฝึกเต็ม 5 ขั้น: รพ.19 (ข้อมูลจริง จ.อุดรธานี)\n\nข้อมูล ณ มิ.ย. 69 (9 เดือน) จากสไลด์ กวป. ก.ค. 69 — รหัส รพ. สุ่ม ระดับ F1 · 60 เตียง\n\n| มิติ | ค่า | เกณฑ์ / เทียบ | หน้า |\n| --- | --- | --- | --- |\n| Risk Score (กระทรวง) | 5 · เขต 8 (NI) = 6 | — | 6–8 |\n| CR / QR / Cash | 0.71 / 0.59 / 0.16 | 1.5 / 1.0 / 0.8 | 8 |\n| NWC | (10.11) ล้าน | < 0 เสี่ยง | 8 |\n| NI | +19.60 ล้าน | — | 8 |\n| เงินบำรุงหลังหักหนี้ | (29.40) ล้าน · แนวโน้ม Q4Y65 → Q3Y69: (15.58) → (29.40) | — | 3 |\n| OPM | 19.35% | ค่าเฉลี่ยกลุ่ม 4.79% | 28 |\n| APP-Drug | 412 วัน | ผ่าน ≤ ~145 (อนุมาน) | 28 |\n| ACP-UC / CSMBS / SSS | 81 / 61 / 103 วัน | 60 / 60 / 120 (อนุมาน) | 28 |\n| ติด C สะสม | 346 รายการ = 128 ต่อ 1,000 Sum AdjRW (สูงสุดในจังหวัด) | — | 34, 20 |\n| CMI | 0.707 | F1 ≥ 0.6 | 20 |\n| Planfin รายได้ | สูงกว่าแผน ณ งวด 16.1% | ±5% | 11 |\n\n::: ขั้น 1 Detect — ลองเขียนเองก่อน\n\n- สภาพคล่องหลุดทั้ง 3 ตัว (Liquid 3) · NWC ติดลบ · Survival 1 (ฟื้นใน 10.11 ÷ (19.60 ÷ 9) ≈ 4.6 เดือน) → Risk 5\n- เงินบำรุงหลังหักหนี้ติดลบ **และแย่ลงต่อเนื่อง 4 ปี** แม้ NI บวก\n- APP 412 วัน · ACP-UC 81 วัน · ติด C ต่อขนาดงานสูงสุดในจังหวัด\n\n:::\n\n::: ขั้น 2 Diagnose — ลองเขียนเองก่อน\n\nรูปแบบที่เห็น (บทที่ 4.5): **NI บวก + OPM สูงกว่ากลุ่ม 4 เท่า แต่ Cash 0.16 และเงินบำรุงแย่ลง** = \"กำไรที่ไม่กลายเป็นเงิน\"\n\nสมมติฐาน 3 ข้อ (ต้องยืนยันด้วยข้อมูล):\n\n1. เงินจมในลูกหนี้ UC/SSS — ACP สูง + ติด C ต่อขนาดงานสูงสุด\n2. รายได้ที่บันทึกอาจสูงกว่าที่จะได้รับจริง (ตั้งลูกหนี้สูง แล้วถูกปรับลดภายหลัง) — สอดคล้องกับรายได้สูงกว่าแผน 16% แต่เงินไม่เข้า\n3. หนี้เก่าสะสม (เจ้าหนี้ยา) ใช้เงินที่เข้ามาไปหมด — APP 412 วัน\n\nข้อมูลที่ต้องขอ: ลูกหนี้แยกสิทธิแยกอายุ · รายการติด C แยกถังและมูลค่า · บัญชีปรับลดลูกหนี้ 4 ไตรมาส · เจ้าหนี้ยาแยกอายุ\n\n:::\n\n::: ขั้น 3–4 Decide + Do — ตัวอย่าง Action plan (เป้าตัวอย่างเพื่อฝึก)\n\n| ปัญหา | สาเหตุราก (สมมติฐาน) | มาตรการ | ผู้รับผิดชอบ | เป้าหมาย | กำหนดเสร็จ | ติดตาม |\n| --- | --- | --- | --- | --- | --- | --- |\n| ติด C 346 รายการ (128 ต่อ 1,000 AdjRW สูงสุดในจังหวัด) | ยังไม่ทราบ — ต้องแยกถังก่อน | Quick win: แยก 4 ถัง เรียงตามมูลค่า แก้รายการใกล้หมดเวลาก่อน | งานประกัน รพ. (สสจ. สนับสนุน) | ติด C ต่อ 1,000 AdjRW ≤ ค่ากลางจังหวัด | 1 ไตรมาส | e-Claim / FDH รายสัปดาห์ |\n| ACP-UC 81 วัน (เกณฑ์ 60) | เงินจมในลูกหนี้ UC | ติดตามผลจากแถวบน + กระทบยอดลูกหนี้บัญชีกับระบบเคลม | งานประกัน + บัญชี รพ. | ACP-UC ≤ 60 วัน | 2 ไตรมาส | hfo / 7 Plus |\n| รายได้สูงกว่าแผน 16% แต่เงินบำรุงแย่ลง | อาจตั้งลูกหนี้สูงกว่าที่ได้รับจริง | ทบทวนวิธีตั้งลูกหนี้รายสิทธิกับหลักเกณฑ์ สป.สธ. ปีปัจจุบัน | บัญชี รพ. + CFO จังหวัด | ส่วนต่างตั้งลูกหนี้ vs รับจริง รายงานทุกไตรมาส | 1 ไตรมาส | บัญชีปรับลดลูกหนี้ |\n| APP 412 วัน | ใช้เจ้าหนี้ยาเป็นแหล่งทุน | แผนชำระหนี้ยาโดยใช้เงินที่ได้จากการลด ACP | ผู้อำนวยการ / CFO รพ. | APP ลดทุกไตรมาส | ทบทวนรายไตรมาส | งบไตรมาส |\n\nเงินที่ปลดล็อกได้จากแถว ACP ต้องคำนวณจากรายได้ UC จริงของ รพ. (สูตรบทที่ 3.7) — ข้อมูลในสไลด์ไม่มีรายได้ UC แยก จึงยังใส่ตัวเลขบาทไม่ได้ **ห้ามเดา**\n\n:::\n\n::: ขั้น 5 Document — ตัวชี้วัดติดตาม\n\n- รายสัปดาห์: ติด C ใกล้หมดเวลา, ติด C สะสม\n- รายเดือน: ยอดลูกหนี้ UC/SSS, ยอดรับเงินโอน, ชาร์ตค้างสรุป\n- รายไตรมาส: ACP, APP, Cash, NWC, เงินบำรุงหลังหักหนี้, Risk Score (ทั้งเกณฑ์กระทรวงและเขต 8)\n\n:::\n\n### 7.5 นำเสนอใน กวป. / ผู้บริหาร — 1 สไลด์ต่อ รพ.\n\n| ส่วน | เนื้อหา | ตัวอย่าง (รพ.19) |\n| --- | --- | --- |\n| หัวเรื่อง | สรุป 1 บรรทัด (ไม่ใช่ชื่อ รพ. อย่างเดียว) | กำไรสูงแต่ไม่กลายเป็นเงิน — เงินจมในลูกหนี้และหนี้ยา |\n| 3 บรรทัด | ป่วยตรงไหน · เพราะอะไร · ต้องแก้อะไร | Cash 0.16, เงินบำรุงติดลบ 29.4 ล้าน · ACP-UC 81 วัน, ติด C สูงสุดต่อขนาดงาน · แยกถังติด C + ทบทวนการตั้งลูกหนี้ |\n| ตาราง | 4–6 ตัวชี้วัด: ค่าปัจจุบัน / เกณฑ์ / ทิศทาง | จากตาราง 7.4 |\n| ข้อขอ | สิ่งที่ต้องการจากที่ประชุม 1 ข้อ | ขอให้ รพ. ส่งลูกหนี้แยกอายุและรายการติด C แยกถังภายในวันที่ ___ |\n| ที่มา | แหล่ง + ข้อมูล ณ วันที่ + เกณฑ์ที่ใช้ | สไลด์ กวป. ก.ค. 69 · ข้อมูล ณ มิ.ย. 69 · Risk เกณฑ์กระทรวง |\n\nถ้าต้องส่งหนังสือขอข้อมูลถึง รพ. ใช้แนวทาง \"คู่มือประกันสุขภาพ\" บทที่ 8 (บทบาท สสจ. และการเขียนหนังสือประสานงาน) — ขอข้อมูลระดับยอดรวม/รายสิทธิ ไม่ขอรายชื่อผู้ป่วย\n\n### 7.6 ติดตามผล — ตัวชี้วัดนำ vs ตัวชี้วัดผล\n\n| ชนิด | ตัวอย่าง | ขยับเมื่อไร | ใช้ทำอะไร |\n| --- | --- | --- | --- |\n| ตัวชี้วัดนำ (Leading) | ชาร์ตค้างสรุป, ติด C แก้ทันเวลา, ยอดรับเงินโอนรายเดือน | ภายในสัปดาห์–เดือน | บอกว่ามาตรการ \"ทำจริง\" หรือยัง |\n| ตัวชี้วัดผล (Lagging) | ACP, Cash, NWC, Risk Score | รายไตรมาส | บอกว่ามาตรการ \"ได้ผล\" หรือยัง |\n\nกติกาติดตาม:\n\n- ทุกแถวใน Action plan ต้องมีตัวชี้วัดนำอย่างน้อย 1 ตัว — ถ้ามีแต่ตัวชี้วัดผล จะรู้ว่าล้มเหลวช้าไป 1 ไตรมาส\n- ตัวชี้วัดนำไม่ขยับ 2 เดือน → มาตรการไม่ได้ทำ ตามที่ผู้รับผิดชอบ\n- ตัวชี้วัดนำขยับแต่ตัวชี้วัดผลไม่ขยับ 1 ไตรมาส → สาเหตุรากผิด กลับไป Diagnose\n\n### 7.7 กับดักที่พบบ่อย\n\n- **ข้าม Diagnose** — Cash ต่ำแล้วสั่งลดค่าใช้จ่ายทันที ทั้งที่เงินจมในลูกหนี้\n- **มาตรการแก้คะแนน** — เลื่อนจ่ายเจ้าหนี้ก่อนปิดงวด Cash ดีขึ้นแต่หนี้ไม่หาย (บทที่ 5.7)\n- **เป้าหมายไม่ใช่ตัวเลข** — \"ลดลง\" \"ดีขึ้น\" วัดไม่ได้\n- **ผู้รับผิดชอบ \"ทุกฝ่าย\"** — แปลว่าไม่มีใครรับผิดชอบ\n- **ใส่ตัวเลขบาทที่ไม่มีแหล่ง** — ถ้าข้อมูลไม่พอ ให้เขียน \"รอข้อมูล ___\" แทนการประมาณ\n- **ใส่ข้อมูลผู้ป่วยในเอกสาร** — ตัวอย่างรายกรณีให้อ้างเป็นจำนวน/มูลค่า ไม่ใส่ชื่อ HN AN หรือเลขบัตร\n\n### 7.8 แบบฝึก\n\n- [ ] ทำ Action plan 1 หน้าให้ รพ. ใน จ.อุดรธานี 1 แห่ง แล้วขอ Feedback จากหัวหน้ากลุ่มงาน\n- [ ] แก้ 3 แถวที่ไม่ดีนี้ให้เป็นแถวที่ดี: ก) \"รายได้ต่ำ / เร่งเรียกเก็บ / ทุกฝ่าย / ดีขึ้น\" — ข) \"CMI ต่ำ / อบรมแพทย์ / งานเวชระเบียน / เพิ่มขึ้น\" — ค) \"ยาค้างจ่าย / ประหยัดยา / เภสัช / ลดลง\"\n- [ ] เลือก รพ. 1 แห่งในกลุ่ม \"ไข้ไม่ขึ้นแต่ป่วย\" (บทที่ 5.6) เปิดในเมนู \"กรณีศึกษา 21 รพ.\" กด \"ร่าง Action plan จาก รพ. นี้\" แล้วแก้ทุกแถวให้ผ่านกติกา 5 ข้อใน 7.2\n- [ ] ทำสไลด์ 1 หน้าตามโครง 7.5 ให้ รพ. เดียวกัน\n\n::: ดูแนวเฉลย: แก้แถวที่ไม่ดี\n\n| แถว | ปัญหา | สาเหตุราก | มาตรการ | ผู้รับผิดชอบ | เป้าหมาย |\n| --- | --- | --- | --- | --- | --- |\n| ก | รายได้ต่ำกว่า Planfin ___% (ข้อมูล ณ ___) | สมมติฐาน: เคลมรั่ว vs แผนเกินจริง — ขอผลเคลม 6 เดือนก่อน | แยกส่วนต่างรายได้เป็นรายสิทธิและรายสาเหตุ | หัวหน้างานประกัน รพ. | รายงานแยกสาเหตุครบ ภายใน 1 เดือน |\n| ข | CMI ___ (เกณฑ์ระดับ ___) | ยังไม่รู้ว่าผู้ป่วยเบาจริงหรือ Under-coding | MR Audit สุ่ม ___ ฉบับ แยกผลรายแผนก | หัวหน้างานเวชระเบียน | รายงานอัตรา Under-coding + AdjRW ที่หาย ภายใน ___ |\n| ค | APP ___ วัน (มาตรฐาน 90) | ใช้เจ้าหนี้ยาเป็นแหล่งทุน | แผนชำระหนี้ยารายเดือน ผูกกับเงินจากการลด ACP | CFO รพ. | APP ลดลง ___ วันต่อไตรมาส |\n\nหมายเหตุ ค: \"ประหยัดยา\" แก้ผิดจุด — ปัญหาคือ **เงินไม่พอจ่ายหนี้** ไม่ใช่ใช้ยามากเกิน (ถ้า IM ผ่าน) ช่องว่าง ___ ให้เติมจากข้อมูลจริงของ รพ. — ไม่เดาตัวเลข\n\n:::\n\n### 7.9 สรุปบท — 3 ข้อที่ต้องจำ\n\n1. 5 ขั้น **Detect → Diagnose → Decide → Do → Document** — ขั้นที่ห้ามข้ามคือ Diagnose ถ้ายังไม่รู้สาเหตุ แถวแรกของแผนคือ \"ขอข้อมูล\"\n2. ทุกแถวต้องมี **ตัวชี้วัด + ค่าปัจจุบัน + เป้าตัวเลข + ผู้รับผิดชอบ 1 หน่วย + วันที่ + แหล่งติดตาม** และติดตามด้วยตัวชี้วัดนำรายเดือนคู่ตัวชี้วัดผลรายไตรมาส\n3. นำเสนอ 1 สไลด์ต่อ รพ.: **หัวเรื่องที่เป็นข้อสรุป + 3 บรรทัด + ตาราง + 1 ข้อขอ + ที่มา** — ไม่มีตัวเลขที่ไม่มีแหล่ง และไม่มีข้อมูลผู้ป่วย\n\n### แผนผังความคิด (Mind map)\n\nจำภาพนี้ให้ได้ก่อนไปบทถัดไป — ลองปิดจอแล้ววาดเองบนกระดาษ\n\n```mindmap\nตัวเลข → Action plan\n- 5 ขั้น\n  - Detect: หลุดเกณฑ์ + ทิศทาง\n  - Diagnose: ห้ามข้าม\n  - Decide: แก้สาเหตุ ไม่ใช่คะแนน\n  - Do · Document\n- แถวที่ดี\n  - ตัวชี้วัด + ค่า + เกณฑ์ + วันที่\n  - สาเหตุจากข้อมูล\n  - ผู้รับผิดชอบ 1 หน่วย\n  - เป้าเป็นตัวเลข\n- ยังไม่รู้สาเหตุ\n  - แถวแรก = ขอข้อมูล\n  - เขียนว่า \"สมมติฐาน\"\n- ติดตาม\n  - นำ: ชาร์ตค้าง ติด C รายเดือน\n  - ผล: ACP Cash Risk รายไตรมาส\n  - นำไม่ขยับ 2 เดือน → ตาม\n- 1 สไลด์ กวป.\n  - หัวเรื่อง = ข้อสรุป\n  - 3 บรรทัด + ตาราง\n  - 1 ข้อขอ + ที่มา\n- กรณีศึกษา\n  - โพธิ์ตาก: APP 494 รายได้ต่ำกว่าแผน\n  - รพ.19: กำไรไม่กลายเป็นเงิน\n- กติกาเหล็ก\n  - ไม่มีตัวเลขไม่มีแหล่ง\n  - ไม่มีข้อมูลผู้ป่วย\n```\n\n## แบบทดสอบตนเอง อภิธานศัพท์ และแหล่งอ้างอิง\n\n### แบบทดสอบตนเอง (ตอบได้ครบ = พร้อมใช้งานจริง)\n\n- [ ] อธิบายสมการบัญชี และยกตัวอย่างรายการ รพ. ที่ทำให้สินทรัพย์และหนี้สินเพิ่มพร้อมกัน\n- [ ] ทำไม รพ. ที่ NI เป็นบวก อาจมี Cash Ratio ต่ำกว่า 0.8\n- [ ] บอกเกณฑ์ CR, QR, Cash, NWC, NI ใน Risk Score ได้โดยไม่เปิดตำรา\n- [ ] อธิบายความต่างระหว่าง Risk Score ระดับ 5 กับระดับ 6\n- [ ] คำนวณ ACP-UC จากงบจริง และแปลงเป็นจำนวนเงินสดที่ค้างอยู่\n- [ ] ระบุ 3 ปัญหาเคลมที่ทำให้ลูกหนี้ปีเก่าสะสม\n- [ ] อ่าน Planfin แล้วบอกได้ว่ารายได้ส่วนไหนตั้งไว้สูงเกินจริง\n- [ ] เขียน Action plan 1 หน้าที่มีเป้าหมายเป็นตัวเลขและวันที่ครบทุกแถว\n\n### อภิธานศัพท์\n\n| คำ | ความหมายสั้น |\n| --- | --- |\n| Accrual basis | เกณฑ์คงค้าง: รับรู้รายได้/ค่าใช้จ่ายเมื่อเกิด ไม่ใช่เมื่อรับ/จ่ายเงิน |\n| ACP | Average Collection Period: จำนวนวันเฉลี่ยที่เก็บหนี้ได้ |\n| APP | Average Payment Period: จำนวนวันเฉลี่ยที่จ่ายหนี้เจ้าหนี้ |\n| CR / QR / Cash Ratio | อัตราส่วนสภาพคล่อง 3 ระดับ จากหลวมไปเข้ม |\n| EBITDA | กำไรก่อนดอกเบี้ย ภาษี ค่าเสื่อม และค่าตัดจำหน่าย |\n| IM | Inventory Management: การบริหารคลังยา/เวชภัณฑ์ |\n| NI | รายได้สูง(ต่ำ)กว่าค่าใช้จ่ายสุทธิ |\n| NWC | ทุนสำรองสุทธิ = สินทรัพย์หมุนเวียน − หนี้สินหมุนเวียน |\n| OPM / OPR | อัตรากำไรจากการดำเนินงาน |\n| Planfin | แผนทางการเงินประจำปีของหน่วยบริการ |\n| ROA | ผลตอบแทนต่อสินทรัพย์ |\n| Risk Score | ระดับวิกฤตการเงิน 0–7 ของ สป.สธ. |\n| TPS | Total Performance Score คะแนนประสิทธิภาพเต็ม 15 |\n| เงินบำรุงคงเหลือ (หักหนี้แล้ว) | เงินบำรุงที่เหลือจริงหลังหักหนี้สินและภาระผูกพัน |\n\n### แหล่งอ้างอิง (เปิดอ่านจริงหรือพบในผลค้นหา ณ วันที่จัดทำ)\n\nทุกรายการเป็นเอกสารนำเสนอ/รายงานของหน่วยงาน สธ. ที่เผยแพร่ ไม่ใช่ประกาศฉบับทางการ — ใช้เพื่อการเรียน ก่อนอ้างในหนังสือราชการให้ใช้หนังสือสั่งการฉบับจริงของ สป.สธ. / เขตสุขภาพที่ 8\n\n- [รายละเอียดตัวชี้วัด 53 ร้อยละหน่วยบริการที่ประสบภาวะวิกฤตทางการเงิน (KPI template ปีงบ 2567, สสจ.อุทัยธานี)](https://uthaihealth.moph.go.th/uthkpi67/document/140.pdf) — สูตร Ratio, เกณฑ์ Risk Score, ความหมาย 7 ระดับ, เป้าหมายปีงบ 67–71\n- [ข้อมูลวิเคราะห์วิกฤตทางการเงินระดับ 7 (Risk Scoring Plus) ไตรมาส 4/2568](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20251113043601.pdf) — ตัวชี้วัด Plus\n- [การวิเคราะห์ 7 Plus Efficiency Score และ TPS จ.สกลนคร (ข้อมูล ธ.ค. 2568)](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20260123092014.pdf) — เกณฑ์ ACP-UC 60 วัน, เป้า TPS/7 Plus, กรณี Risk ต่ำแต่ประสิทธิภาพต่ำ\n- [รายงานสถานการณ์การเงินการคลัง รพ.โพธิ์ตาก ปีงบ 2566–2569](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20260608053511.pdf) — กรณีศึกษาบทที่ 7, มาตรฐาน APP 90 วัน\n- [แผนทางการเงิน (Planfin) ปีงบ 2568 สสจ.อุดรธานี (11 พ.ย. 2567)](https://r8.moph.go.th/r8wayNewadmin/page/upload_file/20241109054225.pdf)\n- [การบริหารจัดการลูกหนี้ค่ารักษาพยาบาล จ.อุดรธานี ณ 30 เม.ย. 2567](https://r8.moph.go.th/r8wayNewadmin/page/upload_file/20240521031539.pdf)\n- [รายงานลูกหนี้ค่ารักษาแยกสิทธิ เขต 8 (ส.ค. 2567)](https://r8.moph.go.th/r8wayNewadmin/page/upload_file/20240822021519.pdf)\n- [การบริหารจัดการเพื่อป้องกันวิกฤตการเงินระดับ 7 เขต 8](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20240219102839.pdf)\n- [CFO ประกัน จ.กาฬสินธุ์ ไตรมาส 4/2567](https://ksn.moph.go.th/wp-content/uploads/2024/09/5.13.1-CFO-ประกัน.pdf) — เกณฑ์ Planfin ±5%\n\nสิ่งที่ยังต้องหาเพิ่มหลังเริ่มงาน: คู่มือเกณฑ์ 7 Plus / TPS ปีงบ 2570 ฉบับทางการ, คู่มือบัญชีหน่วยบริการ สป.สธ. ฉบับล่าสุด, แนวทาง Planfin ปีงบ 2570 ของ จ.อุดรธานี\n\n### แผนผังความคิด (Mind map)\n\nจำภาพนี้ให้ได้ก่อนไปบทถัดไป — ลองปิดจอแล้ววาดเองบนกระดาษ\n\n```mindmap\nอ่านงบ รพ. ใน 30 นาที\n- ภาษาบัญชี (บท 1–2)\n  - สมการบัญชี · Dr/Cr\n  - งบ 4 ตัวผูกกัน 3 จุด\n- บัญชี รพ.สธ. (บท 3)\n  - ลูกหนี้ 9 สิทธิ\n  - Revenue cycle · Aging\n- เครื่องมือ (บท 4–5)\n  - Ratio 4 กลุ่ม\n  - Risk Score 0–7 · 7 Plus · TPS\n  - Planfin ±5%\n- เคลม → เงิน (บท 6)\n  - ปัญหาเคลม → บรรทัดในงบ\n  - สูตร ACP → เงินสด\n- ลงมือ (บท 7)\n  - Detect → Document\n  - Action plan มีตัวเลข + วันที่\n- กติกาเหล็ก\n  - ทุกตัวเลขต้องมีแหล่ง\n  - ตรวจหนังสือสั่งการปีปัจจุบัน\n  - ห้ามข้อมูลผู้ป่วย (PDPA)\n```\n", "manual": "<p><strong>ระบบประกันสุขภาพ โรงพยาบาลรัฐ<\/strong><\/p>\n<p>คู่มือปฏิบัติงานสำหรับงานประกันสุขภาพระดับจังหวัด<\/p>\n<p>8 บทหลัก + ภาคผนวก<\/p>\n<p>ฉบับปรับปรุง ตุลาคม 2569 · อ้างอิงปีงบประมาณ 2569–2570<\/p>\n<p>ใช้คู่กับไฟล์ ระบบวิเคราะห์ประกันสุขภาพ_เขต8.xlsx และ ตำราคำศัพท์และตัวย่องานประกันสุขภาพ<\/p>\n<h2>สารบัญ<\/h2>\n<table>\n\n<thead>\n<tr>\n<th><strong>บท<\/strong><\/th>\n<th><strong>เรื่อง<\/strong><\/th>\n<th><strong>สาระสำคัญ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>แผนที่ระบบ — 3 กองทุนหลักและสิทธิย่อย<\/th>\n<th>โครงสร้างผู้ซื้อบริการ กลไกการจ่าย และจุดอ่อนของแต่ละกองทุน<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>โครงสร้างงบกองทุน UC และเส้นทางเดินเงิน<\/th>\n<th>งบปีงบ 2570 ที่อนุมัติจริง เส้นทาง 4 ชั้น และประเด็น รพ.สต.ถ่ายโอน<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>DRG / AdjRW / CMI<\/th>\n<th>กลไกจ่ายผู้ป่วยใน อัตราจ่ายปี 2569–2570 จุดรั่วของ coding และการตรวจสอบก่อน-หลังจ่าย<\/th>\n<\/tr>\n<tr>\n<th>4<\/th>\n<th>ระบบเคลมและการแก้ปัญหา \"ติด C\"<\/th>\n<th>FDH, e-Claim, AIPN, Authen Code วงจรเคลม 6 ขั้น และ KPI ที่ต้องติดตาม<\/th>\n<\/tr>\n<tr>\n<th>5<\/th>\n<th>Planfin, วิกฤติการเงินระดับ 7 และ Unit cost<\/th>\n<th>เกณฑ์ Risk Score 3 มิติ การอ่านสถานะการเงิน และแผนฟื้นฟู<\/th>\n<\/tr>\n<tr>\n<th>6<\/th>\n<th>มาตรา 41 และมาตรา 18(4)<\/th>\n<th>เงินช่วยเหลือเบื้องต้น — จุดเชื่อมกับงาน Risk Management<\/th>\n<\/tr>\n<tr>\n<th>7<\/th>\n<th>เปรียบเทียบ 3 กองทุนและการไล่เบิกสิทธิซ้อน<\/th>\n<th>พ.ร.บ.รถ, กองทุนเงินทดแทน, UCEP และลำดับการเบิกที่ถูกต้อง<\/th>\n<\/tr>\n<tr>\n<th>8<\/th>\n<th>บทบาท สสจ. และการเขียนหนังสือประสานงาน<\/th>\n<th>ภารกิจ 10 ด้าน · ชนิดหนังสือ · บันไดความเข้ม · แม่แบบ 5 ฉบับ<\/th>\n<\/tr>\n<tr>\n<th>ผนวก<\/th>\n<th>ภาคผนวก<\/th>\n<th>ศัพท์ที่ใช้บ่อย · ปฏิทินงานรายปี · Checklist ประจำเดือน · คู่มือเชื่อมไฟล์ Excel · เอกสารอ้างอิง<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>สิ่งที่เปลี่ยนจากฉบับกันยายน 2569<\/strong><\/p>\n<blockquote>\n<p>• งบกองทุนปี 2570 ใช้ตัวเลขที่อนุมัติจริง: เหมาจ่ายรายหัว <strong>4,669.44 บาท/คน<\/strong> (ฉบับเดิมใช้ข้อเสนอ 5,299 บาท)<\/p>\n<p>• อัตราจ่ายผู้ป่วยในปี 2570 <strong>ไม่เกิน 9,142 บาท/AdjRW<\/strong> (ฉบับเดิมใช้ 10,000 บาท ซึ่งเป็นข้อเสนอเดิม)<\/p>\n<p>• เพิ่มระบบ <strong>FDH<\/strong> ในบทที่ 4 ซึ่ง รพ. สังกัด สธ. ใช้ส่งเบิกบัตรทองตั้งแต่ 1 เมษายน 2567<\/p>\n<p>• แก้เกณฑ์ <strong>Risk Score วิกฤติการเงิน<\/strong> ในบทที่ 5 เป็น 3 มิติ: NWC และ NI ข้อละ 1 คะแนน และเพิ่มมิติระยะเวลาทุนหมด 0–2 คะแนน<\/p>\n<p>• เพิ่มประเด็นหลักเกณฑ์ปี 2570: National Health Package ปฐมภูมิ และการตรวจสอบก่อน-หลังจ่ายด้วย AI<\/p>\n<p>• เพิ่มผนวกเชื่อมแต่ละบทกับชีตในไฟล์ Excel<\/p>\n<\/blockquote><\/div>\n<h2>วิธีใช้คู่มือเล่มนี้<\/h2>\n<p>บทที่ 1–2 คือโครงสร้างที่ต้องเข้าใจก่อน บทที่ 3–4 คือกลไกที่ทำให้เงินเข้าจริง บทที่ 5 คือการอ่านผลลัพธ์ บทที่ 6–7 คือประเด็นเฉพาะที่พบบ่อยในงานประจำ บทที่ 8 คือการแปลงทั้งหมดเป็นหนังสือที่สั่งการได้จริง<\/p>\n<p>ตัวเลขอัตราจ่าย เกณฑ์ และรหัสเปลี่ยนทุกปีงบประมาณ ใช้คู่มือนี้เป็นกรอบความเข้าใจ และยึดประกาศ/คู่มือบริหารกองทุนฉบับปีปัจจุบันเมื่อใช้อ้างอิงในหนังสือราชการ<\/p>\n<h2 id=\"m-ch1\">บทที่ 1 · แผนที่ระบบ<\/h2>\n<h3>1.1 หลักคิดตั้งต้น<\/h3>\n<p>ระบบสุขภาพไทยแยก <strong>ผู้ซื้อบริการ (Purchaser)<\/strong> ออกจาก <strong>ผู้ให้บริการ (Provider)<\/strong> โรงพยาบาลรัฐจึงไม่ได้รับเงินจากงบประมาณแผ่นดินก้อนเดียว แต่รับจากหลายกองทุนที่มีกติกาต่างกัน การเข้าใจว่า \"ใครเป็นคนจ่าย และจ่ายด้วยกลไกอะไร\" คือพื้นฐานของงานประกันสุขภาพทั้งหมด<\/p>\n<h3>1.2 สามกองทุนหลัก<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ประเด็น<\/strong><\/th>\n<th><strong>UCS (บัตรทอง)<\/strong><\/th>\n<th><strong>SSS (ประกันสังคม)<\/strong><\/th>\n<th><strong>CSMBS (ข้าราชการ)<\/strong><\/th>\n<\/tr>\n<tr>\n<th>ผู้ซื้อบริการ<\/th>\n<th>สปสช.<\/th>\n<th>สปส. (กระทรวงแรงงาน)<\/th>\n<th>กรมบัญชีกลาง (กระทรวงการคลัง)<\/th>\n<\/tr>\n<tr>\n<th>กฎหมาย<\/th>\n<th>พ.ร.บ.หลักประกันสุขภาพแห่งชาติ พ.ศ. 2545<\/th>\n<th>พ.ร.บ.ประกันสังคม พ.ศ. 2533<\/th>\n<th>พ.ร.ฎ.เงินสวัสดิการเกี่ยวกับการรักษาพยาบาล พ.ศ. 2553<\/th>\n<\/tr>\n<tr>\n<th>ผู้มีสิทธิ<\/th>\n<th>ประมาณ 47 ล้านคน (ปีงบ 2570 คิดงบที่ 47.17 ล้านคน)<\/th>\n<th>ประมาณ 13 ล้านคน<\/th>\n<th>ประมาณ 4–5 ล้านคน<\/th>\n<\/tr>\n<tr>\n<th>แหล่งเงิน<\/th>\n<th>ภาษี<\/th>\n<th>สมทบ 3 ฝ่าย (ลูกจ้าง/นายจ้าง/รัฐ)<\/th>\n<th>ภาษี<\/th>\n<\/tr>\n<tr>\n<th>ผู้ป่วยนอก<\/th>\n<th>Capitation ตามประชากรที่ลงทะเบียนกับ CUP + fee schedule บางรายการ<\/th>\n<th>Capitation ให้ รพ.คู่สัญญาหลัก<\/th>\n<th>Fee for service (เบิกจ่ายตรง)<\/th>\n<\/tr>\n<tr>\n<th>ผู้ป่วยใน<\/th>\n<th>Global budget ระดับเขต + DRG (AdjRW)<\/th>\n<th>Capitation + จ่ายเพิ่มตาม AdjRW ส่วนที่เกินเกณฑ์<\/th>\n<th>DRG แต่อัตราต่อ RW สูงกว่า UC<\/th>\n<\/tr>\n<tr>\n<th>ใครแบกความเสี่ยง<\/th>\n<th>หน่วยบริการ (เงินปลายปิด)<\/th>\n<th>หน่วยบริการ<\/th>\n<th>รัฐ (ปลายเปิดมากกว่า)<\/th>\n<\/tr>\n<tr>\n<th>จุดอ่อนเชิงระบบ<\/th>\n<th>งบไม่พอ รพ.ขาดทุนสะสม<\/th>\n<th>สิทธิผูกกับนายจ้าง ย้าย รพ.ยุ่งยาก<\/th>\n<th>ค่าใช้จ่ายสูง ควบคุมยาก<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>ประเด็นเชิงนโยบายที่ต้องเข้าใจ<\/strong><\/p>\n<p>คนไทย 3 คนที่ป่วยด้วยโรคเดียวกันแต่ถือสิทธิต่างกัน ทำให้โรงพยาบาลได้รับเงินไม่เท่ากัน นี่คือที่มาของข้อถกเถียงเรื่อง \"ความเหลื่อมล้ำ 3 กองทุน\" และความพยายามบูรณาการสิทธิประโยชน์ให้ใกล้เคียงกัน<\/p><\/div>\n<h3>1.3 สิทธิย่อยที่ต้องรู้จัก<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>สิทธิ<\/strong><\/th>\n<th><strong>ผู้รับผิดชอบ<\/strong><\/th>\n<th><strong>ข้อสังเกตในทางปฏิบัติ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>สิทธิพนักงาน/ลูกจ้าง อปท.<\/th>\n<th>สปสช. บริหารแทน<\/th>\n<th>กติกาคล้าย CSMBS แต่เบิกผ่านระบบ สปสช.<\/th>\n<\/tr>\n<tr>\n<th>กองทุนคืนสิทธิ (บุคคลที่มีปัญหาสถานะและสิทธิ)<\/th>\n<th>กระทรวงสาธารณสุข<\/th>\n<th>งบ non-capitation แยกต่างหาก สำคัญมากในจังหวัดชายแดน<\/th>\n<\/tr>\n<tr>\n<th>ประกันสุขภาพแรงงานต่างด้าว<\/th>\n<th>กระทรวงสาธารณสุข (ไม่ใช่ สปสช.)<\/th>\n<th>รพ. ขายบัตร เงินเข้า รพ.โดยตรง เสี่ยงขาดทุนถ้าบริหารไม่ดี<\/th>\n<\/tr>\n<tr>\n<th>พ.ร.บ.ผู้ประสบภัยจากรถ<\/th>\n<th>บริษัทประกัน / กองทุนทดแทนผู้ประสบภัย<\/th>\n<th>ต้องเบิกก่อนเสมอ เป็นจุดที่ รพ.เสียรายได้มากที่สุดจุดหนึ่ง<\/th>\n<\/tr>\n<tr>\n<th>กองทุนเงินทดแทน<\/th>\n<th>สปส.<\/th>\n<th>ลูกจ้างบาดเจ็บจากการทำงาน คนละส่วนกับประกันสังคมทั่วไป<\/th>\n<\/tr>\n<tr>\n<th>ประกันสุขภาพเอกชน<\/th>\n<th>บริษัทประกัน<\/th>\n<th>เบิกส่วนเกินได้ ต้องคัดกรองตั้งแต่จุดลงทะเบียน<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>1.4 กลไกการจ่ายเงิน 5 รูปแบบ<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>กลไก<\/strong><\/th>\n<th><strong>หลักการ<\/strong><\/th>\n<th><strong>ใครแบกความเสี่ยง<\/strong><\/th>\n<th><strong>ตัวอย่าง<\/strong><\/th>\n<\/tr>\n<tr>\n<th>Capitation<\/th>\n<th>จ่ายตามหัวประชากรที่ลงทะเบียน ไม่ขึ้นกับปริมาณงาน<\/th>\n<th>หน่วยบริการเต็ม 100%<\/th>\n<th>OP ทั่วไป UC, OP ประกันสังคม<\/th>\n<\/tr>\n<tr>\n<th>Global budget + DRG<\/th>\n<th>วงเงินเขตปลายปิด หารด้วยผลงานรวมทั้งเขต<\/th>\n<th>หน่วยบริการร่วมกันทั้งเขต<\/th>\n<th>IP ทั่วไป UC<\/th>\n<\/tr>\n<tr>\n<th>Fee schedule<\/th>\n<th>จ่ายตามรายการและอัตราที่ประกาศล่วงหน้า<\/th>\n<th>ผู้ซื้อบริการ<\/th>\n<th>ทันตกรรม, PP บางรายการ, อุปกรณ์คนพิการ<\/th>\n<\/tr>\n<tr>\n<th>Point system with ceiling<\/th>\n<th>ให้แต้มถ่วงน้ำหนักแล้วหารวงเงินที่มี<\/th>\n<th>หน่วยบริการ<\/th>\n<th>แพทย์แผนไทย, PP บางส่วน<\/th>\n<\/tr>\n<tr>\n<th>Central reimbursement<\/th>\n<th>เบิกจากส่วนกลาง บางครั้งจ่ายเป็นของแทนเงิน<\/th>\n<th>ผู้ซื้อบริการ<\/th>\n<th>ยา จ(2), ยา CL, อวัยวะเทียม, สายสวนหัวใจ, น้ำยา CAPD<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>สรุปบทที่ 1 — 3 ข้อที่ต้องจำ<\/strong><\/p>\n<p>1. แยกให้ออกว่าผู้ป่วยรายนี้อยู่สิทธิใด เพราะกลไกจ่ายต่างกันโดยสิ้นเชิง<\/p>\n<p>2. UC เป็นระบบ \"เงินปลายปิด\" ความเสี่ยงทางการเงินตกอยู่ที่โรงพยาบาลเป็นหลัก<\/p>\n<p>3. ก่อนใช้สิทธิหลัก ต้องตรวจเสมอว่ามีสิทธิอื่นที่ต้องเบิกก่อน (พ.ร.บ.รถ / กองทุนเงินทดแทน / ประกันเอกชน)<\/p><\/div>\n<h2 id=\"m-ch2\">บทที่ 2 · โครงสร้างงบกองทุน UC และเส้นทางเดินเงิน<\/h2>\n<h3>2.1 งบกองทุนแบ่งเป็น 2 ก้อนใหญ่<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ก้อน<\/strong><\/th>\n<th><strong>ลักษณะ<\/strong><\/th>\n<th><strong>ประกอบด้วย<\/strong><\/th>\n<\/tr>\n<tr>\n<th><p>กลุ่ม A<\/p>\n<p>งบเหมาจ่ายรายหัว<\/p><\/th>\n<th>ตั้งวงเงินรวมแล้วหารด้วยจำนวนผู้มีสิทธิ ได้อัตรา \"บาทต่อหัว\"<\/th>\n<th>OP ทั่วไป, IP ทั่วไป, บริการกรณีเฉพาะ (CR), P&amp;P, ฟื้นฟูสมรรถภาพ, แพทย์แผนไทย, งบลงทุน (ค่าเสื่อม), เงินช่วยเหลือเบื้องต้น, QOF<\/th>\n<\/tr>\n<tr>\n<th><p>กลุ่ม B<\/p>\n<p>งบนอกเหมาจ่ายรายหัว<\/p><\/th>\n<th>ตั้งเป็นวงเงินเฉพาะโรค/เฉพาะกลุ่ม ไม่หารรายหัว<\/th>\n<th>เอดส์, ไตวายเรื้อรัง (RRT), NCD (DM/HT/COPD), LTC ผู้สูงอายุภาวะพึ่งพิง, ผู้มีปัญหาสถานะและสิทธิ, พื้นที่กันดาร/3 จชต., เงินเดือนหน่วยบริการภาครัฐ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>2.2 ตัวเลขงบกองทุนปีงบประมาณ 2570<\/h3>\n<p>บอร์ด สปสช. เคยเสนอ ครม. ให้เพิ่มเหมาจ่ายรายหัวปี 2570 เป็น 5,299 บาทต่อประชากร (ธันวาคม 2568) แต่วงเงินที่ได้รับจัดสรรจริงต่ำกว่าข้อเสนอ ตัวเลขที่ใช้ทำงานปี 2570 คือชุดด้านล่าง<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>รายการ<\/strong><\/th>\n<th><strong>ปีงบ 2570<\/strong><\/th>\n<th><strong>เทียบปี 2569<\/strong><\/th>\n<\/tr>\n<tr>\n<th>วงเงินกองทุนรวม<\/th>\n<th>289,113.05 ล้านบาท<\/th>\n<th>+23,817.46 ล้านบาท (+8.98%)<\/th>\n<\/tr>\n<tr>\n<th>ค่าบริการ (ไม่รวมเงินเดือน)<\/th>\n<th>214,144.41 ล้านบาท<\/th>\n<th>+10.47%<\/th>\n<\/tr>\n<tr>\n<th>เงินเดือนบุคลากรหน่วยบริการภาครัฐ<\/th>\n<th>74,968.64 ล้านบาท<\/th>\n<th>+4.93%<\/th>\n<\/tr>\n<tr>\n<th>งบเหมาจ่ายรายหัว (กลุ่ม A)<\/th>\n<th>220,257.68 ล้านบาท<\/th>\n<th>—<\/th>\n<\/tr>\n<tr>\n<th>งบนอกเหมาจ่ายรายหัว (กลุ่ม B)<\/th>\n<th>68,855.36 ล้านบาท<\/th>\n<th>—<\/th>\n<\/tr>\n<tr>\n<th>ประชากรผู้มีสิทธิที่ใช้คิดงบ<\/th>\n<th>47.170 ล้านคน<\/th>\n<th>—<\/th>\n<\/tr>\n<tr>\n<th><strong>อัตราเหมาจ่ายรายหัว<\/strong><\/th>\n<th><strong>4,669.44 บาท/คน<\/strong><\/th>\n<th>+493.45 บาท (+11.83%) จาก 4,175.99 บาท<\/th>\n<\/tr>\n<tr>\n<th>สิทธิประโยชน์ใหม่ 11 รายการ<\/th>\n<th>1,348.97 ล้านบาท<\/th>\n<th>เช่น เทคโนโลยีการแพทย์ขั้นสูง, วัคซีนนิวโมคอคคัสในเด็กเล็ก, TAVI, ปลูกถ่ายหัวใจ ปอด ตับ, ประสาทหูเทียม<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<p>ประเด็นหลักเกณฑ์ปี 2570 ที่กระทบงานจังหวัด<\/p>\n<p>บอร์ด สปสช. เห็นชอบหลักเกณฑ์บริหารกองทุนปี 2570 โดยปรับ 12 ประเด็น (ประชุม 2 กันยายน 2569) ประเด็นที่งานประกันสุขภาพจังหวัดต้องเตรียมรับ:<\/p>\n<blockquote>\n<p>• <strong>อัตราจ่ายผู้ป่วยในไม่เกิน 9,142 บาทต่อ AdjRW<\/strong> (รายละเอียดบทที่ 3)<\/p>\n<p>• <strong>National Health Package<\/strong> สำหรับบริการปฐมภูมิ รวมงบ OP และ P&amp;P ส่งตรงให้หน่วยบริการปฐมภูมิและเครือข่าย กระทบการจัดสรรเงินภายใน CUP และ รพ.สต.ถ่ายโอน<\/p>\n<p>• <strong>ระบบตรวจสอบด้วย AI<\/strong> ทั้งก่อนจ่าย (pre-payment audit) และหลังจ่าย (post-payment audit) เน้นตรวจความถูกต้องและความคุ้มค่า<\/p>\n<p>• หลัก \"Value for Money\" — ลดบริการที่ไม่มีข้อบ่งชี้ทางคลินิก เน้นปฐมภูมิและการป้องกันโรค<\/p>\n<p>• ปรับการเชื่อมโยงข้อมูล การจัดซื้อยา งานเอชไอวี และวัณโรคในชุมชน<\/p>\n<\/blockquote>\n<div class=\"callout\"><p><strong>กับดักที่พบบ่อยที่สุด<\/strong><\/p>\n<p>การนำอัตราเหมาจ่ายรายหัวคูณจำนวนประชากร แล้วสรุปว่านั่นคือเงินที่โรงพยาบาลจะได้รับ — ผิด เพราะ<\/p>\n<blockquote>\n<p>• ต้องหักเงินเดือนบุคลากรภาครัฐออกก่อน<\/p>\n<p>• เงินจำนวนมากไม่ได้จ่ายแบบเหมาจ่าย แต่จ่ายตามผลงานหรือจ่ายเป็นเวชภัณฑ์จากส่วนกลาง<\/p>\n<p>• IP จ่ายตามอัตราต่อ RW จริงของเขต ซึ่งมักต่ำกว่าเพดานที่ประกาศ<\/p>\n<\/blockquote>\n<p>บทเรียนปี 2570: ตัวเลข \"ข้อเสนอ\" กับตัวเลข \"ที่ได้รับจริง\" ต่างกันได้มาก อย่าทำ Planfin จากข่าวข้อเสนอ<\/p><\/div>\n<h3>2.3 เส้นทางเดินเงิน 4 ชั้น<\/h3>\n<h4>ชั้นที่ 1 — สปสช. ส่วนกลาง<\/h4>\n<blockquote>\n<p>• หักเงินเดือนหน่วยบริการภาครัฐออกก่อน ปัจจุบันหักในระดับประเทศ (เดิมหักระดับเขต ทำให้เขตที่มีบุคลากรหนาแน่นเสียเปรียบ)<\/p>\n<p>• กันงบบริหารจัดการและงบจ่ายจากส่วนกลาง เช่น ยาบัญชี จ(2), ยา CL, อวัยวะเทียม, สายสวนหัวใจ, น้ำยา CAPD, วัคซีน<\/p>\n<p>• รายการเหล่านี้มักจ่ายเป็น \"ของ\" ไม่ใช่ \"เงิน\" ผ่านเครือข่ายด้านยาและเวชภัณฑ์ โรงพยาบาลจึงไม่เห็นเป็นตัวเงินในบัญชี<\/p>\n<\/blockquote>\n<h4>ชั้นที่ 2 — สปสช. เขต<\/h4>\n<blockquote>\n<p>• IP: ได้ global budget ก้อนเดียวทั้งเขต หารด้วย Sum AdjRW ของทุกหน่วยบริการในเขต จึงได้อัตราจ่ายต่อ RW จริง<\/p>\n<p>• อปสข. มีอำนาจกำหนดหลักเกณฑ์จัดสรรบางรายการภายในเขต เช่น PPA, ค่าเสื่อมระดับเขต, การตามจ่าย OP refer<\/p>\n<\/blockquote>\n<div class=\"callout\"><p><strong>จุดยุทธศาสตร์ของ สสจ.<\/strong><\/p>\n<p>อปสข. คือเวทีที่ สสจ. ต้องมีส่วนร่วมอย่างจริงจัง เพราะหลักเกณฑ์การเกลี่ยเงินภายในเขตกระทบรายได้โรงพยาบาลในจังหวัดโดยตรง ข้อมูลเชิงประจักษ์มีน้ำหนักกว่าการโต้แย้งในที่ประชุมโดยไม่มีตัวเลข (ชีต ภาพรวมจังหวัด ในไฟล์ Excel ทำมาเพื่อเวทีนี้)<\/p><\/div>\n<h4>ชั้นที่ 3 — CUP (หน่วยบริการประจำ)<\/h4>\n<blockquote>\n<p>• ได้ OP capitation ตามประชากรที่ลงทะเบียน ปรับด้วยโครงสร้างอายุ (age-adjusted)<\/p>\n<p>• ต้องบริหารเงินก้อนนี้ให้ครอบคลุมทั้งเครือข่าย รวมถึงการตามจ่าย OP refer ไปหน่วยบริการอื่น<\/p>\n<p>• CUP ที่มีอัตรา refer สูงจะมีรายจ่ายตามจ่ายสูง กดกำไรส่วน OP ลงอย่างมีนัยสำคัญ<\/p>\n<\/blockquote>\n<h4>ชั้นที่ 4 — หน่วยบริการปฐมภูมิ / รพ.สต.<\/h4>\n<blockquote>\n<p>• รูปแบบเดิม: CUP จัดสรรลงตามข้อตกลง (ตามหัวประชากร / ผลงาน / เหมาจ่ายบางส่วน) และสนับสนุนยา เวชภัณฑ์ ระบบข้อมูล<\/p>\n<p>• รูปแบบปัจจุบัน: รพ.สต. ที่ถ่ายโอนไปสังกัด อบจ. รับเงินตรงจาก สปสช. ไม่ผ่าน CUP<\/p>\n<p>• ปี 2570: National Health Package ปฐมภูมิทำให้เงิน OP และ P&amp;P ไปถึงหน่วยปฐมภูมิโดยตรงมากขึ้น ข้อตกลงเดิมระหว่าง CUP กับหน่วยปฐมภูมิต้องทบทวนใหม่<\/p>\n<\/blockquote>\n<div class=\"callout\"><p><strong>ประเด็นร้อนที่ สสจ. ต้องบริหารจัดการ<\/strong><\/p>\n<p>การถ่ายโอน รพ.สต. ไป อบจ. สร้างความเสี่ยงหลายด้านพร้อมกัน<\/p>\n<blockquote>\n<p>• ระบบส่งต่อและระบบข้อมูลขาดตอน ทำให้เคลมตกหล่น<\/p>\n<p>• ข้อพิพาทเรื่องยาและเวชภัณฑ์ที่ CUP เคยสนับสนุน<\/p>\n<p>• ภาระงาน P&amp;P ที่ไม่ชัดว่าใครรับผิดชอบ ทำให้ผลงานตกทั้งสองฝ่าย<\/p>\n<\/blockquote>\n<p>มาตรการ: MOU ระหว่าง อบจ. กับ CUP ที่ระบุชัดเรื่องยา เวชภัณฑ์ ระบบส่งต่อ การแบ่งงาน P&amp;P และการใช้ระบบข้อมูลร่วมกัน<\/p><\/div>\n<h3>2.4 สูตรประมาณการรายได้ UC ของโรงพยาบาล<\/h3>\n<div class=\"callout\"><p><strong>รายได้ UC โดยประมาณ = (UC Pop × อัตรา OP ต่อหัว) − เงินเดือนที่ถูกหัก<\/strong><\/p>\n<p><strong>+ (Sum AdjRW × อัตราจ่ายต่อ RW จริงของเขต)<\/strong><\/p>\n<p><strong>+ บริการกรณีเฉพาะ (CR) ที่เบิกได้จริง + P&amp;P ตามผลงาน<\/strong><\/p>\n<p><strong>+ งบนอกเหมาจ่ายรายหัว (NCD, LTC, RRT, HIV)<\/strong><\/p><\/div>\n<p>หากผลลัพธ์ต่ำกว่าค่าใช้จ่ายดำเนินการ โรงพยาบาลจะเข้าสู่ภาวะ Planfin ติดลบตั้งแต่ต้นปี ซึ่งต้องวางแผนรับมือล่วงหน้า ไม่ใช่รอให้เกิดแล้วค่อยแก้<\/p>\n<div class=\"callout\"><p><strong>สรุปบทที่ 2 — 3 ข้อที่ต้องจำ<\/strong><\/p>\n<p>1. เงินที่ รพ.ได้จริง ≠ อัตราเหมาจ่ายรายหัว × ประชากร เพราะมีการหักเงินเดือนและกันงบส่วนกลาง<\/p>\n<p>2. IP เป็นระบบ zero-sum ภายในเขต ผลงานของ รพ.อื่นกระทบอัตราจ่ายของเราโดยตรง<\/p>\n<p>3. รพ.สต.ถ่ายโอนและ National Health Package คือจุดที่ต้องจัดการด้วยข้อตกลงเป็นลายลักษณ์อักษร<\/p><\/div>\n<h2 id=\"m-ch3\">บทที่ 3 · DRG / AdjRW / CMI<\/h2>\n<h3>3.1 ตรรกะพื้นฐาน<\/h3>\n<p>ระบบผู้ป่วยในไม่ได้จ่ายตาม \"ของที่ใช้จริง\" แต่จ่ายตาม \"ผู้ป่วยรายนี้ควรมีต้นทุนเท่าใด\" ซึ่งตัดสินจากสิ่งที่บันทึกในเวชระเบียนแล้วแปลงเป็นรหัส<\/p>\n<div class=\"callout\"><strong>เวชระเบียน → ICD-10 (การวินิจฉัย) + ICD-9-CM (หัตถการ) → Grouper → DRG → RW → AdjRW → จำนวนเงิน<\/strong><\/div>\n<div class=\"callout\"><p><strong>จุดที่เงินหายมากที่สุด<\/strong><\/p>\n<p>คือลูกศรแรก — การบันทึกเวชระเบียนและการให้รหัส ไม่ใช่ที่ สปสช. โรงพยาบาลจำนวนมากรักษาผู้ป่วยหนักเท่ากับ รพ.อื่น แต่ได้เงินน้อยกว่าเพราะบันทึกไม่ครบ<\/p><\/div>\n<h3>3.2 ศัพท์ที่ต้องแม่น<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ศัพท์<\/strong><\/th>\n<th><strong>ความหมาย<\/strong><\/th>\n<th><strong>ข้อควรรู้<\/strong><\/th>\n<\/tr>\n<tr>\n<th>DRG<\/th>\n<th>กลุ่มวินิจฉัยโรคร่วม รหัส 5 หลัก<\/th>\n<th>หลัก 1–2 = MDC (กลุ่มโรคหลักตามระบบอวัยวะ), หลัก 3–4 = ADRG, หลัก 5 = ระดับความรุนแรง<\/th>\n<\/tr>\n<tr>\n<th>RW<\/th>\n<th>ค่าน้ำหนักสัมพัทธ์ของ DRG<\/th>\n<th>ค่าคงที่ตามตาราง Thai DRG เวอร์ชันที่ประกาศใช้ในปีนั้น<\/th>\n<\/tr>\n<tr>\n<th>AdjRW<\/th>\n<th>RW ที่ปรับตามวันนอนจริง<\/th>\n<th>คือตัวที่นำไปคูณเงิน ไม่ใช่ RW ดิบ<\/th>\n<\/tr>\n<tr>\n<th>Sum AdjRW<\/th>\n<th>ผลรวม AdjRW ทั้งโรงพยาบาลในปีนั้น<\/th>\n<th>ตัวตั้งของรายได้ IP ทั้งก้อน<\/th>\n<\/tr>\n<tr>\n<th>CMI<\/th>\n<th>Sum AdjRW ÷ จำนวนผู้ป่วยในที่จำหน่าย<\/th>\n<th>ดัชนีความซับซ้อนเฉลี่ย ใช้เปรียบเทียบ รพ.ระดับเดียวกัน<\/th>\n<\/tr>\n<tr>\n<th>Outlier<\/th>\n<th>เคสที่วันนอนสั้นหรือยาวผิดปกติ<\/th>\n<th>Short stay ถูกลด AdjRW, Long stay ได้ปรับเพิ่มแบบขั้นบันได<\/th>\n<\/tr>\n<tr>\n<th>Base rate<\/th>\n<th>อัตราจ่ายต่อ 1 AdjRW<\/th>\n<th>อัตราที่ประกาศ ≠ อัตราที่ได้รับจริง<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>3.3 สูตรที่ต้องท่องได้ และอัตราจ่ายปี 2569–2570<\/h3>\n<div class=\"callout\"><p><strong>รายได้ IP = Sum AdjRW × อัตราจ่ายต่อ RW จริงของเขต<\/strong><\/p>\n<p><strong>อัตราจ่ายต่อ RW จริง = Global budget IP ของเขต ÷ Sum AdjRW ทั้งเขต<\/strong><\/p><\/div>\n<table>\n\n<thead>\n<tr>\n<th><strong>ปีงบ<\/strong><\/th>\n<th><strong>อัตราจ่าย IP (UC)<\/strong><\/th>\n<th><strong>หมายเหตุ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>2569<\/th>\n<th>8,350 บาท/AdjRW<\/th>\n<th>ยังเป็นงบปลายปิด อัตราจริงของแต่ละเขตขึ้นกับผลงานรวม<\/th>\n<\/tr>\n<tr>\n<th>2570<\/th>\n<th>ไม่เกิน 9,142 บาท/AdjRW<\/th>\n<th>มติบอร์ด สปสช. 2 ก.ย. 2569 พร้อมตรวจสอบก่อนและหลังจ่าย (ข้อเสนอเดิม 10,000 บาท ไม่ผ่าน)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<p>นัยสำคัญ 3 ประการ<\/p>\n<blockquote>\n<p><strong>1. เป็น zero-sum ภายในเขต<\/strong> — เมื่อ รพ.อื่นในเขตเพิ่ม AdjRW อัตราจ่ายต่อ RW ของทุกแห่งลดลง<\/p>\n<p><strong>2. อัตราจริงต่ำกว่าเพดานได้<\/strong> — 9,142 บาทคือเพดาน ใช้ทำ Planfin ไม่ได้โดยตรง ต้องใช้อัตราจริงของเขตปีก่อนเป็นฐาน (ชีต Planfin_Waterfall คำนวณส่วนต่างนี้ให้)<\/p>\n<p><strong>3. รพ.ที่ให้รหัสไม่ครบเสียเปรียบสองต่อ<\/strong> — ได้ AdjRW น้อยกว่าที่ควร และถูกดึงอัตราต่อ RW ลงโดย รพ.ที่ให้รหัสครบกว่า<\/p>\n<\/blockquote>\n<h3>3.4 ปัจจัยที่ดัน RW ขึ้น<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ลำดับ<\/strong><\/th>\n<th><strong>ปัจจัย<\/strong><\/th>\n<th><strong>คำอธิบาย<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>หัตถการ (ICD-9-CM)<\/th>\n<th>มีพลังมากที่สุด เคสเดียวกันหากมีรหัสผ่าตัดจะย้ายไป ADRG ที่ RW สูงกว่ามาก<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>Comorbidity / Complication<\/th>\n<th>CC และ MCC ยกระดับความรุนแรง<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>Principal Diagnosis ที่ถูกต้อง<\/th>\n<th>ต้องเป็นโรคที่ทำให้ต้องรับไว้ในโรงพยาบาล ไม่ใช่โรคที่ใช้เวลารักษานานที่สุด<\/th>\n<\/tr>\n<tr>\n<th>4<\/th>\n<th>สถานะการจำหน่าย<\/th>\n<th>เสียชีวิต / ส่งต่อ / ไม่สมัครใจรักษา มีผลต่อการปรับค่า<\/th>\n<\/tr>\n<tr>\n<th>5<\/th>\n<th>อายุ และน้ำหนักแรกเกิด<\/th>\n<th>ตัวแปรใน grouper สำหรับบางกลุ่มโรค โดยเฉพาะทารกแรกเกิด<\/th>\n<\/tr>\n<tr>\n<th>6<\/th>\n<th>วันนอน (LOS)<\/th>\n<th>ไม่เพิ่ม RW โดยตรง แต่ป้องกันการถูกหักจาก short stay<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>3.5 จุดรั่วที่พบบ่อย (เน้นห้องผ่าตัดและ ICU)<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>จุดรั่ว<\/strong><\/th>\n<th><strong>ผลกระทบ<\/strong><\/th>\n<th><strong>วิธีปิด<\/strong><\/th>\n<\/tr>\n<tr>\n<th>ไม่ลงรหัสหัตถการเสริม เช่น central line, arterial line, intubation, ชั่วโมงเครื่องช่วยหายใจ<\/th>\n<th>เสีย CC/MCC ทั้งกลุ่ม RW ตกหนึ่งระดับ<\/th>\n<th>checklist ให้ห้องผ่าตัดและ ICU ส่งรายการหัตถการเข้าเวชระเบียนทุกเคส<\/th>\n<\/tr>\n<tr>\n<th>ใช้เครื่องช่วยหายใจแต่ไม่ระบุจำนวนชั่วโมง<\/th>\n<th>ตกเกณฑ์ ADRG กลุ่ม ventilator ซึ่ง RW สูงมาก<\/th>\n<th>บันทึกเป็นตัวเลขชั่วโมงทุกราย ไม่ใช้คำว่า \"on ET tube\" เฉย ๆ<\/th>\n<\/tr>\n<tr>\n<th>สรุปเวชระเบียนจำหน่ายล่าช้าหรือไม่ครบ<\/th>\n<th>ผู้ให้รหัสไม่มีข้อมูล จึงให้รหัสต่ำไว้ก่อน<\/th>\n<th>KPI สรุปเวชระเบียนภายใน 7–15 วัน รายงานรายบุคคล<\/th>\n<\/tr>\n<tr>\n<th>โรคร่วมที่ควบคุมอยู่แล้วไม่ถูกบันทึก เช่น DM, CKD, AF, COPD<\/th>\n<th>เสียระดับความรุนแรง<\/th>\n<th>ระบุใน discharge summary แม้ไม่ได้รักษาโดยตรงในครั้งนั้น<\/th>\n<\/tr>\n<tr>\n<th>เลือก Principal Diagnosis ผิด โดยเลือกภาวะแทรกซ้อนเป็นโรคหลัก<\/th>\n<th>RW ต่ำกว่าที่ควร หรือถูกเรียกเงินคืน<\/th>\n<th>ทบทวนร่วมกับผู้ให้รหัสก่อนส่งเคลม<\/th>\n<\/tr>\n<tr>\n<th>ไม่แยกเคสที่เบิกบริการกรณีเฉพาะ (CR) ออกจาก DRG<\/th>\n<th>เสียโอกาสเบิกส่วนกลางซึ่งเป็นเงินคนละก้อน<\/th>\n<th>รายการ CR ติดไว้ที่ห้องเคลม ทบทวนทุกเดือน (ชีต เคลมค้าง_ยอดโอน แสดง CR ตกหล่น)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>3.6 การอ่านค่า CMI<\/h3>\n<blockquote>\n<p>• ค่าอ้างอิงคร่าว ๆ: รพ.ชุมชน ประมาณ 0.6–0.8 · รพ.ทั่วไป ประมาณ 0.8–1.2 · รพ.ศูนย์ ตั้งแต่ 1.2 ขึ้นไป<\/p>\n<p>• CMI ต่ำผิดปกติ อาจไม่ได้แปลว่าเคสง่าย แต่แปลว่าการให้รหัสอ่อน ต้อง coding audit ก่อนสรุปว่าศักยภาพต่ำ<\/p>\n<p>• CMI สูงขึ้นเร็วผิดปกติ เป็นธงแดงของ upcoding ซึ่งระบบตรวจสอบด้วย AI ปี 2570 จะจับได้เร็วขึ้น<\/p>\n<\/blockquote>\n<div class=\"callout\"><p><strong>เทคนิควินิจฉัยแยกโรค<\/strong><\/p>\n<p>ดู CMI แยกตาม MDC เทียบกับ รพ.ระดับเดียวกันในเขต (ชีต MDC_Gap)<\/p>\n<blockquote>\n<p>• ต่ำเฉพาะบาง MDC → ปัญหาการให้รหัสในกลุ่มโรคนั้น<\/p>\n<p>• ต่ำทั้งกระดาน → ปัญหาศักยภาพการให้บริการจริง หรือปัญหาระบบเวชระเบียนทั้งระบบ<\/p>\n<\/blockquote><\/div>\n<h3>3.7 การตรวจสอบเวชระเบียนและการตรวจสอบก่อน-หลังจ่าย<\/h3>\n<blockquote>\n<p>• <strong>Post-payment audit<\/strong> — สปสช. สุ่มตรวจเวชระเบียนย้อนหลัง หากการให้รหัสไม่มีหลักฐานรองรับจะเรียกเงินคืน ผลตรวจแบ่งเป็น ถูกต้อง / ปรับ RW เพิ่ม / ปรับ RW ลด<\/p>\n<p>• <strong>Pre-payment audit<\/strong> (เริ่มเข้มขึ้นปี 2570) — ระบบ AI คัดกรองข้อมูลก่อนจ่าย รายการผิดปกติจะถูกระงับหรือขอเอกสารเพิ่ม เงินเข้าช้าลงถ้าเอกสารไม่พร้อม<\/p>\n<p>• สาเหตุที่หน่วยบริการแพ้การตรวจสอบมากที่สุด ไม่ใช่ \"ให้รหัสผิด\" แต่คือ \"ไม่มีหลักฐานบันทึกในเวชระเบียน\"<\/p>\n<\/blockquote>\n<div class=\"callout\"><p><strong>กฎเหล็ก<\/strong><\/p>\n<p>ไม่บันทึก = ไม่ได้ทำ — ต่อให้ทำจริงก็ตาม หลักการนี้ใช้ได้ทั้งกับการเบิกจ่ายและการต่อสู้คดีทางการแพทย์<\/p><\/div>\n<h3>3.8 แผนปฏิบัติการระดับจังหวัด<\/h3>\n<blockquote>\n<p><strong>1.<\/strong> ดึง Sum AdjRW, CMI และจำนวนผู้ป่วยจำหน่ายของทุก รพ. ย้อนหลัง 3 ปี ทำเป็นแนวโน้ม (ชีต ControlChart)<\/p>\n<p><strong>2.<\/strong> หา 5 อันดับ MDC ที่แต่ละ รพ. มี CMI ต่ำกว่าค่ากลางเขต เพื่อชี้เป้าการตรวจสอบ (ชีต MDC_Gap)<\/p>\n<p><strong>3.<\/strong> เปรียบเทียบอัตราจ่ายต่อ RW ที่ได้รับจริงกับที่ประมาณการใน Planfin เพื่อหาช่องว่าง<\/p>\n<p><strong>4.<\/strong> ตั้งทีม coding audit ระดับจังหวัด สุ่มตรวจ 30–50 ฉบับต่อ รพ. ต่อไตรมาส ก่อนที่ สปสช. หรือระบบ AI จะตรวจพบ<\/p>\n<p><strong>5.<\/strong> ออกหนังสือให้ทุก รพ. กำหนด KPI การสรุปเวชระเบียนภายใน 15 วัน และรายงานผลรายเดือน<\/p>\n<\/blockquote>\n<h2 id=\"m-ch4\">บทที่ 4 · ระบบเคลมและการแก้ปัญหา &quot;ติด C&quot;<\/h2>\n<h3>4.1 แผนผังระบบที่ต้องรู้จัก<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ระบบ<\/strong><\/th>\n<th><strong>ใช้กับอะไร<\/strong><\/th>\n<\/tr>\n<tr>\n<th><p><strong>FDH (Financial Data Hub)<\/strong><\/p>\n<p>ศูนย์กลางข้อมูลด้านการเงิน สธ.<\/p><\/th>\n<th>รพ. สังกัด สธ. ส่งข้อมูลเบิกบัตรทองผ่าน FDH เป็นช่องทางเดียวตั้งแต่ 1 เมษายน 2567 ข้อมูลไหลจาก HIS ของ รพ. → FDH → สปสช. ติดตามสถานะการตรวจสอบและยอดชดเชยได้จาก FDH<\/th>\n<\/tr>\n<tr>\n<th>e-Claim<\/th>\n<th>ผู้ป่วยในทุกสิทธิ, OP กรณีเฉพาะ, อุบัติเหตุ/เจ็บป่วยฉุกเฉิน, UCEP, OP refer ข้ามจังหวัด — ข้อมูลจาก FDH เชื่อมเข้าระบบนี้<\/th>\n<\/tr>\n<tr>\n<th>43 แฟ้ม → HDC / OP-PP Individual<\/th>\n<th>ผู้ป่วยนอกทั่วไป และ P&amp;P รายบุคคล (จ่ายตามผลงานและ fee schedule)<\/th>\n<\/tr>\n<tr>\n<th>AIPN<\/th>\n<th>แจ้งขออนุมัติรับผู้ป่วยในข้ามเขต/นอกเครือข่าย ไม่แจ้งภายใน 24 ชั่วโมง = ไม่ได้รับเงิน<\/th>\n<\/tr>\n<tr>\n<th>Seamless for DMIS<\/th>\n<th>โรคเฉพาะ เช่น ไตวายเรื้อรัง (HD/CAPD/KT), วัณโรค, มะเร็ง, Stroke/STEMI fast track, ธาลัสซีเมีย<\/th>\n<\/tr>\n<tr>\n<th>NAPPLUS<\/th>\n<th>ผู้ติดเชื้อเอชไอวีและผู้ป่วยเอดส์<\/th>\n<\/tr>\n<tr>\n<th>New Authen Code<\/th>\n<th>ยืนยันการเข้ารับบริการ เป็นเงื่อนไขบังคับของหลายรายการ<\/th>\n<\/tr>\n<tr>\n<th>Drug Catalogue<\/th>\n<th>ฐานรหัสยาสำหรับจ่ายชดเชย (ยา จ(2), ยา CL, ยากำพร้า)<\/th>\n<\/tr>\n<tr>\n<th>Statement / Smart Money Transfer<\/th>\n<th>ตรวจยอดโอน งวดโอน และรายการหัก<\/th>\n<\/tr>\n<tr>\n<th>e-Portal<\/th>\n<th>ขึ้นทะเบียนหน่วยบริการ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>เรื่องเร่งด่วนที่ต้องตรวจสอบ<\/strong><\/p>\n<p>ระบบ e-Claim ของ สปสช. เข้าใช้งานผ่าน Single Sign-On ด้วย ThaiD บัญชีที่ไม่ผูก ThaiD จะเข้าระบบไม่ได้ ถ้าเข้าระบบไม่ได้จะแก้ข้อมูลติด C ไม่ได้และเงินจะค้างเป็นเดือน — ตรวจว่าเจ้าหน้าที่เคลมทุก รพ. ในจังหวัดผูกบัญชีครบ และมีผู้ปฏิบัติแทนอย่างน้อย 2 คนต่อ รพ.<\/p><\/div>\n<h3>4.2 วงจรเคลม 6 ขั้น<\/h3>\n<div class=\"callout\"><p><strong>1 ตรวจสอบสิทธิ + Authen → 2 ให้บริการ / บันทึกเวชระเบียน → 3 ให้รหัส (Coding)<\/strong><\/p>\n<p><strong>→ 4 ส่งข้อมูลผ่าน FDH ภายในกำหนด → 5 ตรวจสอบ (ผ่าน / ติด C / ถูกระงับก่อนจ่าย) → 6 ประมวลผล → โอนเงิน<\/strong><\/p><\/div>\n<table>\n\n<thead>\n<tr>\n<th><strong>ขั้น<\/strong><\/th>\n<th><strong>จุดรั่ว<\/strong><\/th>\n<th><strong>ผลลัพธ์<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>ไม่ Authen / สิทธิว่าง / สิทธิไม่ตรงวันรับบริการ<\/th>\n<th>ติด C ทันที<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>เวชระเบียนบันทึกไม่ครบ<\/th>\n<th>ได้รหัสต่ำกว่าความเป็นจริง และแพ้การตรวจสอบ<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>ให้รหัสผิดหรือรหัสไม่สัมพันธ์กัน<\/th>\n<th>ติด C หรือถูกเรียกเงินคืนภายหลัง<\/th>\n<\/tr>\n<tr>\n<th>4<\/th>\n<th>ส่งข้อมูลเกินกำหนด / ข้อมูลค้างใน HIS ไม่ขึ้น FDH<\/th>\n<th>ถูกตัดสิทธิการเบิก<\/th>\n<\/tr>\n<tr>\n<th>5<\/th>\n<th>ปล่อยข้อมูลติด C ค้างไว้<\/th>\n<th>หมดเวลาแก้ไข = สูญเงินโดยไม่จำเป็น<\/th>\n<\/tr>\n<tr>\n<th>6<\/th>\n<th>ยอดโอนไม่ตรงกับที่ส่งเคลม<\/th>\n<th>ต้องอุทธรณ์ภายในกรอบเวลาที่กำหนด<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<p>กำหนดเวลาหลัก: โดยทั่วไปต้องส่งข้อมูลภายใน 30 วันนับจากวันจำหน่ายหรือวันให้บริการ และแก้ไขข้อมูลติด C ภายในกรอบที่ประกาศ เงื่อนไขแต่ละรายการไม่เท่ากัน ดูคู่มือแนวทางปฏิบัติในการขอรับค่าใช้จ่ายปีปัจจุบัน หัวข้อ \"สิ่งที่เปลี่ยนแปลง\"<\/p>\n<h3>4.3 &quot;ติด C&quot; คืออะไร<\/h3>\n<p>ติด C คือสถานะของข้อมูลที่ไม่ผ่านการตรวจสอบในกระบวนการพิจารณา มี 2 กรณีหลัก<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>สถานะ<\/strong><\/th>\n<th><strong>ความหมาย<\/strong><\/th>\n<th><strong>การจัดการ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>สถานะ 2<\/th>\n<th>ไม่ผ่านการตรวจสอบขั้นต้น (ระบบตรวจพบเอง เช่น ผิดรูปแบบ ผิดตรรกะ)<\/th>\n<th>หน่วยบริการแก้ไขเองได้ทันที<\/th>\n<\/tr>\n<tr>\n<th>สถานะ 3<\/th>\n<th>ไม่ผ่านการตรวจสอบจาก สปสช.<\/th>\n<th>แก้ตามเหตุผลที่ระบุ หรือยื่นอุทธรณ์<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<p>สาเหตุติด C ที่พบบ่อยที่สุด<\/p>\n<blockquote>\n<p><strong>1.<\/strong> สิทธิ ณ วันรับบริการไม่ตรง / สิทธิว่าง / เปลี่ยนสิทธิระหว่างนอนโรงพยาบาล<\/p>\n<p><strong>2.<\/strong> ไม่มี Authen Code หรือ Authen ผิดวัน<\/p>\n<p><strong>3.<\/strong> เลขประจำตัวประชาชน 13 หลักผิด หรือชื่อ-สกุลไม่ตรงฐานทะเบียนราษฎร<\/p>\n<p><strong>4.<\/strong> การวินิจฉัย–หัตถการ–เพศ–อายุ ไม่สัมพันธ์กัน<\/p>\n<p><strong>5.<\/strong> วันที่ผิดตรรกะ เช่น วันจำหน่ายก่อนวันรับไว้ หรือวันผ่าตัดอยู่นอกช่วงนอนโรงพยาบาล<\/p>\n<p><strong>6.<\/strong> ส่งข้อมูลซ้ำกับรายการที่ผ่านแล้ว<\/p>\n<p><strong>7.<\/strong> หน่วยบริการไม่ได้ขึ้นทะเบียนสำหรับบริการนั้น<\/p>\n<p><strong>8.<\/strong> ไม่แจ้ง AIPN หรือแจ้งเกิน 24 ชั่วโมง<\/p>\n<p><strong>9.<\/strong> ไม่แนบเอกสารหลักฐานตามเงื่อนไขของรายการกรณีเฉพาะ<\/p>\n<p><strong>10.<\/strong> รหัสยาหรืออุปกรณ์ไม่ตรงกับ Drug Catalogue<\/p>\n<\/blockquote>\n<h3>4.4 การจัดลำดับความเสี่ยงเพื่อแก้ไข<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>ระดับ<\/strong><\/th>\n<th><strong>ลักษณะ<\/strong><\/th>\n<th><strong>การจัดการ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>แดง<\/th>\n<th>ส่งเกินกำหนด / ไม่แจ้ง AIPN<\/th>\n<th>กู้คืนไม่ได้ ต้องแก้ที่ระบบงานหน้างาน ไม่ใช่แก้ที่ข้อมูล<\/th>\n<\/tr>\n<tr>\n<th>ส้ม<\/th>\n<th>ติด C สถานะ 3 ที่ใกล้หมดเวลาแก้ไข / ค้างเกิน 30 วัน<\/th>\n<th>เคลียร์รายวัน มอบหมายผู้รับผิดชอบชัดเจน<\/th>\n<\/tr>\n<tr>\n<th>เหลือง<\/th>\n<th>ติด C สถานะ 2<\/th>\n<th>มอบหมายเจ้าหน้าที่แก้ไขแบบรวมชุด<\/th>\n<\/tr>\n<tr>\n<th>เขียว<\/th>\n<th>ผ่านแล้วแต่ได้เงินต่ำกว่าที่คาด<\/th>\n<th>ทบทวนการให้รหัสและเงื่อนไขรายการ<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>4.5 ตัวชี้วัดที่ควรเรียกจากทุก รพ. รายเดือน<\/h3>\n<table>\n\n<thead>\n<tr>\n<th><strong>#<\/strong><\/th>\n<th><strong>ตัวชี้วัด<\/strong><\/th>\n<th><strong>เป้าหมาย / ข้อสังเกต<\/strong><\/th>\n<th><strong>ชีตใน Excel<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1<\/th>\n<th>ร้อยละเคลมผ่านครั้งแรก (First Pass Rate)<\/th>\n<th>ไม่ต่ำกว่าร้อยละ 95<\/th>\n<th>p-chart · Funnel_FPR<\/th>\n<\/tr>\n<tr>\n<th>2<\/th>\n<th>จำนวนและมูลค่าเคสติด C ค้าง แยกอายุค้าง<\/th>\n<th>แยก &lt;15 วัน / 15–30 วัน / &gt;30 วัน<\/th>\n<th>เคลมค้าง_ยอดโอน<\/th>\n<\/tr>\n<tr>\n<th>3<\/th>\n<th>จำนวนเคสที่ส่งเกินกำหนด<\/th>\n<th>ต้องเป็นศูนย์ ถ้าไม่ใช่คือปัญหาเชิงระบบ<\/th>\n<th>Pareto (C11)<\/th>\n<\/tr>\n<tr>\n<th>4<\/th>\n<th>ส่วนต่างระหว่างยอดส่งเคลมกับยอดโอนจริง<\/th>\n<th>ตรวจจาก statement / FDH<\/th>\n<th>เคลมค้าง_ยอดโอน<\/th>\n<\/tr>\n<tr>\n<th>5<\/th>\n<th>มูลค่า CR ที่เบิกได้ เทียบเคสที่เข้าเกณฑ์<\/th>\n<th>มักพบเบิกไม่ครบหลายล้านบาทต่อปี<\/th>\n<th>เคลมค้าง_ยอดโอน<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h3>4.6 แผนปฏิบัติการระดับจังหวัด<\/h3>\n<blockquote>\n<p><strong>1.<\/strong> ทุก รพ. มี Claim Center ที่มีผู้รับผิดชอบชัดเจน ไม่ฝากไว้กับงานเวชระเบียนเพียงอย่างเดียว<\/p>\n<p><strong>2.<\/strong> ตรวจและเคลียร์รายการติด C ทุกวันทำการ ไม่ใช่รอสิ้นเดือน<\/p>\n<p><strong>3.<\/strong> ทำ pre-audit หน้างาน ตรวจสิทธิและ Authen ตั้งแต่จุดลงทะเบียน ปิดสาเหตุติด C อันดับ 1–3 ได้ทันที<\/p>\n<p><strong>4.<\/strong> SOP สำหรับ AIPN ติดไว้ที่ห้องฉุกเฉินและหอผู้ป่วย ระบุใครแจ้ง แจ้งอย่างไร ภายในกี่ชั่วโมง และใครปฏิบัติแทนในวันหยุด<\/p>\n<p><strong>5.<\/strong> ตรวจว่าข้อมูลจาก HIS ขึ้น FDH ครบทุกวัน — ข้อมูลที่ค้างใน HIS ไม่ถือว่าส่งแล้ว<\/p>\n<p><strong>6.<\/strong> ประชุมงานเคลมระดับจังหวัดทุกไตรมาส เปรียบเทียบ First Pass Rate ด้วย Funnel plot และให้แห่งที่ทำได้ดีมาแลกเปลี่ยน<\/p>\n<p><strong>7.<\/strong> ตรวจบัญชีผู้ใช้งานระบบ สปสช. (ThaiD) ของทุกหน่วยบริการให้พร้อมก่อนเริ่มปีงบประมาณใหม่<\/p>\n<\/blockquote>\n<h2 id=\"m-ch5\">บทที่ 5 · Planfin, วิกฤติการเงินระดับ 7 และ Unit cost<\/h2>\n<h3>5.1 Planfin คืออะไร<\/h3>\n<p>แผนประมาณการรายได้และค่าใช้จ่ายของหน่วยบริการในสังกัดสำนักงานปลัดกระทรวงสาธารณสุข จัดทำผ่านโปรแกรม Planfin ของกองเศรษฐกิจสุขภาพและหลักประกันสุขภาพ ส่งก่อนเริ่มปีงบประมาณ และปรับแผนกลางปีในไตรมาสที่ 2<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>ด้านรายได้<\/strong><\/th>\n<th><strong>ด้านค่าใช้จ่าย<\/strong><\/th>\n<\/tr>\n<tr>\n<th>UC (OP capitation, IP DRG, CR, P&amp;P, non-capitation)<\/th>\n<th>ต้นทุนยา<\/th>\n<\/tr>\n<tr>\n<th>ประกันสังคม<\/th>\n<th>เวชภัณฑ์มิใช่ยาและวัสดุการแพทย์<\/th>\n<\/tr>\n<tr>\n<th>ข้าราชการ / อปท.<\/th>\n<th>วัสดุทั่วไป<\/th>\n<\/tr>\n<tr>\n<th>ชำระเงินเอง / แรงงานต่างด้าว<\/th>\n<th>ค่าแรง (เงินเดือน ค่าตอบแทน จ้างเหมา)<\/th>\n<\/tr>\n<tr>\n<th>งบประมาณและรายได้อื่น<\/th>\n<th>ค่าใช้สอยและสาธารณูปโภค / ค่าเสื่อมราคา<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<div class=\"callout\"><p><strong>ข้อผิดพลาดที่พบบ่อยในการทำ Planfin<\/strong><\/p>\n<p>ประมาณการรายได้ IP ด้วยอัตราที่ประกาศ (ปี 2570 คือเพดาน 9,142 บาท/AdjRW) ทั้งที่ควรใช้ <strong>อัตราจ่ายต่อ RW จริงของเขตในปีก่อนหน้า<\/strong> เป็นฐาน ผลคือแผนดูดีเกินจริง แล้วสิ้นปีกลายเป็นติดลบ ชีต Planfin_Waterfall คำนวณส่วนที่อาจประมาณการเกินให้รายโรงพยาบาล<\/p><\/div>\n<h3>5.2 วิกฤติการเงินระดับ 7 (Risk Scoring)<\/h3>\n<p>ประเมินจากคะแนนรวม 0–7 ใน 3 มิติ ตามเกณฑ์ของกองเศรษฐกิจสุขภาพและหลักประกันสุขภาพ<\/p>\n<table>\n\n<thead>\n<tr>\n<th><strong>มิติ<\/strong><\/th>\n<th><strong>ตัวชี้วัด<\/strong><\/th>\n<th><strong>เกณฑ์ที่ถือว่ามีปัญหา<\/strong><\/th>\n<th><strong>คะแนน<\/strong><\/th>\n<\/tr>\n<tr>\n<th>1. สภาพคล่อง<\/th>\n<th>Current Ratio<\/th>\n<th>น้อยกว่า 1.5<\/th>\n<th>1<\/th>\n<\/tr>\n<tr>\n<th><\/th>\n<th>Quick Ratio<\/th>\n<th>น้อยกว่า 1.0<\/th>\n<th>1<\/th>\n<\/tr>\n<tr>\n<th><\/th>\n<th>Cash Ratio<\/th>\n<th>น้อยกว่า 0.8<\/th>\n<th>1<\/th>\n<\/tr>\n<tr>\n<th>2. ความมั่นคงและผลประกอบการ<\/th>\n<th>ทุนสำรองสุทธิ (NWC)<\/th>\n<th>ติดลบ<\/th>\n<th>1<\/th>\n<\/tr>\n<tr>\n<th><\/th>\n<th>รายได้สูง(ต่ำ)กว่าค่าใช้จ่ายสุทธิ (NI)<\/th>\n<th>ติดลบ<\/th>\n<th>1<\/th>\n<\/tr>\n<tr>\n<th>3. ระยะเวลาทุนหมด<\/th>\n<th>ดูตารางถัดไป<\/th>\n<th>ตามสถานะ NWC และ NI<\/th>\n<th>0–2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h4>มิติที่ 3 · ระยะเวลาทุนหมด<\/h4>\n<table>\n\n<thead>\n<tr>\n<th><strong>สถานะ<\/strong><\/th>\n<th><strong>การให้คะแนน<\/strong><\/th>\n<\/tr>\n<tr>\n<th>NWC บวก และ NI บวก<\/th>\n<th>0 คะแนน<\/th>\n<\/tr>\n<tr>\n<th>NWC บวก แต่ NI ติดลบ (ทุนกำลังถูกใช้หมด)<\/th>\n<th>ทุนหมดใน มากกว่า 6 เดือน = 0 · 3–6 เดือน = 1 · ไม่เกิน 3 เดือน = 2<\/th>\n<\/tr>\n<tr>\n<th>NWC ติดลบ แต่ NI บวก (กำลังฟื้น)<\/th>\n<th>ฟื้นภายใน ไม่เกิน 3 เดือน = 0 · 3–6 เดือน = 1 · มากกว่า 6 เดือน = 2<\/th>\n<\/tr>\n<tr>\n<th>NWC และ NI ติดลบทั้งคู่<\/th>\n<th>2 คะแนน<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<table>\n\n<thead>\n<tr>\n<th><strong>คะแนน<\/strong><\/th>\n<th><strong>ระดับ<\/strong><\/th>\n<th><strong>ความหมายและการจัดการ<\/strong><\/th>\n<\/tr>\n<tr>\n<th>0<\/th>\n<th>ปกติ<\/th>\n<th>ติดตามตามปกติ<\/th>\n<\/tr>\n<tr>\n<th>1–2<\/th>\n<th>เฝ้าระวัง<\/th>\n<th>โรงพยาบาลบริหารจัดการได้เอง<\/th>\n<\/tr>\n<tr>\n<th>3–4<\/th>\n<th>เริ่มมีปัญหา<\/th>\n<th>จัดทำแผนปรับปรุงและรายงานความคืบหน้า<\/th>\n<\/tr>\n<tr>\n<th>5–6<\/th>\n<th>มีปัญหา<\/th>\n<th>CFO ระดับจังหวัดและเขตเข้าแทรกแซง<\/th>\n<\/tr>\n<tr>\n<th>7<\/th>\n<th>วิกฤติ<\/th>\n<th>ติดลบทุกมิติ ต้องทำแผนฟื้นฟูการเงินและขอเงินเกลี่ยระดับเขต<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<\/tbody>\n<\/table>\n<h4>สูตรที่ต้องคำนวณเองได้<\/h4>\n<
