<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดเรียนงบ รพ.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<style>
/* Layout: ledger-book workbench — fixed chapter rail on the left (top tabs on phone), one working sheet on the right.
   Color: ledger-green ink on cool paper; red only for negatives / fails, accounting-style. */
:root {
  --paper: #f3f6f3;
  --sheet: #ffffff;
  --ink: #15302a;
  --muted: #5a6d66;
  --line: #d5dfd9;
  --rule: #e8eeea;
  --accent: #0d6b52;
  --accent-ink: #ffffff;
  --accent-soft: #e0efe8;
  --ok: #1d7a3d;
  --ok-soft: #e3f3e7;
  --warn: #9a5c00;
  --warn-soft: #fbefd9;
  --crit: #b3261e;
  --crit-soft: #fbe5e3;
  --mark: #fff0b3;
  --mark-ink: #5c4600;
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Leelawadee UI", "Sukhumvit Set", Tahoma, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 10px;
  --m1: #0d6b52; --m2: #2f5fa8; --m3: #a2541a; --m4: #7a3e9d; --m5: #8a6800; --m6: #b23a5a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1513; --sheet: #151f1c; --ink: #e2ebe7; --muted: #94a79f; --line: #2b3a35; --rule: #1f2b27;
    --accent: #4fbf98; --accent-ink: #06231a; --accent-soft: #173a2f;
    --ok: #62c784; --ok-soft: #15301f; --warn: #e3a646; --warn-soft: #36290f; --crit: #f2756b; --crit-soft: #3a1a17;
    --mark: #4a3d10; --mark-ink: #ffe28a;
    --m1: #4fbf98; --m2: #7aa7ea; --m3: #e59a62; --m4: #c08ae0; --m5: #e0c04f; --m6: #ee86a2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1513; --sheet: #151f1c; --ink: #e2ebe7; --muted: #94a79f; --line: #2b3a35; --rule: #1f2b27;
  --accent: #4fbf98; --accent-ink: #06231a; --accent-soft: #173a2f;
  --ok: #62c784; --ok-soft: #15301f; --warn: #e3a646; --warn-soft: #36290f; --crit: #f2756b; --crit-soft: #3a1a17;
  --mark: #4a3d10; --mark-ink: #ffe28a;
  --m1: #4fbf98; --m2: #7aa7ea; --m3: #e59a62; --m4: #c08ae0; --m5: #e0c04f; --m6: #ee86a2;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.65;
}
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.3; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--sheet);
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: .8rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .grp { font-size: .72rem; letter-spacing: .08em; color: var(--muted); margin: 10px 8px 2px; }
.nav a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: .95rem;
}
.nav a:hover { background: var(--rule); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a small { font-family: var(--f-num); font-size: .72rem; color: var(--muted); }
.rail-foot { margin-top: auto; font-size: .75rem; color: var(--muted); }

main {
  min-width: 0;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font-size: clamp(1.45rem, 3vw, 1.9rem); }
.page-head p { margin: 0; color: var(--muted); max-width: 68ch; }
.eyebrow { font-size: .75rem; letter-spacing: .1em; color: var(--accent); font-weight: 600; }

.topbar { display: none; }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; align-content: start; }
  .rail { display: none; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
  .topbar {
    display: block; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--sheet); border-bottom: 1px solid var(--line);
  }
  .topbar .row { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding-block: 10px 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar b { font-family: var(--f-display); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    padding-block: 4px 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { flex: none; padding: 5px 11px; border-radius: 999px; font-size: .88rem; text-decoration: none; color: var(--ink); border: 1px solid var(--line); }
  .tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  main { padding-block: 18px 56px; }
}

/* ---------- building blocks ---------- */
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.sheet > h2 { font-size: 1.15rem; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 720px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet);
  font-size: .92rem; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--crit); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.mock { background: var(--mark); color: var(--mark-ink); border-color: transparent; font-weight: 600; }
.tag.verify { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.tag.crit { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.tag.watch { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.src { font-family: var(--f-num); font-size: .72rem; padding: 1px 6px; border-radius: 4px; background: var(--rule); color: var(--muted); text-decoration: none; white-space: nowrap; }
a.src:hover { color: var(--accent); }

.notice { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: .9rem; }
.notice.pdpa { border-color: var(--crit); background: var(--crit-soft); }
.notice.info { border-color: var(--accent); background: var(--accent-soft); }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: .85rem; color: var(--muted); }
.field input, .field select, .field textarea, .inp {
  width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper);
}
.field input.num { text-align: right; }
.field .hint { font-size: .75rem; color: var(--muted); }

.progress { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.scroll-x { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { border-bottom: 1px solid var(--rule); padding: 8px 10px; text-align: left; vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: .82rem; border-bottom-color: var(--line); background: var(--paper); }
td.r, th.r { text-align: right; }

/* ---------- reading ---------- */
.reader { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
.toc { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 2px; font-size: .9rem; }
.toc button { text-align: left; background: none; border: 0; padding: 6px 10px; border-radius: 8px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.toc button:hover { background: var(--rule); }
.toc button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; transform: translateY(-1px); }
.toc .dot.done { background: var(--ok); border-color: var(--ok); }
@media (max-width: 900px) {
  .reader { grid-template-columns: minmax(0, 1fr); }
  .toc { position: static; flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .toc button { flex: none; border: 1px solid var(--line); }
}
.prose { max-width: 72ch; }
.prose h2 { font-size: 1.4rem; margin: 4px 0 14px; }
.prose h3 { font-size: 1.12rem; margin: 26px 0 8px; padding-top: 10px; border-top: 1px solid var(--rule); }
.prose h4 { font-size: 1rem; margin: 18px 0 6px; color: var(--accent); }
.prose p { margin: 0 0 12px; }
.prose ul, .prose ol { margin: 0 0 12px; padding-left: 1.4em; }
.prose li { margin: 3px 0; }
.prose table { margin: 6px 0 14px; }
.prose .scroll-x { margin-bottom: 14px; }
.prose blockquote { margin: 0 0 12px; padding-left: 12px; border-left: 2px solid var(--line); color: var(--muted); }
.prose .callout { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; }
.prose .callout p { margin: 0 0 6px; }
.prose .callout blockquote { border: 0; padding: 0; color: inherit; margin: 0; }
.formula { font-family: var(--f-num); background: var(--paper); border: 1px dashed var(--line); padding: 10px 14px; border-radius: 8px; margin: 0 0 14px; overflow-x: auto; }
.task { list-style: none; margin-left: -1.4em; }
.task label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 6px 10px; border-radius: 8px; background: var(--paper); }
.task input { margin-top: 6px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.task input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.fold { border: 1px solid var(--line); border-radius: 8px; padding: 0 14px; margin: 0 0 14px; background: var(--paper); }
.fold > summary { cursor: pointer; padding: 10px 0; font-weight: 600; color: var(--accent); list-style-position: inside; }
.fold[open] > summary { border-bottom: 1px solid var(--rule); margin-bottom: 10px; }
.fold > :last-child { margin-bottom: 12px; }
.chapter-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }

/* ---------- calculators ---------- */
.inputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
@media (max-width: 560px) { .inputs { grid-template-columns: minmax(0, 1fr); } }
.result-row td { vertical-align: middle; }
.pill { display: inline-block; font-size: .78rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.pill.pass { background: var(--ok-soft); color: var(--ok); }
.pill.fail { background: var(--crit-soft); color: var(--crit); }
.pill.na { background: var(--rule); color: var(--muted); }
.neg { color: var(--crit); }

.gauge { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.gauge div { height: 34px; border-radius: 6px; display: grid; place-items: center; font-family: var(--f-num); font-size: .9rem; background: var(--rule); color: var(--muted); }
.gauge div.t-ok.on { background: var(--ok); color: #fff; }
.gauge div.t-watch.on, .gauge div.t-warn.on { background: var(--warn); color: #fff; }
.gauge div.t-crit.on { background: var(--crit); color: #fff; }
.gauge div.cur { outline: 2px solid var(--ink); outline-offset: 2px; }
.score-big { font-family: var(--f-display); font-size: 3rem; line-height: 1; }
.big-money { font-family: var(--f-num); font-size: 2rem; font-weight: 600; color: var(--accent); }
.breakdown { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .breakdown { grid-template-columns: minmax(0, 1fr); } }
.breakdown > div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.breakdown b { font-family: var(--f-num); font-size: 1.3rem; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 720px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.countdown b { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; color: var(--accent); }
.timeline { display: flex; flex-direction: column; gap: 0; }
.timeline .step { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); align-items: center; }
.timeline .step:last-child { border-bottom: 0; }
.timeline .when { font-size: .82rem; color: var(--muted); }
.timeline .now .when { color: var(--accent); font-weight: 600; }
@media (max-width: 560px) { .timeline .step { grid-template-columns: minmax(0, 1fr) auto; } .timeline .when { grid-column: 1 / -1; } }
.stat b { font-family: var(--f-num); font-size: 1.6rem; }
.tool-links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 720px) { .tool-links { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tool-links a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink); background: var(--sheet); }
.tool-links a:hover { border-color: var(--accent); }
.tool-links a span { font-size: .8rem; color: var(--muted); }

/* ---------- quiz / cards ---------- */
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--sheet); cursor: pointer; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.right { border-color: var(--ok); background: var(--ok-soft); }
.choice.wrong { border-color: var(--crit); background: var(--crit-soft); }
.choice:disabled { cursor: default; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.card-flip {
  min-height: 220px; border: 1px solid var(--line); border-radius: 14px; background: var(--sheet);
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  padding: 24px; cursor: pointer; gap: 10px;
}
.card-flip .term { font-family: var(--f-display); font-size: clamp(1.4rem, 4vw, 2rem); }
.card-flip .full { font-weight: 600; }
.card-flip .meaning { color: var(--muted); max-width: 60ch; }

/* ---------- glossary ---------- */
.gl-item { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.gl-item b { font-family: var(--f-display); }
@media (max-width: 560px) { .gl-item { grid-template-columns: minmax(0, 1fr); gap: 2px; } }

/* ---------- action plan ---------- */
.plan-table textarea { width: 100%; min-width: 150px; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--paper); font-size: .88rem; }
.plan-table td { padding: 6px; }
.plan-table th { white-space: nowrap; }
.bad-input { border-color: var(--crit) !important; background: var(--crit-soft) !important; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: .9rem; z-index: 20; }
textarea.copybox { width: 100%; min-height: 120px; font-family: var(--f-num); font-size: .8rem; }

/* ---------- mind map ---------- */
.mindmap { position: relative; margin: 8px 0 18px; padding: 18px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
.mm-lines { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.mm-grid { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(110px, 160px) minmax(0, 1fr); gap: 14px 36px; align-items: center; }
.mm-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.mm-center { display: flex; justify-content: center; }
.mm-root { background: var(--ink); color: var(--paper); font-family: var(--f-display); font-weight: 700; text-align: center; padding: 14px 16px; border-radius: 999px; line-height: 1.35; box-shadow: 0 0 0 6px var(--paper); }
.mm-branch { background: var(--sheet); border: 1.5px solid var(--c); border-radius: 12px; padding: 8px 12px; min-width: 0; }
.mm-title { font-family: var(--f-display); font-weight: 700; color: var(--c); line-height: 1.35; }
.mm-branch ul { margin: 4px 0 0; padding-left: 1.1em; font-size: .86rem; line-height: 1.5; }
.mm-branch li { margin: 2px 0; }
.mm-branch li::marker { color: var(--c); }
@media (max-width: 640px) {
  .mm-lines { display: none; }
  .mm-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .mm-center { order: -1; }
  .mm-root { border-radius: 12px; width: 100%; }
  .mm-col { gap: 10px; padding-left: 14px; border-left: 2px solid var(--line); }
}

/* ---------- theme toggle ---------- */
.brand-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.row-end { display: inline-flex; align-items: center; gap: 8px; }
.theme-btn { display: inline-flex; align-items: center; gap: 5px; flex: none; min-height: 34px; padding: 4px 10px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink);
  font-size: .8rem; cursor: pointer; }
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn span[aria-hidden] { font-size: 1rem; line-height: 1; }
@media (max-width: 400px) { .theme-btn span:not([aria-hidden]) { display: none; } }

</style>

</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="เมนูหลัก">
    <div class="brand-row"><div class="brand"><b>สมุดเรียนงบ รพ.</b><span>งบการเงิน · กองทุน · งานประกันสุขภาพ</span></div><button type="button" class="theme-btn" data-theme-btn></button></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <div class="topbar">
    <div class="row"><b>สมุดเรียนงบ รพ.</b><span class="row-end"><span class="tag verify" id="topVer"></span><button type="button" class="theme-btn" data-theme-btn></button></span></div>
    <nav class="tabs" id="tabs" aria-label="เมนูหลัก"></nav>
  </div>
  <main id="main"><div class="page"><p>กำลังโหลด…</p></div></main>

<script>
window.APP_DATA = {"textbook": "# ตำรางบการเงินโรงพยาบาล สำหรับงานประกันสุขภาพ (เรียนด้วยตนเอง)\n\nจัดทำ 12 พ.ย. 2569 · เอกสารเรียนด้วยตนเอง\n## วิธีใช้ตำรา\n\nเป้าหมาย: ภายใน 90 วันหลังเริ่มงาน อ่านงบการเงิน รพ. 1 แห่งแล้วบอกได้ว่า \"ป่วยตรงไหน เพราะอะไร ต้องแก้อะไร\" ภายใน 30 นาที\n\nตำรานี้เรียงจาก Why → What → How → So what: บทที่ 1–2 คือภาษาบัญชี, บทที่ 3 คือบัญชี รพ.สธ., บทที่ 4–5 คือเครื่องมือวิเคราะห์ที่ สสจ. ใช้กำกับ รพ., บทที่ 6–7 คือจุดที่พยาบาลประกันสุขภาพได้เปรียบคนอื่น เพราะเข้าใจทั้งฝั่งคลินิกและฝั่งเคลม\n\n### โครงเล่ม — แต่ละบทตอบคำถามอะไร\n\n| บท | คำถามที่บทนี้ตอบ | ใช้คู่กับเมนูในแอป | เวลาโดยประมาณ |\n| --- | --- | --- | --- |\n| 1 พื้นฐานบัญชี | รายการใน รพ. 1 รายการ เปลี่ยนตัวเลขอะไรบ้าง | แบบทดสอบ · Flashcards | 3–4 ชม. |\n| 2 งบ 4 ตัว | อ่านงบตามลำดับไหน งบผูกกันตรงไหน | กรณีศึกษา 21 รพ. | 3–4 ชม. |\n| 3 ลูกหนี้ตามสิทธิ | เคลม 1 รายการกลายเป็นเงินหรือหนี้สูญอย่างไร | ACP Cash Unlock | 3–4 ชม. |\n| 4 Ratio | เงินจมอยู่ที่ไหน | Ratio + Risk Score | 3–4 ชม. |\n| 5 Risk Score + Planfin | รพ. ไหนป่วย ป่วยแค่ไหน ใครต้องทำอะไร | Ratio + Risk Score · กรณีศึกษา 21 รพ. | 3–4 ชม. |\n| 6 เคลม → งบ | ปัญหาเคลมแต่ละแบบเป็นเงินเท่าไร แก้อะไรก่อน | ACP Cash Unlock · กรณีศึกษา 21 รพ. | 3–4 ชม. |\n| 7 Action plan | เขียนแผนและนำเสนออย่างไรให้วัดผลได้ | Action plan | 3–4 ชม. |\n| 8 ทบทวน | พร้อมใช้งานจริงหรือยัง | แบบทดสอบ · อภิธานศัพท์ | 1–2 ชม. |\n\nรวมประมาณ 25 ชั่วโมง — ถ้าเรียนวันละ 1–1.5 ชั่วโมง จบเนื้อหาได้ในราว 3 สัปดาห์\n\n### แผนเรียน\n\n| ช่วง | บท | งานที่ต้องทำ (Output) |\n| --- | --- | --- |\n| สัปดาห์ 1 (ก่อนเริ่มงาน) | 1–2 | ทำตัวอย่าง 1.7 ด้วยมือ แล้วสร้างงบ 4 ตัว (2.2) ให้ผูกกันครบ 3 จุด |\n| สัปดาห์ 2 (ก่อนเริ่มงาน) | 3 | บันทึกลูกหนี้ 3 จังหวะ (ตัวอย่าง 3.8) อ่าน Aging และคำนวณ ACP ได้เอง |\n| สัปดาห์ 3 (ก่อนเริ่มงาน) | 4 | คำนวณ Ratio ด้วยมือ และอ่านเป็นคู่กับ รพ. 3 แห่งในกรณีศึกษา |\n| วันที่ 1–30 | 5 | ยืนยันเกณฑ์ปีงบ 2570 กับหัวหน้ากลุ่มงาน แล้วคัดกรอง 21 รพ. ด้วยตาราง 2×2 (5.6) |\n| วันที่ 31–60 | 6 | แยกติด C 4 ถังและเทียบต่อขนาดงานของ รพ. เป้าหมาย 3 แห่ง |\n| วันที่ 61–90 | 7 | Action plan 1 หน้า + สไลด์ กวป. 1 หน้า ให้ รพ. 1 แห่ง แล้วขอ Feedback จากหัวหน้า |\n\nหลักการเรียน: ทุกบทจบด้วยคำถาม \"แล้วมันกระทบเงินสดของ รพ. อย่างไร\" — ถ้าตอบไม่ได้ ให้กลับไปอ่านบทที่ 2 ใหม่\n\nข้อควรระวัง: เกณฑ์ตัวเลข (Risk Score, Planfin, ผังบัญชี) ปรับทุกปีงบประมาณ ก่อนใช้งานจริงให้ตรวจกับหนังสือสั่งการฉบับล่าสุดของ สป.สธ. / เขตสุขภาพที่ 8 เสมอ\n\n**เส้นทางด่วน (ถ้าเวลาก่อนเริ่มงานไม่พอ)** — อ่านเฉพาะหัวข้อแกนประมาณ 8 ชั่วโมง ที่เหลืออ่านคู่กับงานจริง:\n\n| บท | หัวข้อแกน | ได้อะไร |\n| --- | --- | --- |\n| 1 | 1.2–1.4 | สมการบัญชี, Dr/Cr, เกณฑ์คงค้าง |\n| 2 | 2.3, 2.5 | 3 จุดผูกงบ, ลำดับอ่าน 30 นาที |\n| 3 | 3.2, 3.7 | ลูกหนี้ 3 จังหวะ, ACP → เงิน |\n| 4 | 4.1, 4.5 | Ratio สภาพคล่อง, อ่านเป็นคู่ |\n| 5 | 5.1, 5.6 | Risk Score + Survival, ไข้ไม่ขึ้นแต่ป่วย |\n| 6 | 6.1, 6.5 | เงินมาช้า vs หายถาวร, 4 ถังเคลม |\n| 7 | 7.2 | แถว Action plan ที่ดี |\n\n### วิธีเรียน 1 บท (กิจวัตร 6 ขั้น)\n\n1. **อ่านเป้าหมายของบท** ย่อหน้าแรก — รู้ก่อนว่าจบบทต้องทำอะไรได้\n2. **อ่านเนื้อหา** — ตารางคือหัวใจของแต่ละหัวข้อ อ่านช้าตรงตาราง\n3. **ทำตัวอย่างก่อนเปิดเฉลย** — กล่องที่กดพับได้ (เช่น \"ลองคำนวณเอง แล้วกดดูเฉลย\") ให้คิดเองบนกระดาษก่อนทุกครั้ง\n4. **ทำแบบฝึกแล้วติ๊ก** — ความคืบหน้าบันทึกในเครื่อง แสดงที่หน้าหลัก\n5. **ปิดจอแล้ววาด Mind map เอง** ท้ายบท แล้วเทียบกับของจริง — กิ่งที่วาดไม่ออกคือหัวข้อที่ต้องกลับไปอ่าน\n6. **ทำแบบทดสอบ + Flashcards** — ข้อที่ผิดมีอ้างอิงหัวข้อ (เช่น \"T บทที่ 3.7\") ให้กลับไปอ่านตรงนั้น\n\nทบทวนแบบเว้นระยะ: วาด Mind map ของบทนั้นซ้ำในวันที่ 1, 3 และ 7 หลังเรียน — ใช้เวลาครั้งละ 5 นาทีแต่จำได้นานกว่าอ่านซ้ำ\n\n### ป้ายในตำรา — อ่านแล้วรู้ทันทีว่าตัวเลขเชื่อได้แค่ไหน\n\n| ป้าย / ข้อความ | ความหมาย | นำไปใช้ได้ไหม |\n| --- | --- | --- |\n| **ตัวเลขสมมติ** | ตั้งขึ้นเพื่อฝึกคำนวณ รวมถึงอัตราจ่าย 10,000 บาท/AdjRW | ห้ามอ้างในเอกสารจริง |\n| ข้อมูลจริง + แหล่ง + หน้า | มาจากเอกสารที่ระบุ ข้อมูล ณ วันที่ในเอกสาร | อ้างได้ — แต่ใช้ต้นฉบับ/hfo ก่อนใส่หนังสือราชการ |\n| รหัส รพ.01–21 | ข้อมูลจริง จ.อุดรธานี ชื่อ รพ. แทนด้วยรหัสสุ่ม | ใช้ฝึก — ตัวเลขจริงให้ดึงจากต้นฉบับ |\n| อนุมาน | เกณฑ์ที่เดาจากจำนวน รพ. ที่ผ่านในสไลด์ ไม่ใช่เกณฑ์ประกาศ | ต้องยืนยันกับหัวหน้ากลุ่มงานก่อน |\n| เป้าตัวอย่างเพื่อฝึก | เป้าใน Action plan ตัวอย่าง | ไม่ใช่เป้าทางการ |\n| ตรวจกับหนังสือสั่งการปีงบปัจจุบันก่อนใช้งานจริง | เกณฑ์อาจเปลี่ยนทุกปีงบ | ตรวจทุกครั้ง |\n\nลำดับความน่าเชื่อถือของแหล่ง (สูง → ต่ำ): ประกาศ / หนังสือสั่งการ สป.สธ. และกองทุน → เอกสารเขต/จังหวัด (S1–S7, K1) → คู่มือเรียบเรียงภายใน (M1) → ตำรานี้ — รายละเอียดทุกแหล่งอยู่ในเมนู \"เกณฑ์และแหล่งอ้างอิง\"\n\n### กติกาเหล็ก 3 ข้อ (ใช้ตลอดทั้งเล่มและในงานจริง)\n\n1. **ทุกตัวเลขต้องมีแหล่ง** — ตัวเลขการเงิน/เคลมที่ไม่มีแหล่ง ให้เขียน \"รอข้อมูล\" แทนการประมาณ\n2. **ตรวจเกณฑ์กับหนังสือสั่งการปีงบปัจจุบัน** — Risk Score, 7 Plus, TPS, Planfin, อัตราจ่ายเปลี่ยนได้ทุกปี\n3. **PDPA** — ไม่มีชื่อผู้ป่วย / HN / AN / เลขบัตรประชาชน ในเอกสาร ไฟล์ หรือช่องกรอกใด ๆ แอปนี้ไม่มีช่องเก็บข้อมูลเหล่านี้ และเมนู Action plan ตรวจกรองก่อนคัดลอก\n\n### ความคืบหน้าเก็บที่ไหน\n\n- ทุกอย่าง (บทที่อ่าน, แบบฝึกที่ติ๊ก, คะแนนแบบทดสอบ, Action plan) เก็บในเบราว์เซอร์ของ **เครื่องที่ใช้อยู่เท่านั้น** — แท็บเล็ตกับคอมพิวเตอร์ไม่ซิงก์กัน\n- ย้ายเครื่องหรือกันข้อมูลหาย: เมนู \"สำรองความคืบหน้า\" → \"คัดลอกเป็นข้อความ\" ไปเก็บ (เช่น ส่งเข้าอีเมลตัวเอง) แล้ว \"นำเข้าจากข้อความ\" ในอีกเครื่อง — ข้อมูลสำรองไม่มีข้อมูลผู้ป่วย\n- ล้างข้อมูลเบราว์เซอร์หรือโหมดส่วนตัว = ความคืบหน้าหาย\n\n### เริ่มต้นวันนี้\n\n- [ ] ทำแบบทดสอบชุด \"แนวคิดงบการเงิน\" 1 รอบก่อนเรียน แล้วจดคะแนนไว้ — เทียบอีกครั้งหลังจบบทที่ 7\n- [ ] กำหนดเวลาเรียนประจำวันละ 1–1.5 ชั่วโมง และเลือกว่าจะเดินแผนเต็มหรือเส้นทางด่วน\n- [ ] จดคำถามสำหรับหัวหน้ากลุ่มงานวันแรก: เกณฑ์ 7 Plus / TPS / Planfin ปีงบ 2570 ฉบับที่จังหวัดใช้ · นิยามการปรับงบของ Risk Score เกณฑ์เขต 8 · วิธีตั้งลูกหนี้และอัตราจ่ายปีงบ 2570\n- [ ] ตั้งเตือนสำรองความคืบหน้าสัปดาห์ละครั้ง\n\n### สรุป — 3 ข้อที่ต้องรู้ก่อนเริ่ม\n\n1. เรียน **บทละ 3–4 ชั่วโมง** ตามกิจวัตร 6 ขั้น — ทำตัวอย่างก่อนเปิดเฉลย และวาด Mind map เองทุกบท\n2. ดู **ป้าย** ทุกครั้งที่เห็นตัวเลข: สมมติ / จริง+แหล่ง / อนุมาน — ใช้ในงานจริงได้เฉพาะตัวเลขจริงที่ตรวจกับต้นฉบับแล้ว\n3. ความคืบหน้าอยู่ในเครื่องเดียว — **สำรองทุกสัปดาห์**\n\n### แผนผังความคิด (Mind map)\n\nจำภาพนี้ให้ได้ก่อนไปบทถัดไป — ลองปิดจอแล้ววาดเองบนกระดาษ\n\n```mindmap\nเรียนงบ รพ. ใน 90 วัน\n- โครงเล่ม\n  - Why: บท 1–2 ภาษาบัญชี\n  - What: บท 3 ลูกหนี้ตามสิทธิ\n  - How: บท 4–5 Ratio · Risk\n  - So what: บท 6–7 เคลม → แผน\n- แผนเรียน\n  - 3 สัปดาห์ก่อนเริ่ม: บท 1–4\n  - วัน 1–30: คัดกรอง 21 รพ.\n  - วัน 31–60: 4 ถังเคลม 3 รพ.\n  - วัน 61–90: Action plan + สไลด์\n- กิจวัตร 6 ขั้น\n  - เป้าหมาย → อ่าน\n  - ทำตัวอย่างก่อนเปิดเฉลย\n  - แบบฝึก → วาด Mind map\n  - แบบทดสอบ + Flashcards\n- ป้ายตัวเลข\n  - สมมติ: ห้ามอ้าง\n  - จริง + แหล่ง + หน้า\n  - อนุมาน: ต้องยืนยัน\n- กติกาเหล็ก\n  - ทุกตัวเลขมีแหล่ง\n  - ตรวจหนังสือสั่งการปีปัจจุบัน\n  - ไม่มีข้อมูลผู้ป่วย\n- เวลาไม่พอ\n  - เส้นทางด่วน ~8 ชม.\n  - สำรองความคืบหน้าทุกสัปดาห์\n```\n\n## บทที่ 1 ที่มาและแนวคิดพื้นฐานทางบัญชี\n\nบัญชีคือภาษาที่ใช้เล่าว่า \"องค์กรมีอะไร เป็นหนี้ใคร และทำงานแล้วรวยขึ้นหรือจนลง\" — งบการเงินคือรายงานสรุปของภาษานี้\n\nเป้าหมายของบทนี้: จบบทแล้วบันทึกรายการของ รพ. ด้วยสมการบัญชีได้เอง และอธิบายได้ว่าทำไม รพ. ที่ \"กำไร\" ยังไม่มีเงินจ่ายค่ายา ใช้เวลาอ่าน + ทำแบบฝึกประมาณ 3–4 ชั่วโมง\n\nตัวเลขทุกตัวในบทนี้เป็น **ตัวเลขสมมติเพื่อฝึก** ไม่ใช่ข้อมูลของ รพ. ใด · ชื่อบัญชีที่ใช้เป็นชื่อทั่วไปทางบัญชี — ชื่อและรหัสบัญชีจริงให้ดูผังบัญชีหน่วยบริการ สป.สธ. ฉบับปีงบปัจจุบัน\n\n### 1.1 ที่มา: ทำไมต้องมีบัญชี\n\n- ระบบบัญชีคู่ (Double-entry) ถูกรวบรวมเป็นตำราครั้งแรกโดย Luca Pacioli ในอิตาลี ปี ค.ศ. 1494 เพื่อให้พ่อค้าตรวจได้ว่าบันทึกถูกต้องและไม่มีใครยักยอก\n- แนวคิดนี้ยังใช้ทุกวันนี้ เพราะตอบโจทย์ 3 อย่าง: ความรับผิดชอบ (Accountability), การตัดสินใจ (Decision-making), และการตรวจสอบ (Control)\n- สำหรับ รพ.รัฐ ความหมายคือ: เงินบำรุงเป็นเงินแผ่นดิน ผู้อำนวยการต้องแสดงได้ว่าใช้อย่างไร และ สสจ./เขต ต้องเห็นสัญญาณวิกฤตก่อน รพ. ขาดสภาพคล่อง\n\nใครอ่านงบการเงินของ รพ. และอ่านเพื่ออะไร:\n\n| ผู้อ่าน | คำถามที่อยากรู้ | สิ่งที่ดูในงบ |\n| --- | --- | --- |\n| ผู้อำนวยการ / ทีมบริหาร รพ. | เดือนหน้ามีเงินจ่ายเงินเดือนและค่ายาไหม | เงินสด, เจ้าหนี้ค่ายา, ลูกหนี้ค้างรับ |\n| CFO จังหวัด / งานประกันสุขภาพ สสจ. | รพ. ไหนกำลังจะวิกฤต ต้องเข้าไปช่วยตรงไหน | Ratio, NWC, NI, Risk Score, ลูกหนี้ตามสิทธิ |\n| เขตสุขภาพ / ส่วนกลาง | ต้องเกลี่ยเงินช่วย รพ. ไหน | Risk Score, เงินบำรุงคงเหลือหลังหักหนี้ |\n| หน่วยตรวจสอบ | ใช้เงินถูกระเบียบ บันทึกครบถ้วนไหม | หมายเหตุประกอบงบ, เอกสารประกอบรายการ |\n\nงานประกันสุขภาพอยู่แถวที่ 2 — เราไม่ได้ทำบัญชีเอง แต่ต้อง **อ่านเป็น** และ **ชี้ได้ว่างานเคลมกระทบบรรทัดไหน**\n\n### 1.2 สมการบัญชี — สิ่งเดียวที่ต้องจำให้ขึ้นใจ\n\n```latex\n\\text{สินทรัพย์} = \\text{หนี้สิน} + \\text{ทุน (ส่วนของเจ้าของ)}\n```\n\n- สินทรัพย์ (Assets) = สิ่งที่ รพ. ควบคุมและจะให้ประโยชน์ในอนาคต เช่น เงินสด ลูกหนี้ค่ารักษา ยาและเวชภัณฑ์คงคลัง อาคาร ครุภัณฑ์\n- หนี้สิน (Liabilities) = ภาระที่ต้องจ่ายออกไป เช่น เจ้าหนี้ค่ายา ค่าตอบแทนค้างจ่าย\n- ทุน (Equity) = ส่วนที่เหลือเมื่อหักหนี้แล้ว ใน รพ.รัฐ คือทุนและรายได้สูงกว่าค่าใช้จ่ายสะสม\n- ทุกรายการที่บันทึกต้องทำให้สมการยังสมดุล — นี่คือหัวใจของบัญชีคู่ (เดบิต = เครดิต)\n\nสมการแบบขยาย — รายได้และค่าใช้จ่ายคือ \"ทุนที่กำลังเปลี่ยน\" ระหว่างงวด:\n\n```latex\n\\text{สินทรัพย์} = \\text{หนี้สิน} + \\text{ทุนต้นงวด} + (\\text{รายได้} - \\text{ค่าใช้จ่าย})\n```\n\nส่วนในวงเล็บคือ NI (รายได้สูง(ต่ำ)กว่าค่าใช้จ่ายสุทธิ) — ปลายงวด NI จะถูกปิดเข้าทุน นี่คือจุดเชื่อมระหว่างงบผลการดำเนินงานกับงบแสดงฐานะการเงินที่จะเรียนในบทที่ 2\n\nแบ่งหมวดสินทรัพย์และหนี้สินตามระยะเวลา (ใช้ต่อในการคำนวณ Ratio บทที่ 4):\n\n| หมวด | ความหมาย | ตัวอย่างใน รพ. |\n| --- | --- | --- |\n| สินทรัพย์หมุนเวียน | เปลี่ยนเป็นเงินสดหรือใช้หมดภายใน 1 ปี | เงินสด เงินฝาก ลูกหนี้ค่ารักษาตามสิทธิ ยา/เวชภัณฑ์คงคลัง |\n| สินทรัพย์ไม่หมุนเวียน | ใช้ประโยชน์เกิน 1 ปี | อาคาร ครุภัณฑ์การแพทย์ (แสดงสุทธิหลังหักค่าเสื่อมราคาสะสม) |\n| หนี้สินหมุนเวียน | ต้องจ่ายภายใน 1 ปี | เจ้าหนี้ค่ายา/เวชภัณฑ์ ค่าตอบแทนค้างจ่าย ค่าสาธารณูปโภคค้างจ่าย |\n| หนี้สินไม่หมุนเวียน | จ่ายเกิน 1 ปี | ภาระผูกพันระยะยาว (ถ้ามี) |\n\n### 1.3 บัญชีคู่: เดบิตและเครดิต\n\nทุกรายการกระทบอย่างน้อย 2 บัญชี ฝั่งหนึ่งบันทึก \"เดบิต (Dr)\" อีกฝั่ง \"เครดิต (Cr)\" ยอดสองฝั่งต้องเท่ากันเสมอ — เดบิตและเครดิตแปลว่า \"ซ้าย\" และ \"ขวา\" ไม่ได้แปลว่าดีหรือไม่ดี\n\n| ประเภทบัญชี | เพิ่มขึ้นบันทึก | ลดลงบันทึก | ยอดคงเหลือปกติ |\n| --- | --- | --- | --- |\n| สินทรัพย์ | เดบิต | เครดิต | เดบิต |\n| ค่าใช้จ่าย | เดบิต | เครดิต | เดบิต |\n| หนี้สิน | เครดิต | เดบิต | เครดิต |\n| ทุน | เครดิต | เดบิต | เครดิต |\n| รายได้ | เครดิต | เดบิต | เครดิต |\n\nวิธีจำ: สินทรัพย์และค่าใช้จ่าย \"อยู่ซ้าย\" (เพิ่ม = เดบิต) · หนี้สิน ทุน รายได้ \"อยู่ขวา\" (เพิ่ม = เครดิต) — เพราะค่าใช้จ่ายทำให้ทุนลด จึงอยู่คนละฝั่งกับทุน\n\nตัวอย่าง: ให้บริการผู้ป่วยในสิทธิ UC 50,000 บาท ยังไม่ได้รับเงิน (ตัวเลขสมมติ)\n\n| บัญชี | เดบิต | เครดิต |\n| --- | --- | --- |\n| ลูกหนี้ค่ารักษาพยาบาล UC (สินทรัพย์ ↑) | 50,000 | |\n| รายได้ค่ารักษาพยาบาล UC (รายได้ ↑) | | 50,000 |\n\nวงจรบัญชี (Accounting cycle) ที่ฝ่ายบัญชี รพ. ทำทุกงวด — ให้รู้ว่าตัวเลขในงบผ่านขั้นไหนมาบ้าง:\n\n1. เอกสารประกอบรายการ — ใบเสร็จ ใบสั่งซื้อ ใบแจ้งหนี้ รายงานผลการเรียกเก็บ (Statement) จากกองทุน\n2. บันทึกรายการในสมุดรายวัน (Journal) — Dr/Cr ตามตัวอย่างข้างบน\n3. ผ่านรายการไปบัญชีแยกประเภท (Ledger) — รวมยอดแต่ละบัญชี\n4. งบทดลอง (Trial balance) — ตรวจว่ายอดเดบิตรวม = เครดิตรวม\n5. รายการปรับปรุง (Adjusting entries) — ค่าเสื่อม ค่าใช้จ่ายค้างจ่าย ค่าเผื่อหนี้สงสัยจะสูญ (ดู 1.5)\n6. จัดทำงบการเงิน แล้วส่งรายงานตามรอบ\n7. ปิดบัญชี — โอนรายได้และค่าใช้จ่ายเข้าทุน เริ่มงวดใหม่\n\nจุดที่งานประกันเกี่ยวข้องโดยตรงคือข้อ 1 และ 5: ผลเคลมจาก e-Claim/FDH เป็นเอกสารที่ใช้ตัดลูกหนี้ และส่วนต่างระหว่างที่ตั้งไว้กับที่ได้รับจริงต้องปรับปรุงบัญชี\n\n### 1.4 เกณฑ์เงินสด vs เกณฑ์คงค้าง (Cash vs Accrual basis)\n\n| ประเด็น | เกณฑ์เงินสด | เกณฑ์คงค้าง |\n| --- | --- | --- |\n| รับรู้รายได้เมื่อ | ได้รับเงินจริง | ให้บริการเสร็จ (เกิดสิทธิเรียกเก็บ) |\n| รับรู้ค่าใช้จ่ายเมื่อ | จ่ายเงินจริง | เกิดภาระ แม้ยังไม่จ่าย |\n| ตัวอย่าง รพ. | ผู้ป่วย UC นอน รพ. เดือน ต.ค. ได้เงินโอนจาก สปสช. เดือน ธ.ค. → รายได้ลงเดือน ธ.ค. | รายได้ลงเดือน ต.ค. พร้อมตั้ง \"ลูกหนี้ค่ารักษา UC\" ไว้ |\n| จุดอ่อน | ไม่เห็นภาระที่ค้างอยู่ | กำไรอาจสูง แต่เงินสดไม่มี ถ้าเก็บลูกหนี้ไม่ได้ |\n\nหน่วยบริการ สป.สธ. ใช้เกณฑ์คงค้าง ดังนั้นต้องอ่านงบกำไรขาดทุนคู่กับงบกระแสเงินสดเสมอ\n\nตัวอย่างเทียบ 3 เดือน (ตัวเลขสมมติ): เดือน ต.ค. ให้บริการ IP สิทธิ UC 900,000 บาท · เดือน พ.ย. จ่ายค่ายาที่ใช้ใน ต.ค. 300,000 บาท · เดือน ธ.ค. ได้รับเงินชดเชย 900,000 บาท\n\n| เดือน | รายได้ (เกณฑ์เงินสด) | รายได้ (เกณฑ์คงค้าง) | ค่าใช้จ่ายยา (เกณฑ์เงินสด) | ค่าใช้จ่ายยา (เกณฑ์คงค้าง) |\n| --- | --- | --- | --- | --- |\n| ต.ค. | 0 | 900,000 | 0 | 300,000 |\n| พ.ย. | 0 | 0 | 300,000 | 0 |\n| ธ.ค. | 900,000 | 0 | 0 | 0 |\n\nเกณฑ์คงค้างบอกว่า \"งานเดือน ต.ค. ได้ผลอย่างไร\" ได้ถูกต้อง แต่เดือน ต.ค.–พ.ย. รพ. ยังไม่มีเงินเข้าเลย — ถ้าเงินโอนเลื่อนออกไป หรือเคลมติด C เงินสดจะติดลบทั้งที่งบผลการดำเนินงานดูดี\n\n### 1.5 รายการปรับปรุงที่ต้องรู้จัก (Adjusting entries)\n\nรายการปรับปรุงทำให้ตัวเลขปลายงวดตรงกับความจริงตามเกณฑ์คงค้าง — และเป็นจุดที่ตัวเลขถูก \"ทำให้ดูดี\" ได้ง่ายที่สุด\n\n| รายการ | ทำไมต้องปรับ | บันทึก (Dr / Cr) | ผลต่อ NI | ผลต่อเงินสด |\n| --- | --- | --- | --- | --- |\n| ค่าเสื่อมราคา | ครุภัณฑ์ให้ประโยชน์หลายปี ต้องกระจายต้นทุนตามอายุใช้งาน | Dr ค่าเสื่อมราคา / Cr ค่าเสื่อมราคาสะสม | ลด | ไม่กระทบ |\n| ค่าใช้จ่ายค้างจ่าย | เกิดภาระแล้วแต่ยังไม่จ่าย เช่น ค่าตอบแทนนอกเวลาเดือนนี้ จ่ายเดือนหน้า | Dr ค่าตอบแทน / Cr ค่าตอบแทนค้างจ่าย | ลด | ไม่กระทบ (จนกว่าจะจ่าย) |\n| รายได้ค้างรับ | ให้บริการแล้ว เกิดสิทธิเรียกเก็บ แต่ยังไม่ได้รับเงิน | Dr ลูกหนี้ / Cr รายได้ | เพิ่ม | ไม่กระทบ (จนกว่าจะได้รับ) |\n| ค่าเผื่อหนี้สงสัยจะสูญ | ลูกหนี้บางส่วนจะเก็บไม่ได้ (เช่น เกินเวลาอุทธรณ์) | Dr หนี้สงสัยจะสูญ / Cr ค่าเผื่อหนี้สงสัยจะสูญ | ลด | ไม่กระทบ |\n| ปรับลดลูกหนี้ตามผลชดเชยจริง | ตั้งลูกหนี้ไว้สูงกว่าที่กองทุนจ่ายจริง | Dr รายได้ (หรือบัญชีส่วนต่าง) / Cr ลูกหนี้ | ลด | ไม่กระทบ |\n\nค่าเสื่อมราคาแบบเส้นตรง (วิธีพื้นฐานที่สุด):\n\n```latex\n\\text{ค่าเสื่อมต่อปี} = \\frac{\\text{ราคาทุน} - \\text{มูลค่าซาก}}{\\text{อายุการใช้งาน (ปี)}}\n```\n\nตัวอย่าง (ตัวเลขสมมติ): เครื่องดมยาสลบราคา 1,200,000 บาท อายุใช้งาน 8 ปี ไม่มีมูลค่าซาก → ค่าเสื่อมปีละ 150,000 บาท หรือเดือนละ 12,500 บาท — อัตราค่าเสื่อมและอายุใช้งานจริงของครุภัณฑ์แต่ละประเภทให้ดูหลักเกณฑ์ของกรมบัญชีกลาง/คู่มือบัญชีหน่วยบริการ\n\nทำไมงานประกันต้องสนใจ: บรรทัดสุดท้ายของตาราง (ปรับลดลูกหนี้ตามผลชดเชยจริง) คือผลของงานเคลมโดยตรง ถ้า รพ. ตั้งลูกหนี้ตามราคาเรียกเก็บเต็มแล้วไม่ปรับ NI จะสูงเกินจริง และ Risk Score จะต่ำหลอกตา (ดูบทที่ 2.4 และ 6.1)\n\n### 1.6 หลักการสำคัญที่ต้องรู้ (Concepts)\n\n- Going concern (การดำเนินงานต่อเนื่อง): สมมติว่า รพ. ยังเปิดต่อไป จึงตัดค่าเสื่อมราคาครุภัณฑ์ตามอายุใช้งานได้\n- Matching (การจับคู่รายได้กับค่าใช้จ่าย): ค่ายาที่ใช้กับผู้ป่วยเดือนนี้ ต้องลงค่าใช้จ่ายเดือนเดียวกับรายได้ของผู้ป่วยรายนั้น\n- Prudence (ความระมัดระวัง): ลูกหนี้ที่เก็บไม่ได้แน่ ต้องตั้งค่าเผื่อหนี้สงสัยจะสูญ ไม่ใช่นับเป็นรายได้เต็มจำนวน\n- Materiality (ความมีสาระสำคัญ): สนใจรายการที่มีผลต่อการตัดสินใจ ไม่ต้องไล่ทุกบาท\n\nใช้หลักการกับสถานการณ์จริง:\n\n| สถานการณ์ | หลักการที่ใช้ | บันทึกที่ถูก |\n| --- | --- | --- |\n| ซื้อยาล็อตใหญ่ 3 เดือนใช้ | Matching | ลง \"ยาคงคลัง\" (สินทรัพย์) ก่อน เป็นค่าใช้จ่ายเมื่อเบิกใช้ ไม่ใช่ลงค่าใช้จ่ายทั้งก้อนวันที่ซื้อ |\n| ลูกหนี้ พ.ร.บ. ค้าง 3 ปี ติดตามไม่ได้ | Prudence | ตั้งค่าเผื่อหนี้สงสัยจะสูญ / จำหน่ายหนี้ตามระเบียบ |\n| ซื้อเครื่องติดตามสัญญาณชีพ ใช้ได้ 5 ปี | Going concern + Matching | บันทึกเป็นครุภัณฑ์ แล้วตัดค่าเสื่อมทุกปี |\n| ค่าปากกา 200 บาท ใช้หลายเดือน | Materiality | ลงค่าใช้จ่ายทันทีได้ ไม่ต้องกระจาย |\n\n### 1.7 ตัวอย่างเต็ม: บันทึก 5 รายการด้วยสมการบัญชี\n\nใช้โจทย์เดียวกับแบบฝึก 1.8 ข้อแรก — ลองทำเองก่อน แล้วค่อยเปิดเฉลย\n\nยอดยกมาต้นงวด (ตัวเลขสมมติ): เงินสด 100,000 · ครุภัณฑ์ 200,000 · ทุน 300,000\n\n1. ซื้อยาเชื่อ 100,000 บาท\n2. ให้บริการ IP สิทธิ UC 50,000 บาท (ยังไม่ได้รับเงิน)\n3. ได้รับเงินโอน สปสช. 30,000 บาท (เป็นเงินชดเชยของรายการที่ 2 บางส่วน)\n4. จ่ายค่ายา 60,000 บาท\n5. ตัดค่าเสื่อมครุภัณฑ์ 5,000 บาท\n\n::: ดูเฉลย: ตารางสมการบัญชี\n\n| รายการ | เงินสด | ยาคงคลัง | ลูกหนี้ UC | ครุภัณฑ์สุทธิ | = | เจ้าหนี้ค่ายา | ทุน | ทุนเปลี่ยนเพราะ |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| ยกมา | 100,000 | 0 | 0 | 200,000 | = | 0 | 300,000 | |\n| 1. ซื้อยาเชื่อ | | +100,000 | | | = | +100,000 | | |\n| 2. ให้บริการ IP UC | | | +50,000 | | = | | +50,000 | รายได้ |\n| 3. รับเงินโอน | +30,000 | | −30,000 | | = | | | |\n| 4. จ่ายค่ายา | −60,000 | | | | = | −60,000 | | |\n| 5. ค่าเสื่อม | | | | −5,000 | = | | −5,000 | ค่าใช้จ่าย |\n| ปลายงวด | 70,000 | 100,000 | 20,000 | 195,000 | = | 40,000 | 345,000 | |\n\nตรวจสมดุล: สินทรัพย์ 70,000 + 100,000 + 20,000 + 195,000 = 385,000 · หนี้สิน + ทุน = 40,000 + 345,000 = 385,000 ✓\n\nบันทึกบัญชีคู่ (Dr / Cr):\n\n| รายการ | เดบิต | เครดิต | จำนวน |\n| --- | --- | --- | --- |\n| 1 | ยาคงคลัง | เจ้าหนี้ค่ายา | 100,000 |\n| 2 | ลูกหนี้ค่ารักษา UC | รายได้ค่ารักษา UC | 50,000 |\n| 3 | เงินสด/เงินฝากธนาคาร | ลูกหนี้ค่ารักษา UC | 30,000 |\n| 4 | เจ้าหนี้ค่ายา | เงินสด/เงินฝากธนาคาร | 60,000 |\n| 5 | ค่าเสื่อมราคา | ค่าเสื่อมราคาสะสม | 5,000 |\n\nข้อสังเกต:\n\n- รายการ 1 ยังไม่ใช่ค่าใช้จ่าย เพราะยายังไม่ถูกใช้ (Matching) — ถ้าเบิกยาไปใช้ 40,000 บาท จะบันทึก Dr ค่ายา / Cr ยาคงคลัง แล้ว NI ลดลง 40,000\n- รายการ 3 ไม่ใช่รายได้ใหม่ เพราะรับรู้รายได้ไปแล้วในรายการ 2 — เป็นแค่การเปลี่ยนลูกหนี้เป็นเงินสด\n- รายการ 5 ไม่มีเงินออกจริง แต่ทำให้ทุนลด\n\n:::\n\n::: ดูเฉลย: ทำไมกำไรแต่เงินสดลด\n\nNI ของงวด = รายได้ 50,000 − ค่าเสื่อม 5,000 = **+45,000 บาท** แต่เงินสดเปลี่ยนจาก 100,000 เป็น 70,000 = **−30,000 บาท**\n\nกระทบยอดจาก NI ไปหาเงินสด (วิธีนี้คือ \"งบกระแสเงินสดวิธีทางอ้อม\" ที่จะเรียนในบทที่ 2):\n\n| รายการ | จำนวน | เหตุผล |\n| --- | --- | --- |\n| NI | +45,000 | จุดเริ่มต้น |\n| บวกกลับค่าเสื่อม | +5,000 | เป็นค่าใช้จ่ายที่ไม่ใช่เงินสด |\n| ลูกหนี้ UC เพิ่มขึ้น | −20,000 | รายได้ที่ยังไม่ได้เงิน |\n| ยาคงคลังเพิ่มขึ้น | −100,000 | เงินไปจมอยู่ในของ |\n| เจ้าหนี้ค่ายาเพิ่มขึ้น | +40,000 | ยังค้างจ่ายผู้ขาย = ยืมเงินผู้ขายชั่วคราว |\n| เงินสดเปลี่ยนแปลง | −30,000 | ตรงกับยอดเงินสด 100,000 → 70,000 ✓ |\n\nประโยคสรุปที่ใช้ตอบผู้บริหาร: \"รพ. มีรายได้สูงกว่าค่าใช้จ่าย แต่เงินไปจมอยู่ในลูกหนี้ที่ยังไม่ได้รับและยาคงคลัง จึงไม่มีเงินจ่ายเจ้าหนี้ — ทางแก้คือเร่งเก็บลูกหนี้ (งานเคลม) และคุมสต็อกยา ไม่ใช่ตัดค่าใช้จ่ายอย่างเดียว\"\n\n:::\n\n### 1.8 แบบฝึก\n\n- [ ] บันทึก 5 รายการด้วยสมการบัญชี: ซื้อยาเชื่อ 100,000 บาท / ให้บริการ IP สิทธิ UC 50,000 บาท / ได้รับเงินโอน สปสช. 30,000 บาท / จ่ายค่ายา 60,000 บาท / ตัดค่าเสื่อมครุภัณฑ์ 5,000 บาท (ตัวเลขสมมติเพื่อฝึก)\n- [ ] อธิบายด้วยคำพูดตัวเองว่า \"ทำไม รพ. มีรายได้สูงกว่าค่าใช้จ่าย แต่ไม่มีเงินจ่ายค่ายา\"\n- [ ] ต่อจากตัวอย่าง 1.7: เบิกยาไปใช้กับผู้ป่วย 40,000 บาท และค่าตอบแทนนอกเวลาเดือนนี้ 15,000 บาทยังไม่ได้จ่าย — บันทึก Dr/Cr แล้วหา NI และเงินสดปลายงวดใหม่ (ตัวเลขสมมติ)\n- [ ] จำแนกรายการต่อไปนี้ว่าเป็นสินทรัพย์ / หนี้สิน / รายได้ / ค่าใช้จ่าย และหมุนเวียนหรือไม่: ลูกหนี้ค่ารักษาสิทธิเบิกจ่ายตรง, ค่าเสื่อมราคาสะสม, ค่าตอบแทนค้างจ่าย, รถพยาบาล, เงินชดเชย OP UC ที่ได้รับแล้ว\n- [ ] เขียน 1 ประโยค: ถ้าเคลม IP UC 50,000 บาทในตัวอย่างถูกปฏิเสธจ่ายถาวร ต้องปรับปรุงบัญชีอย่างไร และกระทบ NI กับเงินสดอย่างไร\n\n::: ดูเฉลย: แบบฝึกข้อ 3–5\n\nข้อ 3 — เบิกยาใช้: Dr ค่ายา 40,000 / Cr ยาคงคลัง 40,000 · ค่าตอบแทนค้างจ่าย: Dr ค่าตอบแทน 15,000 / Cr ค่าตอบแทนค้างจ่าย 15,000 · NI ใหม่ = 45,000 − 40,000 − 15,000 = **−10,000 บาท** · เงินสดยังเป็น **70,000 บาท** เท่าเดิม เพราะทั้งสองรายการไม่มีเงินออก\n\nข้อ 4 —\n\n| รายการ | ประเภท | หมุนเวียน |\n| --- | --- | --- |\n| ลูกหนี้ค่ารักษาสิทธิเบิกจ่ายตรง | สินทรัพย์ | ใช่ |\n| ค่าเสื่อมราคาสะสม | บัญชีปรับลดสินทรัพย์ (หักจากครุภัณฑ์) | ไม่ใช่ |\n| ค่าตอบแทนค้างจ่าย | หนี้สิน | ใช่ |\n| รถพยาบาล | สินทรัพย์ (ครุภัณฑ์ยานพาหนะ) | ไม่ใช่ |\n| เงินชดเชย OP UC ที่ได้รับแล้ว | เงินสดเพิ่ม (สินทรัพย์) — ส่วนจะเป็นรายได้ใหม่หรือการตัดลูกหนี้ ขึ้นกับว่าตั้งลูกหนี้ไว้แล้วหรือยัง | ใช่ |\n\nข้อ 5 — ส่วนที่ยังค้าง 20,000 บาทต้องปรับลด: Dr รายได้ค่ารักษา UC (หรือหนี้สูญ/ส่วนต่างตามผังบัญชี) / Cr ลูกหนี้ UC 20,000 → NI ลด 20,000 · เงินสดไม่เปลี่ยน (เพราะไม่เคยได้เงินส่วนนี้) — นี่คือเหตุผลที่เคลมถูกปฏิเสธ \"ไม่เจ็บตอนนี้ แต่เจ็บตอนปิดบัญชี\"\n\n:::\n\n### 1.9 กับดักของคนเริ่มเรียนบัญชี\n\n| เข้าใจผิด | ความจริง |\n| --- | --- |\n| เครดิต = ดี เดบิต = แย่ | เป็นแค่ฝั่งซ้าย-ขวาของการบันทึก |\n| ซื้อยา = ค่าใช้จ่ายทันที | เป็นสินทรัพย์ (ยาคงคลัง) จนกว่าจะเบิกใช้ |\n| ได้เงินโอนจากกองทุน = รายได้เสมอ | ถ้าตั้งลูกหนี้ไว้แล้ว เงินโอนคือการตัดลูกหนี้ ไม่ใช่รายได้ใหม่ |\n| ค่าเสื่อม = เงินออก | ไม่มีเงินออก แต่ลด NI — จึงต้องบวกกลับเมื่อดูเงินสด |\n| NI บวก = รพ. ปลอดภัย | ต้องดูเงินสด NWC และลูกหนี้ด้วย (บทที่ 4–5) |\n\n### 1.10 สรุปบท — 3 ข้อที่ต้องจำ\n\n1. สินทรัพย์ = หนี้สิน + ทุน และ NI คือสิ่งที่ทำให้ทุนเปลี่ยนระหว่างงวด\n2. รพ.สธ. ใช้เกณฑ์คงค้าง: รายได้เกิดตอนให้บริการ เงินสดมาทีหลัง — ช่องว่างนี้คือ \"ลูกหนี้\" ซึ่งงานเคลมเป็นคนปิด\n3. รายการปรับปรุง (ค่าเสื่อม ค่าใช้จ่ายค้างจ่าย ค่าเผื่อหนี้สงสัยจะสูญ ปรับลดลูกหนี้ตามผลชดเชยจริง) เปลี่ยน NI โดยไม่เปลี่ยนเงินสด\n\nคำถามปิดบท: \"แล้วมันกระทบเงินสดของ รพ. อย่างไร\" — ถ้าตอบได้จากตัวอย่าง 1.7 แปลว่าพร้อมไปบทที่ 2\n\n### แผนผังความคิด (Mind map)\n\nจำภาพนี้ให้ได้ก่อนไปบทถัดไป — ลองปิดจอแล้ววาดเองบนกระดาษ\n\n```mindmap\nพื้นฐานบัญชี\n- สมการบัญชี\n  - สินทรัพย์ = หนี้สิน + ทุน\n  - NI = รายได้ − ค่าใช้จ่าย → ทุน\n  - หมุนเวียน = ภายใน 1 ปี\n- เดบิต / เครดิต\n  - สินทรัพย์ ค่าใช้จ่าย เพิ่ม = Dr\n  - หนี้สิน ทุน รายได้ เพิ่ม = Cr\n  - Dr = Cr ทุกรายการ\n- เกณฑ์คงค้าง\n  - รายได้เกิดตอนให้บริการ\n  - เงินสดมาทีหลัง = ลูกหนี้\n  - อ่านคู่งบกระแสเงินสด\n- รายการปรับปรุง\n  - ค่าเสื่อม: NI ลด เงินไม่ออก\n  - ค่าใช้จ่ายค้างจ่าย / รายได้ค้างรับ\n  - ค่าเผื่อหนี้สงสัยจะสูญ\n  - ปรับลดลูกหนี้ตามผลชดเชยจริง\n- 4 หลักการ\n  - Going concern\n  - Matching: ยาเป็นค่าใช้จ่ายเมื่อใช้\n  - Prudence: หนี้เก็บไม่ได้ต้องตั้งค่าเผื่อ\n  - Materiality\n- เชื่อมงานประกัน\n  - เคลม 1 ราย = ลูกหนี้ 1 รายการ\n  - ผลเคลม = เอกสารตัดลูกหนี้\n  - ถูกปฏิเสธ → NI ลด เงินสดเท่าเดิม\n```\n\n## บทที่ 2 งบการเงินหลักและความเชื่อมโยงระหว่างงบ\n\nงบการเงินมี 4 งบหลัก + หมายเหตุประกอบงบ แต่ละงบตอบคำถามคนละข้อ และต้องอ่านเชื่อมกันเสมอ\n\nเป้าหมายของบทนี้: จบบทแล้วสร้างงบทั้ง 4 จากรายการในบทที่ 1 ได้เอง ชี้ได้ว่าตัวเลขไหนโผล่ในงบไหนบ้าง และอ่านงบ รพ. จริงตามลำดับ 30 นาทีได้ ใช้เวลาประมาณ 3–4 ชั่วโมง\n\nตัวอย่างในบทนี้ต่อยอดจากตัวอย่าง 1.7 — ใช้ **ตัวเลขสมมติ** ชุดเดิม ชื่อบรรทัดในงบเป็นชื่อทั่วไป รูปแบบงบจริงให้ดูแบบรายงานการเงินหน่วยบริการ สป.สธ. ปีงบปัจจุบัน\n\n### 2.1 งบแต่ละตัวตอบคำถามอะไร\n\n| งบ | ตอบคำถาม | ลักษณะเวลา | สิ่งที่ดูใน รพ. |\n| --- | --- | --- | --- |\n| งบแสดงฐานะการเงิน (Balance sheet) | ณ วันนี้ รพ. มีอะไร เป็นหนี้เท่าไร | ภาพนิ่ง ณ วันสิ้นงวด | เงินสด, ลูกหนี้ค่ารักษาตามสิทธิ, ยาคงคลัง, เจ้าหนี้ค่ายา |\n| งบแสดงผลการดำเนินงาน (Income statement) | ทำงานทั้งงวดแล้ว รายได้สูงหรือต่ำกว่าค่าใช้จ่าย | ช่วงเวลา (เดือน/ปี) | รายได้ค่ารักษาแยกสิทธิ, เงินเดือน/ค่าตอบแทน, ค่ายา, ค่าเสื่อม |\n| งบกระแสเงินสด (Cash flow) | เงินสดเข้า-ออกจริงเท่าไร มาจากไหน | ช่วงเวลา | เงินสดจากการดำเนินงาน vs ลงทุน vs จัดหาเงิน |\n| งบการเปลี่ยนแปลงส่วนทุน | ทุนเพิ่ม/ลดเพราะอะไร | ช่วงเวลา | รายได้สูง(ต่ำ)กว่าค่าใช้จ่ายสะสม |\n| หมายเหตุประกอบงบ | ตัวเลขข้างบนมีรายละเอียด/สมมติฐานอะไร | — | นโยบายตั้งค่าเผื่อหนี้สงสัยจะสูญ, รายละเอียดลูกหนี้รายสิทธิ |\n\nเปรียบเทียบให้จำง่าย (ภาษาพยาบาล): งบแสดงฐานะการเงิน = ผลตรวจร่างกาย ณ วันนี้ · งบผลการดำเนินงาน = Intake/Output ทั้งเวร · งบกระแสเงินสด = สารน้ำที่เข้า-ออกจริง (ไม่ใช่ที่สั่งไว้) · หมายเหตุ = Progress note ที่บอกว่าตัวเลขมาอย่างไร\n\n### 2.2 หน้าตาของแต่ละงบ (สร้างจากตัวอย่าง 1.7)\n\nตัวอย่าง 1.7: ยกมา เงินสด 100,000 · ครุภัณฑ์ 200,000 · ทุน 300,000 แล้วเกิด 5 รายการ (ซื้อยาเชื่อ 100,000 / ให้บริการ IP UC 50,000 / รับเงินโอน 30,000 / จ่ายค่ายา 60,000 / ค่าเสื่อม 5,000) — ตัวเลขสมมติ\n\n**งบแสดงผลการดำเนินงาน** (สำหรับงวด)\n\n| รายการ | บาท |\n| --- | --- |\n| รายได้ค่ารักษาพยาบาล UC | 50,000 |\n| รวมรายได้ | 50,000 |\n| ค่าเสื่อมราคา | 5,000 |\n| รวมค่าใช้จ่าย | 5,000 |\n| **รายได้สูง(ต่ำ)กว่าค่าใช้จ่ายสุทธิ (NI)** | **45,000** |\n\n**งบการเปลี่ยนแปลงส่วนทุน**\n\n| รายการ | บาท |\n| --- | --- |\n| ทุนต้นงวด | 300,000 |\n| บวก NI ของงวด | 45,000 |\n| **ทุนปลายงวด** | **345,000** |\n\n**งบแสดงฐานะการเงิน** (ณ วันสิ้นงวด)\n\n| สินทรัพย์ | บาท | หนี้สินและทุน | บาท |\n| --- | --- | --- | --- |\n| เงินสดและเงินฝาก | 70,000 | เจ้าหนี้ค่ายา | 40,000 |\n| ลูกหนี้ค่ารักษา UC | 20,000 | **รวมหนี้สินหมุนเวียน** | **40,000** |\n| ยาคงคลัง | 100,000 | | |\n| **รวมสินทรัพย์หมุนเวียน** | **190,000** | | |\n| ครุภัณฑ์ (สุทธิหลังหักค่าเสื่อมสะสม) | 195,000 | ทุน | 345,000 |\n| **รวมสินทรัพย์** | **385,000** | **รวมหนี้สินและทุน** | **385,000** |\n\n**งบกระแสเงินสด** (วิธีทางอ้อม)\n\n| รายการ | บาท |\n| --- | --- |\n| NI | 45,000 |\n| บวก ค่าเสื่อมราคา (ไม่ใช่เงินสด) | 5,000 |\n| หัก ลูกหนี้ค่ารักษาเพิ่มขึ้น | (20,000) |\n| หัก ยาคงคลังเพิ่มขึ้น | (100,000) |\n| บวก เจ้าหนี้ค่ายาเพิ่มขึ้น | 40,000 |\n| **เงินสดสุทธิจากกิจกรรมดำเนินงาน** | **(30,000)** |\n| เงินสดสุทธิจากกิจกรรมลงทุน | 0 |\n| เงินสดสุทธิจากกิจกรรมจัดหาเงิน | 0 |\n| **เงินสดเพิ่ม(ลด)สุทธิ** | **(30,000)** |\n| เงินสดต้นงวด | 100,000 |\n| **เงินสดปลายงวด** | **70,000** |\n\nตัวเลขในวงเล็บ = ติดลบ (รูปแบบที่งบการเงินใช้) — ลองหา Ratio จากงบนี้ล่วงหน้า: CR = 190,000 ÷ 40,000 = 4.75 · NWC = 150,000 · ดูดีมาก แต่เงินสดจากการดำเนินงานติดลบ — นี่คือเหตุผลที่ต้องอ่านหลายงบคู่กัน\n\n### 2.3 ความเชื่อมโยง (ต้องวาดเองให้ได้)\n\n1. รายได้สูง(ต่ำ)กว่าค่าใช้จ่ายสุทธิ (NI) จากงบผลการดำเนินงาน → ไหลไปเพิ่ม/ลดทุนในงบฐานะการเงิน\n2. งบกระแสเงินสดเริ่มจาก NI แล้วปรับรายการที่ไม่ใช่เงินสด เช่น บวกค่าเสื่อมกลับ, หักลูกหนี้ที่เพิ่มขึ้น, บวกเจ้าหนี้ที่เพิ่มขึ้น\n3. เงินสดปลายงวดในงบกระแสเงินสด = เงินสดในงบฐานะการเงิน\n\nตัวเลขเดียวกันที่ต้องโผล่ 2 ที่ (ใช้ตรวจว่างบ \"ผูกกัน\" หรือไม่):\n\n| ตัวเลข | โผล่ที่งบ A | โผล่ที่งบ B | จากตัวอย่าง |\n| --- | --- | --- | --- |\n| NI | ผลการดำเนินงาน (บรรทัดสุดท้าย) | เปลี่ยนแปลงส่วนทุน และบรรทัดแรกของกระแสเงินสด | 45,000 |\n| ทุนปลายงวด | เปลี่ยนแปลงส่วนทุน | ฐานะการเงิน (ฝั่งขวา) | 345,000 |\n| เงินสดปลายงวด | กระแสเงินสด (บรรทัดสุดท้าย) | ฐานะการเงิน (สินทรัพย์บรรทัดแรก) | 70,000 |\n| ลูกหนี้เพิ่มขึ้น | ส่วนต่างลูกหนี้ 2 งวดในฐานะการเงิน | กระแสเงินสด (รายการหัก) | 20,000 |\n| ค่าเสื่อม | ผลการดำเนินงาน (ค่าใช้จ่าย) | กระแสเงินสด (บวกกลับ) และค่าเสื่อมสะสมในฐานะการเงิน | 5,000 |\n\nข้อสรุปที่ต้องจำ: ลูกหนี้เพิ่ม = เงินสดลด, เจ้าหนี้เพิ่ม = เงินสดเพิ่ม (ชั่วคราว), ค่าเสื่อม = ค่าใช้จ่ายที่ไม่ใช่เงินสด\n\nกฎการปรับในงบกระแสเงินสดวิธีทางอ้อม:\n\n| การเปลี่ยนแปลงในงบฐานะการเงิน | ผลต่อเงินสด | เหตุผล |\n| --- | --- | --- |\n| สินทรัพย์หมุนเวียน (ลูกหนี้ ยาคงคลัง) เพิ่ม | หัก | เงินไปจมอยู่ในของหรือในลูกหนี้ |\n| สินทรัพย์หมุนเวียนลด | บวก | ของ/ลูกหนี้กลายเป็นเงิน |\n| หนี้สินหมุนเวียน (เจ้าหนี้ ค้างจ่าย) เพิ่ม | บวก | ยังไม่ได้จ่ายเงินออก |\n| หนี้สินหมุนเวียนลด | หัก | จ่ายหนี้ออกไป |\n| ค่าเสื่อม / ค่าเผื่อหนี้สงสัยจะสูญ | บวกกลับ | ลด NI แต่ไม่มีเงินออก |\n\n### 2.4 งบกระแสเงินสด 3 กิจกรรม\n\n| กิจกรรม | ความหมาย | ตัวอย่างใน รพ. |\n| --- | --- | --- |\n| ดำเนินงาน (Operating) | เงินจากงานหลัก — ให้บริการ จ่ายค่ายา จ่ายเงินเดือน | รับเงินชดเชยจากกองทุน, รับเงินผู้ป่วยชำระเอง, จ่ายเจ้าหนี้ค่ายา, จ่ายค่าตอบแทน |\n| ลงทุน (Investing) | ซื้อ/ขายสินทรัพย์ระยะยาว | ซื้อครุภัณฑ์การแพทย์ ก่อสร้าง/ปรับปรุงอาคารด้วยเงินบำรุง |\n| จัดหาเงิน (Financing) | กู้ยืมหรือชำระคืนเงินทุน | ยืมเงิน/รับเงินช่วยเหลือที่ต้องคืน (รพ.รัฐส่วนใหญ่มีรายการนี้น้อย) |\n\nคำถามคัดกรองเร็ว: **เงินสดจากการดำเนินงานเป็นบวกต่อเนื่องหรือไม่** — ถ้าติดลบหลายงวดติดกัน รพ. กำลังใช้เงินเก่าหรือยืมเงินเจ้าหนี้มาหมุน แม้ NI จะบวกก็ตาม\n\nวิธีทางตรง vs ทางอ้อม: วิธีทางตรงแสดงเงินรับ-จ่ายจริงแยกประเภท (อ่านง่าย) · วิธีทางอ้อมเริ่มจาก NI แล้วปรับ (เห็นว่าเงินไปจมที่ไหน) — สำหรับงานประกัน วิธีทางอ้อมมีประโยชน์กว่า เพราะเห็นบรรทัด \"ลูกหนี้เพิ่มขึ้น\" ซึ่งเป็นผลของงานเคลมโดยตรง\n\n### 2.5 ลำดับการอ่านงบที่แนะนำ\n\n1. งบกระแสเงินสด — รพ. มีเงินพอจ่ายไหม (คำถามเอาตัวรอด)\n2. งบฐานะการเงิน — ทุนหมุนเวียนสุทธิ (NWC) บวกหรือลบ, ลูกหนี้/เจ้าหนี้ค้างเท่าไร\n3. งบผลการดำเนินงาน — ขาดทุน/กำไรมาจากรายได้ต่ำ หรือค่าใช้จ่ายสูง\n4. หมายเหตุ — มีการประมาณการที่ทำให้ตัวเลขดูดีเกินจริงหรือไม่\n\nChecklist อ่านงบ รพ. 1 แห่งใน 30 นาที:\n\n| นาที | งบ | คำถาม | ดูอะไร |\n| --- | --- | --- | --- |\n| 0–5 | กระแสเงินสด | เงินสดจากการดำเนินงานบวกหรือลบ ต่อเนื่องกี่งวด | บรรทัดเงินสดสุทธิจากกิจกรรมดำเนินงาน |\n| 5–12 | ฐานะการเงิน | NWC บวกหรือลบ · เงินสดพอจ่ายหนี้หมุนเวียนไหม | Cash, NWC, CR (บทที่ 4) |\n| 12–17 | ฐานะการเงิน | ลูกหนี้สิทธิไหนสูง · เจ้าหนี้ค่ายาค้างนานไหม | ลูกหนี้รายสิทธิ, เจ้าหนี้ค่ายา (ACP/APP บทที่ 4) |\n| 17–24 | ผลการดำเนินงาน | ขาดทุนเพราะรายได้หรือค่าใช้จ่าย · หมวดไหนเปลี่ยนมาก | รายได้แยกสิทธิ, ค่าใช้จ่ายรายหมวด (Common-size) |\n| 24–28 | หมายเหตุ | ตั้งค่าเผื่อหนี้สงสัยจะสูญพอไหม · ลูกหนี้ตั้งตามอัตราจ่ายจริงไหม | นโยบายบัญชี, ลูกหนี้แยกอายุ |\n| 28–30 | สรุป | ป่วยตรงไหน เพราะอะไร ต้องแก้อะไร | เขียน 3 บรรทัด |\n\n### 2.6 กับดักที่พบบ่อย\n\n- กำไรแต่เงินสดติดลบ: ลูกหนี้ค่ารักษาค้างสูง (เคลมไม่ผ่าน/ส่งช้า)\n- ตั้งลูกหนี้ตามราคาเรียกเก็บเต็ม แต่กองทุนจ่ายตามอัตราจ่ายจริง (เช่น DRG ตามค่า Base rate) ทำให้รายได้และลูกหนี้สูงเกินจริง\n- ไม่ตั้งค่าเผื่อหนี้สงสัยจะสูญ สำหรับลูกหนี้ที่เกินระยะเวลาเรียกเก็บได้\n- เจ้าหนี้ค่ายาค้างนาน ทำให้เงินสดดูดี แต่เป็นการยืมเงินผู้ขาย\n\nอาการ → สาเหตุที่น่าสงสัย (ใช้ตอน Detect ในบทที่ 7):\n\n| อาการในงบ | สาเหตุที่น่าสงสัยก่อน | ตรวจต่อที่ |\n| --- | --- | --- |\n| NI บวก แต่เงินสดจากการดำเนินงานลบ | ลูกหนี้หรือยาคงคลังพอก | ลูกหนี้แยกอายุ, มูลค่ายาคงคลัง |\n| เงินสดเพิ่ม แต่ NI ลบ | เจ้าหนี้ค่ายาพอก (ยืมเงินผู้ขาย) | เจ้าหนี้ค่ายา, APP |\n| ลูกหนี้ UC สูงขึ้นทุกงวด ทั้งที่ผลงานเท่าเดิม | ส่งเคลมช้า ติด C/Deny ค้าง | ผลเคลม e-Claim/FDH |\n| รายได้สูงกว่า Planfin มาก แต่เงินไม่เข้า | ตั้งลูกหนี้ตามราคาเรียกเก็บเต็ม | หมายเหตุนโยบายรับรู้รายได้ |\n| ลูกหนี้ปีเก่าไม่ลดเลย | ไม่ได้ติดตาม/ไม่ตั้งค่าเผื่อหนี้สงสัยจะสูญ | ลูกหนี้แยกอายุ (บทที่ 3) |\n\nตัวเลขที่ สสจ./เขตใช้คู่กับงบ: **เงินบำรุงคงเหลือหลังหักหนี้** = เงินบำรุงที่เหลือจริงหลังหักหนี้สินและภาระผูกพัน — ตัวอย่างจริง จ.อุดรธานี ณ มิ.ย. 69 ติดลบ 16 จาก 21 แห่ง ทั้งที่ EBITDA เป็นบวกทุกแห่ง (ดูเมนู \"กรณีศึกษา 21 รพ.\", ที่มา: สไลด์ กวป. ก.ค. 69)\n\n### 2.7 หมายเหตุประกอบงบ — ต้องเปิดอ่านอะไร\n\n- นโยบายการรับรู้รายได้ค่ารักษา: ตั้งลูกหนี้ตามราคาเรียกเก็บ หรือตามอัตราที่กองทุนจ่ายจริง\n- นโยบายค่าเผื่อหนี้สงสัยจะสูญ: ตั้งเมื่อไร ร้อยละเท่าไร แยกตามสิทธิหรือไม่\n- รายละเอียดลูกหนี้รายสิทธิและแยกอายุ: ใช้เทียบกับรายงานลูกหนี้ของจังหวัด (บทที่ 3)\n- ภาระผูกพันและหนี้ที่ยังไม่บันทึก: เช่น สัญญาจัดซื้อที่ยังไม่ส่งมอบ — กระทบเงินบำรุงคงเหลือหลังหักหนี้\n- การเปลี่ยนนโยบายบัญชี: ถ้าเปลี่ยนวิธีตั้งลูกหนี้/ค่าเสื่อม ตัวเลขข้ามปีเทียบกันตรง ๆ ไม่ได้\n\n### 2.8 แบบฝึก\n\n- [ ] วาดแผนภาพเชื่อม 3 งบด้วยมือ โดยใช้ 5 รายการจากแบบฝึกบทที่ 1\n- [ ] หางบการเงิน รพ.ชุมชน 1 แห่ง (จาก สสจ. หรือรายงานประจำปี) แล้วระบุ NI, เงินสดปลายงวด, ลูกหนี้ค่ารักษารวม\n- [ ] สร้างงบทั้ง 4 จากแบบฝึกบทที่ 1 ข้อ 3 (เพิ่มเบิกยาใช้ 40,000 และค่าตอบแทนค้างจ่าย 15,000) แล้วตรวจว่าตัวเลขผูกกันทุกจุด (ตัวเลขสมมติ)\n- [ ] จัดรายการต่อไปนี้เข้ากิจกรรมในงบกระแสเงินสด: รับเงินชดเชย IP จาก สปสช. / ซื้อเครื่องช่วยหายใจ / จ่ายเจ้าหนี้ค่ายา / จ่ายค่าตอบแทนนอกเวลา / ชำระคืนเงินยืม\n- [ ] ใช้ Checklist 30 นาทีกับงบ รพ. จริง 1 แห่ง แล้วเขียนสรุป 3 บรรทัด \"ป่วยตรงไหน เพราะอะไร ต้องแก้อะไร\"\n\n::: ดูเฉลย: งบทั้ง 4 จากแบบฝึกบทที่ 1 ข้อ 3\n\nงบแสดงผลการดำเนินงาน: รายได้ UC 50,000 · ค่ายา 40,000 · ค่าตอบแทน 15,000 · ค่าเสื่อม 5,000 · รวมค่าใช้จ่าย 60,000 · **NI (10,000)**\n\nงบการเปลี่ยนแปลงส่วนทุน: 300,000 + (10,000) = **290,000**\n\nงบแสดงฐานะการเงิน:\n\n| สินทรัพย์ | บาท | หนี้สินและทุน | บาท |\n| --- | --- | --- | --- |\n| เงินสด | 70,000 | เจ้าหนี้ค่ายา | 40,000 |\n| ลูกหนี้ UC | 20,000 | ค่าตอบแทนค้างจ่าย | 15,000 |\n| ยาคงคลัง | 60,000 | รวมหนี้สินหมุนเวียน | 55,000 |\n| ครุภัณฑ์สุทธิ | 195,000 | ทุน | 290,000 |\n| **รวม** | **345,000** | **รวม** | **345,000** |\n\nงบกระแสเงินสด: NI (10,000) + ค่าเสื่อม 5,000 − ลูกหนี้เพิ่ม 20,000 − ยาคงคลังเพิ่ม 60,000 + เจ้าหนี้เพิ่ม 40,000 + ค่าตอบแทนค้างจ่ายเพิ่ม 15,000 = **(30,000)** → เงินสดปลายงวด 100,000 − 30,000 = **70,000** ✓ ตรงกับงบฐานะการเงิน\n\nสังเกต: NI เปลี่ยนจาก +45,000 เป็น (10,000) แต่เงินสดเท่าเดิม 70,000 — เพราะรายการที่เพิ่มไม่มีเงินเข้าออกเลย\n\n:::\n\n::: ดูเฉลย: จัดเข้ากิจกรรมกระแสเงินสด\n\n| รายการ | กิจกรรม |\n| --- | --- |\n| รับเงินชดเชย IP จาก สปสช. | ดำเนินงาน |\n| ซื้อเครื่องช่วยหายใจ | ลงทุน |\n| จ่ายเจ้าหนี้ค่ายา | ดำเนินงาน |\n| จ่ายค่าตอบแทนนอกเวลา | ดำเนินงาน |\n| ชำระคืนเงินยืม | จัดหาเงิน |\n\n:::\n\n### 2.9 สรุปบท — 3 ข้อที่ต้องจำ\n\n1. งบ 4 ตัวผูกกันด้วย 3 ตัวเลข: NI → ทุน, NI → บรรทัดแรกของงบกระแสเงินสด, เงินสดปลายงวด = เงินสดในงบฐานะการเงิน\n2. อ่านจากเงินสดก่อน (กระแสเงินสด → ฐานะการเงิน → ผลการดำเนินงาน → หมายเหตุ) เพราะ รพ. ล้มจากเงินหมด ไม่ใช่จากขาดทุนทางบัญชี\n3. บรรทัด \"ลูกหนี้เพิ่มขึ้น\" ในงบกระแสเงินสดคือผลงานเคลมที่ยังไม่กลายเป็นเงิน — งานประกันสุขภาพคือคนที่ทำให้บรรทัดนี้เล็กลง\n\n### แผนผังความคิด (Mind map)\n\nจำภาพนี้ให้ได้ก่อนไปบทถัดไป — ลองปิดจอแล้ววาดเองบนกระดาษ\n\n```mindmap\nงบ 4 ตัว + หมายเหตุ\n- ฐานะการเงิน\n  - ภาพนิ่ง ณ วันสิ้นงวด\n  - สินทรัพย์ = หนี้สิน + ทุน\n  - NWC = หมุนเวียน − หนี้หมุนเวียน\n- ผลการดำเนินงาน\n  - ทั้งงวด\n  - รายได้ − ค่าใช้จ่าย = NI\n- กระแสเงินสด\n  - ดำเนินงาน / ลงทุน / จัดหาเงิน\n  - ทางอ้อม: เริ่มจาก NI\n  - ลูกหนี้เพิ่ม = เงินสดลด\n- 3 จุดผูกงบ\n  - NI → ทุน\n  - NI → บรรทัดแรกกระแสเงินสด\n  - เงินสดปลายงวดตรงกันทั้ง 2 งบ\n- ลำดับอ่าน 30 นาที\n  - เงินสด → NWC → NI → หมายเหตุ\n  - จบด้วย 3 บรรทัด: ป่วยตรงไหน เพราะอะไร แก้อะไร\n- กับดัก\n  - กำไรแต่เงินสดลบ\n  - ตั้งลูกหนี้ราคาเต็ม\n  - เจ้าหนี้ยาค้าง = ยืมเงินผู้ขาย\n  - เงินบำรุงหลังหักหนี้ติดลบ\n```\n\n## บทที่ 3 ระบบบัญชีหน่วยบริการ สป.สธ. และลูกหนี้ค่ารักษาตามสิทธิ\n\nสำหรับงานประกันสุขภาพ บัญชีที่สำคัญที่สุดคือ \"ลูกหนี้ค่ารักษาพยาบาลแยกตามสิทธิ\" เพราะเป็นจุดที่งานเคลมกลายเป็นเงินสด หรือกลายเป็นหนี้สูญ\n\nเป้าหมายของบทนี้: จบบทแล้วบันทึกบัญชีลูกหนี้ 1 รายตั้งแต่ให้บริการจนได้เงินได้เอง อ่านรายงานลูกหนี้แยกอายุแล้วชี้ได้ว่าสิทธิไหนเป็นปัญหา และคำนวณได้ว่าถ้าลด ACP ลง x วัน รพ. จะได้เงินสดคืนเท่าไร ใช้เวลาประมาณ 3–4 ชั่วโมง\n\nตัวอย่างคำนวณในบทนี้เป็น **ตัวเลขสมมติ** รวมถึงอัตราจ่ายต่อ AdjRW (ไม่ใช่อัตราจริงของปีงบใด) ชื่อบัญชีเป็นชื่อทั่วไป — รหัสบัญชีและชื่อบัญชีจริงให้ดูผังบัญชีหน่วยบริการ สป.สธ. ฉบับที่ รพ. ใช้ ส่วนตัวเลขจริงของ จ.อุดรธานี ระบุแหล่งไว้ทุกจุด\n\n### 3.1 ภาพรวมระบบ\n\n- หน่วยบริการสังกัด สป.สธ. บันทึกบัญชีเกณฑ์คงค้าง และส่งรายงานการเงินรายไตรมาสให้ กองเศรษฐกิจสุขภาพและหลักประกันสุขภาพ (สป.สธ.) เพื่อใช้ประเมินวิกฤตการเงิน ([KPI template ปีงบ 67](https://uthaihealth.moph.go.th/uthkpi67/document/140.pdf))\n- แหล่งข้อมูลกลางที่จังหวัด/เขตใช้ดึงตัวชี้วัด คือระบบ hfo.moph.go.th (ปรากฏเป็นแหล่งอ้างอิงในรายงานสถานการณ์การเงินของเขต 8)\n- เขตสุขภาพที่ 8 ติดตามข้อมูล Risk, 7 Plus Efficiency, TPS, Planfin, Cost/CMI/SumAdjRW ทุกเดือน และมีทีมระดับจังหวัดลงพื้นที่ทำ RCA เมื่อพบสัญญาณเตือน ([เขต 8](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20240219102839.pdf))\n\nใครทำอะไรใน รพ. (ภาพทั่วไป — โครงสร้างจริงแต่ละแห่งต่างกัน):\n\n| หน่วย | หน้าที่ต่อบัญชีลูกหนี้ | ข้อมูลที่ สสจ. ขอได้ |\n| --- | --- | --- |\n| เวชระเบียน / Coder | สรุปชาร์ต ให้รหัส → กำหนดมูลค่าเคลม | ชาร์ตค้างสรุป, เวลาสรุปชาร์ต |\n| งานประกัน / ศูนย์จัดเก็บรายได้ | ส่งเคลม ตามผล แก้ C/Deny อุทธรณ์ | ผลเคลมรายเดือน, รายการติด C |\n| การเงิน | รับเงินโอน กระทบยอดกับ Statement | Statement, ยอดรับโอนรายงวด |\n| บัญชี | ตั้ง/ปรับ/ตัดลูกหนี้ ตั้งค่าเผื่อ ปิดงบ | ลูกหนี้แยกสิทธิแยกอายุ, งบไตรมาส |\n\nจุดสำคัญ: 4 หน่วยนี้ต้องใช้ตัวเลขชุดเดียวกัน — ถ้ายอดลูกหนี้ของบัญชีไม่ตรงกับยอดค้างในระบบเคลม แปลว่ามีรายการที่ไม่มีใครตาม\n\n### 3.2 จากบริการถึงเงินสด: 3 จังหวะของการบันทึกบัญชี\n\nลูกหนี้ 1 รายการเกิดและหายไปใน 3 จังหวะ (ใช้ Dr/Cr จากบทที่ 1.3)\n\n| จังหวะ | เกิดอะไร | Dr | Cr | กระทบ NI | กระทบเงินสด |\n| --- | --- | --- | --- | --- | --- |\n| ① ให้บริการ | ตั้งลูกหนี้ตามมูลค่าที่คาดว่าจะได้รับ | ลูกหนี้ค่ารักษา-สิทธิ | รายได้ค่ารักษา-สิทธิ | เพิ่ม | ไม่เปลี่ยน |\n| ② ได้ผลเคลม | ผลจ่ายต่างจากที่ตั้ง → ปรับลด (หรือเพิ่ม) | รายได้ / บัญชีส่วนต่าง | ลูกหนี้ค่ารักษา | ลดเท่าส่วนต่าง | ไม่เปลี่ยน |\n| ③ รับเงิน | เงินโอนเข้าบัญชี | เงินฝากธนาคาร | ลูกหนี้ค่ารักษา | ไม่เปลี่ยน | เพิ่ม |\n\nกรณีเก็บไม่ได้ มีจังหวะที่ ④ ตั้งค่าเผื่อหนี้สงสัยจะสูญ: Dr หนี้สงสัยจะสูญ (ค่าใช้จ่าย) / Cr ค่าเผื่อหนี้สงสัยจะสูญ (หักจากลูกหนี้) → NI ลด เงินสดไม่เปลี่ยน\n\nสังเกต 2 ข้อ:\n\n1. **เงินสดเปลี่ยนแค่จังหวะเดียว** (③) — งานเคลมทั้งหมดคือการพาลูกหนี้ไปถึงจังหวะ ③ ให้เร็วและครบที่สุด\n2. **มูลค่าตอนตั้งลูกหนี้กำหนดรายได้ทั้งงวด** — ถ้าตั้งสูงเกินจริง รายได้จะสูงเกินแล้วค่อยถูกปรับลดภายหลัง ถ้ารหัสไม่ครบ (Under-coding) รายได้ต่ำตั้งแต่ต้นและ **ไม่มีส่วนต่างให้เห็นในบัญชีเลย** — ต้องจับด้วย MR Audit เท่านั้น\n\nวิธีกำหนดมูลค่าที่ตั้งลูกหนี้ของแต่ละสิทธิ (เช่น IP ตาม AdjRW × อัตราจ่าย, OP ตามรายการ) ให้ใช้หลักเกณฑ์การบันทึกบัญชีของ สป.สธ. และประกาศกองทุนปีงบนั้น — **ตรวจกับหนังสือสั่งการปีงบปัจจุบันก่อนใช้งานจริง**\n\n### 3.3 ประเภทลูกหนี้ค่ารักษาตามสิทธิ (ตามแบบรายงานของ จ.อุดรธานี)\n\nแบบรายงานลูกหนี้ของ จ.อุดรธานี (ข้อมูล ณ 30 เม.ย. 2567) แยกลูกหนี้เป็นรายสิทธิ และแยกอายุตามปีงบประมาณที่เกิดหนี้ ([r8.moph.go.th](https://r8.moph.go.th/r8wayNewadmin/page/upload_file/20240521031539.pdf))\n\n| กลุ่มลูกหนี้ | แหล่งจ่าย | ระบบเรียกเก็บหลัก (ที่งานประกันต้องรู้) |\n| --- | --- | --- |\n| สิทธิ UC | สปสช. | e-Claim / FDH, DRG สำหรับ IP |\n| สิทธิประกันสังคม | สำนักงานประกันสังคม / รพ.คู่สัญญา | ตามข้อตกลงกับ รพ.คู่สัญญาหลัก / ระบบ สปส. |\n| สิทธิเบิกจ่ายตรง (CSMBS) | กรมบัญชีกลาง | ระบบเบิกจ่ายตรง (DRG สำหรับ IP) |\n| แรงงานต่างด้าว / ผู้มีปัญหาสถานะและสิทธิ | กองทุนเฉพาะ | ตามประกาศกองทุน |\n| สิทธิชำระเงิน | ผู้ป่วยจ่ายเอง | การติดตามหนี้ค้างชำระ |\n| สิทธิเบิกต้นสังกัด | หน่วยงานต้นสังกัด | หนังสือเรียกเก็บ |\n| สิทธิ พ.ร.บ. | บริษัทประกันภัย / กองทุนทดแทนผู้ประสบภัย | เอกสาร พ.ร.บ. |\n| สิทธิ อปท. | กรมส่งเสริมการปกครองท้องถิ่น | ระบบเบิกจ่ายตรง อปท. |\n| ระบบปฏิบัติการฉุกเฉิน (EMS) | สพฉ. | ตามหลักเกณฑ์ EMS |\n\nช่องทางเรียกเก็บในคอลัมน์ขวาเป็นภาพรวมเพื่อการเรียน — ก่อนใช้งานจริงให้ตรวจกับคู่มือของแต่ละกองทุนในปีงบประมาณนั้น\n\nจัด 9 กลุ่มเป็น 3 ตะกร้าเพื่อจำง่าย:\n\n| ตะกร้า | สิทธิ | ลักษณะความเสี่ยง | คำถามแรกที่ต้องถาม |\n| --- | --- | --- | --- |\n| ① กองทุนใหญ่ (มีระบบอิเล็กทรอนิกส์) | UC, ประกันสังคม, CSMBS, อปท. | ยอดใหญ่ เก็บได้ถ้าข้อมูลถูกและทันเวลา | ส่งทันไหม ติด C/Deny กี่รายการ |\n| ② กองทุนเฉพาะ / ใช้เอกสาร | ต่างด้าว/สถานะและสิทธิ, พ.ร.บ., ต้นสังกัด, EMS | ยอดเล็กกว่า แต่เอกสารไม่ครบง่าย | เอกสารครบไหม ใครตาม |\n| ③ ผู้ป่วยจ่ายเอง | ชำระเงิน | เก็บไม่ได้สูงสุด ค้างนาน | มีระบบติดตาม/ผ่อนชำระไหม |\n\nสิทธิซ้อน (เช่น ผู้ป่วยมีทั้ง พ.ร.บ. และ UC) ต้องไล่เบิกตามลำดับที่กองทุนกำหนด — ดู \"คู่มือประกันสุขภาพ\" บทที่ 7\n\n### 3.4 วงจรลูกหนี้ (Revenue cycle) ที่พยาบาลประกันต้องเข้าใจ\n\n1. ให้บริการ → บันทึกรายได้ + ตั้งลูกหนี้ตามสิทธิ (เกณฑ์คงค้าง)\n2. สรุปเวชระเบียน / ให้รหัส ICD-10-TM, ICD-9-CM → ส่งเคลม\n3. กองทุนตรวจ → จ่าย / ปฏิเสธ (C, Deny) / ปรับลด\n4. รับเงิน → ตัดลูกหนี้; ส่วนต่างระหว่างที่ตั้งไว้กับที่ได้รับจริง → ปรับปรุงบัญชี\n5. ลูกหนี้ที่เกินกำหนด → ติดตาม / อุทธรณ์ / ตั้งค่าเผื่อหนี้สงสัยจะสูญ\n\nจุดรั่วที่งานประกันแก้ได้โดยตรง: ข้อ 2 (สรุปชาร์ตช้า, รหัสไม่ครบ ทำให้ AdjRW ต่ำ) และข้อ 3 (เคลมติด C / Deny ไม่ได้แก้ไขในเวลา)\n\nแต่ละขั้นมีตัวชี้วัดของตัวเอง — ใช้เป็น Checklist ตอนเยี่ยม รพ.:\n\n| ขั้น | ตัวชี้วัดที่ใช้ติดตาม | สัญญาณรั่ว | เห็นในงบตรงไหน |\n| --- | --- | --- | --- |\n| 1 ให้บริการ | ตรวจสิทธิ ณ จุดบริการ (Authen) | สิทธิว่าง/สิทธิผิด ต้องเปลี่ยนภายหลัง | ลูกหนี้ผิดกลุ่ม |\n| 2 สรุปชาร์ต + รหัส | ชาร์ตค้างสรุป, ระยะเวลาสรุป, CMI | ชาร์ตค้างสะสม, CMI ต่ำกว่ากลุ่ม | รายได้ IP ต่ำ (ไม่มีส่วนต่างให้เห็น) |\n| 3 กองทุนตรวจ | จำนวนติด C / Deny, % ปรับลด | ติด C สะสมไม่ลด | บัญชีปรับลดลูกหนี้สูง |\n| 4 รับเงิน | ACP รายสิทธิ, ยอดกระทบ Statement | ACP เกินเกณฑ์, ยอดไม่ตรง | ลูกหนี้สูง เงินสดต่ำ |\n| 5 เกินกำหนด | ลูกหนี้แยกอายุ | ลูกหนี้ปีเก่าไม่ลด | ค่าเผื่อหนี้สงสัยจะสูญ, หนี้สูญ |\n\nกรอบเวลาส่งเคลมและอุทธรณ์ของแต่ละกองทุนเปลี่ยนตามประกาศปีงบ — ดู \"คู่มือประกันสุขภาพ\" บทที่ 4 และตรวจกับประกาศปีปัจจุบัน\n\n### 3.5 การอ่านรายงานลูกหนี้แยกอายุ (Aging)\n\n- ลูกหนี้ปีงบปัจจุบัน = ปกติ (อยู่ในวงจรเรียกเก็บ)\n- ลูกหนี้ปีงบก่อน 1 ปี = ต้องติดตาม หาสาเหตุรายสิทธิ\n- ลูกหนี้ 2 ปีขึ้นไป = มีโอกาสเก็บไม่ได้สูง ควรพิจารณาความเหมาะสมของการตั้งค่าเผื่อหนี้สงสัยจะสูญ/จำหน่ายหนี้ตามระเบียบ\n- ลูกหนี้สิทธิชำระเงินมักค้างนานที่สุด — ตัวอย่างในรายงานลูกหนี้ของเขต 8 (ส.ค. 2567) พบลูกหนี้สิทธิชำระเงินกระจายอยู่ในปีเก่าหลายปี ขณะที่ UC/SSS/CSMBS ส่วนใหญ่อยู่ในปีปัจจุบัน ([r8.moph.go.th](https://r8.moph.go.th/r8wayNewadmin/page/upload_file/20240822021519.pdf))\n\nตัวอย่างรายงาน Aging ของ รพ.สมมติ (ตัวเลขสมมติ, บาท):\n\n| สิทธิ | ปีปัจจุบัน | ปีก่อน 1 ปี | 2 ปีขึ้นไป | รวม |\n| --- | --- | --- | --- | --- |\n| UC | 9,000,000 | 600,000 | 100,000 | 9,700,000 |\n| ประกันสังคม | 2,500,000 | 300,000 | 50,000 | 2,850,000 |\n| เบิกจ่ายตรง | 1,800,000 | 150,000 | 0 | 1,950,000 |\n| ชำระเงิน | 400,000 | 350,000 | 700,000 | 1,450,000 |\n| พ.ร.บ. | 200,000 | 120,000 | 80,000 | 400,000 |\n| **รวม** | **13,900,000** | **1,520,000** | **930,000** | **16,350,000** |\n\nอ่าน 3 ชั้น:\n\n1. **ภาพรวม:** ลูกหนี้ 2 ปีขึ้นไป 930,000 = 5.7% ของลูกหนี้ทั้งหมด — ดูว่าเพิ่มหรือลดจากไตรมาสก่อน\n2. **สิทธิที่เป็นปัญหา:** ชำระเงินมีลูกหนี้ 2 ปีขึ้นไป 700,000 = 75% ของลูกหนี้เก่าทั้งหมด และ 72% ของลูกหนี้ชำระเงินเป็นหนี้ปีเก่า → ปัญหาอยู่ที่ระบบติดตามหนี้ผู้ป่วย ไม่ใช่ระบบเคลม\n3. **ยอดใหญ่ที่สุด:** UC ปีก่อน 600,000 — ยอดเงินมากที่สุดในกลุ่มที่ยังตามได้ → ถามว่าเป็นรายการติด C/Deny หรือรายการที่ไม่เคยส่ง\n\nลำดับลงมือ: เงินก้อนใหญ่ที่ยังเก็บได้ก่อน (UC/SSS ปีก่อน) → แก้ระบบที่ทำให้หนี้เก่าพอก (ชำระเงิน) → พิจารณาค่าเผื่อ/จำหน่ายหนี้สำหรับส่วนที่เก็บไม่ได้จริงตามระเบียบ\n\n### 3.6 ปรับลด · ค่าเผื่อหนี้สงสัยจะสูญ · จำหน่ายหนี้ — ต่างกันอย่างไร\n\n| เรื่อง | ใช้เมื่อ | ผลต่อลูกหนี้ | ผลต่อ NI | ผลต่อเงินสด |\n| --- | --- | --- | --- | --- |\n| ปรับลดลูกหนี้ตามผลชดเชย | กองทุนแจ้งผลจ่ายต่ำกว่าที่ตั้ง (เป็นที่สิ้นสุด) | ลดทันที | ลด | ไม่เปลี่ยน |\n| ตั้งค่าเผื่อหนี้สงสัยจะสูญ | ยังเป็นสิทธิเรียกเก็บ แต่มีแนวโน้มเก็บไม่ได้ | ลูกหนี้สุทธิลด (ยอดเดิมยังอยู่) | ลด | ไม่เปลี่ยน |\n| จำหน่ายหนี้สูญ | ดำเนินการครบตามระเบียบแล้วเก็บไม่ได้ | ตัดออกจากบัญชี | ลด (ถ้ายังไม่เคยตั้งค่าเผื่อ) | ไม่เปลี่ยน |\n\n- ทั้ง 3 เรื่อง **ไม่ทำให้เงินสดเปลี่ยน** — แต่ทำให้งบสะท้อนความจริง ถ้าไม่ทำ งบจะดูดีเกินจริง (ลูกหนี้และ NI สูง แต่เงินไม่เคยมา)\n- อัตราการตั้งค่าเผื่อและขั้นตอนจำหน่ายหนี้ ให้ใช้นโยบายบัญชีของ รพ. ตามหลักเกณฑ์ สป.สธ. และระเบียบกระทรวงการคลัง — **ตรวจกับหนังสือสั่งการปีงบปัจจุบันก่อนใช้งานจริง** (ตำรานี้ไม่ระบุอัตรา)\n- งานประกันไม่ได้บันทึกบัญชีเอง แต่ต้องส่ง **ข้อมูลผลเคลมที่เป็นที่สิ้นสุด** ให้บัญชีทันเวลา — ถ้าส่งช้า บัญชีจะปรับลดช้า และงบไตรมาสจะคลาดเคลื่อน\n\n### 3.7 ACP — ระยะเวลาเก็บหนี้ และวิธีแปลงเป็นเงิน\n\n```latex\nACP (วัน) = ลูกหนี้ค่ารักษาสิทธินั้น ÷ รายได้ค่ารักษาสิทธินั้น × จำนวนวันในงวด\nเงินสดที่ได้คืน ≈ (รายได้สิทธินั้น ÷ จำนวนวันในงวด) × จำนวนวันที่ ACP ลดลง\n```\n\nเกณฑ์ ACP-UC เกิน 60 วัน = ไม่ผ่าน (เกณฑ์ 7 Plus Efficiency ที่ จ.สกลนครและ จ.อุดรธานีใช้ — ดูเมนู \"เกณฑ์และแหล่งอ้างอิง\" S3, K1) — **ตรวจกับหนังสือสั่งการปีงบปัจจุบันก่อนใช้งานจริง**\n\nตัวอย่าง (ตัวเลขสมมติ): งวด ต.ค.–มิ.ย. = 273 วัน · รายได้ UC 54,000,000 · ลูกหนี้ UC ปลายงวด 15,000,000\n\n- ACP-UC = 15,000,000 ÷ 54,000,000 × 273 = **75.8 วัน** → ไม่ผ่านเกณฑ์ 60\n- รายได้ UC ต่อวัน = 54,000,000 ÷ 273 = 197,802 บาท\n- ถ้าลด ACP เหลือ 60 วัน ลูกหนี้ที่ควรเหลือ = 197,802 × 60 = 11,868,132 → **เงินสดได้คืนประมาณ 3,131,868 บาท** โดยไม่ต้องเพิ่มบริการแม้แต่รายเดียว\n\nข้อมูลจริง จ.อุดรธานี ณ มิ.ย. 69 (สไลด์ กวป. ก.ค. 69 หน้า 28, รหัส รพ. สุ่ม): ACP-UC ผ่าน 14 จาก 21 แห่ง ช่วงค่าอยู่ที่ 26–119 วัน — เปิดเมนู \"กรณีศึกษา 21 รพ.\" แล้วเรียงคอลัมน์ ACP-UC เพื่อดูเอง\n\n### 3.8 ตัวอย่างทั้งวงจร: UC IP 3 ราย (ตัวเลขสมมติ)\n\nสมมติอัตราจ่าย **10,000 บาทต่อ AdjRW** (ตัวเลขกลมเพื่อคำนวณง่าย ไม่ใช่อัตราจริง) และ รพ. ตั้งลูกหนี้ = AdjRW × อัตรา ข้อมูลไม่มีตัวตนผู้ป่วย ใช้ชื่อเรียก \"ราย ก/ข/ค\"\n\n**เดือนที่ 1 — ให้บริการและตั้งลูกหนี้**\n\n| ราย | AdjRW ตามรหัสที่ส่ง | ตั้งลูกหนี้ (บาท) |\n| --- | --- | --- |\n| ก | 1.20 | 12,000 |\n| ข | 0.80 | 8,000 |\n| ค | 2.50 | 25,000 |\n| **รวม** | | **45,000** |\n\nบันทึก: Dr ลูกหนี้ค่ารักษา UC 45,000 / Cr รายได้ค่ารักษา UC 45,000\n\n**เดือนที่ 2 — ได้ผลเคลมและรับเงิน**\n\n- ราย ก จ่ายตามที่ส่ง 12,000\n- ราย ค กองทุนจ่ายที่ AdjRW 2.00 = 20,000 (ส่วนต่าง 5,000)\n- ราย ข ติด C — ข้อมูลไม่ครบ ยังไม่จ่าย\n\n::: ลองบันทึกบัญชีเดือนที่ 2 เองก่อน แล้วกดดูเฉลย\n\n1. ปรับลดราย ค: Dr รายได้ค่ารักษา UC (หรือบัญชีส่วนต่างตามผังบัญชี) 5,000 / Cr ลูกหนี้ค่ารักษา UC 5,000\n2. รับเงินราย ก + ค: Dr เงินฝากธนาคาร 32,000 / Cr ลูกหนี้ค่ารักษา UC 32,000\n3. ราย ข: ยังไม่บันทึก — ลูกหนี้ 8,000 ค้างอยู่ รอแก้ C\n\nยอดลูกหนี้ UC ปลายเดือนที่ 2 = 45,000 − 5,000 − 32,000 = **8,000** (ราย ข)\n\n:::\n\n::: ทางแยกของราย ข: แก้ทัน vs ไม่แก้\n\n| | แก้ C ทันในเวลา | ไม่แก้จนเกินกำหนด |\n| --- | --- | --- |\n| บันทึก | Dr เงินฝาก 8,000 / Cr ลูกหนี้ 8,000 | Dr หนี้สงสัยจะสูญ 8,000 / Cr ค่าเผื่อฯ 8,000 |\n| รายได้สุทธิ 3 ราย | 40,000 | 40,000 − ค่าใช้จ่ายหนี้สงสัยจะสูญ 8,000 → ผลต่อ NI 32,000 |\n| เงินสดที่ได้รวม | 40,000 | 32,000 |\n| ลูกหนี้สุทธิ | 0 | 0 (แต่ยอดเดิมยังค้างในบัญชีจนจำหน่าย) |\n\nราย ข รายเดียวทำให้ NI และเงินสดต่างกัน 8,000 — คูณด้วยจำนวนรายการติด C สะสมทั้งปี จะเห็นว่างานแก้ C คืองานหาเงินโดยตรง\n\n:::\n\n::: บทเรียนที่ซ่อนอยู่: ถ้าราย ก ถูก Under-coding\n\nสมมติราย ก ควรได้ AdjRW 1.50 แต่ Coder ใส่รหัสโรคร่วมไม่ครบ ส่งเคลมได้ 1.20 → รพ. ตั้งลูกหนี้ 12,000 และได้รับ 12,000 พอดี **ไม่มีส่วนต่างให้เห็นในบัญชีเลย** แต่รายได้หายไป 3,000\n\nต่างจากราย ค ที่ถูกปรับลด — อันนั้นยังเห็นในบัญชีปรับลด ส่วน Under-coding มองไม่เห็นในงบ ต้องจับด้วย MR Audit และเทียบ CMI กับ รพ. ระดับเดียวกัน (บทที่ 6)\n\n:::\n\n### 3.9 กับดักที่พบบ่อย\n\n- **ดูแค่ยอดลูกหนี้รวม** — ยอดรวมเท่าเดิมอาจซ่อนลูกหนี้ปีเก่าที่พอกขึ้นทุกปี ต้องดูแยกอายุเสมอ\n- **ยอดลูกหนี้ในบัญชีไม่ตรงกับระบบเคลม** — บัญชีบอกค้าง 10 ล้าน ระบบเคลมบอกค้าง 7 ล้าน ส่วนต่าง 3 ล้านคือรายการที่ไม่มีใครตาม (อาจไม่เคยส่ง หรือได้เงินแล้วแต่ไม่ได้ตัด)\n- **เข้าใจว่าปรับลด/ตั้งค่าเผื่อทำให้เงินหาย** — เงินหายไปตั้งแต่ตอนเคลมไม่ผ่านแล้ว การบันทึกแค่ทำให้งบบอกความจริง\n- **ACP ดีขึ้นเพราะตั้งค่าเผื่อ/ตัดหนี้** — ACP ที่ลดเพราะตัดหนี้ไม่ใช่ผลงานเก็บเงิน ต้องดูคู่กับเงินสดที่รับจริง\n- **เทียบจำนวนติด C ข้าม รพ. ตรง ๆ** — รพ. ใหญ่มีรายการมากกว่าเป็นธรรมดา ต้องเทียบเป็นสัดส่วนต่อจำนวนเคลมหรือต่อ SumAdjRW\n- **ลืมว่าตัวเลขจาก hfo / สไลด์จังหวัดเป็นข้อมูล ณ วันที่หนึ่ง** — ก่อนอ้างในหนังสือราชการให้ระบุ \"ข้อมูล ณ วันที่\" และแหล่งทุกครั้ง\n\n### 3.10 แบบฝึก\n\n- [ ] ขอรายงานลูกหนี้แยกอายุ จ.อุดรธานี ฉบับล่าสุดจากกลุ่มงาน แล้วระบุ 3 รพ. ที่มีลูกหนี้ปีเก่าสูงสุด และสิทธิที่เป็นปัญหา\n- [ ] วาด Revenue cycle ของสิทธิ UC IP ตั้งแต่ Admit ถึงได้เงิน พร้อมระบุระยะเวลาแต่ละขั้น (ข้อมูลจาก รพ.จริง)\n- [ ] บันทึกบัญชี UC IP 2 ราย (อัตราสมมติ 10,000 บาท/AdjRW): ราย 1 ส่ง AdjRW 1.50 กองทุนจ่ายที่ 1.20 · ราย 2 ส่ง AdjRW 0.60 ถูก Deny เป็นที่สิ้นสุด — หายอดลูกหนี้ปลายงวด รายได้สุทธิ และเงินสดที่ได้ (ตัวเลขสมมติ)\n- [ ] คำนวณ ACP-CSMBS: ลูกหนี้ 4,500,000 · รายได้ 9 เดือน 18,000,000 · 273 วัน แล้วหาว่าถ้าลดเหลือ 60 วัน จะได้เงินสดคืนเท่าไร (ตัวเลขสมมติ)\n- [ ] เปิดเมนู \"กรณีศึกษา 21 รพ.\" เรียงตาม ACP-UC นับว่ากี่แห่งเกิน 60 วัน แล้วดูว่า 2 แห่งที่ติด C สะสมสูงสุดมี ACP-UC เท่าไร — สรุปได้หรือไม่ว่าติด C ทำให้ ACP สูง\n\n::: ดูเฉลย: บันทึกบัญชี UC IP 2 ราย\n\n| รายการ | Dr | Cr | บาท |\n| --- | --- | --- | --- |\n| ตั้งลูกหนี้ (1.50 + 0.60) × 10,000 | ลูกหนี้ UC | รายได้ UC | 21,000 |\n| ปรับลดราย 1 (0.30 × 10,000) | รายได้ UC / บัญชีส่วนต่าง | ลูกหนี้ UC | 3,000 |\n| รับเงินราย 1 | เงินฝากธนาคาร | ลูกหนี้ UC | 12,000 |\n| ราย 2 Deny เป็นที่สิ้นสุด | รายได้ UC / บัญชีส่วนต่าง | ลูกหนี้ UC | 6,000 |\n\nลูกหนี้ปลายงวด 21,000 − 3,000 − 12,000 − 6,000 = **0** · รายได้สุทธิ **12,000** · เงินสดได้ **12,000**\n\nราย 2 ถูก Deny เป็นที่สิ้นสุดแล้ว จึงปรับลดเลย ไม่ต้องตั้งค่าเผื่อ (ค่าเผื่อใช้กับหนี้ที่ยังเรียกเก็บได้แต่มีแนวโน้มเก็บไม่ได้) — ถ้ายังอุทธรณ์ได้ ให้คงลูกหนี้ไว้และติดตาม\n\n:::\n\n::: ดูเฉลย: ACP-CSMBS\n\n- ACP = 4,500,000 ÷ 18,000,000 × 273 = **68.25 วัน**\n- รายได้ต่อวัน = 18,000,000 ÷ 273 = 65,934 บาท\n- ลด 8.25 วัน → เงินสดได้คืน ≈ 65,934 × 8.25 = **543,956 บาท**\n\nหมายเหตุ: เกณฑ์ ACP-CSMBS ≤ 60 วันเป็นค่าที่อนุมานจากจำนวน รพ. ที่ผ่านในสไลด์ K1 ไม่ใช่เกณฑ์ที่ประกาศ — ดูเมนู \"เกณฑ์และแหล่งอ้างอิง\" และตรวจกับหนังสือสั่งการปีงบปัจจุบันก่อนใช้งานจริง\n\n:::\n\n::: ดูเฉลย: กรณีศึกษา ACP-UC × ติด C\n\n- ACP-UC เกิน 60 วัน **7 แห่ง** (ตรงกับที่สไลด์รายงานว่าผ่าน 14 จาก 21)\n- 2 แห่งที่ติด C สะสมสูงสุดเป็น รพ. ระดับ A และ S — ACP-UC เกิน 60 ทั้งคู่\n- **สรุปเหตุ-ผลไม่ได้จากข้อมูลนี้:** รพ. ใหญ่มีรายการเคลมมากกว่า จำนวนติด C จึงสูงตามขนาด ต้องเทียบเป็นสัดส่วนต่อจำนวนเคลม และดูว่ารายการติด C เป็นเงินเท่าไร ก่อนสรุปว่าเป็นสาเหตุ — ใช้เป็น \"สมมติฐานที่ต้องตรวจต่อ\" ในขั้น Diagnose (บทที่ 7)\n\nที่มา: สไลด์ กวป. ก.ค. 69 หน้า 28 (ACP) และหน้า 34 (ติด C สะสม 1 ต.ค. 68 – 30 ก.ค. 69)\n\n:::\n\n### 3.11 สรุปบท — 3 ข้อที่ต้องจำ\n\n1. ลูกหนี้ 1 รายการมี 3 จังหวะ: ตั้งลูกหนี้ → ปรับตามผลเคลม → รับเงิน — **เงินสดเปลี่ยนแค่จังหวะสุดท้าย** งานประกันคือการพาทุกรายการไปถึงจังหวะนั้นให้เร็วและครบ\n2. อ่านลูกหนี้ 3 มิติเสมอ: **สิทธิ × อายุหนี้ × ACP** — ยอดรวมอย่างเดียวบอกอะไรไม่ได้\n3. รหัสไม่ครบ (Under-coding) **มองไม่เห็นในบัญชี** ส่วนติด C/Deny เห็นเป็นลูกหนี้ค้างและปรับลด — สองปัญหานี้ใช้เครื่องมือจับต่างกัน (MR Audit vs ติดตามผลเคลม)\n\n### แผนผังความคิด (Mind map)\n\nจำภาพนี้ให้ได้ก่อนไปบทถัดไป — ลองปิดจอแล้ววาดเองบนกระดาษ\n\n```mindmap\nลูกหนี้ค่ารักษาตามสิทธิ\n- 3 จังหวะบัญชี\n  - ① ตั้งลูกหนี้: NI เพิ่ม\n  - ② ปรับตามผลเคลม: NI ลด\n  - ③ รับเงิน: เงินสดเพิ่ม\n  - เงินสดเปลี่ยนแค่ ③\n- 9 สิทธิ 3 ตะกร้า\n  - กองทุนใหญ่: UC SSS CSMBS อปท.\n  - เอกสาร: ต่างด้าว พ.ร.บ. ต้นสังกัด EMS\n  - จ่ายเอง: ชำระเงิน ค้างนานสุด\n- Revenue cycle\n  - Authen → สรุปชาร์ต + รหัส\n  - ส่งเคลม → จ่าย / C / Deny\n  - รับเงิน → เกินกำหนด\n  - งานประกันแก้ได้: ขั้น 2–3\n- อ่าน Aging\n  - สิทธิ × อายุหนี้\n  - ก้อนใหญ่ที่ยังเก็บได้ก่อน\n  - หนี้เก่าพอก = แก้ระบบ\n- ACP → เงิน\n  - ลูกหนี้ ÷ รายได้ × วัน\n  - UC เกิน 60 วัน ไม่ผ่าน\n  - รายได้ต่อวัน × วันที่ลด\n- ปรับลด / ค่าเผื่อ / หนี้สูญ\n  - NI ลด เงินสดไม่เปลี่ยน\n  - งบบอกความจริง\n- จับรั่วคนละเครื่องมือ\n  - Under-coding: มองไม่เห็น → MR Audit\n  - ติด C / Deny: เห็นในลูกหนี้\n```\n\n## บทที่ 4 เครื่องมือวิเคราะห์งบการเงิน (Ratio)\n\nRatio คือการเอาตัวเลข 2 ตัวมาเทียบกัน เพื่อให้เปรียบเทียบ รพ. ต่างขนาดได้ — จำ 4 กลุ่ม: สภาพคล่อง, ความมั่นคง, ประสิทธิภาพ, ความสามารถทำกำไร\n\nเป้าหมายของบทนี้: จบบทแล้วคำนวณ Ratio ทั้ง 4 กลุ่มจากงบ รพ. 1 แห่งได้ด้วยมือ อ่าน Ratio หลายตัวพร้อมกันแล้ววินิจฉัยได้ว่า \"เงินจมอยู่ที่ไหน\" และรู้ว่า Ratio ตัวไหนหลอกตาได้ ใช้เวลาประมาณ 3–4 ชั่วโมง\n\nทำไมต้องใช้ Ratio: รพ. ก มีเงินสด 10 ล้าน หนี้ระยะสั้น 5 ล้าน · รพ. ข มีเงินสด 10 ล้านเท่ากัน แต่หนี้ระยะสั้น 40 ล้าน — เงินสดเท่ากันแต่ความเสี่ยงต่างกันมาก Ratio ทำให้เห็นสิ่งนี้ทันที (ตัวเลขสมมติ)\n\nตัวอย่างคำนวณในบทนี้เป็น **ตัวเลขสมมติ** ส่วนตัวเลขจริงของ จ.อุดรธานี มาจากสไลด์ กวป. ก.ค. 69 (ข้อมูล ณ มิ.ย. 69, รหัส รพ. สุ่ม) — เปิดดูทุก รพ. ได้ในเมนู \"กรณีศึกษา 21 รพ.\"\n\n### 4.1 สภาพคล่องและความมั่นคง (ใช้ใน Risk Score)\n\nสูตรและเกณฑ์ตามนิยามตัวชี้วัดวิกฤตการเงินของ สป.สธ. ([KPI template ปีงบ 67](https://uthaihealth.moph.go.th/uthkpi67/document/140.pdf))\n\n| ตัวชี้วัด | สูตร | สัญญาณเสี่ยง | แปลความ |\n| --- | --- | --- | --- |\n| Current Ratio (CR) | สินทรัพย์หมุนเวียน ÷ หนี้สินหมุนเวียน | < 1.5 | สินทรัพย์ระยะสั้นไม่พอคุ้มหนี้ระยะสั้น |\n| Quick Ratio (QR) | (สินทรัพย์หมุนเวียน − สินค้าคงเหลือ − สินทรัพย์หมุนเวียนอื่น) ÷ หนี้สินหมุนเวียน | < 1.0 | ไม่นับยาคงคลัง แล้วยังจ่ายหนี้ได้ไหม |\n| Cash Ratio | (เงินสด + รายการเทียบเท่าเงินสด + เงินฝากประจำ) ÷ หนี้สินหมุนเวียน | < 0.8 | เงินสดในมือพอจ่ายหนี้ระยะสั้นทันทีไหม |\n| Net Working Capital (NWC) | สินทรัพย์หมุนเวียน − หนี้สินหมุนเวียน | < 0 | ทุนสำรองติดลบ = ใช้เงินเจ้าหนี้หมุน |\n| Net Income (NI) | รวมรายได้ − รวมค่าใช้จ่าย (นิยาม Risk Score ใช้ NI รวมค่าเสื่อมราคาและค่าตัดจำหน่าย) | < 0 | ผลดำเนินงานขาดทุน |\n\nลำดับความสำคัญเวลาอ่าน: Cash Ratio → NWC → NI → CR/QR เพราะ รพ. ล้มจากเงินสดหมด ไม่ใช่จากขาดทุนทางบัญชี\n\n**CR → QR → Cash คือการ \"ลอกเปลือก\" ทีละชั้น:** CR นับสินทรัพย์หมุนเวียนทั้งหมด · QR ตัดยาคงคลังและสินทรัพย์หมุนเวียนอื่นออก (ขายเป็นเงินทันทีไม่ได้) · Cash เหลือแต่เงินจริง — ยิ่งลอก ตัวเลขยิ่งต่ำ ถ้า CR ผ่านแต่ Cash ไม่ผ่าน แปลว่าเงินจมอยู่ในลูกหนี้หรือยา\n\nตัวอย่าง (ตัวเลขสมมติ, บาท):\n\n| สินทรัพย์หมุนเวียน | บาท | หนี้สินหมุนเวียน | บาท |\n| --- | --- | --- | --- |\n| เงินสดและเงินฝาก | 6,000,000 | เจ้าหนี้ค่ายาและเวชภัณฑ์ | 8,000,000 |\n| ลูกหนี้ค่ารักษา | 9,000,000 | ค่าใช้จ่ายค้างจ่าย | 3,000,000 |\n| ยาและเวชภัณฑ์คงคลัง | 3,000,000 | หนี้สินหมุนเวียนอื่น | 1,000,000 |\n| สินทรัพย์หมุนเวียนอื่น | 500,000 | | |\n| **รวม** | **18,500,000** | **รวม** | **12,000,000** |\n\n::: ลองคำนวณ CR, QR, Cash, NWC เองก่อน แล้วกดดูเฉลย\n\n- CR = 18,500,000 ÷ 12,000,000 = **1.54** → ผ่าน (เฉียด)\n- QR = (18,500,000 − 3,000,000 − 500,000) ÷ 12,000,000 = **1.25** → ผ่าน\n- Cash = 6,000,000 ÷ 12,000,000 = **0.50** → ไม่ผ่าน (1 คะแนน)\n- NWC = 18,500,000 − 12,000,000 = **6,500,000** → บวก ผ่าน\n\nอ่าน: CR กับ QR ผ่านเพราะลูกหนี้ 9 ล้าน — ถ้าลูกหนี้ก้อนนี้เก็บไม่ได้ตามเวลา Cash 0.50 คือความจริงที่ รพ. ต้องใช้จ่ายหนี้ ขั้นต่อไปต้องดู ACP (บทที่ 3.7)\n\n:::\n\nภาพจริง จ.อุดรธานี ณ มิ.ย. 69 (เกณฑ์กระทรวง, 21 แห่ง, สไลด์ กวป. ก.ค. 69 หน้า 8):\n\n| ตัวชี้วัด | จำนวน รพ. ที่หลุดเกณฑ์ |\n| --- | --- |\n| CR < 1.5 | 15 |\n| QR < 1.0 | 8 |\n| Cash < 0.8 | 13 |\n| NWC < 0 | 3 |\n| NI < 0 | 1 |\n\nข้อสังเกต: ปัญหาของจังหวัดอยู่ที่ **สภาพคล่อง** ไม่ใช่การขาดทุน — 20 จาก 21 แห่ง NI เป็นบวก แต่เงินสดไม่พอคุ้มหนี้ระยะสั้นเกินครึ่งจังหวัด\n\n### 4.2 ประสิทธิภาพ (Efficiency) — จุดที่งานประกันมีผลโดยตรง\n\n| ตัวชี้วัด | สูตรทั่วไป | เกณฑ์ที่พบในเอกสารเขต 8 |\n| --- | --- | --- |\n| ACP-UC (ระยะเวลาเก็บหนี้ UC) | ลูกหนี้ UC ÷ รายได้ UC × จำนวนวันในงวด | เกิน 60 วัน = ไม่ผ่าน ([สกลนคร ธ.ค. 68](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20260123092014.pdf)) |\n| ACP-CSMBS / ACP-SSS | สูตรเดียวกัน แยกสิทธิ | ดูเกณฑ์ปีงบปัจจุบัน |\n| APP-Drug (ระยะเวลาชำระหนี้ยา) | เจ้าหนี้ค่ายา ÷ ต้นทุนยา × จำนวนวัน | มาตรฐาน 90 วัน ([รพ.โพธิ์ตาก](https://r8way.moph.go.th/r8wayNewadmin/page/upload_file/20260608053511.pdf)); เกิน 180 วัน = สัญญาณผิดนัดชำระ |\n| IM (Inventory Management) | ยา/เวชภัณฑ์คงคลัง ÷ ต้นทุนที่ใช้ × จำนวนวัน | ดูเกณฑ์ปีงบปัจจุบัน |\n\nสูตรในคอลัมน์กลางเป็นสูตรมาตรฐานทางบัญชี — ตัวหารและจำนวนวันที่ สป.สธ. ใช้จริง ให้ตรวจกับคู่มือ 7 Plus ปีงบปัจจุบัน\n\n**3 ตัวนี้คือวงจรเดียวกัน** — เงินของ รพ. หมุนเป็นวง: ซื้อยา (ค้างจ่ายผู้ขาย) → ยาอยู่ในคลัง (IM) → ใช้รักษา → เป็นลูกหนี้ (ACP) → ได้เงิน → จ่ายผู้ขาย (APP)\n\n```latex\nวงจรเงินสด (วัน) ≈ IM + ACP − APP\n```\n\n- ค่าบวก = รพ. ต้องใช้เงินตัวเองรองรับช่วงนั้น\n- ค่าติดลบมาก = รพ. ใช้เงินผู้ขายยารองรับ — ใน รพ.รัฐ มักไม่ใช่ประสิทธิภาพ แต่เป็นสัญญาณว่าจ่ายหนี้ยาไม่ไหว\n\nตัวอย่าง APP (ตัวเลขสมมติ): เจ้าหนี้ค่ายา 8,000,000 · ต้นทุนยาที่ใช้ 9 เดือน 12,000,000 · 273 วัน\n\n::: ลองคำนวณ APP และเงินที่ต้องใช้ถ้าจะลด APP เหลือ 90 วัน\n\n- APP = 8,000,000 ÷ 12,000,000 × 273 = **182 วัน** → เกิน 180 = สัญญาณผิดนัดชำระ\n- เจ้าหนี้ที่ควรเหลือที่ 90 วัน = 12,000,000 ÷ 273 × 90 = 3,956,044\n- ต้องใช้เงินสดจ่ายเพิ่ม ≈ 8,000,000 − 3,956,044 = **4,043,956 บาท**\n\nบทเรียน: ลด APP **ต้องใช้เงินสด** ส่วนลด ACP **ได้เงินสดคืน** — ลำดับที่ถูกจึงเป็นเร่งเก็บลูกหนี้ (ACP) ก่อน แล้วเอาเงินนั้นไปลด APP\n\n:::\n\nภาพจริง จ.อุดรธานี ณ มิ.ย. 69 (7 Plus, สไลด์ กวป. ก.ค. 69 หน้า 28): APP-Drug ผ่านเพียง 3 จาก 21 แห่ง ค่าอยู่ที่ 56–415 วัน ครึ่งหนึ่งของจังหวัดเกิน 240 วัน ขณะที่ IM ผ่าน 18 แห่ง และ ACP-UC ผ่าน 14 แห่ง — APP คือจุดอ่อนที่สุดของจังหวัด (เกณฑ์ผ่าน/ไม่ผ่านแต่ละช่องอนุมานจากสไลด์ ดูเมนู \"เกณฑ์และแหล่งอ้างอิง\")\n\n### 4.3 ความสามารถทำกำไร\n\n- EBITDA = กำไรก่อนดอกเบี้ย ภาษี ค่าเสื่อม และค่าตัดจำหน่าย — ใกล้เคียง \"เงินสดที่ธุรกิจหลักสร้างได้\" ใช้ดูว่า รพ. มีเงินไปลงทุนต่อไหม\n- Operating Margin (OPM/OPR) = กำไรจากการดำเนินงาน ÷ รายได้จากการดำเนินงาน — สกลนครใช้ค่ากลางรายกลุ่ม รพ. เป็นเกณฑ์เทียบ\n- ROA = กำไร ÷ สินทรัพย์รวม — สินทรัพย์ที่มีสร้างผลตอบแทนได้ไหม\n\nตัวอย่าง (ตัวเลขสมมติ): NI (2,000,000) · ค่าเสื่อมราคาและค่าตัดจำหน่าย 5,000,000 · ไม่มีดอกเบี้ยจ่าย → EBITDA = −2,000,000 + 5,000,000 = **3,000,000**\n\nอ่าน: ขาดทุนทางบัญชีเพราะค่าเสื่อม แต่งานหลักยังสร้างเงินได้ 3 ล้าน — ยังไม่วิกฤตทันที แต่ถ้าเป็นแบบนี้ต่อเนื่อง จะไม่มีเงินพอทดแทนครุภัณฑ์ที่เสื่อมไป\n\nEBITDA บวก **ไม่ได้แปลว่าเงินพอ** — ภาพจริง จ.อุดรธานี ณ มิ.ย. 69: EBITDA บวกทั้ง 21 แห่ง และ OPM ผ่านเกณฑ์ค่าเฉลี่ยกลุ่ม 20 แห่ง แต่เงินบำรุงคงเหลือหลังหักหนี้ติดลบ 16 แห่ง (สไลด์ กวป. ก.ค. 69 หน้า 6–8, 28) เพราะ EBITDA ไม่นับเงินที่จมในลูกหนี้และหนี้ที่ยังค้างจ่าย\n\n### 4.4 วิธีวิเคราะห์ 3 แบบ\n\n1. Trend (แนวราบ): เทียบตัวเองย้อนหลัง 3–5 ปี / รายไตรมาส — ดีขึ้นหรือแย่ลง\n2. Common-size (แนวตั้ง): แปลงทุกบรรทัดเป็น % ของรายได้รวม — ค่าใช้จ่ายหมวดไหนกินสัดส่วนเพิ่ม\n3. Benchmark: เทียบค่ากลางกลุ่ม รพ. ขนาดเดียวกัน (กลุ่ม F1/F2/F3/M1/M2/S/A) — ไม่เทียบ รพ.ชุมชนกับ รพ.ศูนย์\n\n**Trend — ตัวอย่างจริง** NWC ของ รพ.04 (ล้านบาท, สไลด์ กวป. ก.ค. 69 หน้า 3):\n\n| Q4Y65 | Q4Y66 | Q4Y67 | Q4Y68 | Q1Y69 | Q2Y69 | Q3Y69 |\n| --- | --- | --- | --- | --- | --- | --- |\n| 54.43 | 1.20 | 1.47 | (20.81) | (12.93) | 20.47 | (0.28) |\n\nถ้าดูแค่ Q2Y69 จะเห็น NWC บวก 20 ล้าน ดูเหมือนฟื้นแล้ว แต่ Trend 7 จุดบอกว่าทุนสำรองหายจาก 54 ล้านภายใน 1 ปี และแกว่งรอบศูนย์มา 2 ปี — ข้อควรระวัง: เทียบไตรมาสต่างกันในปีงบเดียวกันต้องระวังฤดูกาลของเงินโอน ให้เทียบไตรมาสเดียวกันข้ามปีด้วย\n\n**Common-size — ตัวอย่าง** (ตัวเลขสมมติ):\n\n| ค่าใช้จ่าย | ปีก่อน | % รายได้ | ปีนี้ | % รายได้ |\n| --- | --- | --- | --- | --- |\n| รายได้รวม | 100,000,000 | 100% | 110,000,000 | 100% |\n| ค่าตอบแทน/เงินเดือน | 45,000,000 | 45% | 52,800,000 | 48% |\n| ยาและเวชภัณฑ์ | 20,000,000 | 20% | 22,000,000 | 20% |\n| ค่าเสื่อม | 8,000,000 | 8% | 8,800,000 | 8% |\n\nทุกบรรทัดเพิ่มขึ้นเป็นเงินบาท แต่ Common-size ชี้ว่ามีเพียงค่าตอบแทนที่โตเร็วกว่ารายได้ (45% → 48%) — คำถามต่อไปคือ เพิ่มเพราะอัตรากำลังหรือเพราะค่าตอบแทนนอกเวลา\n\n**Benchmark** — ใช้ค่ากลางของกลุ่มระดับเดียวกัน เช่น 7 Plus ของ จ.อุดรธานีเทียบ OPM/ROA กับค่าเฉลี่ยกลุ่ม (สไลด์ กวป. ก.ค. 69 หน้า 28) ข้อควรระวัง: ถ้าทั้งกลุ่มแย่ การ \"ดีกว่าค่ากลาง\" ก็ยังอาจไม่พอ — ใช้คู่กับเกณฑ์สัมบูรณ์ (เช่น Cash 0.8) เสมอ\n\n### 4.5 อ่าน Ratio หลายตัวพร้อมกัน — รูปแบบที่ต้องจำ\n\nRatio ตัวเดียวบอกได้แค่ \"มีอาการ\" ต้องอ่านเป็นคู่จึงบอก \"สาเหตุ\" ได้ — เหมือนอ่าน Vital signs ทั้งชุด ไม่ใช่ดูชีพจรตัวเดียว\n\n| รูปแบบที่เห็น | วินิจฉัยเบื้องต้น | ตรวจต่อที่ |\n| -
